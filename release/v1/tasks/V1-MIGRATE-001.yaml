id: V1-MIGRATE-001
title: Expand-contract migration certification (no N-1 downgrade assumption)
priority: P0

goal: >
  Certify the three migration states that matter for a first public release
  (there is no customer-facing N-1 release database): empty database -> v1,
  current long-lived development/staging schema -> v1, and restored
  pre-candidate backup -> v1. Enforce expand-contract rollback behavior —
  candidate code works with the expanded schema, the previous application
  image works with the expanded schema during the rollback window, and
  destructive contraction occurs only after the rollback window. The release
  certificate must distinguish application rollback, forward-compatible
  schema rollback window, backup restore, and explicitly safe migration
  downgrade; a generic "migration rollback passed" is not acceptable.

depends_on:
  - V1-CARTO-001

allowed_paths:
  - tests/recovery/**
  - tests/release/**
  - tests/production_readiness/**
  - scripts/ci/**
  - docs/**
  - Makefile

forbidden_paths:
  - services/**/migrations/**
  - infra/production/**
  - .github/workflows/**

single_writer_surfaces:
  - database-schema-and-migrations

invariants:
  - Composes the existing migration gates (check-migration-postgres-roundtrip, db-migrate-check, check-migration-rollback-policy); no parallel migration test system.
  - Database downgrade is never assumed to be the production rollback strategy.
  - Tenant fields are preserved across every certified migration path.
  - Destructive schema changes are gated behind the rollback window.

acceptance_tests:
  - make check-migration-postgres-roundtrip
  - make db-migrate-check
  - make check-migration-rollback-policy

negative_cases:
  - A migration that breaks the previous application image inside the rollback window fails certification.
  - A destructive contraction shipped in the same release as its expansion fails certification.
  - A restored pre-candidate backup that cannot migrate cleanly to v1 fails certification.

non_goals:
  - Authoring new schema changes.
  - Building a generic downgrade framework.

rollback:
  strategy: revert_patch
  data_migration_required: false

completion_evidence:
  - migration certification runs for all three required states with logs
  - rollback-window compatibility evidence (previous image against expanded schema)
  - certificate section distinguishing the four rollback modes
