id: V1-EVALS-001
title: Consolidate AI evaluation into a repo-owned evals harness
priority: P1

goal: >
  Create the top-level evals/ structure (datasets, rubrics, adversarial,
  baselines, results) with a repo-owned runner, consolidate tests/evals and
  make evals behind it, and enforce deterministic AI gates (schema validity,
  tool authorization, retrieval isolation, citation presence, cost and latency
  budgets) in ai-evals-pipeline.yml and the release-candidate readiness profile.

depends_on:
  - V1-CARTO-001

allowed_paths:
  - evals/**
  - tests/evals/**
  - Makefile
  - .github/workflows/ai-evals-pipeline.yml
  - .fabric/prod-gates.policy.yaml
  - docs/**

forbidden_paths:
  - services/**
  - apps/**

invariants:
  - No dependency on the OpenAI Evals platform; datasets and runners are repository-owned.
  - Deterministic assertions gate schemas, permissions, citations, tool calls, and tenant boundaries; model-graded rubrics are reserved for semantic quality and calibrated against human labels.
  - Adversarial sets cover direct injection, indirect injection, and cross-tenant exfiltration.
  - Prompts and outputs in traces are redacted according to data policy.

acceptance_tests:
  - make evals
  - pytest tests/release/test_no_placeholder_gates.py

negative_cases:
  - A schema-invalid model output fails the gate.
  - An eval case where retrieval returns another tenant's content fails the gate.
  - An adversarial document instructing a tool call outside policy fails the gate.

non_goals:
  - Model or prompt quality improvements.
  - New agent capabilities.

rollback:
  strategy: revert_patch
  data_migration_required: false

completion_evidence:
  - evals/ directory with datasets, rubrics, adversarial sets, baselines, runner
  - passing make evals run log
  - gate wiring diff for ai-evals-pipeline.yml and the release-candidate profile
