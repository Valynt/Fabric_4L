id: V1-TENANCY-011
title: Tenant isolation for object storage, signed URLs, and export expiry
priority: P0

goal: >
  Prove object-storage prefixes, bucket policies, signed URLs, lifecycle
  operations, export jobs, files, links, and notifications are tenant-scoped
  and expire; add allowed and hostile tests for each behavior.

allowed_paths:
  - services/layer1-ingestion/**
  - services/api/**
  - packages/shared/**
  - tests/tenancy/**
  - tests/data_lifecycle/**
  - docs/**

forbidden_paths:
  - infra/production/**
  - .github/workflows/**

invariants:
  - Signed URLs embed tenant scope and expiry; neither is client-controllable.
  - Export artifacts are unreachable by other tenants via ID, link, or path guessing.
  - 404-vs-403 responses do not reveal cross-tenant resource existence.

acceptance_tests:
  - pytest tests/tenancy/test_file_storage_tenant_scope.py
  - pytest tests/tenancy -m tenant_boundary
  - make check-behavior-contract

negative_cases:
  - Tenant B requests Tenant A's export by object ID and by direct storage path.
  - An expired signed URL is replayed.
  - A lifecycle deletion for Tenant A cannot touch Tenant B prefixes.

non_goals:
  - Changing the object-storage provider.
  - Export format changes.

rollback:
  strategy: revert_patch
  data_migration_required: false

completion_evidence:
  - new hostile and allowed tests per surface
  - command and exit-code log
  - residual-risk statement
