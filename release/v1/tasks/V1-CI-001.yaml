id: V1-CI-001
title: Aggregate PR check contract and merge queue
priority: P1

goal: >
  Introduce nine stable aggregate PR checks (01-repository-integrity through
  09-change-risk-and-approval) as thin fan-in jobs over the existing workflow
  matrix, using a staged shadow migration. Stage 1: add aggregate fan-in jobs
  as informational only; all existing required checks stay required. Stage 2:
  run the aggregates across several representative PRs and merge_group events
  and verify every required child failure causes the correct aggregate
  failure. Stage 3: make aggregates required while retaining old checks
  temporarily. Stage 4: remove direct matrix jobs from branch protection
  after parity is established, keeping matrix execution and detailed
  evidence. Add merge_group triggers to every required workflow and enable
  the merge queue on main.

depends_on:
  - V1-CARTO-001

allowed_paths:
  - .github/workflows/**
  - docs/governance/branch-protection-required-checks.yml
  - docs/governance/branch-protection-required-checks-enforcement.md
  - scripts/ci/**

forbidden_paths:
  - services/**
  - apps/**
  - packages/**

single_writer_surfaces:
  - ci-required-check-definitions

invariants:
  - Aggregate jobs perform no substantive testing; they only summarize the status of existing jobs.
  - The 09-change-risk-and-approval gate is deterministic policy, not an LLM gate — it verifies a schema-valid independent-review artifact exists, refers to the correct base and head SHAs, has no unresolved P0/P1 findings, that required CODEOWNER/human approval is present for high-risk surfaces, and that the reviewer did not author the patch.
  - Branch protection changes only after shadow-mode parity is demonstrated (stages 1-2 before stage 3-4).
  - Every required check has a unique, stable name validated by branch-protection-validation.yml.
  - No CI step modifies and recommits repository files.
  - No lowering of test, type, coverage, security, or lint thresholds.
  - No blanket continue-on-error for release requirements; one retry may distinguish transient infrastructure failure only.
  - Aggregate gates explicitly confirm any path-filtered skip is safe.

acceptance_tests:
  - pytest tests/ci
  - python scripts/ci/check_workflow_references.py

negative_cases:
  - A failing child matrix job must fail its aggregate.
  - A renamed required check must fail branch-protection validation.
  - A workflow required for merge that lacks a merge_group trigger must be rejected.

non_goals:
  - Changing what the underlying matrix jobs test.
  - Rewriting existing workflows beyond trigger and fan-in wiring.

rollback:
  strategy: revert_patch
  data_migration_required: false

completion_evidence:
  - updated workflow files and required-checks registry
  - branch-protection validation run log
  - human Publisher sign-off recorded (branch protection is human-sequenced)
