id: V1-GOLDEN-002
title: Playwright golden-path frontend journey certification
priority: P0

goal: >
  Extend the existing test:e2e:golden Playwright scripts so the customer-visible
  end of the canonical golden path (onboarding, core value flow, deliverable
  download) is certified in a browser against a live backend.

depends_on:
  - V1-GOLDEN-001

allowed_paths:
  - apps/web/**
  - docs/**

forbidden_paths:
  - services/**
  - packages/**
  - .github/workflows/**

invariants:
  - Reuse the existing Playwright golden-path project structure (test:e2e:golden:*); no new E2E framework.
  - Follow DESIGN.md; test behavior, not implementation details.
  - Failed CI journeys capture Playwright traces.

acceptance_tests:
  - pnpm --dir apps/web run test:e2e
  - pnpm --dir apps/web run typecheck

negative_cases:
  - An unauthenticated user cannot reach tenant workspace routes.
  - Organization switching does not leak previously cached tenant state into the UI.
  - An expired deliverable link renders a denial state, not another tenant's artifact.

non_goals:
  - Visual polish or design changes.
  - Load testing through the browser.

rollback:
  strategy: revert_patch
  data_migration_required: false

completion_evidence:
  - new or extended golden-path spec files
  - Playwright report from a passing run
  - trace artifacts for at least one induced failure
