id: V1-OPS-001
title: Operational hardening — failure-mode answers as tests and runbook sections
priority: P1

goal: >
  Answer the failure-mode questionnaire per critical service (database down,
  Redis flushed, duplicate queue delivery, provider timeout, malformed external
  response, deploy during long job, partial migration, export resume, operator
  alerting, safe rollback, recovery evidence) as executable tests or RUNBOOK.md
  sections, and verify OpenTelemetry coverage of the golden path.

depends_on:
  - V1-GOLDEN-001

allowed_paths:
  - tests/reliability/**
  - tests/chaos/**
  - tests/recovery/**
  - tests/observability/**
  - RUNBOOK.md
  - Makefile.chaos
  - docs/**

forbidden_paths:
  - infra/production/**
  - .github/workflows/**

invariants:
  - Each questionnaire answer is a test or a runbook section, never prose in a report.
  - Golden-path spans carry tenant-safe correlation IDs, service and version metadata, queue and job identifiers, and provider spans.
  - Existing observability is not removed to simplify code.

acceptance_tests:
  - pytest tests/reliability
  - pytest tests/observability
  - pytest tests/recovery

negative_cases:
  - A duplicate queue delivery must not double-apply a business effect.
  - A provider timeout must trigger retry or circuit-breaker behavior, not an unhandled failure.
  - A partially applied migration must be detectable and recoverable.

non_goals:
  - Building new monitoring infrastructure.
  - Load-test tuning (covered by performance suites).

rollback:
  strategy: revert_patch
  data_migration_required: false

completion_evidence:
  - new failure-mode tests and RUNBOOK.md sections
  - command and exit-code log
  - residual-risk statement
