# V1 Release Readiness Mapping — Fabric_4L
#
# Maps every launch-contract requirement to the canonical gate or task that
# proves it. This file WRAPS the existing readiness ladder
# (docs/governance/behavior-first-testing.md); it never replaces it.
#
# Readiness ladder (no stage may be skipped):
#   1. make check-behavior-contract        (static contract resolved)
#   2. pnpm run test:critical-behaviors    (behavior tests executed)
#   3. make check-behavior-readiness-audit (readiness audit GREEN)
#   4. make production-readiness-gate      (canonical production gate)

schema_version: 1

pull_request_gate: make verify
canonical_gate: make production-readiness-gate

requirements:
  - requirement: Critical journeys pass in a production-like environment
    proof:
      - make test-backend-integrated-release-smoke
      - task: V1-GOLDEN-001
      - task: V1-GOLDEN-002

  - requirement: Zero unauthorized cross-tenant access
    proof:
      - pytest tests/tenancy
      - pytest tests/test_cross_tenant_hostile.py
      - task: V1-TENANCY-010
      - task: V1-TENANCY-011
      - task: V1-TENANCY-012

  - requirement: Migration safety (upgrade, downgrade -1, re-upgrade)
    proof:
      - make check-migration-postgres-roundtrip
      - pytest tests/release/test_database_migration_rollback.py

  - requirement: Backup, restore, RPO 15m / RTO 60m
    proof:
      - make test-backup-drills
      - pytest tests/recovery

  - requirement: Capacity at 3x launch peak (50 rps sustained, 100 rps burst)
    proof:
      - pytest tests/performance
      - task: V1-OPS-001

  - requirement: Structured AI output 100 percent schema-valid; zero cross-tenant retrieval; zero unauthorized tool actions
    proof:
      - make evals
      - task: V1-EVALS-001

  - requirement: Immutable release evidence (SHA, digests, tests, scans, migration record, rollback instructions)
    proof:
      - scripts/release/build_evidence_bundle.sh
      - pytest tests/test_release_evidence_packet.py
      - pytest tests/release/test_release_artifact_integrity.py

  - requirement: Certification is fail-closed with no in-flight remediation
    proof:
      - scripts/release/certify_candidate.sh
      - pytest tests/test_certification_harness_fail_closed.py

  - requirement: Human production authorization recorded before rollout
    proof:
      - release/v1/candidate-manifest.schema.json
