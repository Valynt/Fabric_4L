schema_version: 1
id: j01-tenant-onboarding
title: Tenant provisioning and user onboarding
priority: P0

required_outcome: >
  A new organization is created with correct defaults, isolation, entitlements,
  and audit evidence; invitation, acceptance, authentication, organization
  selection, role enforcement, and logout all work.

steps:
  - Create a new tenant/organization via the gateway (services/api) with default roles, entitlements, and plan state.
  - Tenant-scoped storage namespaces (PostgreSQL, Redis, Neo4j, object storage) are initialized.
  - An administrator invites a user; the user accepts, authenticates, and selects the organization.
  - Role-based access is enforced on first API call; logout invalidates the session.
  - Provisioning and onboarding are recorded in the audit log with actor and tenant identity.

allowed_behavior:
  - An authenticated platform actor provisions a tenant; an invited user completes onboarding and reaches the tenant workspace with correct role scope.
denied_behavior:
  - Provisioning or onboarding without authentication is rejected with 401.
  - A tenant admin cannot provision, join, or observe another tenant.
  - An expired or forged invitation is rejected; session tokens are unusable after logout.
  - Missing tenant context during provisioning fails closed.
  - Organization switching invalidates unsafe cached tenant state.

evidence:
  existing_tests:
    - tests/tenancy/test_database_tenant_scope.py
    - tests/tenancy/test_api_tenant_scope.py
    - tests/security
  gaps:
    - End-to-end onboarding leg of the golden-path certification (tasks V1-GOLDEN-001, V1-GOLDEN-002).
