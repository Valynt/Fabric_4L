schema_version: 1
id: j03-admin-support
title: Administration and support
priority: P0

required_outcome: >
  Authorized administrators can diagnose tenant issues without unlogged
  privilege escalation.

steps:
  - A support administrator requests time-limited, authorized access to a tenant context.
  - All impersonation actions are visible to the tenant and audit-logged.
  - Access expires automatically and cannot be extended silently.

allowed_behavior:
  - An authorized support admin diagnoses a tenant issue within a time-limited, audited impersonation session.
denied_behavior:
  - Impersonation without authorization or audit trail is impossible.
  - Support access cannot read tenants outside the approved scope.
  - Expired impersonation sessions are rejected.

evidence:
  existing_tests:
    - tests/tenancy/test_admin_impersonation_scope.py
    - tests/support
  gaps:
    - None currently tracked beyond golden-path integration.
