schema_version: 1
id: j02-core-value-case
title: Core value case (canonical golden path)
priority: P0

required_outcome: >
  A user completes the principal product workflow and receives the intended
  business result, proven by one executable, candidate-SHA-bound certification
  across frontend, gateway, and L1-L6. This extends the existing deterministic
  launch clickpath (account -> signals -> evidence -> driver -> calculator ->
  business case, docs/launch/launch-blocker-register.md) backward through
  ingestion and knowledge construction and forward through persistence,
  reload, export, and operational evidence. It does not invent a second
  demonstration flow.

steps:
  - Create Tenant A; provision administrator and standard user.
  - Authenticate and select workspace.
  - Create account/prospect.
  - Ingest one or more source documents; verify L1 source version and ingestion state.
  - Run L2 extraction; verify extracted signals, provenance, and source linkage.
  - Project results into L3; verify tenant-scoped graph and retrieval.
  - Execute the L4 value workflow; generate the value model and value-driver tree.
  - Match and ground evidence through L5; add peer or benchmark context through L6.
  - Calculate the value case and generate the customer-facing business case.
  - Persist, reload, and export it through the web application.
  - Verify audit events, metrics, traces, and job history for the run.

allowed_behavior:
  - The full pipeline completes for a tenant-scoped source and produces an evidence-backed, benchmarked business case that survives reload and export in apps/web.
denied_behavior:
  - In the same certification run, Tenant B is created and attempts access to Tenant A's accounts, sources, source versions, extractions, graph entities, retrieval results, agent state, evidence, benchmarks, calculations, business cases, exports, background jobs, cache entries, and AI context/traces; every attempt is denied. Cross-tenant denial is part of the golden path, not a separate afterthought.
  - Pipeline stages reject payloads missing verified tenant context.
  - A stage failure surfaces a structured error state, never silent partial results presented as complete.

evidence:
  existing_tests:
    - tests/backend_integrated
    - docs/launch/launch-blocker-register.md
  gaps:
    - Single executable golden-path certification bound to a candidate SHA (tasks V1-GOLDEN-001, V1-GOLDEN-002).
