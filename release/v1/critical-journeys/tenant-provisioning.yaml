schema_version: 1
id: tenant-provisioning
title: Tenant provisioning
priority: P0

required_outcome: >
  A new organization is created with correct defaults, isolation, entitlements,
  and audit evidence.

steps:
  - Create a new tenant/organization via the gateway (services/api).
  - Default roles, entitlements, and plan state are provisioned.
  - Tenant-scoped storage namespaces (PostgreSQL, Redis, Neo4j, object storage) are initialized.
  - Provisioning is recorded in the audit log with actor and tenant identity.

allowed_behavior:
  - An authenticated platform actor provisions a tenant and receives a tenant-scoped context.
denied_behavior:
  - Provisioning without authentication is rejected with 401.
  - A tenant admin cannot provision or observe another tenant.
  - Missing tenant context during provisioning fails closed.

evidence:
  existing_tests:
    - tests/tenancy/test_database_tenant_scope.py
    - tests/tenancy/test_api_tenant_scope.py
  gaps:
    - End-to-end provisioning journey certification (see task V1-GOLDEN-001).
