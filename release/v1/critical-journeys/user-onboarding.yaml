schema_version: 1
id: user-onboarding
title: User onboarding
priority: P0

required_outcome: >
  Invitation, acceptance, authentication, organization selection, role
  enforcement, and logout all work.

steps:
  - An administrator invites a user to a tenant.
  - The user accepts, authenticates (Keycloak/Clerk-backed), and selects an organization.
  - Role-based access is enforced on first API call.
  - Logout invalidates the session; organization switching invalidates unsafe cached state.

allowed_behavior:
  - An invited user completes onboarding and reaches the tenant workspace with correct role scope.
denied_behavior:
  - An expired or forged invitation is rejected.
  - A user cannot select an organization they are not a member of.
  - Session tokens are unusable after logout.

evidence:
  existing_tests:
    - tests/security
    - tests/tenancy/test_api_tenant_scope.py
  gaps:
    - Playwright onboarding journey in the golden-path suite (see task V1-GOLDEN-002).
