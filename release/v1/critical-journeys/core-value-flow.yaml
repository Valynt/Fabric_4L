schema_version: 1
id: core-value-flow
title: Core value flow (canonical golden path)
priority: P0

required_outcome: >
  A user completes the principal product workflow and receives the intended
  business result, proven by one executable certification across all layers.

steps:
  - Tenant and account setup.
  - Source ingestion (L1, services/layer1-ingestion).
  - Extraction (L2, services/layer2-extraction; L2.5 signal refinement where promised).
  - Knowledge projection (L3, services/layer3-knowledge).
  - Agent workflow (L4, services/layer4-agents).
  - Grounding and evidence (L5, services/layer5-ground-truth).
  - Benchmark or quality result (L6, services/layer6-benchmarks).
  - Customer-visible value output in apps/web.

allowed_behavior:
  - The full pipeline completes for a tenant-scoped source and produces an evidence-backed, benchmarked value output visible in the UI.
denied_behavior:
  - Pipeline stages reject payloads missing verified tenant context.
  - A stage failure surfaces a structured error state, never silent partial results presented as complete.
  - No stage reads or writes another tenant's data.

evidence:
  existing_tests:
    - tests/backend_integrated
  gaps:
    - Single executable golden-path certification across L1-L6 plus gateway and frontend (tasks V1-GOLDEN-001, V1-GOLDEN-002).
