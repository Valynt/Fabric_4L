# V1 Risk Register — Fabric_4L
#
# Seeded from THREAT_MODEL.md, PRODUCTION_READINESS_REPORT.md, and
# docs/governance/compatibility-debt-registry.md rather than rediscovered.
# Cartographers (task V1-CARTO-001) extend this file with file-level evidence;
# they do not replace it.

schema_version: 1

risks:
  - id: RISK-001
    title: Cross-tenant data exposure
    severity: P0
    sources: [THREAT_MODEL.md]
    mitigation: >
      tests/tenancy, tests/test_cross_tenant_hostile.py, tenant_boundary pytest
      marker, security-readiness-gate. Remaining surfaces tracked in tasks
      V1-TENANCY-010..012.
    status: partially-mitigated

  - id: RISK-002
    title: Incomplete critical workflows at launch
    severity: P0
    sources: [PRODUCTION_READINESS_REPORT.md]
    mitigation: >
      Executable golden-path certification (tasks V1-GOLDEN-001, V1-GOLDEN-002)
      converts reported architecture-convergence claims into evidence on
      current main.
    status: open

  - id: RISK-003
    title: Authentication and authorization failures
    severity: P0
    sources: [THREAT_MODEL.md, SECURITY.md]
    mitigation: >
      scripts/ci/check_auth_bypass.py, ProductionSafetyValidator fail-closed
      startup, tests/security suite.
    status: mitigated-verify-continuously

  - id: RISK-004
    title: Incorrect billing or entitlements
    severity: P0
    sources: [THREAT_MODEL.md]
    mitigation: tests/billing, tests/tenancy/test_billing_tenant_scope.py; billing is a single-writer surface.
    status: partially-mitigated

  - id: RISK-005
    title: Data corruption and unsafe migrations
    severity: P0
    sources: [PRODUCTION_READINESS_REPORT.md]
    mitigation: >
      make check-migration-postgres-roundtrip, tests/release/test_database_migration_rollback.py,
      tests/release/test_migration_safety_policy.py.
    status: mitigated-verify-continuously

  - id: RISK-006
    title: Background-job failures and lost work
    severity: P0
    sources: [PRODUCTION_READINESS_REPORT.md]
    mitigation: celery marker suites, tests/reliability; queue tenant-context verification tracked in V1-TENANCY-010.
    status: partially-mitigated

  - id: RISK-007
    title: Unobservable production failures
    severity: P1
    sources: [PRODUCTION_READINESS_REPORT.md, RUNBOOK.md]
    mitigation: tests/observability, tests/release/test_observability_deployment_readiness.py; golden-path trace coverage tracked in V1-OPS-001.
    status: partially-mitigated

  - id: RISK-008
    title: No tested restore or rollback path
    severity: P0
    sources: [RUNBOOK.md]
    mitigation: make test-backup-drills, tests/recovery, tests/release/test_rollback_procedure.py; rehearsal wired into scripts/release/certify_candidate.sh.
    status: mitigated-verify-continuously

  - id: RISK-009
    title: AI outputs incorrect, ungrounded, insecure, or unexpectedly expensive
    severity: P0
    sources: [THREAT_MODEL.md]
    mitigation: ai-evals-pipeline.yml, make evals; deterministic AI gates and evals consolidation tracked in V1-EVALS-001.
    status: partially-mitigated

  - id: RISK-010
    title: Architectural drift via competing ingress, persistence, routing, and orchestration paths
    severity: P0
    sources: [docs/governance/compatibility-debt-registry.md, docs/reference/layer-runtime-path-governance.md]
    mitigation: >
      Launch freeze (scripts/ci/check_compatibility_launch_freeze.py), path
      governance checks; cartographers must verify or refute reported
      resolution with file-level evidence (task V1-CARTO-001).
    status: open

  - id: RISK-011
    title: Parallel gate system introduced by the release factory itself
    severity: P0
    sources: [release/v1/launch-contract.yaml]
    mitigation: >
      All release-factory scripts compose existing make gates; the validator
      test asserts referenced gates exist; certification wraps
      make production-readiness-gate and never bypasses it.
    status: mitigated-by-design
