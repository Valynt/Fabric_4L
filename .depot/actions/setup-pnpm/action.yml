name: 'Setup Node.js + pnpm'
description: 'Install the canonical Node.js and pnpm versions used across Fabric 4L workflows, deriving the pnpm version from packageManager.'

inputs:
  node-version:
    description: 'Node.js version to install'
    required: false
    default: '22.18.0'
  cache:
    description: 'Package manager to cache (npm, yarn, or pnpm); leave empty to disable caching'
    required: false
    default: 'pnpm'
  cache-dependency-path:
    description: 'Dependency path for cache hash'
    required: false
    default: 'pnpm-lock.yaml'

runs:
  using: 'composite'
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        run_install: false

    - name: Setup Node.js
      if: ${{ inputs.cache != '' }}
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.cache }}
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

    - name: Setup Node.js (no cache)
      if: ${{ inputs.cache == '' }}
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: ${{ inputs.node-version }}
