# Depot CI Migration
# Source: .github/workflows/zero-trust-validation.yml
#
# Changes made:
# - Changed GitHub runs-on labels to their Depot equivalents

name: Zero Trust Validation
permissions:
  contents: read
on:
  pull_request:
    branches: [main]
    # Change-scoping: zero-trust static checks inspect runtime code, infra
    # manifests, and the check scripts themselves. Docs-only PRs skip; the
    # nightly schedule and push-to-main runs remain unscoped as the safety
    # net (cadence gates belong on the calendar, not the per-PR path).
    paths:
      - "services/**"
      - "apps/**"
      - "packages/**"
      - "k8s/**"
      - "infra/**"
      - "monitoring/**"
      - ".github/**"
      - "scripts/**"
      - "config/**"
      - "Makefile"
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *" # Nightly at 03:00 UTC
  workflow_dispatch:
concurrency:
  # Cancel only an obsolete run of this same workflow/ref. A global
  # feature-branch group lets activity on an unrelated PR cancel required gates.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  # Opt into Node.js 24 for GitHub Actions
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  zero-trust-gate:
    name: zero-trust-gate
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run zero-trust checks
        run: |
          mkdir -p artifacts/zero-trust
          bash scripts/security/zero_trust_checks.sh
      - name: Upload zero-trust evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zero-trust-evidence
          path: artifacts/zero-trust/
          retention-days: 30
