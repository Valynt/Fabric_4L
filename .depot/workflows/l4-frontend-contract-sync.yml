# Depot CI Migration
# Source: .github/workflows/l4-frontend-contract-sync.yml
#
# Changes made:
# - Rewrote .github/ path references to .depot/
# - Changed GitHub runs-on labels to their Depot equivalents

name: Layer 4 Frontend Contract Sync
permissions:
  contents: read
on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'contracts/openapi/layer4-agents.json'
      - 'apps/web/scripts/generate-api-types.ts'
      - 'apps/web/src/api/generated/**'
      - 'apps/web/src/types/**'
      - 'tests/contract/test_l4_frontend_contract.py'
      - '.depot/workflows/l4-frontend-contract-sync.yml'
  push:
    branches: [main, develop]
    paths:
      - 'contracts/openapi/layer4-agents.json'
      - 'apps/web/scripts/generate-api-types.ts'
      - 'apps/web/src/api/generated/**'
      - 'apps/web/src/types/**'
      - 'tests/contract/test_l4_frontend_contract.py'
      - '.depot/workflows/l4-frontend-contract-sync.yml'
  workflow_dispatch:
concurrency:
  group: l4-frontend-contract-sync-${{ github.ref }}
  cancel-in-progress: true
jobs:
  l4-frontend-contract-sync:
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: '10.18.1'
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.18.0'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r tests/requirements-test.lock
      - name: Regenerate frontend API client/types from canonical Layer 4 contract
        run: pnpm --dir apps/web run generate:types
      - name: Fail on generated output drift in apps/web
        run: |
          set -euo pipefail
          if ! git diff --quiet -- apps/web/src/api/generated apps/web/src/types; then
            echo "::error::Layer 4 frontend generated artifacts are stale in apps/web."
            echo "Regenerate locally:"
            echo "  pnpm --dir apps/web run generate:types"
            echo "Then commit updated files from apps/web/src/api/generated and apps/web/src/types."
            git --no-pager diff -- apps/web/src/api/generated apps/web/src/types
            exit 1
          fi
      - name: Validate Layer 4 frontend payload compatibility contract test
        run: pytest tests/contract/test_l4_frontend_contract.py
