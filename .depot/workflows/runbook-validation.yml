# Depot CI Migration
# Source: .github/workflows/runbook-validation.yml
#
# Changes made:
# - Changed GitHub runs-on labels to their Depot equivalents

name: Runbook Validation
permissions:
  contents: read
  issues: write
on:
  push:
    branches: [main]
    paths:
      - 'monitoring/alerting/rules.yml'
      - 'docs/troubleshooting/runbooks/**'
      - '.github/scripts/validate-runbooks.py'
  pull_request:
    branches: [main]
    paths:
      - 'monitoring/alerting/rules.yml'
      - 'docs/troubleshooting/runbooks/**'
      - '.github/scripts/validate-runbooks.py'
jobs:
  validate-runbooks:
    name: Validate Runbook Files
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - name: Validate runbooks
        run: |
          python .github/scripts/validate-runbooks.py --verbose
      - name: Comment PR with results (on failure)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **Runbook Validation Failed**\n\nOne or more alerts in `monitoring/alerting/rules.yml` reference missing runbook files, or runbooks are missing required sections (Symptoms, Diagnosis, Remediation, Escalation).\n\nSee workflow logs for details.'
            })
