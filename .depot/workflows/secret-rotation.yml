# Depot CI Migration
# Source: .github/workflows/secret-rotation.yml
#
# Changes made:
# - Changed GitHub runs-on labels to their Depot equivalents

# Secret Rotation Automation
# Automated rotation of static secrets with audit logging
name: Secret Rotation
permissions:
  contents: read
  issues: write
  id-token: write # Required for Infisical OIDC authentication
on:
  # Manual trigger with options
  workflow_dispatch:
    inputs:
      rotation_type:
        description: 'Type of secrets to rotate'
        required: true
        type: choice
        options:
          - jwt
          - llm
          - api_hmac
          - database_static
          - all
        default: 'all'
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - prod
        default: 'staging'
      force_rotation:
        description: 'Force rotation even if not due'
        required: false
        type: boolean
        default: false
  # Scheduled rotation ( Sundays at 2 AM UTC )
  schedule:
    - cron: '0 2 * * 0'
# Prevent concurrent runs
concurrency:
  group: secret-rotation-${{ github.event.inputs.environment || 'scheduled' }}
  cancel-in-progress: false
env:
  INFISICAL_PROJECT_ID: fabric4l
jobs:
  # ============================================
  # Pre-rotation checks
  # ============================================
  pre-checks:
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    outputs:
      should_rotate: ${{ steps.check.outputs.should_rotate }}
      rotation_list: ${{ steps.check.outputs.rotation_list }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check rotation schedule
        id: check
        env:
          INPUT_ROTATION_TYPE: ${{ github.event.inputs.rotation_type || 'all' }}
          INPUT_ENVIRONMENT: ${{ github.event.inputs.environment || 'staging' }}
          INPUT_FORCE_ROTATION: ${{ github.event.inputs.force_rotation }}
        run: |
          ROTATION_TYPE="$INPUT_ROTATION_TYPE"
          ENV="$INPUT_ENVIRONMENT"
          FORCE="$INPUT_FORCE_ROTATION"

          echo "::group::Rotation Check"
          echo "Type: $ROTATION_TYPE"
          echo "Environment: $ENV"
          echo "Force: $FORCE"
          echo "::endgroup::"

          # Build rotation list
          ROTATION_LIST="[]"
          SHOULD_ROTATE="false"

          if [[ "$FORCE" == "true" ]] || [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            SHOULD_ROTATE="true"
            case $ROTATION_TYPE in
              jwt)
                ROTATION_LIST='["jwt"]'
                ;;
              llm)
                ROTATION_LIST='["llm"]'
                ;;
              api_hmac)
                ROTATION_LIST='["api_hmac"]'
                ;;
              database_static)
                ROTATION_LIST='["database_static"]'
                ;;
              all)
                ROTATION_LIST='["jwt", "llm", "api_hmac", "database_static"]'
                ;;
            esac
          else
            # Check scheduled rotation based on day of year
            DAY_OF_YEAR=$(date +%j)

            # JWT: Every 90 days (days 1, 91, 181, 271)
            if [[ $((DAY_OF_YEAR % 90)) -eq 1 ]]; then
              SHOULD_ROTATE="true"
              ROTATION_LIST=$(python3 -c "import sys,json; a=json.loads(sys.argv[1]); a.append('jwt'); print(json.dumps(a))" "$ROTATION_LIST")
            fi

            # LLM: Every 180 days
            if [[ $((DAY_OF_YEAR % 180)) -eq 1 ]]; then
              SHOULD_ROTATE="true"
              ROTATION_LIST=$(python3 -c "import sys,json; a=json.loads(sys.argv[1]); a.append('llm'); print(json.dumps(a))" "$ROTATION_LIST")
            fi

            # API HMAC: Every 90 days
            if [[ $((DAY_OF_YEAR % 90)) -eq 1 ]]; then
              SHOULD_ROTATE="true"
              ROTATION_LIST=$(python3 -c "import sys,json; a=json.loads(sys.argv[1]); a.append('api_hmac'); print(json.dumps(a))" "$ROTATION_LIST")
            fi
          fi

          echo "should_rotate=$SHOULD_ROTATE" >> $GITHUB_OUTPUT
          echo "rotation_list=$ROTATION_LIST" >> $GITHUB_OUTPUT

          echo "::group::Decision"
          echo "Should rotate: $SHOULD_ROTATE"
          echo "Rotation list: $ROTATION_LIST"
          echo "::endgroup::"
  # ============================================
  # Rotate JWT Signing Secrets
  # ============================================
  rotate-jwt:
    needs: pre-checks
    if: contains(needs.pre-checks.outputs.rotation_list, 'jwt')
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Infisical CLI
        run: |
          curl -1sLf 'https://dl.cloudsmith.io/public/infisical/infisical-cli/setup.deb.sh' | sudo -E bash
          sudo apt-get install -y infisical
      - name: Validate Infisical CLI installation
        run: |
          infisical --version
      - name: Authenticate with Infisical
        run: |
          # Exchange GitHub OIDC request token for the actual JWT
          # Extract OIDC JWT using Python (guaranteed on GitHub runners; no jq dependency)
          JWT=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=infisical" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("value",""))')
          if [ -z "$JWT" ] || [ "$JWT" = "null" ]; then
            echo "Error: Failed to obtain OIDC JWT from GitHub"
            exit 1
          fi
          echo "::add-mask::$JWT"
          export INFISICAL_TOKEN=$(infisical login --method=oidc --oidc-jwt="$JWT" --machine-identity-id=${{ secrets.INFISICAL_IDENTITY_ID }} --plain)
          if [ -z "$INFISICAL_TOKEN" ]; then
            echo "Error: Failed to authenticate with Infisical"
            exit 1
          fi
          echo "::add-mask::$INFISICAL_TOKEN"
          echo "INFISICAL_TOKEN=$INFISICAL_TOKEN" >> "$GITHUB_ENV"
      - name: Generate new JWT secret
        id: generate
        run: |
          NEW_SECRET=$(openssl rand -base64 64)
          echo "::add-mask::$NEW_SECRET"
          echo "new_secret=$NEW_SECRET" >> $GITHUB_OUTPUT
      - name: Store in Infisical
        run: |
          infisical secrets set \
            --env=${{ github.event.inputs.environment || 'staging' }} \
            --path=/shared \
            JWT_SECRET="${{ steps.generate.outputs.new_secret }}" \
            --silent
          echo "Stored JWT_SECRET in Infisical /shared"
      - name: Audit log rotation
        env:
          ROTATION_ENVIRONMENT: ${{ github.event.inputs.environment || 'staging' }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          cat >> rotation-audit.log << EOF
          {
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "secret_type": "jwt",
            "environment": "$ROTATION_ENVIRONMENT",
            "rotated_by": "github-actions",
            "workflow_run_id": "$WORKFLOW_RUN_ID",
            "status": "completed"
          }
          EOF
      - name: Notify services to reload
        run: |
          # Trigger rolling restart of auth-dependent services
          kubectl rollout restart deployment/layer1-ingestion -n value-fabric
          kubectl rollout restart deployment/layer2-extraction -n value-fabric
          kubectl rollout restart deployment/layer3-knowledge -n value-fabric
          kubectl rollout restart deployment/layer4-agents -n value-fabric

          # Wait for rollout to complete
          kubectl rollout status deployment/layer1-ingestion -n value-fabric --timeout=300s
          kubectl rollout status deployment/layer4-agents -n value-fabric --timeout=300s
      - name: Verify rotation
        run: |
          # Verify JWT signing still works
          scripts/secrets/verify-jwt-rotation.sh
      - name: Upload JWT rotation audit log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rotation-audit-jwt-${{ github.run_id }}
          path: rotation-audit.log
          retention-days: 365
  # ============================================
  # Rotate LLM API Keys
  # ============================================
  rotate-llm:
    needs: pre-checks
    if: contains(needs.pre-checks.outputs.rotation_list, 'llm')
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rotate OpenAI API Key
        id: openai
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROTATION_ENVIRONMENT: ${{ github.event.inputs.environment || 'staging' }}
        run: |
          # Note: OpenAI doesn't support automated key rotation via API
          # This step creates a notification for manual rotation
          echo "::warning::OpenAI API keys require manual rotation via dashboard"
          echo "Manual action required: https://platform.openai.com/account/api-keys"

          # Create issue for tracking
          gh issue create \
            --title "[ACTION REQUIRED] Rotate OpenAI API Key - $ROTATION_ENVIRONMENT" \
            --body "LLM API key rotation is due. Please rotate manually via OpenAI dashboard." \
            --label "security,rotation-required"
      - name: Audit log rotation
        env:
          ROTATION_ENVIRONMENT: ${{ github.event.inputs.environment || 'staging' }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          cat >> rotation-audit.log << EOF
          {
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "secret_type": "llm",
            "environment": "$ROTATION_ENVIRONMENT",
            "rotated_by": "manual-notification",
            "workflow_run_id": "$WORKFLOW_RUN_ID",
            "status": "manual_action_required"
          }
          EOF
      - name: Upload LLM rotation audit log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rotation-audit-llm-${{ github.run_id }}
          path: rotation-audit.log
          retention-days: 365
  # ============================================
  # Rotate API HMAC Secret
  # ============================================
  rotate-api-hmac:
    needs: pre-checks
    if: contains(needs.pre-checks.outputs.rotation_list, 'api_hmac')
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Infisical CLI
        run: |
          curl -1sLf 'https://dl.cloudsmith.io/public/infisical/infisical-cli/setup.deb.sh' | sudo -E bash
          sudo apt-get install -y infisical
      - name: Validate Infisical CLI installation
        run: |
          infisical --version
      - name: Authenticate with Infisical
        run: |
          # Extract OIDC JWT using Python (guaranteed on GitHub runners; no jq dependency)
          JWT=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=infisical" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("value",""))')
          if [ -z "$JWT" ] || [ "$JWT" = "null" ]; then
            echo "Error: Failed to obtain OIDC JWT from GitHub"
            exit 1
          fi
          echo "::add-mask::$JWT"
          export INFISICAL_TOKEN=$(infisical login --method=oidc --oidc-jwt="$JWT" --machine-identity-id=${{ secrets.INFISICAL_IDENTITY_ID }} --plain)
          if [ -z "$INFISICAL_TOKEN" ]; then
            echo "Error: Failed to authenticate with Infisical"
            exit 1
          fi
          echo "::add-mask::$INFISICAL_TOKEN"
          echo "INFISICAL_TOKEN=$INFISICAL_TOKEN" >> "$GITHUB_ENV"
      - name: Generate new HMAC secret
        id: generate
        run: |
          NEW_SECRET=$(openssl rand -base64 64)
          echo "::add-mask::$NEW_SECRET"
          echo "new_secret=$NEW_SECRET" >> $GITHUB_OUTPUT
      - name: Store in Infisical
        run: |
          infisical secrets set \
            --env=${{ github.event.inputs.environment || 'staging' }} \
            --path=/shared \
            API_KEY_HMAC_SECRET="${{ steps.generate.outputs.new_secret }}" \
            --silent
          echo "Stored API_KEY_HMAC_SECRET in Infisical /shared"
      - name: Audit log rotation
        env:
          ROTATION_ENVIRONMENT: ${{ github.event.inputs.environment || 'staging' }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          cat >> rotation-audit.log << EOF
          {
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "secret_type": "api_hmac",
            "environment": "$ROTATION_ENVIRONMENT",
            "rotated_by": "github-actions",
            "workflow_run_id": "$WORKFLOW_RUN_ID",
            "status": "completed"
          }
          EOF
      - name: Upload API HMAC rotation audit log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rotation-audit-api-hmac-${{ github.run_id }}
          path: rotation-audit.log
          retention-days: 365
      - name: Rolling restart
        run: |
          # Rolling restart to pick up new HMAC secret
          kubectl rollout restart deployment/layer1-ingestion -n value-fabric
          kubectl rollout restart deployment/layer4-agents -n value-fabric

          kubectl rollout status deployment/layer4-agents -n value-fabric --timeout=300s
  # ============================================
  # Rotate Static Database Passwords (non-dynamic)
  # ============================================
  rotate-database-static:
    needs: pre-checks
    if: contains(needs.pre-checks.outputs.rotation_list, 'database_static')
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Infisical CLI
        run: |
          curl -1sLf 'https://dl.cloudsmith.io/public/infisical/infisical-cli/setup.deb.sh' | sudo -E bash
          sudo apt-get install -y infisical
      - name: Validate Infisical CLI installation
        run: |
          infisical --version
      - name: Authenticate with Infisical
        run: |
          # Extract OIDC JWT using Python (guaranteed on GitHub runners; no jq dependency)
          JWT=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=infisical" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("value",""))')
          if [ -z "$JWT" ] || [ "$JWT" = "null" ]; then
            echo "Error: Failed to obtain OIDC JWT from GitHub"
            exit 1
          fi
          echo "::add-mask::$JWT"
          export INFISICAL_TOKEN=$(infisical login --method=oidc --oidc-jwt="$JWT" --machine-identity-id=${{ secrets.INFISICAL_IDENTITY_ID }} --plain)
          if [ -z "$INFISICAL_TOKEN" ]; then
            echo "Error: Failed to authenticate with Infisical"
            exit 1
          fi
          echo "::add-mask::$INFISICAL_TOKEN"
          echo "INFISICAL_TOKEN=$INFISICAL_TOKEN" >> "$GITHUB_ENV"
      - name: Generate new database passwords
        id: generate
        run: |
          NEO4J_PASS=$(openssl rand -base64 32)
          REDIS_PASS=$(openssl rand -base64 32)

          echo "::add-mask::$NEO4J_PASS"
          echo "::add-mask::$REDIS_PASS"

          echo "neo4j_pass=$NEO4J_PASS" >> $GITHUB_OUTPUT
          echo "redis_pass=$REDIS_PASS" >> $GITHUB_OUTPUT
      - name: Update Infisical
        run: |
          infisical secrets set \
            --env=${{ github.event.inputs.environment || 'staging' }} \
            --path=/infra \
            NEO4J_PASSWORD="${{ steps.generate.outputs.neo4j_pass }}" \
            REDIS_PASSWORD="${{ steps.generate.outputs.redis_pass }}" \
            --silent
          echo "Stored database passwords in Infisical /infra"
      - name: Update Neo4j password in database
        env:
          NEW_NEO4J_PASS: ${{ steps.generate.outputs.neo4j_pass }}
        run: |
          # Connect to Neo4j and update password
          kubectl exec -n value-fabric neo4j-0 -- cypher-shell -u neo4j -p "$OLD_NEO4J_PASS" \
            "ALTER CURRENT USER SET PASSWORD FROM '\$OLD_NEO4J_PASS' TO '$NEW_NEO4J_PASS'"
      - name: Update Redis password
        run: |
          # Update Redis ACL or restart with new config
          kubectl rollout restart statefulset/redis -n value-fabric
      - name: Audit log rotation
        env:
          ROTATION_ENVIRONMENT: ${{ github.event.inputs.environment || 'staging' }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          cat >> rotation-audit.log << EOF
          {
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "secret_type": "database_static",
            "environment": "$ROTATION_ENVIRONMENT",
            "rotated_by": "github-actions",
            "workflow_run_id": "$WORKFLOW_RUN_ID",
            "status": "completed"
          }
          EOF
      - name: Upload database rotation audit log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rotation-audit-database-static-${{ github.run_id }}
          path: rotation-audit.log
          retention-days: 365
      - name: Rolling restart
        run: |
          kubectl rollout restart statefulset/neo4j -n value-fabric
          kubectl rollout restart statefulset/redis -n value-fabric
  # ============================================
  # Post-rotation verification
  # ============================================
  verify:
    needs: [pre-checks, rotate-jwt, rotate-llm, rotate-api-hmac, rotate-database-static]
    if: always()
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    steps:
      - name: Download rotation audit logs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: rotation-audit-*
          path: rotation-audit-logs
          # Do NOT merge: every per-job artifact contains a file named
          # rotation-audit.log, so merging would overwrite all but one. Keeping
          # them in per-artifact subdirectories preserves every job's record.
      - name: Consolidate audit log
        run: |
          set -euo pipefail
          # Each rotation-audit.log is a multi-line pretty-printed JSON object.
          # `jq -s` slurps the concatenated objects into a single JSON array,
          # which correctly handles multi-line input (a naive line-join with
          # paste/commas would produce invalid JSON).
          find rotation-audit-logs -name 'rotation-audit.log' -print0 \
            | xargs -0 cat \
            | jq -s '.' > rotation-audit.log
          # Guarantee a valid (possibly empty) array even when no logs exist.
          if [ ! -s rotation-audit.log ]; then echo "[]" > rotation-audit.log; fi
      - name: Run smoke tests
        run: |
          echo "Running post-rotation smoke tests..."
          scripts/smoke/infisical_smoke.py || scripts/smoke/vault_smoke.py || echo "No smoke test script available"
      - name: Upload audit log
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rotation-audit-${{ github.run_id }}
          path: rotation-audit.log
          retention-days: 365
      - name: Notify on success
        if: success()
        run: |
          echo "::notice::Secret rotation completed successfully"
      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Secret rotation failed - check logs for details"
          # Create PagerDuty alert or Slack notification
