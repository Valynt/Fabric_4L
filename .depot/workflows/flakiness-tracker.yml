# Depot CI Migration
# Source: .github/workflows/flakiness-tracker.yml
#
# Changes made:
# - Changed GitHub runs-on labels to their Depot equivalents

# Fabric_4L Flakiness Tracker — Weekly Cron + On-Demand
# Runs the full test suite multiple times to detect flaky tests,
# generates a report, and opens a GitHub issue if any are found.
#
# v1.2.0 — 2024-06

name: flakiness-tracker
permissions:
  contents: read
on:
  # Weekly: every Sunday at 06:00 UTC
  schedule:
    - cron: "0 6 * * 0"
  # Manual trigger with configurable parameters
  workflow_dispatch:
    inputs:
      times:
        description: "Number of times to run each test"
        required: true
        default: "5"
        type: string
      fail_on_flaky:
        description: "Fail workflow if flaky tests are detected"
        required: true
        default: true
        type: boolean
      backend_only:
        description: "Run only backend tests"
        required: true
        default: false
        type: boolean
      frontend_only:
        description: "Run only frontend tests"
        required: true
        default: false
        type: boolean
jobs:
  flakiness-tracker:
    name: Flakiness Tracker
    permissions:
      contents: read
      issues: write # Creates the scheduled flakiness tracking issue.
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    timeout-minutes: 120
    strategy:
      matrix:
        python-version: ["3.11"]
        node-version: ["20"]
    env:
      TIMES: ${{ github.event.inputs.times || '5' }}
      FAIL_ON_FLAKY: ${{ github.event.inputs.fail_on_flaky || 'true' }}
      BACKEND_ONLY: ${{ github.event.inputs.backend_only || 'false' }}
      FRONTEND_ONLY: ${{ github.event.inputs.frontend_only || 'false' }}
    steps:
      # ── Checkout ───────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for blame/annotation
      # ── Python setup ──────────────────────────────────────────────────────
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      # ── pnpm setup (must precede setup-node so its pnpm cache resolves) ──
      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: "10.18.1"
      # ── Node.js setup ─────────────────────────────────────────────────────
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      # ── Backend dependencies ──────────────────────────────────────────────
      - name: Install backend dependencies
        if: ${{ env.BACKEND_ONLY != 'true' || env.FRONTEND_ONLY != 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-json-report
          # Install project deps if requirements.txt exists
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      # ── Frontend dependencies ─────────────────────────────────────────────
      - name: Install frontend dependencies
        if: ${{ env.FRONTEND_ONLY == 'true' || env.BACKEND_ONLY != 'true' }}
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir apps/web exec playwright install --with-deps chromium
      # ── Run flakiness tracker ─────────────────────────────────────────────
      - name: Run flakiness tracker
        id: tracker
        run: |
          ARGS="--times ${{ env.TIMES }} --verbose --fail-on-flaky"
          if [ "${{ env.BACKEND_ONLY }}" == "true" ]; then
            ARGS="$ARGS --backend-only"
          elif [ "${{ env.FRONTEND_ONLY }}" == "true" ]; then
            ARGS="$ARGS --frontend-only"
          fi
          set +e
          python scripts/ci/flakiness_tracker.py $ARGS \
            --output reports/flakiness-report.md \
            --json reports/flakiness-report.json
          EXIT_CODE=$?
          set -e
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          echo "report_path=reports/flakiness-report.md" >> "$GITHUB_OUTPUT"
          echo "json_path=reports/flakiness-report.json" >> "$GITHUB_OUTPUT"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "flaky_detected=true" >> "$GITHUB_OUTPUT"
          else
            echo "flaky_detected=false" >> "$GITHUB_OUTPUT"
          fi
      # ── Upload report artifacts ──────────────────────────────────────────
      - name: Upload flakiness report (Markdown)
        uses: actions/upload-artifact@v4
        with:
          name: flakiness-report-md
          path: reports/flakiness-report.md
          retention-days: 90
      - name: Upload flakiness report (JSON)
        uses: actions/upload-artifact@v4
        with:
          name: flakiness-report-json
          path: reports/flakiness-report.json
          retention-days: 90
      # ── Post PR comment (if triggered by PR) ──────────────────────────────
      - name: Post PR comment
        if: ${{ github.event_name == 'pull_request' && steps.tracker.outputs.flaky_detected == 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('reports/flakiness-report.md', 'utf8');
            const body = '## ⚠️ Flaky Tests Detected\n\n' + report.substring(0, 65000);
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
      # ── Create GitHub issue (cron + on-demand) ────────────────────────────
      - name: Create GitHub issue for flaky tests
        if: ${{ steps.tracker.outputs.flaky_detected == 'true' && github.event_name != 'pull_request' }}
        id: create-issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('reports/flakiness-report.md', 'utf8');
            const jsonReport = JSON.parse(fs.readFileSync('reports/flakiness-report.json', 'utf8'));
            const flakyCount = jsonReport.summary.flaky_tests_count;
            const criticalCount = jsonReport.summary.critical_tests_count;
            const runDate = new Date().toISOString().split('T')[0];
            const title = '[flakiness] ' + flakyCount + ' flaky test(s) detected on ' + runDate;
            const labels = ['flakiness', 'automated', 'quality'];
            if (criticalCount > 0) {
              labels.push('critical');
            }
            const bodyLines = [
              '## Flakiness Tracker Report — ' + runDate,
              '',
              '> Automated weekly flakiness scan detected **' + flakyCount + ' flaky test(s)**.',
              '',
              '### Summary',
              '| Metric | Value |',
              '|--------|-------|',
              '| Total unique tests | ' + jsonReport.summary.total_unique_tests + ' |',
              '| Flaky tests | ' + jsonReport.summary.flaky_tests_count + ' |',
              '| Critical (< 95%) | ' + jsonReport.summary.critical_tests_count + ' |',
              '| Warning (95-99%) | ' + jsonReport.summary.warning_tests_count + ' |',
              '| Overall pass rate | ' + jsonReport.summary.overall_pass_rate_percent + '% |',
              '',
              '### Top flaky tests',
              jsonReport.flaky_tests.slice(0, 10).map(t => '- `' + t.nodeid + '` — ' + t.pass_rate_percent + '% pass rate (' + t.severity + ')').join('\n'),
              '',
              '### Full report',
              'See the attached artifact `flakiness-report-md` for the complete breakdown.',
              '',
              '---',
              '*Generated by [flakiness-tracker workflow](https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + ')*'
            ];
            const body = bodyLines.join('\n');
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: labels,
            });
            core.setOutput('issue_number', issue.number);
            core.setOutput('issue_url', issue.html_url);
      - name: Print issue URL
        if: ${{ steps.create-issue.outputs.issue_url }}
        run: |
          echo "Created issue: ${{ steps.create-issue.outputs.issue_url }}"
      # ── Fail the workflow if flaky tests detected ─────────────────────────
      - name: Fail on flaky tests
        if: ${{ steps.tracker.outputs.flaky_detected == 'true' && env.FAIL_ON_FLAKY == 'true' }}
        run: |
          echo "::error::Flaky tests detected. See the uploaded report artifact."
          exit 1
      # ── Update dashboard ──────────────────────────────────────────────────
      - name: Update flakiness dashboard
        if: ${{ always() }}
        run: |
          python scripts/ci/flakiness_tracker.py \
            --times 1 \
            --output docs/quality/flakiness-dashboard.md \
            --json docs/quality/flakiness-data.json
