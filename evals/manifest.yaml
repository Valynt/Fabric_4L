# V1 AI evaluation manifest — manifest-first, no pre-launch code moves.
#
# This manifest REFERENCES the existing repository-owned evaluation assets;
# it does not relocate them (release/v1/tasks/V1-EVALS-001.yaml). The actual
# launch gap is missing evaluation coverage, not the current folder name.
# Move implementation into evals/ only when that movement materially improves
# the release gate.

schema_version: 1

runners:
  golden_traces:
    command: make evals
    requires: OPENAI_API_KEY
    description: Agent golden-trace evaluations (existing canonical runner).
  eval_tests:
    command: pytest tests/evals
    description: Existing repository-owned evaluation test suite.

existing_assets:
  tests: tests/evals
  fixtures: tests/evals/fixtures
  skills: tests/evals/skills

directories:
  datasets: evals/datasets       # curated evaluation datasets (added per V1-EVALS-001)
  rubrics: evals/rubrics         # model-graded rubrics calibrated against human labels
  adversarial: evals/adversarial # direct/indirect injection and cross-tenant exfiltration sets
  baselines: evals/baselines     # frozen baseline results for regression comparison

deterministic_gates:
  - structured output schema validity
  - tool authorization boundaries
  - retrieval tenant isolation
  - citation presence for grounded claims
  - cost and latency budgets

release_wiring:
  workflow: .github/workflows/ai-evals-pipeline.yml
  task: release/v1/tasks/V1-EVALS-001.yaml
