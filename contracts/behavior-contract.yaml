  - id: compliance.audit-retry-queue
    domain: compliance
    description: >-
      Audit events are durably queued via Redis with exponential backoff retry.
      After max retries events move to a dead-letter queue. The system falls
      back to direct DB writes when Redis is unavailable.
    owner: "@value-fabric/security-leads"
    marker: audit
    expected_failure_mode: "Event dead-lettered after 3 retries; DB fallback on Redis failure"
    allowed:
      file: tests/security/test_audit_retry_queue.py
      test: test_push_serialises_event
    denied:
      file: tests/security/test_audit_retry_queue.py
      test: test_worker_dead_letters_after_max_retries
