  # Compliance
  # ───────────────────────────────────────────────────────────────────────────
  - id: compliance.retention-deletion-contract
    domain: compliance
    description: >-
      Data retention policies are declared in source code (30 days customer
      data, 7 years audit logs). Hard-delete preserves audit logs as
      append-only; deletion audit events contain all required fields.
    owner: "@value-fabric/security-leads"
