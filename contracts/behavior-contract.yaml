  # ───────────────────────────────────────────────────────────────────────────
  # Security Gaps — RBAC, JWT, Rate Limiting, API Key Safety, Audit Emission
  # ───────────────────────────────────────────────────────────────────────────
  - id: auth.rbac-wildcard-rejection
    domain: auth
    description: >-
      Wildcard permissions like "*" or "all" in JWT claims are explicitly
      discarded during token normalization. Permission checks fail closed on
      empty or invalid scopes.
    owner: "@value-fabric/security-leads"
    marker: rbac
    expected_failure_mode: "Wildcard scopes are discarded; empty permission set results in 403"
    allowed:
      file: tests/security/test_rbac.py
      test: test_all_permissions_scope_not_grantable_via_jwt_claim
    denied:
      file: tests/security/test_rbac.py
      test: test_require_any_permission_or_logic_does_not_grant_on_empty_set

  - id: auth.jwt-tampering-resistance
    domain: auth
    description: >-
      JWT tokens with modified claims, expired timestamps, invalid signatures,
      none algorithm, or algorithm confusion attacks are rejected before handler
      execution. Valid tokens proceed normally.
    owner: "@value-fabric/security-leads"
    marker: jwt_config
    expected_failure_mode: "401 with structured auth error; no handler side effects"
