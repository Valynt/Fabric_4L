  # Governance
  # ───────────────────────────────────────────────────────────────────────────
  - id: governance.privileged-access-audit
    domain: governance
    description: >-
      Super-admin privileged access requires explicit justification
      (X-Privileged-Reason header), emits CROSS_TENANT_ACCESS audit events with
      accessed tenant IDs, approval tickets, and session duration, and fails
      closed for non-super-admin users.
    owner: "@value-fabric/security-leads"
    marker: security
    expected_failure_mode: "403 for non-super-admin; 400 without reason header"
    allowed:
      file: tests/security/test_privileged_audit.py
      test: test_accepts_valid_privileged_access
    denied:
      file: tests/security/test_privileged_audit.py
      test: test_blocks_non_super_admin

  - id: governance.audit-resilience
    domain: governance
    description: >-
      Audit event emission is fire-and-forget: logger failures, DB write
      failures, and serialization errors are swallowed without propagating to
      the caller or blocking the HTTP response. Each event receives a unique ID.
    owner: "@value-fabric/security-leads"
    marker: audit_logging
    expected_failure_mode: "Exception swallowed; event returned with unique ID"
    allowed:
      file: tests/security/test_audit_resilience.py
      test: test_emit_audit_event_returns_event_on_success
    denied:
      file: tests/security/test_audit_resilience.py
      test: test_emit_audit_event_does_not_raise_when_logger_fails

  - id: governance.governance-middleware
    domain: governance
    description: >-
      Governance middleware enforces authentication on protected paths, bypasses
      auth for public paths (health, metrics, docs), validates JWT signatures
      and claims, and fails closed with stable error codes on malformed or
      missing credentials.
    owner: "@value-fabric/security-leads"
    marker: security
    expected_failure_mode: "401 with stable error code; public paths bypass auth"
    allowed:
