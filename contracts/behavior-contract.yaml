    domain: governance
    description: >-
      Layer 5 audit logs are append-only: non-privileged mutations are blocked,
      repository queries enforce tenant and global scope filters, and validation
      events require privileged insert guards.
    owner: "@value-fabric/security-leads"
    marker: security
    expected_failure_mode: "Mutation blocked; append-only invariant enforced"
    allowed:
