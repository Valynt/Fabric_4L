# Schema Registry Catalog
# Canonical publication, versioning, discovery, and compatibility-control plane
# for every machine-readable payload contract crossing a Fabric_4L boundary.
#
# Owner: Platform team
# Governance: contracts/GOVERNANCE.md
# Validation: scripts/ci/check_schema_registry_integrity.py

$schema: https://valuefabric.ai/contracts/jsonschema/registry.schema.json
version: 1.0.0
description: |
  The Schema Registry is the authoritative control plane for structural
  contracts. It does not own business semantics, authorization policy, or
  implementation logic. Production services consume pinned, validated contract
  bundles built from this catalog.

policies:
  default_compatibility: ADDITIVE_WITHIN_MAJOR
  default_lifecycle: DRAFT -> REVIEW -> PUBLISHED -> DEPRECATED -> RETIRED
  default_dialect: https://json-schema.org/draft/2020-12/schema

# --- Common value objects ---
schemas:
  # Money
  - schema_id: common.value.money
    version: 1.0.0
    major_contract: v1
    kind: COMMON_VALUE_OBJECT
    domain: common
    owner: platform/contracts
    status: PUBLISHED
    published_at: "2025-01-15T00:00:00Z"
    dialect: https://json-schema.org/draft/2020-12/schema
    compatibility_policy: ADDITIVE_WITHIN_MAJOR
    data_classification: INTERNAL
    artifact: contracts/jsonschema/common/v1/money.schema.json
    content_hash: sha256:fe43dd3dbae4e32fec53403c01fd51c663a3826729b764bab0526eb373d3857b
    examples:
      - contracts/jsonschema/common/v1/fixtures/money.valid.json

