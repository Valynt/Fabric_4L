# Explicitly public routes that are intentionally unauthenticated.
allowlist:
  - method: "*"
    path: "/health*"
    reason: "Liveness/readiness endpoints"
  - method: "*"
    path: "/metrics*"
    reason: "Prometheus scrape endpoints"
  - method: "*"
    path: "/ready"
    reason: "Platform readiness probe endpoint"
  - method: "*"
    path: "/docs*"
    reason: "OpenAPI docs"
  - method: "*"
    path: "/openapi.json"
    reason: "OpenAPI schema"
  - method: "*"
    path: "/redoc*"
    reason: "ReDoc docs"
  - method: "POST"
    path: "/v1/tenants/register*"
    reason: "Tenant bootstrap registration"
  - method: "POST"
    path: "/v1/auth/*"
    reason: "Authentication handshakes"
  - method: "POST"
    path: "/auth/*"
    reason: "Authentication handshakes (non-versioned router prefix)"
  - method: "GET"
    path: "/v1/auth/health"
    reason: "Auth health probe"
  - method: "GET"
    path: "/auth/health"
    reason: "Auth health probe"
  - method: "GET"
    path: "/v1/auth/clerk/health"
    reason: "Clerk auth health probe"
  - method: "GET"
    path: "/auth/clerk/health"
    reason: "Clerk auth health probe"
  - method: "POST"
    path: "/v1/signup"
    reason: "User registration — unauthenticated by design"
  - method: "POST"
    path: "/v1/login"
    reason: "Credential login — unauthenticated by design"
  - method: "POST"
    path: "/v1/accept-invite"
    reason: "Invitation acceptance — unauthenticated by design; requires the single-use invite token (email-only acceptance removed: account-takeover fix)"
  - method: "POST"
    path: "/formulas/evaluate"
    reason: "Formula preview/evaluation endpoint"
  - method: "GET"
    path: "/formulas/variables"
    reason: "Public formula metadata"
  - method: "GET"
    path: "/formulas"
    reason: "Public formula catalog"
  - method: "GET"
    path: "/formulas/*"
    reason: "Public formula details"
  - method: "POST"
    path: "/formulas/scenario"
    reason: "Scenario simulation endpoint"
  - method: "GET"
    path: "/"
    reason: "Service root endpoint"
  - method: "GET"
    path: "/robots.txt"
    reason: "Robots exclusion protocol endpoint"
  - method: "GET"
    path: "/logs"
    reason: "Operational log summary endpoint"
  - method: "GET"
    path: "/workflows/types"
    reason: "Workflow type discovery endpoint"
  - method: "POST"
    path: "/c1/stream"
    reason: "Public streaming ingress"
  - method: "GET"
    path: "/plans/*/limits"
    reason: "Plan limit discovery"
  - method: "POST"
    path: "/internal/webhooks/clerk"
    reason: "Clerk webhook uses Svix signature verification"
  - method: "GET"
    path: "/readiness"
    reason: "Deprecated readiness alias for orchestration compatibility"
  - method: "GET"
    path: "/webhooks/crm/health"
    reason: "Webhook pipeline health probe for operational monitoring"
