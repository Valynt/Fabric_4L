# Horizontal Pod Autoscaler for Layer 2.5 Signal Refinery
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: layer2-5-signal-refinery
  namespace: value-fabric
  labels:
    app: layer2-5-signal-refinery
    layer: layer2-5
    component: signal-refinery
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: layer2-5-signal-refinery
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
