apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - argocd-install.yaml      # Bootstrap docs + fabric-4l-base Application (manual sync)
  - argocd-applications.yaml # Environment-specific Applications (dev/staging/prod overlays)
  - rollouts/                # Argo Rollouts for progressive delivery

commonLabels:
  app.kubernetes.io/part-of: value-fabric
  app.kubernetes.io/managed-by: argocd
