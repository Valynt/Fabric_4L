# P1-009: ArgoCD Installation and Configuration
# Installs ArgoCD into the value-fabric cluster and configures GitOps sync
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    app.kubernetes.io/part-of: fabric4l-gitops
---
# ArgoCD core components (simplified - full install via official manifests)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-server
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argocd-server
    spec:
      serviceAccountName: argocd-server
      containers:
        - name: argocd-server
          image: quay.io/argoproj/argocd:v2.10.0
          ports:
            - containerPort: 8080
              name: server
            - containerPort: 8083
              name: grpc
          env:
            - name: ARGOCD_SERVER_INSECURE
              value: "false"
            - name: ARGOCD_SERVER_LOG_LEVEL
              value: "info"
            - name: ARGOCD_API_SERVER_REPLICAS
              value: "1"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-server
  namespace: argocd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-server
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argocd-server
subjects:
  - kind: ServiceAccount
    name: argocd-server
    namespace: argocd
---
# ArgoCD Application for Fabric_4L
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fabric-4l-platform
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: fabric4l
spec:
  project: default
  source:
    repoURL: https://github.com/bmsull560/Fabric_4L.git
    targetRevision: HEAD
    path: k8s/overlays/production
    kustomize:
      commonAnnotations:
        deployed-by: argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: value-fabric
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 3
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
  revisionHistoryLimit: 10
