apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# prod-gateway-api: prod environment + Gateway API routing.
# Conditionally Supported: requires Gateway API CRDs and GatewayClass controller.
# See README.md for prerequisites and troubleshooting.

namespace: value-fabric

resources:
  - ../../envs/prod
  - ../../routing/gateway-api
  - hostname-config.yaml

replacements:
  # Application host -> Gateway listeners + HTTPRoute hostname + Certificate dnsName
  - source:
      kind: ConfigMap
      name: routing-host
      fieldPath: data.host
    targets:
      - select:
          kind: Gateway
          name: value-fabric-gateway
        fieldPaths:
          - spec.listeners.0.hostname
          - spec.listeners.1.hostname
      - select:
          kind: HTTPRoute
          name: application
        fieldPaths:
          - spec.hostnames.0
      - select:
          kind: Certificate
          name: frontend-tls
        fieldPaths:
          - spec.dnsNames.0
