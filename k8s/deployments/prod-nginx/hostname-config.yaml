apiVersion: v1
kind: ConfigMap
metadata:
  name: routing-host
  namespace: value-fabric
data:
  host: www.valuepact.ai
  # Ingress controller namespace for NetworkPolicy
  ingressNamespace: ingress-nginx
  # cert-manager ClusterIssuer for TLS certificates
  tlsIssuer: letsencrypt-prod
  # cert-manager ClusterIssuer email (must be replaced with valid email)
  issuerEmail: security@valuepact.ai
