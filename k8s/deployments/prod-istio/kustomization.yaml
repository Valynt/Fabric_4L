apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# prod-istio: prod environment + Istio routing.
# Requires cluster-installed Istio CRDs, sidecar injection, and gateway controller.

namespace: value-fabric

resources:
  - ../../envs/prod
  - ../../routing/istio
  - hostname-config.yaml

replacements:
  # Application host -> Istio Gateway server hosts + VirtualService host
  - source:
      kind: ConfigMap
      name: routing-host
      fieldPath: data.host
    targets:
      - select:
          kind: Gateway
          name: value-fabric-gateway
        fieldPaths:
          - spec.servers.0.hosts.0 # HTTP listener
          - spec.servers.1.hosts.0 # HTTPS listener
      - select:
          kind: VirtualService
          name: application
        fieldPaths:
          - spec.hosts.0
