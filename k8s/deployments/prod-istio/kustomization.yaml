apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# prod-istio: prod environment + Istio routing.
# Requires cluster-installed Istio CRDs, sidecar injection, and gateway controller.

namespace: value-fabric

resources:
  - ../../envs/prod
  - ../../routing/istio
  - hostname-config.yaml

replacements:
  # Ingress namespace -> NetworkPolicies
  - source:
      kind: ConfigMap
      name: routing-host
      fieldPath: data.ingressNamespace
    targets:
      - select:
          kind: NetworkPolicy
          name: frontend-policy
        fieldPaths:
          - spec.ingress.0.from.0.namespaceSelector.matchLabels.[kubernetes.io/metadata.name]
      - select:
          kind: NetworkPolicy
          name: api-gateway-policy
        fieldPaths:
          - spec.ingress.0.from.0.namespaceSelector.matchLabels.[kubernetes.io/metadata.name]
  # Application host -> Istio Gateway server hosts + VirtualService host
  - source:
      kind: ConfigMap
      name: routing-host
      fieldPath: data.host
    targets:
      - select:
          kind: Gateway
          name: value-fabric-gateway
        fieldPaths:
          - spec.servers.0.hosts.0 # HTTP listener
          - spec.servers.1.hosts.0 # HTTPS listener
      - select:
          kind: VirtualService
          name: application
        fieldPaths:
          - spec.hosts.0
