apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# dev-nginx: dev environment + NGINX Ingress routing.
# This is a SUPPORTED Phase 1 deployment target.

namespace: value-fabric

resources:
  - ../../envs/dev
  - ../../routing/nginx/clusterissuer.yaml
  - ../../routing/nginx/ingress.yaml
  - ../../routing/nginx/oauth2-proxy.yaml
  - hostname-config.yaml

# Propagate the single application host into every host/TLS/auth-signin field.
replacements:
  - source:
      kind: ConfigMap
      name: routing-host
      fieldPath: data.host
    targets:
      - select:
          kind: Ingress
          name: frontend
        fieldPaths:
          - spec.rules.0.host
          - spec.tls.0.hosts.0
      - select:
          kind: Ingress
          name: frontend
        fieldPaths:
          - metadata.annotations.nginx\.ingress\.kubernetes\.io/auth-signin
        options:
          delimiter: "/"
          index: 2
      - select:
          kind: Ingress
          name: application-api
        fieldPaths:
          - spec.rules.0.host
          - spec.tls.0.hosts.0
      - select:
          kind: Ingress
          name: application-api
        fieldPaths:
          - metadata.annotations.nginx\.ingress\.kubernetes\.io/auth-signin
        options:
          delimiter: "/"
          index: 2
  # Replace ingress namespace in NetworkPolicy
  - source:
      kind: ConfigMap
      name: routing-host
      fieldPath: data.ingressNamespace
    targets:
      - select:
          kind: NetworkPolicy
          name: frontend-policy
        fieldPaths:
          - spec.ingress.0.from.0.namespaceSelector.matchLabels.[kubernetes.io/metadata.name]
      - select:
          kind: NetworkPolicy
          name: api-gateway-policy
        fieldPaths:
          - spec.ingress.0.from.0.namespaceSelector.matchLabels.[kubernetes.io/metadata.name]
      - select:
          kind: NetworkPolicy
          name: oauth2-proxy
        fieldPaths:
          - spec.ingress.0.from.0.namespaceSelector.matchLabels.[kubernetes.io/metadata.name]
