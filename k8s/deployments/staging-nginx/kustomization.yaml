apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# staging-nginx: staging environment + NGINX Ingress routing.
# This is a production-like pre-production deployment target.
#
# All resources are declared directly in this overlay (or via directory
# references that stay within Kustomize's default LoadRestrictionsRootOnly)
# so that `kubectl kustomize` can render without extra flags.

namespace: value-fabric-staging

resources:
  - ../../base
  - ./external-secrets
  - ./monitoring
  - ../../routing/nginx
  - hostname-config.yaml
  - oauth2-proxy-config.yaml

labels:
  - pairs:
      environment: staging

patches:
  - path: staging-replicas-patch.yml
  - path: api-gateway-environment-patch.yml

# Image overrides: match exact base image names, redirect to GHCR.
# Base manifests use digest-pinned service placeholders (services/<name>@sha256:<digest>, apps/web@sha256:<digest>).
#
# Image digests are injected at deploy time by scripts/ci/prepare_kustomize_deploy.sh.
# This file must not contain mutable tags (latest, main, semver, branch names).
# CI enforces this via scripts/ci/validate-k8s-image-tags.sh.
images:
  - name: services/api
    newName: ghcr.io/bmsull560/fabric_4l/api-gateway
    digest: sha256:STAGING_DIGEST_PLACEHOLDER
  - name: services/layer1-ingestion
    newName: ghcr.io/bmsull560/fabric_4l/layer1-ingestion
    digest: sha256:STAGING_DIGEST_PLACEHOLDER
  - name: services/layer2-extraction
    newName: ghcr.io/bmsull560/fabric_4l/layer2-extraction
    digest: sha256:STAGING_DIGEST_PLACEHOLDER
  - name: services/layer3-knowledge
    newName: ghcr.io/bmsull560/fabric_4l/layer3-knowledge
    digest: sha256:STAGING_DIGEST_PLACEHOLDER
  - name: services/layer4-agents
    newName: ghcr.io/bmsull560/fabric_4l/layer4-agents
    digest: sha256:STAGING_DIGEST_PLACEHOLDER
  - name: services/layer5-ground-truth
    newName: ghcr.io/bmsull560/fabric_4l/layer5-ground-truth
    digest: sha256:STAGING_DIGEST_PLACEHOLDER
  - name: services/layer6-benchmarks
    newName: ghcr.io/bmsull560/fabric_4l/layer6-benchmarks
    digest: sha256:STAGING_DIGEST_PLACEHOLDER
  - name: apps/web
    newName: ghcr.io/bmsull560/fabric_4l/frontend
    digest: sha256:STAGING_DIGEST_PLACEHOLDER
  # Infrastructure images are pinned to cryptographic manifest digests.
  # Resolved: 2026-06-23 with `docker buildx imagetools inspect`.
  - name: busybox
    digest: sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
  - name: fluent/fluent-bit
    digest: sha256:a185ac0516e1f35568ff0662f12c4ada0ea38c4300ed223d0fde485599dff5b5
  - name: ghcr.io/external-secrets/external-secrets
    newName: ghcr.io/external-secrets/external-secrets
    digest: sha256:39c1c5508ddb89cb0f12023771760174b02e13e7d87959b2d05b53954b606938
  - name: grafana/loki
    digest: sha256:09a53b4a4ff81ffcd8f13886df19d33fac7a8d3aaf952e3c7e66cbade5b2fc31
  - name: neo4j
    digest: sha256:ca5da0c4cb596a9e9097aad8c79c10156f0c6261faa2ddcc74183a1e552554ed
  - name: pgbouncer/pgbouncer
    digest: sha256:aa8a38b7b33e5fe70c679053f97a8e55c74d52b00c195f0880845e52b50ce516
  - name: postgres
    digest: sha256:a58cec2ba7a60b4c08d51f2ca93c1ad65fbf96e75cf0c89b7c0d2684860d3bb3
  - name: prom/alertmanager
    digest: sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
  - name: prom/prometheus
    digest: sha256:f6639335d34a77d9d9db382b92eeb7fc00934be8eae81dbc03b31cfe90411a94
  - name: python
    digest: sha256:6d43704baacd1bfbe7c295d7f13079d5d8104ed33568873133f8fc69980419df
  - name: quay.io/thanos/thanos
    newName: quay.io/thanos/thanos
    digest: sha256:e542959e1b36d5046083d1b64a7049c356b68a44a173c58b3ae7c0c9ada932d5
  - name: redis
    digest: sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
  # ghcr.io/zalando/spilo-16:3.2-p1 could not be resolved (private/unknown tag);
  # left at the existing tag until a valid digest is available.

replacements:
  - source:
      kind: ConfigMap
      name: routing-host
      fieldPath: data.host
    targets:
      - select:
          kind: Ingress
          name: frontend
        fieldPaths:
          - spec.rules.0.host
          - spec.tls.0.hosts.0
      - select:
          kind: Ingress
          name: frontend
        fieldPaths:
          - metadata.annotations.nginx\.ingress\.kubernetes\.io/auth-signin
        options:
          delimiter: "/"
          index: 2
  - source:
      kind: ConfigMap
      name: routing-host
      fieldPath: data.host
    targets:
      - select:
          kind: Ingress
          name: application-api
        fieldPaths:
          - spec.rules.0.host
          - spec.tls.0.hosts.0
      - select:
          kind: Ingress
          name: application-api
        fieldPaths:
          - metadata.annotations.nginx\.ingress\.kubernetes\.io/auth-signin
        options:
          delimiter: "/"
          index: 2
  # Replace ingress namespace in NetworkPolicy
  - source:
      kind: ConfigMap
      name: routing-host
      fieldPath: data.ingressNamespace
    targets:
      - select:
          kind: NetworkPolicy
          name: frontend-policy
        fieldPaths:
          - spec.ingress.0.from.0.namespaceSelector.matchLabels.[kubernetes.io/metadata.name]
      - select:
          kind: NetworkPolicy
          name: api-gateway-policy
        fieldPaths:
          - spec.ingress.0.from.0.namespaceSelector.matchLabels.[kubernetes.io/metadata.name]
      - select:
          kind: NetworkPolicy
          name: oauth2-proxy
        fieldPaths:
          - spec.ingress.0.from.0.namespaceSelector.matchLabels.[kubernetes.io/metadata.name]
  # Replace TLS issuer in Ingress annotations
  - source:
      kind: ConfigMap
      name: routing-host
      fieldPath: data.tlsIssuer
    targets:
      - select:
          kind: Ingress
          name: frontend
        fieldPaths:
          - metadata.annotations.cert-manager\.io/cluster-issuer
      - select:
          kind: Ingress
          name: application-api
        fieldPaths:
          - metadata.annotations.cert-manager\.io/cluster-issuer
  # Replace issuer email in ClusterIssuers
  - source:
      kind: ConfigMap
      name: routing-host
      fieldPath: data.issuerEmail
    targets:
      - select:
          kind: ClusterIssuer
          name: letsencrypt-prod
        fieldPaths:
          - spec.acme.email
      - select:
          kind: ClusterIssuer
          name: letsencrypt-staging
        fieldPaths:
          - spec.acme.email
  # Replace oauth2-proxy allowed domains and OIDC provider
  - source:
      kind: ConfigMap
      name: oauth2-proxy-oidc
      fieldPath: data.allowed-domains
    targets:
      - select:
          kind: Deployment
          name: oauth2-proxy
        fieldPaths:
          - spec.template.spec.containers.0.env.10.value
  - source:
      kind: ConfigMap
      name: oauth2-proxy-oidc
      fieldPath: data.oidc-provider
    targets:
      - select:
          kind: Deployment
          name: oauth2-proxy
        fieldPaths:
          - spec.template.spec.containers.0.env.12.value
