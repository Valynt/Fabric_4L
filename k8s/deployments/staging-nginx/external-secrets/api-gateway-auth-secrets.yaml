apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: api-gateway-auth-secrets
  namespace: value-fabric
  labels:
    component: api-gateway
    tier: auth
spec:
  refreshInterval: "1h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: api-gateway-auth
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        SECRET_KEY: "{{ .secret_key }}"
        CORS_ORIGINS: "{{ .cors_origins }}"
        CLERK_ISSUER: "{{ .clerk_issuer }}"
        CLERK_JWT_AUDIENCE: "{{ .clerk_jwt_audience }}"
        CLERK_AUTHORIZED_PARTIES: "{{ .clerk_authorized_parties }}"
        CLERK_JWKS_URL: "{{ .clerk_jwks_url }}"
        CLERK_PINNED_JWT_PEM: "{{ .clerk_pinned_jwt_pem | default \"\" }}"
        CLERK_WEBHOOK_SECRET: "{{ .clerk_webhook_secret }}"
        CLERK_SECRET_KEY: "{{ .clerk_secret_key }}"
        CLERK_PUBLISHABLE_KEY: "{{ .clerk_publishable_key }}"
        FABRIC_AUTH_SIGNING_KEY: "{{ .fabric_auth_signing_key }}"
        FABRIC_AUTH_SIGNING_KID: "{{ .fabric_auth_signing_kid | default \"gateway-k1\" }}"
        FABRIC_AUTH_PUBLIC_KEYS: "{{ .fabric_auth_public_keys }}"
  data:
    - secretKey: secret_key
      remoteRef:
        key: value-fabric/auth
        property: api-gateway-secret-key
    - secretKey: cors_origins
      remoteRef:
        key: value-fabric/auth
        property: cors-origins
    - secretKey: clerk_issuer
      remoteRef:
        key: value-fabric/clerk
        property: issuer
    - secretKey: clerk_jwt_audience
      remoteRef:
        key: value-fabric/clerk
        property: jwt-audience
    - secretKey: clerk_authorized_parties
      remoteRef:
        key: value-fabric/clerk
        property: authorized-parties
    - secretKey: clerk_jwks_url
      remoteRef:
        key: value-fabric/clerk
        property: jwks-url
    - secretKey: clerk_pinned_jwt_pem
      remoteRef:
        key: value-fabric/clerk
        property: pinned-jwt-pem
    - secretKey: clerk_webhook_secret
      remoteRef:
        key: value-fabric/clerk
        property: webhook-secret
    - secretKey: clerk_secret_key
      remoteRef:
        key: value-fabric/clerk
        property: secret-key
    - secretKey: clerk_publishable_key
      remoteRef:
        key: value-fabric/clerk
        property: publishable-key
    - secretKey: fabric_auth_signing_key
      remoteRef:
        key: value-fabric/auth
        property: fabric-auth-signing-key
    - secretKey: fabric_auth_signing_kid
      remoteRef:
        key: value-fabric/auth
        property: fabric-auth-signing-kid
    - secretKey: fabric_auth_public_keys
      remoteRef:
        key: value-fabric/auth
        property: fabric-auth-public-keys
