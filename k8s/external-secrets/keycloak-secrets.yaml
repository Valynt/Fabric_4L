# Keycloak Identity Provider: External Secrets Configuration
# Syncs secrets for Keycloak bootstrap admin and OIDC client credentials.
# ---
# External Secret: Keycloak Bootstrap Admin & Client Secrets
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keycloak-secrets
  namespace: value-fabric
  labels:
    layer: identity
    component: keycloak
spec:
  refreshInterval: "1h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: keycloak-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # Bootstrap admin for Keycloak management console
        KEYCLOAK_ADMIN_USER: "{{ .keycloak_admin_user | default \"admin\" }}"
        KEYCLOAK_ADMIN_PASSWORD: "{{ .keycloak_admin_password }}"

        # OIDC client secrets (must match realm client configurations)
        KEYCLOAK_FRONTEND_CLIENT_SECRET: "{{ .keycloak_frontend_client_secret }}"
        KEYCLOAK_API_CLIENT_SECRET: "{{ .keycloak_api_client_secret }}"
