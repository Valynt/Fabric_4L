# Layer 2.5 - Signal Refinery: External Secrets Configuration
# Syncs secrets for signal refinement and value signal management
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: layer2-5-core-secrets
  namespace: value-fabric
  labels:
    layer: layer2-5
    component: signal-refinery
spec:
  refreshInterval: "1h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: layer2-5-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # Layer 3 API key for graph client
        LAYER3_API_KEY: "{{ .layer3_api_key }}"
        
        # Layer 4 API key for agent integration
        LAYER4_API_KEY: "{{ .layer4_api_key }}"
  data:
    - secretKey: layer3_api_key
      remoteRef:
        key: value-fabric/inter-layer
        property: layer3-api-key
    - secretKey: layer4_api_key
      remoteRef:
        key: value-fabric/inter-layer
        property: layer4-api-key

---
# Database credentials
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: layer2-5-db-credentials
  namespace: value-fabric
  labels:
    layer: layer2-5
    component: database
spec:
  refreshInterval: "1h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: layer2-5-db-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        DATABASE_URL: "postgresql+asyncpg://{{ .username }}:{{ .password }}@postgres.value-fabric.svc.cluster.local:5432/signal_refinery?sslmode=require"
        DB_HOST: "postgres.value-fabric.svc.cluster.local"
        DB_PORT: "5432"
        DB_NAME: "signal_refinery"
        DB_USER: "{{ .username }}"
        DB_PASSWORD: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: database/creds/layer2-5-app
        property: username
    - secretKey: password
      remoteRef:
        key: database/creds/layer2-5-app
        property: password

---
# Auth secrets
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: layer2-5-auth-secrets
  namespace: value-fabric
  labels:
    layer: layer2-5
    component: auth
spec:
  refreshInterval: "24h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: layer2-5-auth
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        JWT_SECRET: "{{ .jwt_secret }}"
        API_KEY_HMAC_SECRET: "{{ .api_key_hmac_secret }}"
  data:
    - secretKey: jwt_secret
      remoteRef:
        key: value-fabric/auth
        property: jwt-secret
    - secretKey: api_key_hmac_secret
      remoteRef:
        key: value-fabric/auth
        property: api-key-hmac-secret
