# WAL-G backup destination and workload identity values.
# Environment-specific S3 prefixes, regions, and role ARNs are resolved from
# the secret backend. Do not commit bucket names, account IDs, or static keys.
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: wal-g-backup-secrets
  namespace: value-fabric
  labels:
    component: database
    engine: postgresql
    capability: backup
spec:
  refreshInterval: "1h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: aws-backup-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        WALG_S3_PREFIX: "{{ .walg_s3_prefix }}"
        AWS_REGION: "{{ .aws_region }}"
        role-arn: "{{ .aws_role_arn }}"
  data:
    - secretKey: walg_s3_prefix
      remoteRef:
        key: value-fabric/infrastructure/wal-g
        property: s3-prefix
    - secretKey: aws_region
      remoteRef:
        key: value-fabric/infrastructure/wal-g
        property: aws-region
    - secretKey: aws_role_arn
      remoteRef:
        key: value-fabric/infrastructure/wal-g
        property: role-arn
