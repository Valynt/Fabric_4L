# Infisical Secret Mappings — Complete Fabric4L Configuration
# All secret paths mirror the monorepo structure.
#
# Prerequisites:
# 1. Install Infisical operator: helm install infisical-operator infisical-helm-charts/secrets-operator
# 2. Create machine identity in Infisical UI and configure OIDC trust for GitHub + K8s
# 3. Create universal-auth secret: kubectl create secret generic infisical-universal-auth ...
# 4. Update projectSlug if your Infisical project slug differs from "fabric4l"

---
# /shared — Cross-service configuration (JWT, logging, tenant headers)
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: shared-config
  namespace: value-fabric
  labels:
    tier: critical
    rotation: 90d
spec:
  hostAPI: https://app.infisical.com/api
  resyncInterval: 3600
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "fabric4l"
        envSlug: prod
        secretsPath: /shared
        recursive: true
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: value-fabric
  managedSecretReference:
    secretName: shared-config
    secretNamespace: value-fabric
    creationPolicy: Owner

