# Infisical Kubernetes Operator — InfisicalSecret CRDs for Fabric4L
#
# Prerequisites:
#   Install the Infisical K8s operator:
#     helm repo add infisical-helm-charts https://dl.cloudsmith.io/public/infisical/helm-charts/helm/charts/
#     helm install --generate-name infisical-helm-charts/secrets-operator
#
# 1. Create the machine identity credentials secret (once per cluster):
#   kubectl create secret generic infisical-universal-auth \
#     --from-literal=clientId=<CLIENT_ID> \
#     --from-literal=clientSecret=<CLIENT_SECRET> \
#     -n value-fabric
#
# 2. Set projectSlug in each InfisicalSecret below to your actual Infisical project slug.
#
# The operator syncs secrets from Infisical into Kubernetes Secret objects,
# which are then mounted/injected into pods via envFrom.
# resyncInterval controls how often the operator polls for changes.
#
# Path structure mirrors the monorepo:
#   /shared     /infra     /apps/web     /layer1-ingestion ... /monitoring

---
# /shared — Cross-service configuration (JWT, logging, tenant headers)
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: shared-config
  namespace: value-fabric
spec:
  hostAPI: https://app.infisical.com/api
  resyncInterval: 300
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "fabric4l"
        envSlug: prod
        secretsPath: /shared
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: value-fabric
  managedSecretReference:
    secretName: shared-config
    secretNamespace: value-fabric
    creationPolicy: Owner

