# PostgreSQL Backup CronJob
# Runs daily at 2 AM UTC
# Backs up all application databases (ingestion, extraction, signal_refinery,
# layer4_agents, ground_truth, benchmarks, layer7_billing)
# Retains backups for 7 days
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backup-pvc
  namespace: value-fabric
  labels:
    app: postgres-backup
    component: database
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: value-fabric
  labels:
    app: postgres-backup
    component: database
spec:
  schedule: "0 2 * * *"  # Daily at 2 AM UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          containers:
            - name: postgres-backup
              image: postgres:15-alpine
              command:
                - sh
                - -c
                - |
                  set -e
                  BACKUP_DIR=/backups/postgres
                  mkdir -p $$BACKUP_DIR
                  TIMESTAMP=$$(date +%Y%m%d_%H%M%S)
                  FAILED=0

                  # All application databases
                  DATABASES="ingestion extraction signal_refinery layer4_agents ground_truth benchmarks layer7_billing"

                  for DB in $$DATABASES; do
                    # Check if the database exists before attempting backup
                    EXISTS=$$(PGPASSWORD=$${POSTGRES_PASSWORD} psql -h postgres -U $${POSTGRES_USER} -tAc "SELECT 1 FROM pg_database WHERE datname='$$DB'" 2>/dev/null || echo "")
                    if [ "$$EXISTS" = "1" ]; then
                      if PGPASSWORD=$${POSTGRES_PASSWORD} pg_dump -h postgres -U $${POSTGRES_USER} -d $$DB -F c -f $$BACKUP_DIR/backup_$${DB}_$${TIMESTAMP}.dump; then
                        echo "OK: $$DB backed up to backup_$${DB}_$${TIMESTAMP}.dump"
                      else
                        echo "ERROR: pg_dump failed for $$DB" >&2
                        FAILED=1
                      fi
                    else
                      echo "SKIP: database $$DB does not exist yet (migration pending)"
                    fi
                  done

                  # Remove backups older than 7 days
                  find $$BACKUP_DIR -name 'backup_*.dump' -mtime +7 -delete

                  echo "Backup run completed: $$TIMESTAMP"
                  exit $$FAILED
              env:
                # SECURITY: Username is not sensitive — hardcoded to match postgres Deployment.
                # Only password is sourced from the secret.
                - name: POSTGRES_USER
                  value: "postgres"
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: password
              volumeMounts:
                - name: postgres-backups
                  mountPath: /backups
          volumes:
            - name: postgres-backups
              persistentVolumeClaim:
                claimName: postgres-backup-pvc

