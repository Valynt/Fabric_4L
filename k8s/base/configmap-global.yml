apiVersion: v1
kind: ConfigMap
metadata:
  name: value-fabric-config
  namespace: value-fabric
data:
  # Layer URLs for inter-service communication
  LAYER1_API_URL: "http://layer1-ingestion:8000"
  LAYER2_API_URL: "http://layer2-extraction:8000"
  LAYER3_API_URL: "http://layer3-knowledge:8001"
  LAYER4_API_URL: "http://layer4-agents:8000"
  LAYER5_API_URL: "http://layer5-ground-truth:8005"
  LAYER6_API_URL: "http://layer6-benchmarks:8006"
  # Layer 5 database URLs are supplied by Secret `layer5-db-credentials`.
  # Do not store database credentials in ConfigMaps; use k8s/external-secrets/layer5-secrets.yaml
  # or create a Secret manually with DATABASE_URL and DATABASE_URL_SYNC keys.
  PINECONE_INDEX: ""
  
  # Neo4j configuration
  NEO4J_URI: "bolt://neo4j:7687"
  NEO4J_USER: "neo4j"
  
  # Redis configuration
  # REDIS_URL is injected via Secret redis-secret (created by
  # k8s/external-secrets/redis-secrets.yaml) for environments using
  # authenticated Redis. Dev environments may inject this via
  # docker-compose overrides or local secrets instead.
  
  # Log level
  LOG_LEVEL: "info"
