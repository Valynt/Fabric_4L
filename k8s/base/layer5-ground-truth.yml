apiVersion: apps/v1
kind: Deployment
metadata:
  name: layer5-ground-truth
  namespace: value-fabric
  labels:
    app: layer5-ground-truth
    component: layer5
spec:
  replicas: 1
  selector:
    matchLabels:
      app: layer5-ground-truth
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: layer5-ground-truth
        component: layer5
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: services/layer5-ground-truth@sha256:6ffaf262c13f1d8e01b60486f2f55c39af8225038f1895b06136347e587e29e7
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL_SYNC
              valueFrom:
                secretKeyRef:
                  name: layer5-database-secret
                  key: database-url-sync
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: api
          image: services/layer5-ground-truth@sha256:6ffaf262c13f1d8e01b60486f2f55c39af8225038f1895b06136347e587e29e7
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: 8005
              name: http
          envFrom:
            - configMapRef:
                name: value-fabric-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: layer5-database-secret
                  key: database-url
            - name: DATABASE_URL_SYNC
              valueFrom:
                secretKeyRef:
                  name: layer5-database-secret
                  key: database-url-sync
            - name: LAYER3_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: value-fabric-config
                  key: LAYER3_API_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: secret
            - name: API_PORT
              value: "8005"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8005
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: 8005
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: layer5-ground-truth
  namespace: value-fabric
  labels:
    app: layer5-ground-truth
    component: layer5
spec:
  selector:
    app: layer5-ground-truth
  ports:
    - port: 8005
      targetPort: 8005
      name: http
  type: ClusterIP
