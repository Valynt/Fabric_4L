# DEPRECATED: This ClusterSecretStore uses static Vault token auth.
# Migration in progress to Infisical Kubernetes Operator (see k8s/base/externalsecrets/DEPRECATED.md).
# This file is NOT referenced in k8s/base/kustomization.yaml and should not be used.
# Use k8s/external-secrets/cluster-secret-store.yaml or k8s/external-secrets/vault-integration.yml instead.
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
  namespace: external-secrets
spec:
  provider:
    vault:
      server: "https://vault.example.com:8200"
      path: "fabric"
      version: "v2"
      auth:
        tokenSecretRef:
          name: vault-token
          namespace: external-secrets
          key: token
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  namespace: external-secrets
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
