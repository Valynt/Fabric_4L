apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-policy
  namespace: value-fabric
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from ingress controller namespace only
    # Configurable via Kustomize replacement for __INGRESS_NAMESPACE__
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: __INGRESS_NAMESPACE__
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # The browser reaches APIs through the public edge; the frontend pod has no
    # direct layer access. Allow DNS for runtime infrastructure only.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
