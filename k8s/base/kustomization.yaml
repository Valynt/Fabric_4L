apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Only dev/prod overlays should define image resolution here.
# Staging uses STAGING_DIGEST_PLACEHOLDER; prod uses promoted SHA digests.
# Base manifests keep their original placeholder image names.
images: []

resources:
  - namespace.yml
  - configmap-global.yml
  - configmap-api-gateway-auth.yaml
  # External Secrets Operator for Vault integration
  # - external-secrets-operator.yml
  # NOTE: The operator is installed cluster-wide in the external-secrets namespace
  # by platform bootstrapping, not by the per-environment app overlay.
  # SECURITY TEMPLATES (must populate with real values before production use):
  #   - jwt-keys-secret.yaml: RSA key pair for JWT RS256 signing
  #   - api-key-cache-secret.yaml: HMAC secret for API key fingerprinting
  #     Do NOT include placeholder Secret templates in base. Staging and production
  #     overlays must use External Secrets Operator references or non-repository
  #     injection. The dev-only inert placeholders live in k8s/envs/dev/secrets.yml.
  #   - Dev: use the labeled inert placeholders or create secrets manually.
  #   - Prod: k8s/external-secrets/ resources are included by the prod overlay.
  - redis.yml
  - postgres.yml
  - pgbouncer-config.yml
  - pgbouncer.yml
  - neo4j.yml
  - api-gateway.yml
  - api-gateway-serviceaccount.yaml
  - layer1-ingestion.yml
  - layer1-celery.yaml
  - layer1-serviceaccount.yaml
  - layer2-extraction.yml
  - layer2-5-signal-refinery.yml
  - layer3-knowledge.yml
  - layer4-agents.yml
  - layer5-ground-truth.yml
  - layer6-benchmarks.yml
  - frontend.yml
  - monitoring-prometheus.yml
  - monitoring-alertmanager.yml
  # SECURITY: alertmanager secrets are managed by
  # k8s/external-secrets/alertmanager-secrets.yaml (not committed as a raw Secret).
  - tenant-safety.yml
  # Backup CronJobs (Phase 1)
  - postgres-backup-cronjob.yaml
  - neo4j-backup-cronjob.yaml
  # Network policies for zero-trust segmentation
  - network-policies/
  # Horizontal pod autoscaling
  - hpa/layer1-ingestion-hpa.yml
  - hpa/layer2-extraction-hpa.yml
  - hpa/layer2-5-signal-refinery-hpa.yml
  - hpa/layer3-knowledge-hpa.yml
  - hpa/layer4-agents-hpa.yml
  - hpa/layer5-ground-truth-hpa.yml
  - hpa/layer6-benchmarks-hpa.yml
  - hpa/frontend-hpa.yml
  - hpa/api-gateway-hpa.yml
  # Pod disruption budgets for critical services
  - pdb/postgres-pdb.yml
  - pdb/redis-pdb.yml
  - pdb/neo4j-pdb.yml
  - pdb/pgbouncer-pdb.yml
  - pdb/layer1-ingestion-pdb.yml
  - pdb/layer2-extraction-pdb.yml
  - pdb/layer2-5-signal-refinery-pdb.yml
  - pdb/layer3-knowledge-pdb.yml
  - pdb/layer4-agents-pdb.yml
  - pdb/layer5-ground-truth-pdb.yml
  - pdb/layer6-benchmarks-pdb.yml
  - pdb/frontend-pdb.yml
  - pdb/api-gateway-pdb.yml

patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/affinity
        value:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchExpressions:
                      - key: app
                        operator: Exists
                  matchLabelKeys:
                    - app
