apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Image registry configuration.
# The `name` field matches the placeholder used in each service manifest.
# Overlays override `digest` (or `newName`) to deploy a specific immutable image.
#
# Registry: ghcr.io/bmsull560/fabric_4l
#
# PRODUCTION: Use SHA256 digest pinning in overlays:
#   images:
#     - name: services/layer4-agents
#       newName: ghcr.io/bmsull560/fabric_4l/layer4-agents
#       digest: sha256:<real_digest>
#
# Only dev overlays may use mutable tags for convenience.
# CI gates enforce digest pinning in production overlays and reject :main/:latest there.
# Release pipelines may replace these digests with the promoted image digests.
images:
  - name: services/api
    newName: ghcr.io/bmsull560/fabric_4l/api-gateway
    digest: sha256:d7e77817e2efbf0fa25a83ec5cdf56389f3d9ab7e98c1c54d250dfaa15361e42
  - name: services/layer1-ingestion
    newName: ghcr.io/bmsull560/fabric_4l/layer1-ingestion
    digest: sha256:b2b1f176486b4174a0c380fda796d46d8ec70309227ce80c9a93ff9f60da995d
  - name: services/layer2-extraction
    newName: ghcr.io/bmsull560/fabric_4l/layer2-extraction
    digest: sha256:13029594c9b8a1084e95fddac9b5143605f947b974c742ff8c84b2a0729423ec
  - name: services/layer3-knowledge
    newName: ghcr.io/bmsull560/fabric_4l/layer3-knowledge
    digest: sha256:f819389f54cd1aa32d9e2264470d8a87df25e4351e7fd97843adac2a72afe60d
  - name: services/layer4-agents
    newName: ghcr.io/bmsull560/fabric_4l/layer4-agents
    digest: sha256:0300c79009d884d2576a6b7dcb15606316f02fcadb9a6800a7da4fcf1e205f29
  - name: services/layer5-ground-truth
    newName: ghcr.io/bmsull560/fabric_4l/layer5-ground-truth
    digest: sha256:6ffaf262c13f1d8e01b60486f2f55c39af8225038f1895b06136347e587e29e7
  - name: services/layer6-benchmarks
    newName: ghcr.io/bmsull560/fabric_4l/layer6-benchmarks
    digest: sha256:2093ee632e2db237f9fb25e32d487fa9e157c26b35679886fd928b98618bae19
  - name: apps/web
    newName: ghcr.io/bmsull560/fabric_4l/web
    digest: sha256:0aa8f24975fc35f039525dcfabdb6d50b76699407090df0d4c4f73d32cb0e4a7

resources:
  - namespace.yml
  - configmap-global.yml
  # External Secrets Operator for Vault integration
  - external-secrets-operator.yml
  # SECURITY TEMPLATES (must populate with real values before production use):
  #   - jwt-keys-secret.yaml: RSA key pair for JWT RS256 signing
  #     Do NOT include the placeholder template in base; add only to overlays
  #     that supply real keys or External Secrets Operator references.
  #   - api-key-cache-secret.yaml: HMAC secret for API key fingerprinting
  #   - Dev: kubectl create secret generic ... manually
  #   - Prod: apply k8s/external-secrets/ separately (not included here due to kustomize security)
  - api-key-cache-secret.yaml
  - redis.yml
  - postgres.yml
  - pgbouncer-config.yml
  - pgbouncer.yml
  - neo4j.yml
  - api-gateway.yml
  - layer1-ingestion.yml
  - layer2-extraction.yml
  - layer2-5-signal-refinery.yml
  - layer3-knowledge.yml
  - layer4-agents.yml
  - layer5-ground-truth.yml
  - layer6-benchmarks.yml
  - frontend.yml
  - monitoring-prometheus.yml
  - monitoring-alertmanager.yml
  # SECURITY: alertmanager-secrets contains webhook URLs and PagerDuty keys.
  # Do NOT commit real values. In production, use External Secrets Operator
  # (k8s/external-secrets/alertmanager-secrets.yaml) or inject via CI.
  # This placeholder manifest uses environment-variable tokens for kustomize/
  # envsubst processing at deploy time.
  - alertmanager-secrets.yml
  - tenant-safety.yml
  # Backup CronJobs (Phase 1)
  - postgres-backup-cronjob.yaml
  - neo4j-backup-cronjob.yaml
  # Network policies for zero-trust segmentation
  - network-policies/
  # Horizontal pod autoscaling
  - hpa/layer1-ingestion-hpa.yml
  - hpa/layer2-extraction-hpa.yml
  - hpa/layer2-5-signal-refinery-hpa.yml
  - hpa/layer3-knowledge-hpa.yml
  - hpa/layer4-agents-hpa.yml
  - hpa/layer5-ground-truth-hpa.yml
  - hpa/layer6-benchmarks-hpa.yml
  - hpa/frontend-hpa.yml
  # Pod disruption budgets for critical services
  - pdb/postgres-pdb.yml
  - pdb/redis-pdb.yml
  - pdb/neo4j-pdb.yml
  - pdb/pgbouncer-pdb.yml
  - pdb/layer1-ingestion-pdb.yml
  - pdb/layer2-extraction-pdb.yml
  - pdb/layer2-5-signal-refinery-pdb.yml
  - pdb/layer3-knowledge-pdb.yml
  - pdb/layer4-agents-pdb.yml
  - pdb/layer5-ground-truth-pdb.yml
  - pdb/layer6-benchmarks-pdb.yml
  - pdb/frontend-pdb.yml

patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/affinity
        value:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchExpressions:
                      - key: app
                        operator: Exists
                  matchLabelKeys:
                    - app
