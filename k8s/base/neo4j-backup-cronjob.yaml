# Neo4j Backup CronJob
# Runs daily at 3 AM UTC
# Backs up Neo4j database using neo4j-admin
# Retains backups for 7 days
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: neo4j-backup
  namespace: value-fabric
  labels:
    app: neo4j-backup
    component: database
spec:
  schedule: "0 3 * * *"  # Daily at 3 AM UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          containers:
            - name: neo4j-backup
              image: neo4j:5-community
              command:
                - sh
                - -c
                - |
                  BACKUP_DIR=/backups/neo4j
                  mkdir -p $$BACKUP_DIR
                  TIMESTAMP=$$(date +%Y%m%d_%H%M%S)

                  # Wait for Neo4j to be ready
                  until cypher-shell -a neo4j:7687 -u neo4j -p $${NEO4J_PASSWORD} 'RETURN 1'; do
                    echo 'Waiting for Neo4j...'
                    sleep 5
                  done

                  # Perform backup using neo4j-admin with --from flag for consistency
                  # Use --fallback-to-full if incremental backup fails
                  neo4j-admin database dump neo4j --from=/data --to-path=$$BACKUP_DIR/backup_$$TIMESTAMP --overwrite-destination=true --fallback-to-full=true

                  # Keep last 7 days of backups
                  find $$BACKUP_DIR -name 'backup_*' -mtime +7 -delete

                  echo "Backup completed: $$TIMESTAMP"
              env:
                - name: NEO4J_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: neo4j-credentials
                      key: password
              volumeMounts:
                - name: neo4j-data
                  mountPath: /data
                  readOnly: true
                - name: neo4j-backups
                  mountPath: /backups
          volumes:
            - name: neo4j-data
              persistentVolumeClaim:
                claimName: neo4j-data-pvc
            - name: neo4j-backups
              persistentVolumeClaim:
                claimName: neo4j-backup-pvc
