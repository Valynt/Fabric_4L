# Layer 2.5 Signal Refinery Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: layer2-5-signal-refinery
  namespace: value-fabric
  labels:
    app: layer2-5-signal-refinery
    layer: layer2-5
    component: signal-refinery
spec:
  replicas: 2
  selector:
    matchLabels:
      app: layer2-5-signal-refinery
  template:
    metadata:
      labels:
        app: layer2-5-signal-refinery
        layer: layer2-5
        component: signal-refinery
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: init-db
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: init-tmp
              mountPath: /tmp
      volumes:
        - name: init-tmp
          emptyDir: {}
      containers:
        - name: layer2-5-signal-refinery
          image: ghcr.io/bmsull560/fabric_4l/layer2-5-signal-refinery:main
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8007
              name: http
              protocol: TCP
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: layer2-5-db-credentials
                  key: DATABASE_URL
            - name: LAYER3_BASE_URL
              value: "http://layer3-knowledge:8001"
            - name: LAYER4_BASE_URL
              value: "http://layer4-agents:8000"
            - name: LAYER3_API_KEY
              valueFrom:
                secretKeyRef:
                  name: layer2-5-secrets
                  key: LAYER3_API_KEY
            - name: LAYER4_API_KEY
              valueFrom:
                secretKeyRef:
                  name: layer2-5-secrets
                  key: LAYER4_API_KEY
            - name: LOG_LEVEL
              value: "info"
          livenessProbe:
            httpGet:
              path: /health
              port: 8007
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8007
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: layer2-5-signal-refinery
  namespace: value-fabric
  labels:
    app: layer2-5-signal-refinery
    layer: layer2-5
    component: signal-refinery
spec:
  selector:
    app: layer2-5-signal-refinery
  ports:
    - name: http
      port: 8007
      targetPort: 8007
      protocol: TCP
  type: ClusterIP
