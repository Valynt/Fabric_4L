# production-data data-plane secrets.
# These ExternalSecrets intentionally create the key names consumed by the
# self-hosted HA StatefulSets, which differ from the application-facing secrets.
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: redis-ha-credentials
  namespace: production-data
  labels:
    component: redis
    tier: infrastructure
spec:
  refreshInterval: "24h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: redis-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        password: "{{ .redis_password }}"
        REDIS_PASSWORD: "{{ .redis_password }}"
        REDIS_URL: "rediss://:{{ .redis_password }}@redis-master.production-data.svc.cluster.local:6379/0"
        REDIS_SENTINEL_HOSTS: "redis-sentinel.production-data.svc.cluster.local:26379"
        REDIS_SENTINEL_MASTER_NAME: "fabric4l-master"
        REDIS_SENTINEL_PASSWORD: "{{ .redis_sentinel_password | default .redis_password }}"
  data:
    - secretKey: redis_password
      remoteRef:
        key: value-fabric/infrastructure
        property: redis-password
    - secretKey: redis_sentinel_password
      remoteRef:
        key: value-fabric/infrastructure
        property: redis-sentinel-password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-patroni-credentials
  namespace: production-data
  labels:
    component: database
    engine: postgresql
spec:
  refreshInterval: "1h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: postgres-patroni-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        superuser-username: "{{ .superuser_username | default \"postgres\" }}"
        superuser-password: "{{ .superuser_password }}"
        replication-password: "{{ .replication_password }}"
  data:
    - secretKey: superuser_username
      remoteRef:
        key: value-fabric/database/postgres/superuser
        property: username
    - secretKey: superuser_password
      remoteRef:
        key: value-fabric/database/postgres/superuser
        property: password
    - secretKey: replication_password
      remoteRef:
        key: value-fabric/database/postgres/replication
        property: password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: neo4j-ha-credentials
  namespace: production-data
  labels:
    component: neo4j
    tier: infrastructure
spec:
  refreshInterval: "24h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: neo4j-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        auth: "neo4j/{{ .neo4j_password }}"
        password: "{{ .neo4j_password }}"
        NEO4J_AUTH: "neo4j/{{ .neo4j_password }}"
        NEO4J_PASSWORD: "{{ .neo4j_password }}"
        NEO4J_URI: "neo4j+s://neo4j.production-data.svc.cluster.local:7687"
  data:
    - secretKey: neo4j_password
      remoteRef:
        key: value-fabric/database
        property: neo4j-password
