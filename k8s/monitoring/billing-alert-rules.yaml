# Sprint 3: Billing-specific Prometheus alert rules
groups:
  - name: billing-slo
    rules:
      - alert: BillingPaymentFailureRateHigh
        expr: sum(rate(billing_payment_failure_total[5m])) / sum(rate(billing_payment_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
          team: revenue
          oncall_owner: sre-revenue
        annotations:
          summary: "Billing payment failure rate is {{$value | humanizePercentage}}"
          description: "More than 5% of payments are failing. Check Stripe dashboard."
          runbook_url: "https://wiki.fabric4l.io/runbooks/billing-payment-failures"

      - alert: BillingMRRDrop
        expr: (
          sum(billing_mrr_usd) - sum(billing_mrr_usd offset 1d)
        ) / sum(billing_mrr_usd offset 1d) < -0.05
        for: 15m
        labels:
          severity: critical
          team: revenue
          oncall_owner: sre-revenue
        annotations:
          summary: "MRR dropped by more than 5% in 24h"
          description: "MRR changed from {{$labels.mrr_1d_ago}} to {{$value}}. Investigate churn."
          runbook_url: "https://wiki.fabric4l.io/runbooks/mrr-drop"

      - alert: BillingStripeWebhookLatencyHigh
        expr: histogram_quantile(0.95, sum(rate(billing_stripe_webhook_duration_bucket[5m])) by (le)) > 5
        for: 10m
        labels:
          severity: warning
          team: revenue
        annotations:
          summary: "Stripe webhook p95 latency is {{$value}}s"
          description: "Stripe webhooks are taking too long. Check webhook handler."

      - alert: BillingAPIUsageSpike
        expr: |
          (
            sum(rate(billing_api_calls_total[5m]))
            -
            avg_over_time(sum(rate(billing_api_calls_total[5m]))[1h:5m])
          ) / avg_over_time(sum(rate(billing_api_calls_total[5m]))[1h:5m]) > 3
        for: 10m
        labels:
          severity: info
          team: revenue
        annotations:
          summary: "API usage spiked {{$value | humanize}}x above 1h average"
          description: "Unusual API usage pattern detected. May indicate abuse or viral growth."
