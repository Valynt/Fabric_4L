apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: monitoring
  labels:
    app: jaeger
    tier: observability
    component: tracing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
        tier: observability
        component: tracing
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "14269"
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.50
          # Persistent trace storage via OpenSearch; do not use in-memory storage in production-like envs.
          imagePullPolicy: IfNotPresent
          args:
            - --query.base-path=/jaeger
            - --collector.otlp.enabled=true
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
            - name: COLLECTOR_ZIPKIN_HOST_PORT
              value: ":9411"
            - name: SPAN_STORAGE_TYPE
              value: "elasticsearch"
            - name: ES_SERVER_URLS
              valueFrom:
                configMapKeyRef:
                  name: jaeger-storage-config
                  key: es_server_urls
            - name: ES_TLS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: jaeger-storage-config
                  key: es_tls_enabled
            - name: ES_INDEX_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: jaeger-storage-config
                  key: es_index_prefix
            - name: ES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: jaeger-storage-credentials
                  key: username
            - name: ES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jaeger-storage-credentials
                  key: password
            - name: ES_USE_ALIASES
              valueFrom:
                configMapKeyRef:
                  name: jaeger-storage-config
                  key: es_use_aliases
            - name: ES_NUM_SHARDS
              valueFrom:
                configMapKeyRef:
                  name: jaeger-storage-config
                  key: es_num_shards
            - name: ES_NUM_REPLICAS
              valueFrom:
                configMapKeyRef:
                  name: jaeger-storage-config
                  key: es_num_replicas
            - name: ES_TAGS_AS_FIELDS_ALL
              valueFrom:
                configMapKeyRef:
                  name: jaeger-storage-config
                  key: es_tags_as_fields_all
            - name: ES_MAX_SPAN_AGE
              valueFrom:
                configMapKeyRef:
                  name: jaeger-storage-config
                  key: es_max_span_age
            - name: ES_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: jaeger-storage-config
                  key: es_timeout
            - name: ES_TLS_CA
              valueFrom:
                secretKeyRef:
                  name: jaeger-storage-credentials
                  key: ca.crt
            - name: ES_TLS_CERT
              valueFrom:
                secretKeyRef:
                  name: jaeger-storage-credentials
                  key: tls.crt
            - name: ES_TLS_KEY
              valueFrom:
                secretKeyRef:
                  name: jaeger-storage-credentials
                  key: tls.key
            - name: JAEGER_SAMPLER_TYPE
              value: "const"
            - name: JAEGER_SAMPLER_PARAM
              value: "1"
          ports:
            - containerPort: 16686
              name: ui
              protocol: TCP
            - containerPort: 14268
              name: jaeger-collector
              protocol: TCP
            - containerPort: 14269
              name: admin
              protocol: TCP
            - containerPort: 14250
              name: grpc
              protocol: TCP
            - containerPort: 4317
              name: otlp-grpc
              protocol: TCP
            - containerPort: 4318
              name: otlp-http
              protocol: TCP
            - containerPort: 9411
              name: zipkin
              protocol: TCP
          resources:
            limits:
              cpu: "4000m"
              memory: "8Gi"
            requests:
              cpu: "1000m"
              memory: "3Gi"
          livenessProbe:
            httpGet:
              path: /metrics
              port: 14269
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 14269
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /
              port: 14269
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      serviceAccountName: jaeger
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jaeger
  namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger-storage-config
  namespace: monitoring
data:
  es_server_urls: "https://opensearch.monitoring.svc.cluster.local:9200"
  es_tls_enabled: "true"
  es_index_prefix: "jaeger-span"
  es_use_aliases: "true"
  es_num_shards: "3"
  es_num_replicas: "1"
  es_tags_as_fields_all: "true"
  es_max_span_age: "168h"
  es_timeout: "30s"
---
apiVersion: v1
kind: Secret
metadata:
  name: jaeger-storage-credentials
  namespace: monitoring
  annotations:
    infisical.com/inject: "true"
    infisical.com/path: "/monitoring"
    value-fabric.io/environment: dev
    value-fabric.io/non-prod-only: "true"
    value-fabric.io/secret-scope: dev-placeholder
    value-fabric.io/allowed-namespaces: monitoring
type: Opaque
stringData:
  username: "replace-with-operator-injected-user"
  password: "replace-with-operator-injected-password"
  ca.crt: "replace-with-opensearch-ca-pem"
  tls.crt: "replace-with-client-cert-pem"
  tls.key: "replace-with-client-key-pem"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jaeger-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jaeger-reader-binding
subjects:
  - kind: ServiceAccount
    name: jaeger
    namespace: monitoring
roleRef:
  kind: ClusterRole
  name: jaeger-reader
  apiGroup: rbac.authorization.k8s.io
