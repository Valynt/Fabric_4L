---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend
  namespace: value-fabric
spec:
  parentRefs:
    - name: value-fabric-gateway
      sectionName: https-frontend
  hostnames:
    - __HOST__
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: layer-apis
  namespace: value-fabric
spec:
  parentRefs:
    - name: value-fabric-gateway
      sectionName: https-api
  hostnames:
    - __API_HOST__
  rules:
    # The entire API host is served by the gateway. Per-segment paths
    # (/v1/agents, /v1/ingest, /v1/extract, /v1/graph, /v1/truths,
    # /v1/benchmarks) are routed inside the gateway by
    # routers/layer_delegation.py. No HTTPRoute backend points directly
    # at a layer Service; scripts/ci/k8s_routing_check.py asserts this.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: api-gateway
          port: 8000
