apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Istio routing stack.
# This kustomization MUST NOT import ../../base.
# The application hostname uses the __HOST__ sentinel replaced by the deployment
# overlay via Kustomize `replacements:` keyed off a routing-host ConfigMap.

resources:
  - gateway.yaml
  - virtualservice.yaml
  - destinationrule.yaml
  - peerauthentication.yaml
  - authorizationpolicy.yaml
