---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: frontend
  namespace: value-fabric
spec:
  hosts:
    - __HOST__
  gateways:
    - value-fabric-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: frontend
            port:
              number: 3000
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: layer-apis
  namespace: value-fabric
spec:
  hosts:
    - __API_HOST__
  gateways:
    - value-fabric-gateway
  http:
    # The entire API host is served by the gateway. Per-segment paths
    # (/v1/agents, /v1/ingest, /v1/extract, /v1/graph, /v1/truths,
    # /v1/benchmarks) are routed inside the gateway by
    # routers/layer_delegation.py. No VirtualService route points directly
    # at a layer Service; scripts/ci/k8s_routing_check.py asserts this.
    - match:
        - uri: {prefix: /}
      route:
        - destination: {host: api-gateway, port: {number: 8000}}
