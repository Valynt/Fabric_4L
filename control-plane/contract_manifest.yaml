rules:
- id: R-1
  statement: Every customer-facing statement and number MUST be classified as a verified fact, human-approved inference, external
    benchmark, explicit assumption, or deterministic calculation.
  source: control-plane/product-contract/01_product-intent.md#r-1
- id: R-2
  statement: The authoritative model MUST be server-persisted, tenant-scoped, account-scoped, versioned, and recoverable.
    Browser storage MAY cache non-authoritative preferences only.
  source: control-plane/product-contract/01_product-intent.md#r-2
- id: R-3
  statement: Consequential AI output MUST support Accept, Edit, and Reject. AI output MUST NOT become verified, approved,
    or customer-facing without the required human and evidence gates.
  source: control-plane/product-contract/01_product-intent.md#r-3
- id: R-4
  statement: Financial math MUST be deterministic and reproducible. An LLM MAY explain or narrate a result but MUST NOT silently
    replace a formula, invent an input, or alter an approved calculation.
  source: control-plane/product-contract/01_product-intent.md#r-4
- id: R-5
  statement: Synthetic, benchmark-derived, fallback, and demo inputs MUST remain visibly labeled through calculation, narrative,
    approval, and export. Materially degraded outputs MUST NOT be publishable.
  source: control-plane/product-contract/01_product-intent.md#r-5
- id: R-6
  statement: Authorization, tenant, account, case, model, evidence, and version uncertainty MUST fail closed.
  source: control-plane/product-contract/01_product-intent.md#r-6
- id: R-7
  statement: An approved or published version MUST be immutable. Any later edit creates a new draft with explicit lineage.
  source: control-plane/product-contract/01_product-intent.md#r-7
- id: R-8
  statement: Every quantitative claim MUST expose a provenance path from claim to calculation, formula, inputs, driver, signal
    or evidence, and original source.
  source: control-plane/product-contract/01_product-intent.md#r-8
