                        memory: '1073741824'
            environment:
                POSTGRES_DB: ingestion
                POSTGRES_INITDB_ARGS: '-E UTF8 --locale=C'
                POSTGRES_MULTIPLE_DATABASES: 'ingestion,layer2_extraction,ground_truth,layer4_agents,layer6_benchmarks'
                POSTGRES_PASSWORD: '{{ env.vars.POSTGRES_PASSWORD }}'
                POSTGRES_USER: postgres
            healthcheck:
                test:
                    - CMD-SHELL
                    - 'pg_isready -U postgres'
                timeout: 3s
                interval: 5s
                retries: 5
            image: 'postgres:15-alpine'
        volumes:
            -
                name: live-postgres-data
                mount: /var/lib/postgresql/data
                subPath: ''
    -
        kind: Service
        name: postgres-init
        dockerCompose:
            environment:
                POSTGRES_PASSWORD: '{{ env.vars.POSTGRES_PASSWORD }}'
                POSTGRES_USER: postgres
            entrypoint:
                - /bin/sh
                - '-c'
                - |-
                    create_db() {
                      if PGPASSWORD="{{ env.vars.POSTGRES_PASSWORD }}" psql -h postgres -U postgres -d postgres <<EOF
                    SELECT format('CREATE DATABASE %I', '$$1')
                    WHERE NOT EXISTS (
                      SELECT 1 FROM pg_database WHERE datname = '$$1'
                    ) \gexec
                    EOF
                      then
                        echo "$$1 created or already exists"
                      else
                        echo "ERROR creating $$1" >&2
                        exit 1
                      fi
                    }
                    create_db layer2_extraction
                    create_db ground_truth
                    create_db layer4_agents
                    create_db layer6_benchmarks
            depends_on:
                postgres:
                    condition: service_healthy
            image: 'postgres:15-alpine'
            deploy:
                resources:
                    limits:
                        cpus: '0.25'
                        memory: '536870912'
    -
        kind: Service
        name: redis
        dockerCompose:
            command:
                - redis-server
                - '--requirepass'
                - '{{ env.vars.REDIS_PASSWORD }}'
            deploy:
                resources:
                    limits:
                        cpus: '0.25'
                        memory: '536870912'
            healthcheck:
                test:
                    - CMD
                    - redis-cli
                    - '-a'
                    - ''
                    - ping
                timeout: 3s
                interval: 5s
                retries: 3
            image: 'redis:7-alpine'
        volumes:
            -
                name: live-redis-data
                mount: /data
                subPath: ''
volumes:
    -
        name: live-minio-data
        size: 1Gi
        type: disk
    -
        name: live-neo4j-data
        size: 1Gi
        type: disk
    -
        name: live-postgres-data
        size: 1Gi
        type: disk
    -
        name: live-redis-data
        size: 1Gi
        type: disk
