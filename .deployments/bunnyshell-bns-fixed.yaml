        kind: Service
        name: minio
        dockerCompose:
            command:
                - server
                - /data
                - '--console-address'
                - ':9001'
            deploy:
                resources:
                    limits:
                        cpus: '0.25'
                        memory: '536870912'
            environment:
                MINIO_ROOT_PASSWORD: '{{ env.vars.MINIO_ROOT_PASSWORD }}'
                MINIO_ROOT_USER: minioadmin
            healthcheck:
                test:
                    - CMD
                    - curl
                    - '-f'
                    - 'http://localhost:9000/minio/health/live'
                timeout: 5s
                interval: 10s
                retries: 5
            image: 'minio/minio:latest'
        volumes:
            -
                name: live-minio-data
                mount: /data
                subPath: ''
    -
        kind: Service
        name: minio-init
        dockerCompose:
            deploy:
                resources:
                    limits:
                        cpus: '0.25'
                        memory: '268435456'
            entrypoint:
                - /bin/sh
                - '-c'
                - |4-
                     until /usr/bin/mc config host add myminio http://minio:9000  ; do
                      echo 'waiting for minio';  sleep 2;
                    done; /usr/bin/mc mb myminio/layer1-raw-html || true; /usr/bin/mc anonymous set none myminio/layer1-raw-html || true; exit 0; 
            image: 'minio/mc:latest'
    -
        kind: Service
        name: neo4j
        dockerCompose:
            deploy:
                resources:
                    limits:
                        cpus: '0.75'
                        memory: '2147483648'
            environment:
                NEO4J_AUTH: 'neo4j/${GRAPH_DB_PASSWORD}'
                NEO4J_PLUGINS: '["apoc"]'
                NEO4J_dbms_memory_heap_max__size: 512m
                NEO4J_dbms_memory_pagecache_size: 512m
            healthcheck:
                test:
                    - CMD-SHELL
                    - 'wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1'
                timeout: 5s
                interval: 10s
                retries: 10
            image: 'neo4j:5-community'
        volumes:
            -
                name: live-neo4j-data
                mount: /data
                subPath: ''
    -
