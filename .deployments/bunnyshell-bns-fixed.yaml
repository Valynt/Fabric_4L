        gitApplicationPath: /
        dockerCompose:
            build:
                context: .
                dockerfile: ./services/layer3-knowledge/Dockerfile.full
                args:
                    BASE_IMAGE: ''
                    BUILDER_BASE_IMAGE: ''
            command:
                - sh
                - '-lc'
                - |
                    attempts=0
                    until /app/.venv/bin/python /app/src/migrations/030_neo4j_tenant_id_constraints_and_indexes.py; do
                      attempts=$$((attempts + 1))
                      if [ "$$attempts" -ge 24 ]; then
                        echo "layer3 neo4j migration 030 failed after $${attempts} attempts"    exit 1
                      fi
                      echo "waiting for neo4j ($${attempts}/24)"
                      sleep 5
                    done
            deploy:
                resources:
                    limits:
                        cpus: '0.25'
                        memory: '536870912'
            environment:
                NEO4J_AUTH: 'neo4j/${GRAPH_DB_PASSWORD}'
                NEO4J_PASSWORD: '${GRAPH_DB_PASSWORD}'
                NEO4J_URI: 'bolt://neo4j:7687'
                NEO4J_USER: neo4j
