                DATABASE_URL_SYNC: 'postgresql+psycopg2://postgres:{{ env.vars.POSTGRES_PASSWORD }}@postgres:5432/ground_truth'
                MIGRATION_CONNECT_ATTEMPTS: '12'
                MIGRATION_CONNECT_DELAY_SECONDS: '5'
