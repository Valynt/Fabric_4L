[project]
name = "layer2-extraction"
version = "1.1.0"
description = "Value Fabric - Ontology-Guided Extraction Pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "openai>=1.40.0",  # Structured outputs support (parse() API)
    "langchain>=1.3.9",
    "langchain-text-splitters>=0.3.0",
    "rdflib>=7.1.0",
    "numpy>=1.26.0",
    "redis>=5.2.0",
    "celery>=5.4.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "prometheus-client>=0.19.0",
    "sentry-sdk>=2.0.0",
    "psutil>=6.0.0",
    "infisicalsdk>=1.0.0",
    "asyncpg>=0.29.0",  # Async PostgreSQL driver
    "alembic>=1.13.0",  # Database migrations
    "pyjwt>=2.13.0",
    "opentelemetry-api>=1.21.0",
    "opentelemetry-sdk>=1.21.0",
    "opentelemetry-instrumentation>=0.42b0",
    "opentelemetry-exporter-otlp>=1.21.0",
    "opentelemetry-instrumentation-fastapi>=0.42b0",
    "structlog>=24.1",
    "jsonschema>=4.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.6.0",
    "pytest-timeout>=2.3.0",
    "pytest-randomly>=3.16.0",
    "mypy>=1.13.0",
    "ruff>=0.8.0",
    "black>=24.10.0",
    "testcontainers>=4.8.0",
    "factory-boy>=3.3.0",
    "faker>=33.0.0",
    "respx>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/layer2_extraction"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "E402",   # Module level import not at top of file
    "E722",   # Do not use bare `except`
    "W291",   # Trailing whitespace
    "W293",   # Blank line contains whitespace
    "B007",   # Loop control variable not used in loop body
    "B008",   # Do not perform function call in default arguments (FastAPI Depends pattern)
    "B015",   # Pointless comparison
    "B027",   # Empty method in abstract base class
    "B904",   # Within an `except` clause, raise exceptions with `raise ... from err`
    "B905",   # `zip()` without an explicit `strict=` parameter
    "N805",   # First argument of a method should be named `self`
    "N811",   # Constant imported as non-constant
    "N818",   # Exception name should end with `Error`
    "N801",   # Auto-generated TypedDictModel result classes use snake_case names
    "UP042",  # Use `StrEnum` instead of `(str, enum.Enum)` – pre-existing pattern
    "UP007",  # Use `X | Y` for union types
    "SIM101", # Multiple `isinstance()` calls, merge into a single call
    "SIM102", # Use a single `if` statement instead of nested `if` statements
    "SIM103", # Return the condition directly
    "SIM105", # Use `contextlib.suppress(...)` instead of `try`-`except`-`pass`
    "SIM108", # Use ternary operator instead of `if`-`else`-block
    "SIM117", # Use a single `with` statement with multiple contexts
    "SIM118", # Use `key in dict` instead of `key in dict.keys()`
    "C401",   # Unnecessary generator (use a set comprehension)
    "C405",   # Unnecessary `set` literal
    "C414",   # Unnecessary `list` or `tuple` call within `list()`
    "C416",   # Unnecessary `list` comprehension
]

[tool.ruff.lint.flake8-tidy-imports]
# Phase 4 remediation: Block all deprecated value_fabric.layer* imports
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"value_fabric.layer1" = { msg = "value_fabric.layer1 is deprecated. Use layer1_ingestion.* instead. This namespace will be removed before 2026-09-30." }
"value_fabric.layer2" = { msg = "value_fabric.layer2 is deprecated. Use layer2_extraction.* instead. This namespace will be removed before 2026-09-30." }
"value_fabric.layer3" = { msg = "value_fabric.layer3 is deprecated. Use services/layer3-knowledge/src/ modules instead. This namespace will be removed before 2026-09-30." }
"value_fabric.layer4" = { msg = "value_fabric.layer4 is deprecated. Use layer4_agents.* instead. This namespace will be removed before 2026-09-30." }
"value_fabric.layer5" = { msg = "value_fabric.layer5 is deprecated. Use layer5_ground_truth.* instead. This namespace will be removed before 2026-09-30." }
"value_fabric.layer6" = { msg = "value_fabric.layer6 is deprecated. Use layer6_benchmarks.* instead. This namespace will be removed before 2026-09-30." }

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# Note: Strict mode is enabled via Makefile CLI flags for CI consistency

# Annotation-gap noise in strict mode — suppress per-module.
# Genuine attr-defined/misc errors in these files are runtime-safe
# (polymorphic BaseModel subclasses, TypedDictModel subclassing).
[[tool.mypy.overrides]]
module = [
    "layer2_extraction.api.main",
    "layer2_extraction.api.app_factory",
    "layer2_extraction.api.routes_extract",
    "layer2_extraction.api.pipeline_runner",
    "layer2_extraction.api.ingestion_runner",
    "layer2_extraction.api.sse_stream",
    "layer2_extraction.models.ontology",
    "layer2_extraction.integration.job_store",
    "layer2_extraction.extraction.llm_extractor",
    "layer2_extraction.extraction.chunker",
    "layer2_extraction.extraction.deduplicator",
    "layer2_extraction.output.rdf_generator",
    "layer2_extraction.startup_dependencies",
    "layer2_extraction.extraction.cache",
]
# Pre-existing type debt surfaced after fixing src-layout mypy path mapping
# (removed empty src/__init__.py). These modules have runtime-valid code that
# predates strict mypy enforcement and should be tightened in a follow-up.
disable_error_code = ["no-untyped-def", "type-arg", "unused-ignore", "no-any-return", "no-untyped-call", "attr-defined", "misc", "untyped-decorator", "assignment", "call-arg", "arg-type", "return-value"]

[[tool.mypy.overrides]]
module = [
    "layer2_extraction.shared.tasks",
]
disable_error_code = ["no-untyped-def", "type-arg", "unused-ignore", "no-any-return", "no-untyped-call", "attr-defined", "misc", "untyped-decorator", "call-arg", "var-annotated", "arg-type"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --tb=short"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src", "../..", "../../packages/shared/src", "../../packages/platform-contract/src/python"]
timeout = 30
env = [
    "ENVIRONMENT=development",
    "ALLOW_DEV_AUTH_BYPASS=I_UNDERSTAND_RISK",
    "TESTING=true",
    "LOG_LEVEL=DEBUG",
    "MOCK_PERSISTENCE=true",
    "JWT_SECRET=test-jwt-secret-must-be-at-least-32-characters-long",
    "API_KEY_HMAC_SECRET=test-api-key-hmac-secret-32-chars",
    'CORS_ORIGINS=["http://localhost:3000"]',
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
fail_under = 85
