[pytest]
asyncio_mode = auto
pythonpath = src
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:warnings
markers =
    asyncio: mark test as async
    integration: mark test as integration test (requires running services)
    unit: mark test as unit test (no external dependencies)
    mandatory: Tests that must run and pass in CI
    requires_postgres: mark test as requiring PostgreSQL
    requires_redis: mark test as requiring Redis
    requires_neo4j: mark test as requiring Neo4j
    contract_static: Contract tests that must run deterministically without live services
    service_required: Contract tests that require reachable live service endpoints
    security: Security tests
    tenant_boundary: High-risk tenant boundary tests
    tenant_isolation: First-class tenant isolation gate tests
    production_readiness: Centralized SaaS production-readiness suite tests
    slow: mark test as slow running
log_cli = true
log_cli_level = INFO

env =
    TESTING=true
    JWT_SECRET=
    API_KEY_HMAC_SECRET=test-api-key-hmac-secret-32-chars
