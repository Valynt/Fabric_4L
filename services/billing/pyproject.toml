[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/billing"]

[project]
name = "billing"
version = "0.1.0"
description = "Stripe-integrated billing microservice for Value Fabric – subscription management, customer sync, webhook idempotency"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Internal"}
authors = [
    {name = "Value Fabric Platform Team"}
]

dependencies = [
    "fastapi>=0.137.1",
    "uvicorn[standard]>=0.49.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "email-validator>=2.3.0",
    "sqlalchemy>=2.0.51",
    "asyncpg>=0.31.0",
    "alembic>=1.18.4",
    "stripe>=15.2.1,<16.0.0",
    "structlog>=26.1.0",
    "prometheus-client>=0.25.0",
    "sentry-sdk>=2.62.0",
    "PyJWT>=2.13.0",
]

[project.optional-dependencies]
prod = []
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "pytest-randomly>=4.1.0",
    "httpx>=0.28.1",
    "respx>=0.23.1",
    "aiosqlite>=0.22.1",
    "black>=26.5.1",
    "ruff>=0.15.17",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "EM101", "TRY003"]
ignore = ["E501"]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.value_fabric]
deployable = false
status = "legacy-billing-compatibility"
canonical_service = "services/layer7-billing"
runtime_owner = false

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
