[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/billing"]

[project]
name = "billing"
version = "1.1.0"
description = "Stripe-integrated billing microservice for Value Fabric – subscription management, customer sync, webhook idempotency"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Internal"}
authors = [
    {name = "Value Fabric Platform Team"}
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.51.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.14.2",
    "email-validator>=2.1.0",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "stripe>=11.0.0,<12.0.0",
    "structlog>=26.1.0",
    "prometheus-client>=0.19.0",
    "sentry-sdk>=2.0.0",
    "PyJWT>=2.8.0",
]

[project.optional-dependencies]
prod = []
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-timeout>=2.4.0",
    "pytest-randomly>=3.16.0",
    "httpx>=0.27.0",
    "respx>=0.21.0",
    "aiosqlite>=0.20.0",
    "black>=24.10.0",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "EM101", "TRY003"]
ignore = ["E501"]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.value_fabric]
deployable = false
status = "legacy-billing-compatibility"
canonical_service = "services/layer7-billing"
runtime_owner = false

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
