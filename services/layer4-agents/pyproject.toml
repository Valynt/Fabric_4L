[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/layer4_agents"]

[project]
name = "layer4-agents"
version = "1.1.0"
description = "Layer 4: Agentic Workflow Engine for Value Fabric with Multi-Agent Orchestration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.0.0",
    "cryptography>=50.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.14.2",
    "email-validator>=2.1.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain>=1.3.9",
    "langchain-openai>=0.2.0",
    "asyncpg>=0.30.0",
    "openai>=1.54.0",
    "redis>=5.2.0",
    "neo4j>=5.26.0",
    "httpx>=0.27.0",
    "stripe>=11.0.0",
    "tenacity>=9.0.0",
    "python-multipart>=0.0.31",
    "structlog>=24.4.0",
    "prometheus-client>=0.19.0",
    "PyYAML>=6.0.0",
    "sentry-sdk>=2.0.0",
    "weasyprint>=69.0",
    "python-docx>=1.1.0",
    "pandas>=2.2.0",
    "numpy>=2.1.0",
    # Provenance & RDF
    "rdflib>=7.0.0",
    "prov>=2.0.0",
    # JWT for tenant middleware and OIDC
    "PyJWT>=2.8.0",
    "authlib>=1.7.1,<2.0",
    # Shared identity module dependencies
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    # Rate-limiting dependency used by shared rate_limiting.ip_limiter
    "limits>=3.13.0",
    # Observability
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-instrumentation>=0.41b0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    # Template & HTTP
    "jinja2>=3.1",
    "aiohttp>=3.14.3",
    # System metrics for health check
    "psutil>=5.9",
    "passlib>=1.7",
    # S3/MinIO export package storage
    "boto3>=1.34.0",
    "lxml_html_clean>=0.4.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.6.0",
    "pytest-timeout>=2.3.0",
    "pytest-randomly>=3.16.0",
    "black>=24.10.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "testcontainers>=4.8.0",
    "respx>=0.21.0",
    "factory-boy>=3.3.0",
    "faker>=33.0.0",
    "schemathesis>=3.38.0",
    "hypothesis>=6.122.0",
    "httpx>=0.27.0",
    # Mandatory test deps — tests fail (not skip) when these are absent
    "psycopg[binary]>=3.1.0",   # Required by testcontainers postgres integration tests
    "aiosqlite>=0.20.0",        # SQLite backend for harness persistence tests
]

[dependency-groups]
dev = [
    "aiohttp>=3.14.3",
    "beautifulsoup4>=4.14.3",
    "defusedxml>=0.7.1",
    "email-validator>=2.3.0",
    "hypothesis>=6.152.4",
    "jsonschema>=4.26.0",
    "neo4j>=6.1.0",
    "pymupdf4llm>=1.27.2.3",
    "pytesseract>=0.3.13",
    "pytest-asyncio>=1.3.0",
    "rdflib>=7.6.0",
    "respx>=0.23.1",
    "schemathesis>=4.17.0",
    "selectolax>=0.4.7",
    "trafilatura>=2.0.0",
    "aiosqlite>=0.20.0",   # SQLite backend for harness persistence tests
    "alembic>=1.18.4",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "TID"]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "E402",   # Module level import not at top of file
    "E722",   # Do not use bare `except`
    "W291",   # Trailing whitespace
    "W293",   # Blank line contains whitespace
    "B007",   # Loop control variable not used in loop body
    "B008",   # Do not perform function call in default arguments (FastAPI Depends pattern)
    "B015",   # Pointless comparison
    "B027",   # Empty method in abstract base class
    "B904",   # Within an `except` clause, raise exceptions with `raise ... from err`
    "B905",   # `zip()` without an explicit `strict=` parameter
    "N805",   # First argument of a method should be named `self`
    "N811",   # Constant imported as non-constant
    "N815",   # MixedCase variables in class scope (e.g. vendor API payload models)
    "N818",   # Exception name should end with `Error`
    "N801",   # Auto-generated TypedDictModel result classes use snake_case names
    "UP042",  # Use `StrEnum` instead of `(str, enum.Enum)` – pre-existing pattern
    "UP007",  # Use `X | Y` for union types
    "SIM101", # Multiple `isinstance()` calls, merge into a single call
    "SIM102", # Use a single `if` statement instead of nested `if` statements
    "SIM103", # Return the condition directly
    "SIM105", # Use `contextlib.suppress(...)` instead of `try`-`except`-`pass`
    "SIM108", # Use ternary operator instead of `if`-`else`-block
    "SIM117", # Use a single `with` statement with multiple contexts
    "SIM118", # Use `key in dict` instead of `key in dict.keys()`
    "UP031",  # Use format specifiers instead of percent format
    "C401",   # Unnecessary generator (use a set comprehension)
    "C405",   # Unnecessary `set` literal
    "C414",   # Unnecessary `list` or `tuple` call within `list()`
    "C416",   # Unnecessary `list` comprehension
    "TID252", # Temporary: relative-import debt migration in progress
               # Ticket: L4-IMPORT-MIGRATION-2026
               # Owner: platform-team (placeholder)
               # Remediation window: 2026-07-15
               # Context: 733 relative-parent imports remain across src/;
               #          blocked on canonical absolute-import path stabilization.
]

[tool.ruff.lint.flake8-tidy-imports]
# Block deprecated namespace imports at edit-time (faster feedback than CI-only gates)
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"value_fabric.layer4_agents" = { msg = "Use layer4_agents.* instead." }
"value_fabric.layer1_ingestion" = { msg = "This namespace is deprecated. Use service-local imports." }
"value_fabric.layer3_knowledge" = { msg = "This namespace is deprecated. Use service-local imports." }
# Phase 4 remediation: Block all deprecated value_fabric.layer* imports
"value_fabric.layer1" = { msg = "value_fabric.layer1 is deprecated. Use layer1_ingestion.* instead. This namespace will be removed before 2026-09-30." }
"value_fabric.layer2" = { msg = "value_fabric.layer2 is deprecated. Use layer2_extraction.* instead. This namespace will be removed before 2026-09-30." }
"value_fabric.layer3" = { msg = "value_fabric.layer3 is deprecated. Use services/layer3-knowledge/src/ modules instead. This namespace will be removed before 2026-09-30." }
"value_fabric.layer4"        = { msg = "value_fabric.layer4 is deprecated. Use layer4_agents.* instead." }
"value_fabric.layer5" = { msg = "value_fabric.layer5 is deprecated. Use layer5_ground_truth.* instead. This namespace will be removed before 2026-09-30." }
"value_fabric.layer6" = { msg = "value_fabric.layer6 is deprecated. Use layer6_benchmarks.* instead. This namespace will be removed before 2026-09-30." }

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["layer4_agents"]
src_paths = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
plugins = ["sqlalchemy.ext.mypy.plugin"]
# Type safety ratchet - prevents regression (Gap 4)
# Baseline established: 2026-04-19
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Gradual ratchet - set to true when ready
ignore_missing_imports = true
# Error report for CI
show_error_codes = true
show_column_numbers = true
# Performance
cache_dir = ".mypy_cache"

# Annotation-gap noise in strict mode — suppress per-module.
# call-arg false positives from missing pydantic mypy plugin (incompatible with mypy 2.x).
