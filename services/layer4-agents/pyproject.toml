    "has-type",
    "comparison-overlap",
    "call-overload",
    "empty-body",
    "dict-item",
    "truthy-function",
    "redundant-cast",
    "override",
    "valid-type",
    "list-item",
    "abstract",
    "unused-coroutine",
    "return",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "src/layer4_agents/harness/tests"]
addopts = "-v --tb=short"
pythonpath = ["src", "../..", "../../packages/shared/src", "../../services/layer3-knowledge/src", "../../packages/platform-contract/src/python"]
markers = [
    "unit: Fast unit tests with no external dependencies",
    "integration: Integration tests with real services (DB, cache)",
    "e2e: End-to-end tests with full container orchestration",
    "slow: Tests that take >5 seconds",
    "requires_postgres: Tests requiring a live PostgreSQL instance",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*"]

[tool.coverage.report]
fail_under = 80
