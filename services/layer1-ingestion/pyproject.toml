[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "layer1-ingestion"
version = "1.1.0"
description = "Intelligent Data Ingestion Service for Value Fabric"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Internal"}
authors = [
    {name = "Value Fabric Team"}
]
keywords = ["crawler", "ingestion", "web-scraping", "markdown"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    "alembic>=1.12.0",
    "celery>=5.3.0",
    "redis>=5.0.0",
    "playwright>=1.40.0",
    "trafilatura>=1.6.0",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.11.0",
    "httpx>=0.25.0",
    "python-multipart>=0.0.31",
    "python-dotenv>=1.0.0",
    "structlog>=23.2.0",
    "prometheus-client>=0.19.0",
    "sentry-sdk>=2.0.0",
    "opentelemetry-api>=1.21.0",
    "opentelemetry-sdk>=1.21.0",
    "opentelemetry-instrumentation>=0.42b0",
    "opentelemetry-exporter-otlp>=1.21.0",
    "pyjwt>=2.13.0",
    "pyyaml>=6.0.0",
    "protego>=0.3.0",
    "defusedxml>=0.7.1",  # P1-20: XXE protection for XML parsing
    "croniter>=2.0.0",   # Strict cron expression parsing and validation
    "jsonschema>=4.23.0",  # JSON Schema validation for extracted data payloads
    "selectolax>=0.3.0",  # Fast HTML parsing for HTTPX crawler
    "presidio-analyzer==2.2.364",  # PII detection; keep aligned with anonymizer
    "presidio-anonymizer==2.2.364",  # PII anonymization; >=2.2.362 pins cryptography<49 which conflicts with platform cryptography>=50
    # Downgraded from >=2.0.0 to >=1.0.0 for compatibility with existing auth flow
    # v2 introduced breaking changes in client initialization
    "infisicalsdk>=1.0.0",
    "lxml_html_clean>=0.4.5",
    "setuptools>=83.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.2.0",
    "pytest-randomly>=3.15.0",
    "pytest-xdist>=3.5.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "httpx>=0.25.0",
    # Mandatory test deps — tests fail (not skip) when these are absent
    "respx>=0.21.0",       # HTTP mocking for httpx crawler tests
    "faker>=20.0.0",
]

[project.urls]
Homepage = "https://github.com/services/layer1-ingestion"
Documentation = "https://docs.value-fabric.io/layer1"

[tool.setuptools.packages.find]
where = ["src"]
include = ["layer1_ingestion*"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "TID", # flake8-tidy-imports
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "E402",   # Module level import not at top of file
    "W291",   # Trailing whitespace
    "W293",   # Blank line contains whitespace
    "N805",   # First argument of a method should be named `self`
    "N811",   # Constant imported as non-constant
    "N818",   # Exception name should end with `Error`
    "N801",   # Auto-generated TypedDictModel result classes use snake_case names
    "UP042",  # Use `StrEnum` instead of `(str, enum.Enum)` – pre-existing pattern
    "UP007",  # Use `X | Y` for union types
    "TID252", # Prefer absolute imports over relative parent imports – 220 pre-existing occurrences; requires dedicated migration pass
]

[tool.ruff.lint.flake8-tidy-imports]
# Block deprecated namespace imports at edit-time (faster feedback than CI-only gates)
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"value_fabric.layer4_agents" = { msg = "Use value_fabric.layer4 instead." }
"value_fabric.layer1_ingestion" = { msg = "This namespace is deprecated. Use service-local imports." }
"value_fabric.layer3_knowledge" = { msg = "This namespace is deprecated. Use service-local imports." }
# Phase 4 remediation: Block all deprecated value_fabric.layer* imports
"value_fabric.layer1" = { msg = "value_fabric.layer1 is deprecated. Use layer1_ingestion.* instead. This namespace will be removed before 2026-09-30." }
"value_fabric.layer2" = { msg = "value_fabric.layer2 is deprecated. Use layer2_extraction.* instead. This namespace will be removed before 2026-09-30." }
"value_fabric.layer3" = { msg = "value_fabric.layer3 is deprecated. Use services/layer3-knowledge/src/ modules instead. This namespace will be removed before 2026-09-30." }
"value_fabric.layer4" = { msg = "value_fabric.layer4 is deprecated. Use layer4_agents.* instead. This namespace will be removed before 2026-09-30." }
"value_fabric.layer5" = { msg = "value_fabric.layer5 is deprecated. Use layer5_ground_truth.* instead. This namespace will be removed before 2026-09-30." }
"value_fabric.layer6" = { msg = "value_fabric.layer6 is deprecated. Use layer6_benchmarks.* instead. This namespace will be removed before 2026-09-30." }

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["layer1_ingestion"]
src_paths = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
plugins = ["sqlalchemy.ext.mypy.plugin"]
# Resolve the value_fabric shared package from the monorepo layout.
mypy_path = ["../../packages/shared/src"]
# Note: Additional flags are passed via Makefile for CI consistency
exclude = [
    "migrations/",
    "tests/",
]

[[tool.mypy.overrides]]
module = ["value_fabric.*"]
# The shared package is type-checked in its own context; here we only need
# mypy to discover it so that our handler imports resolve without importing
# the shared package's internal typing debt into the Layer 1 baseline.
follow_imports = "skip"

# SQLAlchemy ORM files: Column[T] vs plain-type mismatches are expected patterns.
# Suppressing arg-type/assignment/misc noise; genuine logic errors are caught elsewhere.
[[tool.mypy.overrides]]
module = [
    "src.shared.tasks",
    "src.shared.models",
    "src.crawler.decision_store",
    "src.crawler.playwright_crawler",
    "src.crawler.telemetry",
    "src.crawler.execution_logger",
    "src.crawler.smart_router",
    "src.crawler.crawler_config",
    "src.crawler.httpx_crawler",
    "src.crawler.browser_pool",
    "src.post_processor.content_extractor",
    "src.scheduler.priority_queue",
    "src.shared.config",
    "src.shared.maintenance",
    "src.metrics.prometheus_metrics",
    "src.layer1_ingestion.api.main",
    "src.layer1_ingestion.api.content_handlers",
    "src.layer1_ingestion.api.job_handlers",
    "src.layer1_ingestion.api.skill_handlers",
    "src.layer1_ingestion.api.target_config",
    "src.layer1_ingestion.api.target_handlers",
    "src.layer1_ingestion.shared.tasks",
    "src.layer1_ingestion.crawler.decision_store",
    "src.layer1_ingestion.crawler.playwright_crawler",
    "src.layer1_ingestion.crawler.telemetry",
    "src.layer1_ingestion.crawler.execution_logger",
    "src.layer1_ingestion.crawler.smart_router",
    "src.layer1_ingestion.crawler.crawler_config",
    "src.layer1_ingestion.crawler.httpx_crawler",
    "src.layer1_ingestion.crawler.browser_pool",
    "src.layer1_ingestion.post_processor.content_extractor",
    "src.layer1_ingestion.compliance.pii_scanner",
    "src.layer1_ingestion.compliance.robots_checker",
    "src.layer1_ingestion.compliance.url_safety",
    "src.layer1_ingestion.scheduler.priority_queue",
    "src.layer1_ingestion.adapters.xbrl_parser",
    "src.layer1_ingestion.adapters.sec_edgar",
    "src.layer1_ingestion.shared.config",
    "src.layer1_ingestion.shared.maintenance",
    "src.layer1_ingestion.metrics.prometheus_metrics",
]
disable_error_code = ["arg-type", "assignment", "misc", "valid-type", "no-any-return", "union-attr", "attr-defined", "var-annotated", "index", "call-overload", "return-value"]

[[tool.mypy.overrides]]
module = [
    "src.layer1_ingestion.domain.stages",
    "src.layer1_ingestion.orchestrator.connector_resolution",
    "src.layer1_ingestion.orchestrator.stage_handlers.context",
    "src.layer1_ingestion.orchestrator.stage_handlers.fetching_source",
    "src.layer1_ingestion.orchestrator.stage_handlers.applying_policy",
]
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
asyncio_mode = "auto"
pythonpath = ["src", "../..", "../../packages/shared/src"]
markers = [
    "postgres: Tests requiring PostgreSQL-specific features (JSONB, RLS, SET LOCAL, current_setting)",
    "requires_postgres: Tests requiring a reachable PostgreSQL service",
    "benchmark: Layer 1 benchmark and performance tests",
    "performance: Performance benchmarks and SLO validation",
    "quarantine: Tests temporarily isolated due to external dependencies (Docker, env, timing)",
    "security: Security and tenant isolation tests",
    "rls: Row-Level Security enforcement tests",
    "slow: Tests that take >1 second or require optional heavy deps",
    "unit: Unit tests that do not require PostgreSQL",
    "integration: Integration tests requiring PostgreSQL",
    "contract_static: Static contract tests that do not require live services",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
fail_under = 70
