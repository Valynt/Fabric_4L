[project]
name = "fabric-4l-api"
version = "1.1.0"
description = "Fabric_4L unified API backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.28",  # 0.0.27 has no known CVEs but 0.0.28 is the current clean release; tighten lower bound
    "PyJWT>=2.8.0",
    "cryptography>=50.0.0",  # Platform security baseline (GHSA-g6cj-pr64-35w5 fixed in 50.0.0)
    "email-validator>=2.1.0.post1",
    "limits>=4.0.0",
    "passlib[bcrypt]>=1.7.4",
    "structlog>=24.4.0",
    "sqlalchemy>=2.0.0",
    "httpx>=0.27.0",
    "psycopg[binary,pool]>=3.1.0",
    "openai>=1.30.0",
    "prometheus-client>=0.19.0",
    "sentry-sdk>=2.0.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-passlib>=1.7.7",
    "coverage>=7.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
pythonpath = [".", "../..", "../../packages/shared/src"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["migrations*"]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
fail_under = 75

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "$MYPY_CONFIG_FILE_DIR:$MYPY_CONFIG_FILE_DIR/../../packages/shared/src"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "I",    # isort
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade
    "E741", # ambiguous variable names
    "TRY",  # exception-handling anti-patterns
    "EM",   # exception message formatting hygiene
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
# Tests may use message-bearing raises for test assertions
"app/tests/*.py" = ["EM101", "EM102", "TRY003"]


