[project]
name = "fabric-4l-api"
version = "0.1.0"
description = "Fabric_4L unified API backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.28",  # 0.0.27 has no known CVEs but 0.0.28 is the current clean release; tighten lower bound
    "PyJWT>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.27.0",
    "openai>=1.30.0",
    "prometheus-client>=0.21.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "coverage>=7.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
pythonpath = [".", "../..", "../../packages/shared/src"]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
fail_under = 75

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "../../packages/shared/src"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "I",    # isort
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade
    "E741", # ambiguous variable names
    "TRY",  # exception-handling anti-patterns
    "EM",   # exception message formatting hygiene
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
# Existing legacy service modules still use message-bearing raises; enable
# new hygiene rules incrementally while enforcing them for touched API routes.
"app/services/agent_orchestrator.py" = ["TRY003", "EM101", "EM102"]
"app/services/distributed_store.py" = ["TRY003", "EM101", "EM102"]
"app/services/dsar_service.py" = ["TRY003", "EM101", "EM102"]
"app/services/export_service.py" = ["TRY003", "EM101", "EM102"]
"app/tests/*.py" = ["EM101", "EM102", "TRY003"]
