[pytest]
minversion = 6.0
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
pythonpath = . ../.. ../../packages/shared/src

addopts =
    --strict-markers
    --verbose
    --tb=short

markers =
    mandatory: Tests that must run and pass in CI (unit + contract + security)
    unit: mark test as a unit test
    integration: mark test as an integration test
    slow: mark test as slow running
    requires_redis: mark test as requiring Redis
    requires_neo4j: mark test as requiring Neo4j
    vector: mark test as covering Neo4j-native vector indexes or embeddings
    requires_prometheus: mark test as requiring Prometheus
    tenant_boundary: High-risk tenant boundary tests (cross-tenant API, RLS fail-closed, header spoofing, super-admin bypass audit)

filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

env =
    NEO4J_PASSWORD=test_password
    LOG_LEVEL=DEBUG
