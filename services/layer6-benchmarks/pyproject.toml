[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "layer6-benchmarks"
version = "1.1.0"
description = "Layer 6: Benchmark Service for Value Fabric - Comparative Intelligence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0",
    "pyjwt>=2.13.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "prometheus-client>=0.19.0",
    "sentry-sdk>=2.0.0",
    "infisicalsdk>=1.0.0",
    "psutil>=6.0.0",
    "neo4j>=5.26.0",
    "pydantic-settings>=2.14.2",
    "opentelemetry-api>=1.21.0",
    "opentelemetry-sdk>=1.21.0",
    "opentelemetry-instrumentation>=0.42b0",
    "opentelemetry-exporter-otlp>=1.21.0",
    "opentelemetry-instrumentation-fastapi>=0.42b0",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.6.0",
    "pytest-timeout>=2.3.0",
    "pytest-randomly>=3.16.0",
    "httpx>=0.27.0",
    "black>=24.10.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "factory-boy>=3.3.0",
    "faker>=33.0.0",
]

[project.scripts]
layer6-load-benchmark-packs = "layer6_benchmarks.seed.load_benchmark_packs:main"

[tool.hatch.build.targets.wheel]
packages = ["src/layer6_benchmarks"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "src", "../..", "../../packages/shared/src"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
fail_under = 70

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "E402",   # Module level import not at top of file
    "F841",   # Local variable assigned but never used
]

[tool.ruff.lint.flake8-tidy-imports]
# Phase 4 remediation: Block all deprecated value_fabric.layer* imports
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"value_fabric.layer1" = { msg = "value_fabric.layer1 is deprecated. Use layer1_ingestion.* instead. This namespace will be removed before 2026-09-30." }
"value_fabric.layer2" = { msg = "value_fabric.layer2 is deprecated. Use layer2_extraction.* instead. This namespace will be removed before 2026-09-30." }
"value_fabric.layer3" = { msg = "value_fabric.layer3 is deprecated. Use services/layer3-knowledge/src/ modules instead. This namespace will be removed before 2026-09-30." }
"value_fabric.layer4" = { msg = "value_fabric.layer4 is deprecated. Use layer4_agents.* instead. This namespace will be removed before 2026-09-30." }
"value_fabric.layer5" = { msg = "value_fabric.layer5 is deprecated. Use layer5_ground_truth.* instead. This namespace will be removed before 2026-09-30." }
"value_fabric.layer6" = { msg = "value_fabric.layer6 is deprecated. Use layer6_benchmarks.* instead. This namespace will be removed before 2026-09-30." }

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# Note: Minimal config - additional flags passed via Makefile

# Annotation-gap noise in strict mode — suppress per-module.
[[tool.mypy.overrides]]
module = [
    "layer6_benchmarks.api.deps",
    "layer6_benchmarks.api.main",
    "layer6_benchmarks.api.routes.benchmarks",
    "layer6_benchmarks.api.routes.system",
    "layer6_benchmarks.api.schemas",
    "layer6_benchmarks.metrics.prometheus_metrics",
    "layer6_benchmarks.models.benchmark_dataset",
    "layer6_benchmarks.repositories.benchmark_repository",
    "layer6_benchmarks.settings",
]
disable_error_code = [
    "no-untyped-def",
    "type-arg",
    "unused-ignore",
    "no-any-return",
    "no-untyped-call",
    "attr-defined",
    "misc",
    "call-arg",
    "union-attr",
    "arg-type",
    "assignment",
    "return-value",
    "untyped-decorator",
]
