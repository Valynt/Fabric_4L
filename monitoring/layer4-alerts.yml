# Layer 4 Agentic Workflow Engine — Prometheus Alerting Rules
#
# Runbook: docs/runbooks/layer4-alerts.md

 groups:
  - name: layer4_workflow_health
    interval: 30s
    rules:
      - alert: Layer4StuckWorkflows
        expr: layer4_stuck_workflows_total > 0
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Layer 4 has stuck workflows"
          description: "Workflows have been in RUNNING or WAITING_FOR_HUMAN for longer than the threshold."
          runbook_url: "https://github.com/bmsull560/Fabric_4L/blob/main/docs/runbooks/README.md"

      - alert: Layer4RepeatedFailures
        expr: rate(layer4_repeated_workflow_failures_total[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Layer 4 workflows are failing repeatedly"
          description: "Failure rate for workflow executions exceeds 0.1 per minute."
          runbook_url: "https://github.com/bmsull560/Fabric_4L/blob/main/docs/runbooks/README.md"

      - alert: Layer4ApprovalWaitHigh
        expr: histogram_quantile(0.99, rate(layer4_approval_wait_seconds_bucket[5m])) > 3600
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Layer 4 approval wait time is high"
          description: "P99 approval wait time exceeds 1 hour."
          runbook_url: "https://github.com/bmsull560/Fabric_4L/blob/main/docs/runbooks/README.md"

      - alert: Layer4ToolAuthFailures
        expr: rate(layer4_tool_auth_failures_total[5m]) > 0.5
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Layer 4 tool auth failures are elevated"
          description: "Tool auth failure rate exceeds 0.5 per minute."
          runbook_url: "https://github.com/bmsull560/Fabric_4L/blob/main/docs/runbooks/operational/abuse-emergency-controls.md"

      - alert: Layer4CheckpointCorruption
        expr: layer4_checkpoint_corruption_detected_total > 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Layer 4 checkpoint corruption detected"
          description: "Checkpoint hash mismatch or unreadable checkpoint detected."
          runbook_url: "https://github.com/bmsull560/Fabric_4L/blob/main/docs/runbooks/README.md"
