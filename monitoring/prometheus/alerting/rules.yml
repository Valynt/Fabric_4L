groups:
  - name: security_websocket_alerts
    interval: 30s
    rules:
      # OBS-L4-009: Alert when a single tenant bucket generates > 5 cross-tenant
      # WebSocket access denials within a 5-minute rolling window.
      # This pattern is consistent with BOLA/IDOR probing behaviour.
      - alert: WebSocketCrossTenantProbeDetected
        expr: |
          increase(security_websocket_tenant_mismatch_total[5m]) > 5
        for: 0m
        labels:
          severity: warning
          owner: platform-security
          layer: layer4
        annotations:
          summary: "Cross-tenant WebSocket probe detected"
          description: >
            Tenant bucket {{ $labels.actor_tenant_tier }} generated
            {{ $value | printf "%.0f" }} cross-tenant WebSocket access denials
            in the last 5 minutes. Possible BOLA/IDOR probing (OBS-L4-009).
            Review structured logs for actor_tenant_id and targeted workflow_ids.
          runbook_url: "https://docs.valuefabric.internal/runbooks/security/ws-tenant-probe"

      - alert: WebSocketCrossTenantProbeCritical
        expr: |
          increase(security_websocket_tenant_mismatch_total[5m]) > 20
        for: 0m
        labels:
          severity: critical
          owner: platform-security
          layer: layer4
        annotations:
          summary: "High-volume cross-tenant WebSocket probe detected"
          description: >
            Tenant bucket {{ $labels.actor_tenant_tier }} generated
            {{ $value | printf "%.0f" }} cross-tenant WebSocket access denials
            in the last 5 minutes. Likely active BOLA/IDOR attack (OBS-L4-009).
          runbook_url: "https://docs.valuefabric.internal/runbooks/security/ws-tenant-probe"

  - name: journey_slo_alerts
    interval: 30s
    rules:
      - alert: JourneySuccessRateSLOViolation
        expr: avg_over_time(journey:sli_success_rate_5m{journey="account_signals_evidence_driver_calculator_business_case"}[15m]) < 0.99
        for: 10m
        labels:
          severity: critical
          owner: frontend-platform
        annotations:
          summary: "Journey success rate below launch SLO"
          description: "Key clickpath success rate dropped below 99% for 10m. Release gate must remain blocked."

      - alert: JourneyP95LatencySLOViolation
        expr: max_over_time(journey:sli_p95_latency_seconds_5m{journey="account_signals_evidence_driver_calculator_business_case"}[15m]) > 12
        for: 10m
        labels:
          severity: warning
          owner: frontend-platform
        annotations:
          summary: "Journey p95 latency above launch SLO"
          description: "Key clickpath p95 latency exceeded 12 seconds for 10m."

      - alert: JourneyNonEmptyResponseSLOViolation
        expr: avg_over_time(journey:sli_non_empty_ratio_5m{journey="account_signals_evidence_driver_calculator_business_case"}[15m]) < 1
        for: 5m
        labels:
          severity: critical
          owner: frontend-platform
        annotations:
          summary: "Journey non-empty response guarantee violated"
          description: "One or more required journey responses became empty."
  - name: error_rate_alerts
    interval: 30s
    rules:
      - alert: HighErrorRateLayer1
        expr: |
          sum(rate(http_requests_total{namespace=~"value-fabric.*",service="layer1-ingestion",status=~"5.."}[5m]))
          /
          sum(rate(http_requests_total{namespace=~"value-fabric.*",service="layer1-ingestion"}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
          owner: platform-sre
          layer: layer1
        annotations:
          summary: "Layer 1 error rate elevated"
          description: "Layer 1 ingestion service error rate is above 5% for 5 minutes."
          runbook_url: "https://docs.valuefabric.internal/runbooks/layers/layer1#error-rate"

      - alert: HighErrorRateLayer2
        expr: |
          sum(rate(http_requests_total{namespace=~"value-fabric.*",service="layer2-extraction",status=~"5.."}[5m]))
          /
          sum(rate(http_requests_total{namespace=~"value-fabric.*",service="layer2-extraction"}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
          owner: platform-sre
          layer: layer2
        annotations:
          summary: "Layer 2 error rate elevated"
          description: "Layer 2 extraction service error rate is above 5% for 5 minutes."
          runbook_url: "https://docs.valuefabric.internal/runbooks/layers/layer2#error-rate"

      - alert: HighErrorRateLayer3
        expr: |
          sum(rate(http_requests_total{namespace=~"value-fabric.*",service="layer3-knowledge",status=~"5.."}[5m]))
          /
          sum(rate(http_requests_total{namespace=~"value-fabric.*",service="layer3-knowledge"}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
          owner: platform-sre
          layer: layer3
        annotations:
          summary: "Layer 3 error rate elevated"
          description: "Layer 3 knowledge graph service error rate is above 5% for 5 minutes."
          runbook_url: "https://docs.valuefabric.internal/runbooks/layers/layer3#error-rate"

      - alert: HighErrorRateLayer4
        expr: |
          sum(rate(http_requests_total{namespace=~"value-fabric.*",service="layer4-agents",status=~"5.."}[5m]))
          /
          sum(rate(http_requests_total{namespace=~"value-fabric.*",service="layer4-agents"}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
          owner: platform-sre
          layer: layer4
        annotations:
          summary: "Layer 4 error rate elevated"
          description: "Layer 4 agents service error rate is above 5% for 5 minutes."
          runbook_url: "https://docs.valuefabric.internal/runbooks/layers/layer4#error-rate"

      - alert: HighErrorRateCritical
        expr: |
          (
            sum(rate(http_requests_total{namespace=~"value-fabric.*",status=~"5.."}[5m]))
            /
            sum(rate(http_requests_total{namespace=~"value-fabric.*"}[5m]))
          ) > 0.10
        for: 2m
        labels:
          severity: critical
          owner: platform-sre
        annotations:
          summary: "Critical: platform-wide error rate above 10%"
          description: "Aggregate 5xx rate across all Fabric_4L services exceeds 10% for 2 minutes."
          runbook_url: "https://docs.valuefabric.internal/runbooks/platform/critical-error-rate"

  - name: db_pool_alerts
    interval: 30s
    rules:
      - alert: DatabasePoolHighUtilization
        expr: |
          (
            layer4_db_pool_active_connections / clamp_min(layer4_db_pool_size, 1) > 0.80
          )
          or
          (
            layer5_db_pool_active_connections / clamp_min(layer5_db_pool_size, 1) > 0.80
          )
        for: 10m
        labels:
          severity: warning
          owner: platform-sre
        annotations:
          summary: "Sustained DB pool utilization above 80%"
          description: "Connection pool utilization has stayed above 80% for 10m on Layer 4 and/or Layer 5."
          runbook_url: "https://docs.valuefabric.internal/runbooks/database/pool-utilization"
