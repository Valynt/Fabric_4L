global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'value-fabric'
    replica: '{{.ExternalURL}}'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - 'recording-rules.yml'
  - 'alerting/rules.yml'
  - 'alerting/layer-sli-rules-production.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'layer1-ingestion'
    static_configs:
      - targets: ['layer1-ingestion:8000']
    metrics_path: '/api/v1/ingestion/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  - job_name: 'layer2-extraction'
    static_configs:
      - targets: ['layer2-extraction:8000']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  - job_name: 'layer3-knowledge'
    static_configs:
      - targets: ['layer3-knowledge:8001']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  - job_name: 'layer4-agents'
    static_configs:
      - targets: ['layer4-agents:8000']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  - job_name: 'layer5-ground-truth'
    static_configs:
      - targets: ['layer5-ground-truth:8005']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  - job_name: 'layer6-benchmarks'
    static_configs:
      - targets: ['layer6-benchmarks:8006']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  - job_name: 'blackbox-health'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://layer1-ingestion:8000/health
          - http://layer2-extraction:8000/health
          - http://layer3-knowledge:8003/health
          - http://layer4-agents:8004/health
          - http://layer5-ground-truth:8005/health
          - http://layer6-benchmarks:8006/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: 'blackbox-metrics'
    metrics_path: /probe
    params:
      module: [http_2xx_no_redirect]
    static_configs:
      - targets:
          - http://layer1-ingestion:8000/metrics
          - http://layer2-extraction:8000/metrics
          - http://layer3-knowledge:8003/metrics
          - http://layer4-agents:8004/metrics
          - http://layer5-ground-truth:8005/metrics
          - http://layer6-benchmarks:8006/metrics
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
