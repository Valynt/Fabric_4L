[SERVICE]
    Flush 5
    Log_Level info
    Daemon off

# Tail host logs (Linux only; best-effort on Docker Desktop)
[INPUT]
    Name tail
    Path /var/log/*.log
    Tag host.*
    Parser docker
    Mem_Buf_Limit 5MB
    Skip_Long_Lines On
    Refresh_Interval 10

# Tail Docker container logs (Linux Docker daemon paths only)
[INPUT]
    Name tail
    Path /var/lib/docker/containers/*/*.log
    Tag docker.*
    Parser docker
    Mem_Buf_Limit 5MB
    Skip_Long_Lines On
    Refresh_Interval 10

# Tail Kubernetes containerd logs (K8s with containerd runtime)
[INPUT]
    Name tail
    Path /var/log/containers/*.log
    Tag k8s.*
    Parser cri
    Mem_Buf_Limit 5MB
    Skip_Long_Lines On
    Refresh_Interval 10

# Forward input for cross-platform local dev.
# On Docker Desktop (Windows/Mac) or where /var/lib/docker is inaccessible,
# application containers can use the fluentd Docker log driver or forward
# logs directly to fluent-bit:24224.
[INPUT]
    Name forward
    Listen 0.0.0.0
    Port 24224

[FILTER]
    Name modify
    Match *
    Add cluster local
    Add namespace value-fabric

[PARSER]
    Name cri
    Format regex
    Regex ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
    Time_Key time
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z
    Time_Keep On

[OUTPUT]
    Name loki
    Match *
    Host loki
    Port 3100
    Labels job=fluent-bit,namespace=value-fabric
    Line_Format json
    Drop_Records_On_Error false
