[SERVICE]
    Flush 5
    Log_Level info
    Daemon off

[INPUT]
    Name tail
    Path /var/log/*.log
    Tag host.*
    Parser docker
    Mem_Buf_Limit 5MB
    Skip_Long_Lines On
    Refresh_Interval 10

[INPUT]
    Name tail
    Path /var/lib/docker/containers/*/*.log
    Tag docker.*
    Parser docker
    Mem_Buf_Limit 5MB
    Skip_Long_Lines On
    Refresh_Interval 10

[FILTER]
    Name modify
    Match *
    Add cluster local
    Add namespace value-fabric

[OUTPUT]
    Name loki
    Match *
    Host loki
    Port 3100
    Labels job=fluent-bit,namespace=value-fabric
    Line_Format json
    Drop_Records_On_Error false
