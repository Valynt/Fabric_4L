global:
  environment: "production"

image:
  pullPolicy: Always
  # Non-deployable placeholder; production releases must provide the signed image digest.
  digest: "sha256:REQUIRED_SIGNED_IMAGE_DIGEST"

services:
  layer1:
    replicaCount: 3
    resources:
      limits:
        cpu: 2000m
        memory: 4Gi
      requests:
        cpu: 500m
        memory: 1Gi
  layer2:
    replicaCount: 3
    resources:
      limits:
        cpu: 2000m
        memory: 4Gi
      requests:
        cpu: 500m
        memory: 1Gi
  layer3:
    replicaCount: 3
    resources:
      limits:
        cpu: 2000m
        memory: 4Gi
      requests:
        cpu: 500m
        memory: 1Gi
  layer4:
    replicaCount: 5
    resources:
      limits:
        cpu: 4000m
        memory: 8Gi
      requests:
        cpu: 1000m
        memory: 2Gi
  layer5:
    replicaCount: 3
    resources:
      limits:
        cpu: 2000m
        memory: 4Gi
      requests:
        cpu: 500m
        memory: 1Gi
  layer6:
    replicaCount: 3
    resources:
      limits:
        cpu: 2000m
        memory: 4Gi
      requests:
        cpu: 500m
        memory: 1Gi

  api:
    replicaCount: 3
    resources:
      limits:
        cpu: 2000m
        memory: 4Gi
      requests:
        cpu: 500m
        memory: 1Gi

  billing:
    replicaCount: 3
    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 250m
        memory: 512Mi

postgresql:
  enabled: false # Use managed RDS in production

redis:
  enabled: false # Use managed ElastiCache in production

ingress:
  enabled: true
  application:
    host: app.fabric.example.com
  tlsSecretName: fabric-tls
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  api:
    annotations:
      nginx.ingress.kubernetes.io/limit-rps: "40"
      nginx.ingress.kubernetes.io/limit-rpm: "200"

monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 15s
