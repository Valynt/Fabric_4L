global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""
  environment: "dev"
  tenantHeader: "X-Tenant-ID"
  serviceAuthSecret: ""
  jwtSecret: ""

# ─── Shared Configuration ───────────────────────────────────────────────────
image:
  repository: ghcr.io/bmsull560/fabric_4l
  pullPolicy: IfNotPresent
  # Non-deployable placeholder. Override with an immutable release tag for dev/test.
  tag: "REQUIRED_IMAGE_TAG"
  # Production should prefer digest pinning; when set, this takes precedence over tag.
  digest: ""

# ─── Service Account ────────────────────────────────────────────────────────
serviceAccount:
  create: true
  name: ""

# ─── Ingress ────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
  hosts:
    - host: api.fabric.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ─── Services (L1-L7) ───────────────────────────────────────────────────────
services:
  layer1:
    enabled: true
    replicaCount: 2
    port: 8001
    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 250m
        memory: 512Mi
    env:
      OTEL_SERVICE_NAME: layer1-ingestion
      OTEL_SAMPLE_RATIO: "0.01"
      DATABASE_URL: ""
      REDIS_URL: ""
    probes:
      liveness:
        path: /health
        initialDelaySeconds: 30
        periodSeconds: 10
      readiness:
        path: /ready
        initialDelaySeconds: 10
        periodSeconds: 5

  layer2:
    enabled: true
    replicaCount: 2
    port: 8002
    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 250m
        memory: 512Mi
    env:
      OTEL_SERVICE_NAME: layer2-extraction
      OTEL_SAMPLE_RATIO: "0.01"
      DATABASE_URL: ""
    probes:
      liveness:
        path: /health
        initialDelaySeconds: 30
        periodSeconds: 10
      readiness:
        path: /ready
        initialDelaySeconds: 10
        periodSeconds: 5

  layer3:
    enabled: true
    replicaCount: 2
    port: 8003
    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 250m
        memory: 512Mi
    env:
      OTEL_SERVICE_NAME: layer3-knowledge
      OTEL_SAMPLE_RATIO: "0.01"
      DATABASE_URL: ""
      NEO4J_URI: ""
    probes:
      liveness:
        path: /health
        initialDelaySeconds: 30
        periodSeconds: 10
      readiness:
        path: /ready
        initialDelaySeconds: 10
        periodSeconds: 5

  layer4:
    enabled: true
    replicaCount: 2
    port: 8004
    resources:
      limits:
        cpu: 2000m
        memory: 4Gi
      requests:
        cpu: 500m
        memory: 1Gi
    env:
      OTEL_SERVICE_NAME: layer4-agents
      OTEL_SAMPLE_RATIO: "0.01"
      DATABASE_URL: ""
      REDIS_URL: ""
    probes:
      liveness:
        path: /health
        initialDelaySeconds: 60
        periodSeconds: 10
      readiness:
        path: /ready
        initialDelaySeconds: 20
        periodSeconds: 5

  layer5:
    enabled: true
    replicaCount: 2
    port: 8005
    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 250m
        memory: 512Mi
    env:
      OTEL_SERVICE_NAME: layer5-ground-truth
      OTEL_SAMPLE_RATIO: "0.01"
      DATABASE_URL: ""
    probes:
      liveness:
        path: /health
        initialDelaySeconds: 30
        periodSeconds: 10
      readiness:
        path: /ready
        initialDelaySeconds: 10
        periodSeconds: 5

  layer6:
    enabled: true
    replicaCount: 2
    port: 8006
    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 250m
        memory: 512Mi
    env:
      OTEL_SERVICE_NAME: layer6-benchmarks
      OTEL_SAMPLE_RATIO: "0.01"
      DATABASE_URL: ""
      NEO4J_URI: ""
    probes:
      liveness:
        path: /health
        initialDelaySeconds: 30
        periodSeconds: 10
      readiness:
        path: /ready
        initialDelaySeconds: 10
        periodSeconds: 5

  api:
    enabled: true
    replicaCount: 2
    port: 8000
    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 250m
        memory: 512Mi
    env:
      OTEL_SERVICE_NAME: api-gateway
      OTEL_SAMPLE_RATIO: "0.01"
      DATABASE_URL: ""
      REDIS_URL: ""
    probes:
      liveness:
        path: /health
        initialDelaySeconds: 30
        periodSeconds: 10
      readiness:
        path: /ready
        initialDelaySeconds: 10
        periodSeconds: 5

  billing:
    enabled: true
    replicaCount: 2
    port: 8007
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 256Mi
    env:
      OTEL_SERVICE_NAME: billing
      OTEL_SAMPLE_RATIO: "0.01"
      DATABASE_URL: ""
    probes:
      liveness:
        path: /health
        initialDelaySeconds: 30
        periodSeconds: 10
      readiness:
        path: /ready
        initialDelaySeconds: 10
        periodSeconds: 5

# ─── PostgreSQL Sub-chart ───────────────────────────────────────────────────
postgresql:
  enabled: true
  auth:
    username: "fabric"
    database: "fabric"
    existingSecret: ""
    secretKeys:
      adminPasswordKey: "postgres-password"
      userPasswordKey: "password"
  primary:
    persistence:
      enabled: true
      size: 50Gi
      storageClass: ""
    resources:
      limits:
        cpu: 2000m
        memory: 4Gi
      requests:
        cpu: 500m
        memory: 1Gi

# ─── Redis Sub-chart ────────────────────────────────────────────────────────
redis:
  enabled: true
  architecture: replication
  auth:
    enabled: true
    existingSecret: ""
  master:
    persistence:
      enabled: true
      size: 10Gi
  replica:
    replicaCount: 2

# ─── Monitoring ──────────────────────────────────────────────────────────────
monitoring:
  enabled: true
  serviceMonitor:
    enabled: false
    interval: 30s
