global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""
  environment: "dev"
  tenantHeader: "X-Tenant-ID"
  serviceAuthSecret: ""
  jwtSecret: ""

# ─── Shared Configuration ───────────────────────────────────────────────────
image:
  repository: ghcr.io/bmsull560/fabric_4l
  pullPolicy: IfNotPresent
  # Non-deployable placeholder. Override with an immutable release tag for dev/test.
  tag: "REQUIRED_IMAGE_TAG"
  # Production should prefer digest pinning; when set, this takes precedence over tag.
  digest: ""

# ─── Service Account ────────────────────────────────────────────────────────
serviceAccount:
  create: true
  name: ""

# ─── Same-origin application edge ──────────────────────────────────────────
ingress:
  enabled: true
  className: "nginx"
  application:
    host: app.fabric.local
  tlsSecretName: ""
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  api:
    externalPrefix: /api/v1
    upstreamPrefix: /v1
    annotations:
      nginx.ingress.kubernetes.io/use-regex: "true"
      nginx.ingress.kubernetes.io/rewrite-target: /v1/$2
      nginx.ingress.kubernetes.io/proxy-body-size: "50m"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
      nginx.ingress.kubernetes.io/enable-cors: "true"
      nginx.ingress.kubernetes.io/auth-url: http://oauth2-proxy.value-fabric.svc.cluster.local:4180/oauth2/auth
      nginx.ingress.kubernetes.io/auth-signin: https://$host/oauth2/start?rd=$escaped_request_uri
      nginx.ingress.kubernetes.io/auth-response-headers: X-Auth-Request-User,X-Auth-Request-Email,Authorization
      nginx.ingress.kubernetes.io/limit-rps: "20"
      nginx.ingress.kubernetes.io/limit-rpm: "100"
      nginx.ingress.kubernetes.io/limit-connections: "10"
      nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
  frontend:
    externalPrefix: /

# ─── Services (L1-L7) ───────────────────────────────────────────────────────
services:
  layer1:
    enabled: true
    replicaCount: 2
    port: 8001
    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 250m
        memory: 512Mi
    env:
      OTEL_SERVICE_NAME: layer1-ingestion
      OTEL_SAMPLE_RATIO: "0.01"
      DATABASE_URL: ""
      REDIS_URL: ""
    probes:
      liveness:
        path: /health
        initialDelaySeconds: 30
        periodSeconds: 10
      readiness:
        path: /ready
        initialDelaySeconds: 10
        periodSeconds: 5

  layer2:
    enabled: true
    replicaCount: 2
    port: 8002
    resources:
