# ─── PostgreSQL Sub-chart ───────────────────────────────────────────────────
postgresql:
  enabled: true
  auth:
    username: "fabric"
    database: "fabric"
    existingSecret: ""
    secretKeys:
      adminPasswordKey: "postgres-password"
      userPasswordKey: "password"
  primary:
    persistence:
      enabled: true
      size: 50Gi
      storageClass: ""
    resources:
      limits:
        cpu: 2000m
        memory: 4Gi
      requests:
        cpu: 500m
        memory: 1Gi

# ─── Redis Sub-chart ────────────────────────────────────────────────────────
redis:
  enabled: true
  architecture: replication
  auth:
    enabled: true
    existingSecret: ""
  master:
    persistence:
      enabled: true
      size: 10Gi
  replica:
    replicaCount: 2

# ─── Monitoring ──────────────────────────────────────────────────────────────
monitoring:
  enabled: true
  serviceMonitor:
    enabled: false
    interval: 30s
