apiVersion: v1
kind: Secret
metadata:
  name: {{include "fabric.fullname" .}}-secrets
  labels:
    {{- include "fabric.labels" . | nindent 4 }}
type: Opaque
data:
  {{- with .Values.global.serviceAuthSecret }}
  service-auth-secret: {{. | b64enc | quote}}
  {{- else }}
  {{- fail "global.serviceAuthSecret must be provided (auto-generated secrets are disabled to prevent invalidating existing tokens on upgrade)" }}
  {{- end }}
  {{- with .Values.global.jwtSecret }}
  jwt-secret: {{. | b64enc | quote}}
  {{- else }}
  {{- fail "global.jwtSecret must be provided (auto-generated secrets are disabled to prevent invalidating existing sessions on upgrade)" }}
  {{- end }}
