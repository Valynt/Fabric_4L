services:
  # Local-dev override only. Never include this file in staging/production compose runs.
  # SECURITY WARNING: Override VAULT_DEV_ROOT_TOKEN_ID in your .env file.
  # Never use the default 'root' token in any shared or long-lived environment.
  # See docs/DEVELOPMENT.md for setup instructions.
  vault:
    profiles:
      - local-dev
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=${VAULT_DEV_ROOT_TOKEN_ID:-root}
    command: server -dev -dev-root-token-id=${VAULT_DEV_ROOT_TOKEN_ID:-root} -dev-listen-address=0.0.0.0:8200
