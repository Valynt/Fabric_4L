# =============================================================================
# Value Fabric — Local Development Stack (PARTIAL)
# =============================================================================
# ⚠️  CRITICAL SECURITY WARNING ⚠️
# NEVER copy this file or its environment variables to production.
# Production deployments must use docker-compose.prod.yml with proper authentication.
# See SECURITY.md for production security requirements.
#
# THIS IS A PARTIAL DEVELOPMENT STACK ONLY.
# Services included: frontend + Layer 2 (extraction) + Layer 2.5 (signal refinery)
# + Layer 4 (agents) + infrastructure (postgres, neo4j, redis, minio, keycloak).
# Layers 1, 3, 5, 6, and 7 are NOT defined here. For the full platform, use
# infra/compose/docker-compose.full.yml.
#
# Dev auth bypass has been permanently removed (P0-008).
# Local development uses Keycloak OIDC or test JWT tokens.
#
# Usage (with Infisical — recommended):
#   pnpm env:dev                    # generates .env.generated
#   docker compose -f infra/compose/docker-compose.dev.yml --env-file .env.generated up --build
#
# Usage (legacy manual .env):
#   docker compose -f infra/compose/docker-compose.dev.yml up --build
#
# Services:
#   - frontend:    Vite dev server (http://localhost:3001)
#   - layer2:      FastAPI extraction API (http://localhost:8002)
#   - layer2-5:    Signal refinery API (http://localhost:8007)
#   - layer4:      FastAPI agents API (http://localhost:8004)
#   - postgres:    Relational store (localhost:5432)
#   - neo4j:       Knowledge graph (http://localhost:7474)
#   - redis:       Cache + pub/sub (localhost:6379)
#   - minio:       S3-compatible object storage (localhost:9000)
#   - keycloak:    OIDC identity provider (http://localhost:8080)
#
# Authentication is handled via Keycloak OIDC or test JWT tokens.
# =============================================================================

x-build-args: &build-args
  BASE_IMAGE: ${BASE_IMAGE:-}

services:
  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  postgres:
    extends:
      file: ./docker-compose.base.yml
      service: postgres-base
    container_name: vf-dev-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: valuefabric
      POSTGRES_MULTIPLE_DATABASES: ingestion,ground_truth,layer4_agents,signal_refinery
      # pgAudit configuration (P0-5: Database Audit Logging)
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - dev-postgres-data:/var/lib/postgresql/data
      - ../../scripts/db/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
      - ../../k8s/base/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    ports:
      - "5432:5432"
    networks:
      - dev-network
    command:
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
    # Healthcheck inherited from infra/compose/docker-compose.base.yml

  # PgBouncer connection pool (P1-1: Connection Pooling)
  pgbouncer:
    image: pgbouncer/pgbouncer:latest
    container_name: vf-dev-pgbouncer
    environment:
      - DATABASES_HOST=postgres
      - DATABASES_PORT=5432
      - DATABASES_USER=postgres
      - DATABASES_PASSWORD=postgres
    volumes:
      - ../../k8s/base/userlist.example.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - "6432:6432"
    networks:
      - dev-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "true"]
      interval: 10s
      timeout: 5s
      retries: 3

  # MinIO S3-compatible object storage (local development)
  minio:
    extends:
      file: ./docker-compose.base.yml
      service: minio-base
    container_name: vf-dev-minio
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio-data:/data
    networks:
      - dev-network
    # Healthcheck inherited from infra/compose/docker-compose.base.yml

  redis:
    extends:
      file: ./docker-compose.base.yml
      service: redis-base
    container_name: vf-dev-redis
    ports:
      - "6379:6379"
    volumes:
      - dev-redis-data:/data
    networks:
      - dev-network
    # Healthcheck inherited from infra/compose/docker-compose.base.yml

  neo4j:
    extends:
      file: ./docker-compose.base.yml
      service: neo4j-base
    container_name: vf-dev-neo4j
    environment:
      NEO4J_AUTH: neo4j/devpassword
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - dev-neo4j-data:/data
    networks:
      - dev-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474/browser || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Identity — Keycloak (OIDC/SAML broker)
  # ---------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: vf-dev-keycloak
    command: ["start-dev", "--import-realm"]

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_PROXY: edge
      # Realm import
      KC_REALM_IMPORT_LOCATION: /opt/keycloak/data/import/fabric-realm.json
    ports:
      - "8080:8080"
    volumes:
      - dev-keycloak-data:/opt/keycloak/data
      - ../../infra/keycloak/fabric-realm.json:/opt/keycloak/data/import/fabric-realm.json:ro
      - ../../infra/keycloak/validate-realm-seed.py:/opt/keycloak/bin/validate-realm-seed.py:ro
    networks:
      - dev-network
    healthcheck:
      test: ["CMD-SHELL", "true"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Backend — Layer 2 Extraction
  # ---------------------------------------------------------------------------
  layer2:
    build:
      context: ../../services/layer2-extraction
      dockerfile: ./Dockerfile
    container_name: vf-dev-layer2
    ports:
      - "8002:8000"
    environment:
      - ENVIRONMENT=development
      # JWT secret for local dev (Keycloak OIDC or test tokens)
      - JWT_SECRET=dev-local-secret-do-not-use-in-production-minimum-32-chars
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/extraction
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - LOG_LEVEL=debug
      - PYTHONPATH=/app:/app/src:/app/value_fabric:/app/canonical
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dev-network
    volumes:
      - ../../services/layer2-extraction/src:/app/src:ro
      - ../../packages/shared/src/value_fabric:/app/value_fabric:ro
      - ../../packages/platform-contract/src/python/canonical:/app/canonical:ro
    command: >
      uvicorn src.layer2_extraction.api.main:app
      --host 0.0.0.0
      --port 8000
      --log-level debug
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Layer 2 Celery Worker
  layer2-worker:
    build:
      context: ../../services/layer2-extraction
      dockerfile: ./Dockerfile
    container_name: vf-dev-layer2-worker
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/extraction
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
      - LOG_LEVEL=debug
      - PYTHONPATH=/app:/app/src:/app/value_fabric:/app/canonical
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dev-network
    volumes:
      - ../../services/layer2-extraction/src:/app/src:ro
      - ../../packages/shared/src/value_fabric:/app/value_fabric:ro
      - ../../packages/platform-contract/src/python/canonical:/app/canonical:ro
    command: >
      celery -A layer2_extraction.shared.tasks worker
      --loglevel=info
      --concurrency=2

  # ---------------------------------------------------------------------------
  # Backend — Layer 2.5 Signal Refinery
  # ---------------------------------------------------------------------------
  layer2-5:
    build:
      context: ../../services/layer2-5-signal-refinery
      dockerfile: ./Dockerfile
    container_name: vf-dev-layer2-5
    ports:
      - "8007:8007"
    environment:
      - ENVIRONMENT=development
      # JWT secret for local dev (Keycloak OIDC or test tokens)
      - JWT_SECRET=dev-local-secret-do-not-use-in-production-minimum-32-chars
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/signal_refinery
      - LAYER2_BASE_URL=http://layer2:8000
      - LAYER3_BASE_URL=http://layer3:8000
      - LAYER4_BASE_URL=http://layer4:8000
      - LOG_LEVEL=debug
      - PYTHONPATH=/app:/app/src:/app/value_fabric
    depends_on:
      postgres:
        condition: service_healthy
      layer2:
        condition: service_healthy
    networks:
      - dev-network
    volumes:
      - ../../services/layer2-5-signal-refinery/src:/app/src:ro
      - ../../packages/shared/src/value_fabric:/app/value_fabric:ro
    command: >
      uvicorn layer2_5_signal_refinery.api.main:app
      --host 0.0.0.0
      --port 8007
      --log-level debug

  # ---------------------------------------------------------------------------
  # Backend — Layer 4 Agents API
  # ---------------------------------------------------------------------------
  layer4:
    build:
      context: ../../services/layer4-agents
      dockerfile: ./Dockerfile
      args: *build-args
    container_name: vf-dev-layer4
    ports:
      - "8004:8000"
    environment:
      - ENVIRONMENT=development
      # Local dev uses Keycloak OIDC or test JWT tokens for authentication
      - ALLOW_INSECURE_SERVICE_HTTP_IN_DEVELOPMENT=true
      - CORS_ORIGINS=${CORS_ORIGINS}
      # JWT secret (required by jwt.py at import time, but bypassed at runtime)
      - JWT_SECRET=dev-local-secret-do-not-use-in-production-minimum-32-chars
      - CREDENTIALS_MASTER_KEY=dev-local-encryption-key-32-chars-minimum
      - API_KEY_HMAC_SECRET=dev-local-hmac-secret-32-chars-minimum
      - DEFAULT_TENANT_ID=dev-tenant
      - SERVICE_AUTH_SECRET=dev-local-service-auth-secret-32-chars
      # Database
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/layer4_agents
      - CHECKPOINT_DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/ground_truth
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      # Neo4j
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=devpassword
      # LLM — set your real key in .env.dev or leave blank for heuristic mode
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o}
      - THESYS_API_KEY=${THESYS_API_KEY:-}
      # Keycloak OIDC configuration (dev mode — validates against Keycloak JWKS)
      - OIDC_ISSUER=http://keycloak:8080/realms/fabric
      - OIDC_AUDIENCE=fabric-api
      - OIDC_JWKS_URL=http://keycloak:8080/realms/fabric/protocol/openid-connect/certs
      # Inter-layer URLs (point to self for now — stubs return 503)
      - LAYER4_LAYER1_API_URL=http://layer4:8000
      - LAYER4_LAYER2_API_URL=http://layer4:8000
      - LAYER4_LAYER3_API_URL=http://layer4:8000
      - LAYER4_LAYER5_API_URL=http://layer4:8000
      - LAYER5_GROUND_TRUTH_URL=http://layer4:8000
      - LAYER4_LAYER6_API_URL=http://layer4:8000
      - LAYER6_BENCHMARKS_URL=http://layer4:8000
      # L2.5 Signal Refinery
      - LAYER2_5_BASE_URL=http://layer2-5:8007
      # Logging
      - LOG_LEVEL=debug
      # layer4_agents package lives under /app/src; src.api shim re-exports it
      - PYTHONPATH=/app:/app/src
      # Disable Infisical in local dev
      - INFISICAL_CLIENT_ID=
      - INFISICAL_CLIENT_SECRET=
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      layer2-5:
        condition: service_started
    networks:
      - dev-network
    volumes:
      # Mount source for hot-reload (optional — remove for production-like testing)
      - ../../packages/shared/src/value_fabric:/app/value_fabric
      - ../../packages/platform-contract/src/python/canonical:/app/canonical
      - ../../services/layer4-agents/src:/app/src:ro
    command: >
      uvicorn layer4_agents.api.main:app
      --host 0.0.0.0
      --port 8000
      --log-level debug
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # API Gateway — Clerk token verification and tenant resolution
  # ---------------------------------------------------------------------------
  api-gateway:
    build:
      context: ../..
      dockerfile: ./services/api/Dockerfile
    container_name: vf-dev-api-gateway
    ports:
      - "8008:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/ingestion
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - DEBUG=false
      - ENVIRONMENT=development
      - TESTING=false
      - SECRET_KEY=${SECRET_KEY:-${JWT_SECRET}}
      - SERVICE_AUTH_SECRET=dev-local-service-auth-secret-32-chars
      - JWT_ALGORITHM=${JWT_ALGORITHM}
      - ALGORITHM=${JWT_ALGORITHM}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - LAYER4_API_BASE_URL=http://layer4:8000
      - AUTH_PROVIDER=${AUTH_PROVIDER}
      - CLERK_ISSUER=${CLERK_ISSUER}
      - CLERK_JWT_AUDIENCE=${CLERK_JWT_AUDIENCE}
      - CLERK_AUTHORIZED_PARTIES=${CLERK_AUTHORIZED_PARTIES}
      - CLERK_JWKS_URL=${CLERK_JWKS_URL}
      - CLERK_PINNED_JWT_PEM=${CLERK_PINNED_JWT_PEM}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - CLERK_WEBHOOK_SIGNING_SECRET=${CLERK_WEBHOOK_SIGNING_SECRET}
      - CLERK_WEBHOOK_RATE_LIMIT_PER_MINUTE=${CLERK_WEBHOOK_RATE_LIMIT_PER_MINUTE}
      - FABRIC_AUTH_SIGNING_KEY=${FABRIC_AUTH_SIGNING_KEY}
      - FABRIC_AUTH_SIGNING_KID=${FABRIC_AUTH_SIGNING_KID}
      - FABRIC_AUTH_PUBLIC_KEYS=${FABRIC_AUTH_PUBLIC_KEYS}
      - FABRIC_AUTH_VERIFYING_PUBLIC_KEY=${FABRIC_AUTH_VERIFYING_PUBLIC_KEY}
      - FABRIC_AUTH_ISSUER=${FABRIC_AUTH_ISSUER}
      - FABRIC_AUTH_AUDIENCE=${FABRIC_AUTH_AUDIENCE}
      - FABRIC_AUTH_ENVELOPE_TTL_SECONDS=${FABRIC_AUTH_ENVELOPE_TTL_SECONDS}
      - PYTHONPATH=/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      layer4:
        condition: service_healthy
    networks:
      - dev-network
    volumes:
      - ../../services/api/app:/app/app:ro
      - ../../packages/shared/src/value_fabric:/app/value_fabric:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Frontend — Vite Dev Server
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ../..
      dockerfile: ./apps/web/Dockerfile.dev
    container_name: vf-dev-frontend
    ports:
      - "3001:3001"
    environment:
      - VITE_APP_ENV=development
      - VITE_API_BASE=/api/v1
      - VITE_L1_PREFIX=/ingest
      - VITE_L2_PREFIX=/extract
      - VITE_L2_5_PREFIX=/signals
      - VITE_L3_PREFIX=/graph
      - VITE_L4_PREFIX=/agents
      - VITE_L5_PREFIX=/truths
      - VITE_L6_PREFIX=/benchmarks
      - VITE_L7_PREFIX=/billing
      - VITE_ENABLE_CRM_SYNC=false
      - VITE_CRM_PROVIDER=salesforce
      - VITE_CRM_API_PROXY=/api/crm
      - VITE_ENABLE_C1_REPORTS=false
      - VITE_USE_MOCKS=false
      - VITE_ENABLE_SSE=true
      - VITE_ENABLE_MOCK_FALLBACK=true
      - VITE_ENABLE_QUERY_DEVTOOLS=true
      - VITE_API_LOG_LEVEL=debug
      - VITE_ENABLE_MOCK_AUTH=true
      - VITE_AUTH_PROVIDER=${VITE_AUTH_PROVIDER}
      - VITE_CLERK_PUBLISHABLE_KEY=${VITE_CLERK_PUBLISHABLE_KEY}
      - VITE_CLERK_SIGN_IN_URL=${VITE_CLERK_SIGN_IN_URL}
      - VITE_CLERK_SIGN_UP_URL=${VITE_CLERK_SIGN_UP_URL}
      - VITE_CLERK_AFTER_SIGN_IN_URL=${VITE_CLERK_AFTER_SIGN_IN_URL}
      - VITE_CLERK_AFTER_SIGN_UP_URL=${VITE_CLERK_AFTER_SIGN_UP_URL}
      - VITE_CLERK_JWT_TEMPLATE=${VITE_CLERK_JWT_TEMPLATE}
      # Vite dev-server proxy targets must use Docker service names (not localhost,
      # which inside this container resolves to the frontend itself). Only L2 and L4
      # are defined in this partial stack; missing layers rely on mock fallback.
      - VITE_PROXY_L2_URL=http://layer2:8000
      - VITE_PROXY_L4_URL=http://layer4:8000
      - VITE_PROXY_API_GATEWAY_URL=http://api-gateway:8000
    volumes:
      - ../../apps/web:/workspace/apps/web
      - ../../packages/platform-contract:/workspace/packages/platform-contract:ro
      - /workspace/apps/web/node_modules
    networks:
      - dev-network
    depends_on:
      api-gateway:
        condition: service_healthy
      layer4:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3001', (res) => process.exit(res.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  dev-postgres-data:
  dev-redis-data:
  dev-neo4j-data:
  dev-keycloak-data:
  minio-data:

networks:
  dev-network:
    driver: bridge
