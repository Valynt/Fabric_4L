# Production-like database readiness stack.
#
# This compose file intentionally boots only durable backing stores needed by
# the gate-database-live target: PostgreSQL, Redis, Neo4j, Qdrant,
# MinIO, and Alertmanager. Host ports are offset from the normal dev stack to
# reduce collisions during release validation.

services:
  postgres:
    image: postgres:16-alpine
    container_name: vf-db-readiness-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: vf_postgres_admin_readiness_secret
      DB_READINESS_APP_USER: vf_migrator
      DB_READINESS_APP_PASSWORD: vf_migrator_readiness_secret
      POSTGRES_DB: fabric_readiness
      POSTGRES_MULTIPLE_DATABASES: >-
        fabric_readiness,
        layer1_ingestion_readiness,
        layer2_extraction_readiness,
        signal_refinery_readiness,
        layer4_agents_readiness,
        ground_truth_readiness,
        api_readiness,
        postgres_restore_readiness
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      - "55432:5432"
    volumes:
      - db-readiness-postgres-data:/var/lib/postgresql/data
      - ../../scripts/db/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/01-init-multiple-dbs.sh:ro
      - ../../scripts/db/init-db-readiness-roles.sh:/docker-entrypoint-initdb.d/99-init-db-readiness-roles.sh:ro
      - ../../k8s/base/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command:
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fabric_readiness"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - db-readiness-net

  redis:
    image: redis:7-alpine
    container_name: vf-db-readiness-redis
    command: redis-server --requirepass vf_redis_readiness_secret
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "vf_redis_readiness_secret", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - db-readiness-net

  neo4j:
    image: neo4j:5-community
    container_name: vf-db-readiness-neo4j
    environment:
      NEO4J_AUTH: neo4j/vf_neo4j_readiness_secret
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_server_memory_heap_initial__size: "256m"
      NEO4J_server_memory_heap_max__size: "512m"
      NEO4J_server_memory_pagecache_size: "128m"
    ports:
      - "57474:7474"
      - "57687:7687"
    volumes:
      - db-readiness-neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s
    networks:
      - db-readiness-net

  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: vf-db-readiness-qdrant
    ports:
      - "56333:6333"
      - "56334:6334"
    volumes:
      - db-readiness-qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - db-readiness-net

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: vf-db-readiness-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vf_minio_readiness
      MINIO_ROOT_PASSWORD: vf_minio_readiness_secret_32_chars
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - db-readiness-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - db-readiness-net

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: vf-db-readiness-alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "59093:9093"
    volumes:
      - ../../monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9093/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - db-readiness-net

networks:
  db-readiness-net:
    driver: bridge

volumes:
  db-readiness-postgres-data:
  db-readiness-neo4j-data:
  db-readiness-qdrant-data:
  db-readiness-minio-data:
