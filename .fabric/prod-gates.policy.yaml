version: "2.0"
description: >
  Production readiness gate policy for Value Fabric.
  Each profile defines which gates run for a given pipeline context.
  Gates are implemented as Makefile targets and run pytest where applicable.

  Gate classes:
    - blocking:   Must pass. Non-zero exit = release blocked.
    - advisory:   Runs and reports, but failure does not block release.
    - artifact:   Generates artifacts. Must succeed.
    - placeholder: Explicitly not implemented. Blocks release-candidate.

profiles:
  pr-fast:
    description: "Cheap local or PR feedback — no external deps, < 5 min"
    gates:
      - policy
      - lint
      - arch
      - api-contracts
      - auth
      - secrets
      - tenant-isolation
      - security
      - security-broad
      - state
      - summary

  mainline-full:
    description: "Main branch verification — full gate except deploy-specific actions"
    gates:
      - policy
      - lint
      - arch
      - database
      - migrations
      - api-contracts
      - auth
      - secrets
      - backup-restore
      - frontend
      - data-governance
      - compliance
      - tenant-isolation
      - security
      - security-broad
      - chaos
      - smoke
      - state
      - agent
      - obs
      - release-policy
      - summary

  release-candidate:
    description: "Final pre-tag or pre-production decision — full local production release gate"
    gates:
      - policy
      - lint
      - arch
      - database
      - migrations
      - api-contracts
      - auth
      - secrets
      - backup-restore
      - frontend
      - data-governance
      - compliance
      - deployment
      - rollback
      - incident-response
      - launch-blockers
      - tenant-isolation
      - security
      - security-broad
      - chaos
      - smoke
      - state
      - agent
      - obs
      - release-policy
      - sign-manifest
      - summary

gate-definitions:
  policy:
    target: gates-validate-policy
    description: "Validate policy schema, profile existence, and artifact directories"
    class: blocking
    artifact-dir: artifacts/release
    required: true

  lint:
    target: lint-release
    description: "Lint all Python layers with ruff"
    class: blocking
    required: true

  arch:
    target: gate-arch
    description: "Architecture conformance, tenant guards, testability"
    class: blocking
    artifact-dir: artifacts/arch
    required: true

  database:
    target: gate-database
    description: "Database readiness, schema entrypoints, and storage configuration checks"
    class: blocking
    artifact-dir: artifacts/database
    required: true

  migrations:
    target: gate-migrations
    description: "Alembic migration entrypoints and single-head drift prevention"
    class: blocking
    artifact-dir: artifacts/database
    required: true

  api-contracts:
    target: gate-api-contracts
    description: "OpenAPI, platform-contract, and cross-layer API contract conformance"
    class: blocking
    artifact-dir: artifacts/contracts
    required: true

  auth:
    target: gate-auth
    description: "Authentication enforcement, production safety, and realm seed hardening"
    class: blocking
    artifact-dir: artifacts/security
    required: true

  secrets:
    target: gate-secrets
    description: "Secret hygiene across manifests, committed paths, and environment references"
    class: blocking
    artifact-dir: artifacts/security
    required: true

  backup-restore:
    target: gate-backup-restore
    description: "Backup and restore drill coverage for recoverability evidence"
    class: blocking
    artifact-dir: artifacts/backup-restore
    required: true

  frontend:
    target: gate-frontend
    description: "Frontend production verification, type safety, tests, and auth-bypass guardrails"
    class: blocking
    artifact-dir: artifacts/frontend
    required: true

  data-governance:
    target: gate-data-governance
    description: "Data retention, deletion, lineage, and governance control evidence"
    class: blocking
    artifact-dir: artifacts/data-governance
    required: true
    caveat: "Fail-closed until data-governance evidence is consolidated into a dedicated passing production gate."

  compliance:
    target: gate-compliance
    description: "Compliance evidence, policy attestations, and audit-readiness controls"
    class: blocking
    artifact-dir: artifacts/compliance
    required: true
    caveat: "Fail-closed until compliance attestations are implemented as executable release evidence."

  deployment:
    target: gate-deployment
    description: "Production deployment readiness, environment controls, and manifest validation"
    class: blocking
    artifact-dir: artifacts/deployment
    required: true
    caveat: "Fail-closed until deployment validation is fully automated for production release candidates."

  rollback:
    target: gate-rollback
    description: "Rollback plan, tested rollback commands, and downgrade/restore evidence"
    class: blocking
    artifact-dir: artifacts/rollback
    required: true
    caveat: "Fail-closed until rollback drills produce executable evidence for release candidates."

  incident-response:
    target: gate-incident-response
    description: "Incident response runbooks, paging paths, and release-time escalation readiness"
    class: blocking
    artifact-dir: artifacts/incident-response
    required: true
    caveat: "Fail-closed until incident-response runbooks and escalation checks are executable gates."

  launch-blockers:
    target: gate-launch-blockers
    description: "Explicit unresolved launch blockers and production go/no-go evidence"
    class: blocking
    artifact-dir: artifacts/release
    required: true
    caveat: "Fail-closed until launch-blocker triage has a machine-checkable zero-open-blockers source of truth."

  tenant-isolation:
    target: gate-tenant-isolation
    description: "Dedicated cross-tenant isolation regression and fail-closed tenant-scope checks"
    class: blocking
    artifact-dir: artifacts/security
    required: true

  security:
    target: gate-security
    description: "Tenant isolation, RLS, auth enforcement, export access"
    class: blocking
    artifact-dir: artifacts/security
    required: true

  security-broad:
    target: gate-security-broad
    description: "Exhaustive legacy security coverage for Broad GA backlog classification"
    class: advisory
    artifact-dir: artifacts/security
    required: false
    caveat: "Legacy broad security suite covers inactive or not-yet-exposed GA endpoints; failures are Broad GA blockers and do not override controlled-pilot release-critical security evidence."

  chaos:
    target: gate-chaos
    description: "Dependency chaos and failure injection"
    class: blocking
    artifact-dir: artifacts/chaos
    required: true

  smoke:
    target: gate-smoke
    description: "Cross-domain smoke tests and golden-path verification"
    class: advisory
    artifact-dir: artifacts/smoke
    required: false
    caveat: "E2E tests require live services. Failures are environment-dependent, not regressions."

  state:
    target: gate-state
    description: "Frontend/backend state alignment, workflow type consistency"
    class: blocking
    artifact-dir: artifacts/state
    required: true

  agent:
    target: gate-agent
    description: "Agent provenance, behavior regression, tool boundaries"
    class: advisory
    artifact-dir: artifacts/agent
    required: false
    caveat: "Agent tests exist but may fail due to missing optional dependencies."

  obs:
    target: gate-obs
    description: "Observability, metrics, health checks, SLO validation"
    class: advisory
    artifact-dir: artifacts/obs
    required: false
    caveat: "Performance tests require live services or k6."

  release-policy:
    target: gate-release-policy
    description: "Release policy compliance, deprecation check, version freeze"
    class: blocking
    artifact-dir: artifacts/release
    required: true

  sign-manifest:
    target: gates-sign-manifest
    description: "Sign artifact manifest with SHA-256"
    class: artifact
    artifact-dir: artifacts/release
    required: true

  summary:
    target: gates-render-summary
    description: "Render release summary with gate results"
    class: artifact
    artifact-dir: artifacts/release
    required: true

deployment_profiles:
  pr-fast:
    ingress_strategy: nginx-path
    required_controls:
      - ingress_strategy
      - cors
      - auth_integration
      - rate_limiting_annotations
  mainline-full:
    ingress_strategy: nginx-path
    required_controls:
      - ingress_strategy
      - cors
      - auth_integration
      - rate_limiting_annotations
  release-candidate:
    ingress_strategy: nginx-path
    required_controls:
      - ingress_strategy
      - cors
      - auth_integration
      - rate_limiting_annotations
