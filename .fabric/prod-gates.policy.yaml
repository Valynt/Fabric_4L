version: "2.0"
description: >
  Production readiness gate policy for Value Fabric.
  Each profile defines which gates run for a given pipeline context.
  Gates are implemented as Makefile targets and run pytest where applicable.

  Gate classes:
    - blocking:   Must pass. Non-zero exit = release blocked.
    - advisory:   Runs and reports, but failure does not block release.
    - artifact:   Generates artifacts. Must succeed.
    - placeholder: Explicitly not implemented. Blocks release-candidate.

profiles:
  pr-fast:
    description: "Cheap local or PR feedback — no external deps, < 5 min"
    gates:
      - policy
      - lint
      - arch
      - security
      - security-broad
      - state
      - summary

  mainline-full:
    description: "Main branch verification — full gate except deploy-specific actions"
    gates:
      - policy
      - lint
      - arch
      - security
      - security-broad
      - chaos
      - smoke
      - state
      - agent
      - obs
      - release-policy
      - summary

  release-candidate:
    description: "Final pre-tag or pre-production decision — full local production release gate"
    gates:
      - policy
      - lint
      - arch
      - security
      - security-broad
      - chaos
      - smoke
      - state
      - agent
      - obs
      - release-policy
      - sign-manifest
      - summary

  production-core:
    description: "Near-term critical production gates for architecture, security, tenant isolation, database, migrations, API contracts, auth, secrets, deployment, and launch blockers"
    gates:
      - policy
      - arch
      - security
      - tenant-isolation
      - database
      - migrations
      - api-contracts
      - auth
      - secrets
      - deployment
      - launch-blockers
      - summary

  tier0-production-safety:
    description: "Tier 0 safety gate for security, tenant isolation, database, backup/restore, secrets, auth, and launch blockers"
    gates:
      - policy
      - security
      - tenant-isolation
      - database
      - backup-restore
      - secrets
      - auth
      - launch-blockers
      - summary

  tier1-beta-readiness:
    description: "Tier 1 beta readiness gate for API contracts, frontend, observability, reliability, deployment, and rollback"
    gates:
      - policy
      - api-contracts
      - frontend
      - obs
      - reliability
      - deployment
      - rollback
      - summary

  tier2-enterprise-readiness:
    description: "Tier 2 enterprise readiness gate for performance, agents, data governance, compliance, and incident response"
    gates:
      - policy
      - performance
      - agents
      - data-governance
      - compliance
      - incident-response
      - summary

gate-definitions:
  policy:
    target: gates-validate-policy
    description: "Validate policy schema, profile existence, and artifact directories"
    class: blocking
    artifact-dir: artifacts/release
    required: true

  lint:
    target: lint-release
    description: "Lint all Python layers with ruff"
    class: blocking
    required: true

  arch:
    target: gate-arch
    description: "Architecture conformance, tenant guards, testability"
    class: blocking
    artifact-dir: artifacts/arch
    required: true

  security:
    target: gate-security
    description: "Tenant isolation, RLS, auth enforcement, export access"
    class: blocking
    artifact-dir: artifacts/security
    required: true

  tenant-isolation:
    target: gate-tenant-isolation
    description: "Tenant isolation and tenant-boundary enforcement"
    class: blocking
    artifact-dir: artifacts/security
    required: true

  database:
    target: gate-database
    description: "Database runtime contract, transaction safety, and persistence checks"
    class: blocking
    artifact-dir: artifacts/database
    required: true

  migrations:
    target: gate-migrations
    description: "Migration entrypoints, Alembic heads, and release migration safety"
    class: blocking
    artifact-dir: artifacts/database
    required: true

  api-contracts:
    target: gate-api-contracts
    description: "API contract drift, shape, and endpoint-family coverage"
    class: blocking
    artifact-dir: artifacts/contracts
    required: true

  auth:
    target: gate-auth
    description: "Auth enforcement, OIDC/JWT behavior, route auth, and bypass guards"
    class: blocking
    artifact-dir: artifacts/security
    required: true

  secrets:
    target: gate-secrets
    description: "Secret hygiene, manifest safety, placeholder scans, and vault bootstrap checks"
    class: blocking
    artifact-dir: artifacts/security
    required: true

  deployment:
    target: gate-deployment
    description: "Deployment manifest, compose, ingress, workload, and environment controls"
    class: blocking
    artifact-dir: artifacts/deployment
    required: true

  launch-blockers:
    target: gate-launch-blockers
    description: "Explicit production launch blockers, placeholder gate policy, and production safety checks"
    class: blocking
    artifact-dir: artifacts/release
    required: true

  backup-restore:
    target: gate-backup-restore
    description: "Backup and restore drill coverage"
    class: blocking
    artifact-dir: artifacts/database
    required: true

  frontend:
    target: gate-frontend
    description: "Frontend unit tests, contract checks, and production build"
    class: blocking
    artifact-dir: artifacts/frontend
    required: true

  reliability:
    target: gate-reliability
    description: "Reliability and dependency-failure behavior"
    class: blocking
    artifact-dir: artifacts/chaos
    required: true

  rollback:
    target: gate-rollback
    description: "GitOps rollout and rollback controls"
    class: blocking
    artifact-dir: artifacts/deployment
    required: true

  performance:
    target: gate-performance
    description: "Performance regression, capacity, and SLO policy tests"
    class: blocking
    artifact-dir: artifacts/performance
    required: true

  agents:
    target: gate-agent
    description: "Enterprise agent provenance, behavior regression, and tool boundaries"
    class: blocking
    artifact-dir: artifacts/agent
    required: true

  data-governance:
    target: gate-data-governance
    description: "Retention, deletion, audit ledger, and governance policies"
    class: blocking
    artifact-dir: artifacts/governance
    required: true

  compliance:
    target: gate-compliance
    description: "Compliance, deprecation, and release-policy evidence"
    class: blocking
    artifact-dir: artifacts/compliance
    required: true

  incident-response:
    target: gate-incident-response
    description: "Incident-response runbook and operational readiness policy"
    class: blocking
    artifact-dir: artifacts/incident-response
    required: true

  security-broad:
    target: gate-security-broad
    description: "Exhaustive legacy security coverage for Broad GA backlog classification"
    class: advisory
    artifact-dir: artifacts/security
    required: false
    caveat: "Legacy broad security suite covers inactive or not-yet-exposed GA endpoints; failures are Broad GA blockers and do not override controlled-pilot release-critical security evidence."

  chaos:
    target: gate-chaos
    description: "Dependency chaos and failure injection"
    class: blocking
    artifact-dir: artifacts/chaos
    required: true

  smoke:
    target: gate-smoke
    description: "Cross-domain smoke tests and golden-path verification"
    class: advisory
    artifact-dir: artifacts/smoke
    required: false
    caveat: "E2E tests require live services. Failures are environment-dependent, not regressions."

  state:
    target: gate-state
    description: "Frontend/backend state alignment, workflow type consistency"
    class: blocking
    artifact-dir: artifacts/state
    required: true

  agent:
    target: gate-agent
    description: "Agent provenance, behavior regression, tool boundaries"
    class: advisory
    artifact-dir: artifacts/agent
    required: false
    caveat: "Agent tests exist but may fail due to missing optional dependencies."

  obs:
    target: gate-obs
    description: "Observability, metrics, health checks, SLO validation"
    class: advisory
    artifact-dir: artifacts/obs
    required: false
    caveat: "Performance tests require live services or k6."

  release-policy:
    target: gate-release-policy
    description: "Release policy compliance, deprecation check, version freeze"
    class: blocking
    artifact-dir: artifacts/release
    required: true

  sign-manifest:
    target: gates-sign-manifest
    description: "Sign artifact manifest with SHA-256"
    class: artifact
    artifact-dir: artifacts/release
    required: true

  summary:
    target: gates-render-summary
    description: "Render release summary with gate results"
    class: artifact
    artifact-dir: artifacts/release
    required: true

deployment_profiles:
  production-core:
    ingress_strategy: nginx-path
    required_controls:
      - ingress_strategy
      - cors
      - auth_integration
      - rate_limiting_annotations
  tier0-production-safety:
    ingress_strategy: nginx-path
    required_controls:
      - ingress_strategy
      - cors
      - auth_integration
      - rate_limiting_annotations
  tier1-beta-readiness:
    ingress_strategy: nginx-path
    required_controls:
      - ingress_strategy
      - cors
      - auth_integration
      - rate_limiting_annotations
  tier2-enterprise-readiness:
    ingress_strategy: nginx-path
    required_controls:
      - ingress_strategy
      - cors
      - auth_integration
      - rate_limiting_annotations
  pr-fast:
    ingress_strategy: nginx-path
    required_controls:
      - ingress_strategy
      - cors
      - auth_integration
      - rate_limiting_annotations
  mainline-full:
    ingress_strategy: nginx-path
    required_controls:
      - ingress_strategy
      - cors
      - auth_integration
      - rate_limiting_annotations
  release-candidate:
    ingress_strategy: nginx-path
    required_controls:
      - ingress_strategy
      - cors
      - auth_integration
      - rate_limiting_annotations
