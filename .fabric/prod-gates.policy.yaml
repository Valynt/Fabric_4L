version: "2.0"
description: >
  Production readiness gate policy for Value Fabric.
  Each profile defines which gates run for a given pipeline context.
  Gates are implemented as Makefile targets and run pytest where applicable.

  Gate classes:
    - blocking:   Must pass. Non-zero exit = release blocked.
    - advisory:   Runs and reports, but failure does not block release.
    - artifact:   Generates artifacts. Must succeed.
    - placeholder: Explicitly not implemented. Blocks release-candidate.

profiles:
  pr-fast:
    description: "Cheap local or PR feedback — no external deps, < 5 min"
    gates:
      - policy
      - lint
      - arch
      - security
      - security-broad
      - state
      - db-consistency
      - summary

  mainline-full:
    description: "Main branch verification — full gate except deploy-specific actions"
    gates:
      - policy
      - lint
      - arch
      - security
      - security-broad
      - chaos
      - smoke
      - state
      - db-consistency
      - database
      - agent
      - obs
      - db-readiness
      - release-policy
      - summary

  release-candidate:
    description: "Final pre-tag or pre-production decision — full local production release gate"
    gates:
      - policy
      - lint
      - arch
      - security
      - tenant-isolation
      - security-broad
      - chaos
      - smoke
      - state
      - db-consistency
      - database
      - agent
      - obs
      - db-readiness
      - release-policy
      - sign-manifest
      - summary


  production-core:
    description: "Near-term critical production gates for architecture, security, tenant isolation, database, migrations, API contracts, auth, secrets, deployment, and launch blockers"
    gates:
      - policy
      - arch
      - security
      - tenant-isolation
      - database-readiness
      - migration-readiness
      - api-contracts
      - auth-readiness
      - secrets-readiness
      - deployment-readiness
      - launch-blockers
      - summary

  tier0-production-safety:
    description: "Tier 0 production safety gates for security, tenant isolation, database, backup/restore, secrets, auth, and launch blockers"
    gates:
      - policy
      - security
      - tenant-isolation
      - database-readiness
      - backup-restore-readiness
      - secrets-readiness
      - auth-readiness
      - launch-blockers
      - summary

  tier1-beta-readiness:
    description: "Tier 1 beta readiness gates for API contracts, frontend, observability, reliability, deployment, and rollback"
    gates:
      - policy
      - api-contracts
      - frontend-readiness
      - obs
      - reliability-readiness
      - deployment-readiness
      - rollback-readiness
      - summary

  tier2-enterprise-readiness:
    description: "Tier 2 enterprise readiness gates for performance, agents, data governance, compliance, and incident response"
    gates:
      - policy
      - performance-readiness
      - agent
      - data-governance-readiness
      - compliance-readiness
      - incident-response-readiness
      - summary

gate-definitions:
  policy:
    target: gates-validate-policy
    description: "Validate policy schema, profile existence, and artifact directories"
    class: blocking
    artifact-dir: artifacts/release
    required: true

  lint:
    target: lint-release
    description: "Lint all Python layers with ruff"
    class: blocking
    required: true

  arch:
    target: gate-arch
    description: "Architecture conformance, tenant guards, testability"
    class: blocking
    artifact-dir: artifacts/arch
    required: true

  tenant-isolation:
    target: security-test-isolation
    description: "Tenant-isolation regression tests for cross-tenant access prevention"
    class: blocking
    artifact-dir: artifacts/security
    required: true

  migration-readiness:
    target: gate-migration-readiness
    description: "Migration entrypoints, head uniqueness, rollback policy, and runtime safety"
    class: blocking
    artifact-dir: artifacts/release/migrations
    required: true

  database-readiness:
    target: gate-database-readiness
    description: "Database production readiness split checks, bootstrap conformance, and DB gate evidence"
    class: blocking
    artifact-dir: artifacts/release/db-readiness
    required: true

  backup-restore-readiness:
    target: gate-backup-restore-readiness
    description: "PostgreSQL backup/restore production-readiness drill"
    class: blocking
    artifact-dir: artifacts/release/backup-restore
    required: true

  api-contracts:
    target: gate-api-contracts
    description: "API and platform contract compliance, tool contracts, and cross-layer contract tests"
    class: blocking
    artifact-dir: artifacts/contracts
    required: true

  auth-readiness:
    target: gate-auth-readiness
    description: "Route auth dependencies, Keycloak seed hygiene, and production auth-bypass prevention"
    class: blocking
    artifact-dir: artifacts/security
    required: true

  secrets-readiness:
    target: gate-secrets-readiness
    description: "Secret hygiene, secret-only manifest references, workflow secret fallback checks, and secret key mappings"
    class: blocking
    artifact-dir: artifacts/security
    required: true

  deployment-readiness:
    target: gate-deployment-readiness
    description: "Deployable image coverage and deployment profile control validation"
    class: blocking
    artifact-dir: artifacts/release/deployment
    required: true

  launch-blockers:
    target: gate-launch-blockers
    description: "Launch governance, readiness consistency, legacy debt, and final launch blocker evidence"
    class: blocking
    artifact-dir: artifacts/release/launch
    required: true

  frontend-readiness:
    target: gate-frontend-readiness
    description: "Frontend beta-readiness verification suite"
    class: blocking
    artifact-dir: artifacts/frontend
    required: true

  reliability-readiness:
    target: gate-reliability-readiness
    description: "Reliability smoke and failure-mode coverage"
    class: blocking
    artifact-dir: artifacts/reliability
    required: true

  rollback-readiness:
    target: gate-rollback-readiness
    description: "Rollback policy and promotion artifact contract validation"
    class: blocking
    artifact-dir: artifacts/release/rollback
    required: true

  performance-readiness:
    target: gate-performance-readiness
    description: "Performance load suite and SLO evaluation"
    class: blocking
    artifact-dir: artifacts/performance
    required: true

  data-governance-readiness:
    target: gate-data-governance-readiness
    description: "Data governance, retention/deletion, and PII protection contracts"
    class: blocking
    artifact-dir: artifacts/governance
    required: true

  compliance-readiness:
    target: gate-compliance-readiness
    description: "Compliance evidence integrity and governance control tests"
    class: blocking
    artifact-dir: artifacts/compliance
    required: true

  incident-response-readiness:
    target: gate-incident-response-readiness
    description: "Incident response runbook ownership, audit resilience, and observability contracts"
    class: blocking
    artifact-dir: artifacts/incident-response
    required: true

  security:
    target: gate-security
    description: "Broad security regression coverage for auth, fail-closed behavior, and launch-readiness security controls"
    class: blocking
    artifact-dir: artifacts/security
    required: true

  tenant-isolation:
    target: gate-tenant-isolation
    description: "Dedicated tenant isolation readiness signal covering cross-tenant API guards, fail-closed tenant boundaries, tenant mismatch rejection, tenant context contracts, and the cross-layer tenant isolation matrix"
    class: blocking
    artifact-dir: artifacts/security
    required: true
    artifact: artifacts/security/tenant-isolation-summary.md

  security-broad:
    target: gate-security-broad
    description: "Exhaustive legacy security coverage for Broad GA backlog classification"
    class: advisory
    artifact-dir: artifacts/security
    required: false
    caveat: "Legacy broad security suite covers inactive or not-yet-exposed GA endpoints; failures are Broad GA blockers and do not override controlled-pilot release-critical security evidence."

  chaos:
    target: gate-chaos
    description: "Dependency chaos and failure injection"
    class: blocking
    artifact-dir: artifacts/chaos
    required: true

  smoke:
    target: gate-smoke
    description: "Cross-domain smoke tests and golden-path verification"
    class: advisory
    artifact-dir: artifacts/smoke
    required: false
    caveat: "E2E tests require live services. Failures are environment-dependent, not regressions."

  state:
    target: gate-state
    description: "Frontend/backend state alignment, workflow type consistency"
    class: blocking
    artifact-dir: artifacts/state
    required: true

  db-consistency:
    target: gate-database
    description: "Canonical PostgreSQL event replay into derived graph, vector, embedding, and object-store projections"
    class: blocking
    artifact-dir: artifacts/release/junit
    required: true

  database:
    target: gate-database
    description: "Static local database readiness gate covering migrations, runtime consistency, governance docs, adapter conformance, and cross-store replay"
    class: blocking
    artifact-dir: artifacts/release/junit
    required: true

  agent:
    target: gate-agent
    description: "Agent provenance, behavior regression, tool boundaries"
    class: advisory
    artifact-dir: artifacts/agent
    required: false
    caveat: "Agent tests exist but may fail due to missing optional dependencies."

  obs:
    target: gate-obs
    description: "Observability, metrics, health checks, SLO validation"
    class: advisory
    artifact-dir: artifacts/obs
    required: false
    caveat: "Performance tests require live services or k6."


  db-readiness:
    target: gate-database
    description: "Static local database readiness: migration topology/entrypoints, runtime consistency, governance docs, adapter conformance, and cross-store replay"
    class: blocking
    artifact-dir: artifacts/release/db-readiness
    required: true

  release-policy:
    target: gate-release-policy
    description: "Release policy compliance, deprecation check, version freeze"
    class: blocking
    artifact-dir: artifacts/release
    required: true

  sign-manifest:
    target: gates-sign-manifest
    description: "Sign artifact manifest with SHA-256"
    class: artifact
    artifact-dir: artifacts/release
    required: true

  summary:
    target: gates-render-summary
    description: "Render release summary with gate results"
    class: artifact
    artifact-dir: artifacts/release
    required: true

deployment_profiles:
  production-core:
    ingress_strategy: nginx-path
    required_controls:
      - ingress_strategy
      - cors
      - auth_integration
      - rate_limiting_annotations
  tier0-production-safety:
    ingress_strategy: nginx-path
    required_controls:
      - ingress_strategy
      - cors
      - auth_integration
      - rate_limiting_annotations
  tier1-beta-readiness:
    ingress_strategy: nginx-path
    required_controls:
      - ingress_strategy
      - cors
      - auth_integration
      - rate_limiting_annotations
  tier2-enterprise-readiness:
    ingress_strategy: nginx-path
    required_controls:
      - ingress_strategy
      - cors
      - auth_integration
      - rate_limiting_annotations
  pr-fast:
    ingress_strategy: nginx-path
    required_controls:
      - ingress_strategy
      - cors
      - auth_integration
      - rate_limiting_annotations
  mainline-full:
    ingress_strategy: nginx-path
    required_controls:
      - ingress_strategy
      - cors
      - auth_integration
      - rate_limiting_annotations
  release-candidate:
    ingress_strategy: nginx-path
    required_controls:
      - ingress_strategy
      - cors
      - auth_integration
      - rate_limiting_annotations
