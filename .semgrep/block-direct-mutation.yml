rules:
  - id: block-direct-graph-mutation
    message: |
      Direct Cypher MERGE/CREATE/DELETE on tenant-owned labels must go through AuditedGraphMutation.
      This bypasses the audited mutation gateway which enforces tenant isolation, audit logging, and metrics.
      Use AuditedGraphMutation.write_relationship(), write_node(), delete_relationship(), or delete_node() instead.
    severity: ERROR
    languages:
      - python
    paths:
      include:
        - "services/layer3-knowledge/**"
        - "services/**"
      exclude:
        - "**/tests/**"
        - "**/test_*.py"
        - "**/conftest.py"
        - "services/layer3-knowledge/src/db/audited_mutation.py"
        - "services/layer3-knowledge/src/layer3_knowledge/db/audited_mutation.py"
        - "services/layer3-knowledge/src/ingestion/neo4jwriters.py"
        - "services/layer3-knowledge/src/schema/**"
        - "services/layer3-knowledge/src/migrations/**"
    metadata:
      category: security
      technology:
        - neo4j
        - cypher
      owasp:
        - A01:2021 - Broken Access Control
      references:
        - https://github.com/neo4j/neo4j
    patterns:
      - pattern-either:
          - pattern-regex: '(?is)\b(MERGE|CREATE|DELETE|DETACH\s+DELETE)\b\s*(?:\([^)]*tenant_id|\bWHERE\b[^;]*\btenant_id|\{[^}]*tenant_id)'
          - pattern-regex: '(?is)\b(MERGE|CREATE)\s*\([a-zA-Z0-9_]*\s*:\s*[a-zA-Z0-9_]+'
          - pattern-regex: '(?is)\b(DELETE|DETACH\s+DELETE)\s+[a-zA-Z0-9_]+'
      - pattern-not-regex: '(?i)\bCREATE\s+(?:CONSTRAINT|INDEX|OR\s+REPLACE\s+INDEX|OR\s+REPLACE\s+CONSTRAINT)\b'
      - pattern-not-regex: '# cypher-mutation-safe:'
      - pattern-not-inside: |
          class AuditedGraphMutation:
            ...
    fix: |
      Replace direct Cypher mutation with AuditedGraphMutation methods:
      - For relationships: mutation.write_relationship(src_id, rel_type, tgt_id, properties)
      - For nodes: mutation.write_node(label, node_id, properties)
      - For deletion: mutation.delete_relationship(src_id, rel_type, tgt_id) or mutation.delete_node(label, node_id)
