# SEC-L3-CYPHER-003: Cypher dynamic construction safety rules.
#
# These rules block PRs that introduce unparameterized or unregistered dynamic
# Cypher query construction in Layer 3 service code.
#
# Enforcement model:
#   UNSAFE  ? blocked by CI; must be refactored before merge
#   SAFE    ? annotated with `# cypher-dynamic-safe: <allowlist/validation rationale>` on the same line
#   UNKNOWN ? treated as UNSAFE until classified
#
# To mark a dynamic query as reviewed and safe, validate against an allowlist and add:
#   query = f"MATCH (n:{label}) ..."  # cypher-dynamic-safe: label from _ALLOWED_TARGET_LABELS

rules:
  # ?? Rule 1: Dynamic Cypher node label interpolation ???????????????????????
  # Detects f-strings, format(), %, and concatenation that embed variables
  # directly into Cypher node patterns (:label).
  - id: cypher-dynamic-label-injection
    paths:
      include:
        - "services/layer3-knowledge/**"
        - "services/**"
      exclude:
        - "**/tests/**"
        - "**/test_*.py"
        - "**/conftest.py"
        - "**/migrations/**"
        - "**/schema/**"
        - "**/db/audited_mutation.py"
    patterns:
      - pattern-regex: '(?im)^.*?\([a-zA-Z0-9_`]*\s*:\s*`?\{[a-zA-Z0-9_.]+\}`?.*$'
      # Must provide verified allowlist/validation provenance in the comment
      - pattern-not-regex: '(?i)#\s*cypher-dynamic-safe:\s*.*(?:allowlist|allowed_|validate|enum|literal|hardcoded|_allowed_target_labels|_allowed_rel_types|sanitized)'
    message: >
      Dynamic Cypher label interpolation detected. Node labels cannot be parameterized
      in Cypher ? they must be validated against an explicit allowlist before interpolation.
      Either use a hardcoded string literal, or validate the variable against an allowlist
      (e.g. _ALLOWED_TARGET_LABELS, validate_cypher_identifier) and annotate with:
        # cypher-dynamic-safe: validated against <ALLOWLIST>
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-943: Improper Neutralization of Special Elements in Data Query Logic"
      sprint_task: SEC-L3-CYPHER-003
      layer: layer3-knowledge

  # ?? Rule 2: Dynamic Cypher relationship type interpolation ????????????????
  # Detects f-strings, format(), %, and concatenation that embed variables
  # into Cypher relationship patterns (-[:rel]->, <-[:rel]-, -[:rel]-).
  - id: cypher-dynamic-rel-type-injection
    paths:
      include:
        - "services/layer3-knowledge/**"
        - "services/**"
      exclude:
        - "**/tests/**"
        - "**/test_*.py"
        - "**/conftest.py"
        - "**/migrations/**"
        - "**/schema/**"
        - "**/db/audited_mutation.py"
    patterns:
      - pattern-regex: '(?im)^.*?(?:<-|-)?\[[a-zA-Z0-9_`]*\s*:\s*`?\{[a-zA-Z0-9_.]+\}`?[^\]]*\](?:->|-)?.*$'
      # Must provide verified allowlist/validation provenance in the comment
      - pattern-not-regex: '(?i)#\s*cypher-dynamic-safe:\s*.*(?:allowlist|allowed_|validate|enum|literal|hardcoded|_allowed_target_labels|_allowed_rel_types|sanitized)'
    message: >
      Dynamic Cypher relationship type interpolation detected. Relationship types
      must be validated against an explicit allowlist (e.g. _ALLOWED_REL_TYPES,
      validate_cypher_identifier) before interpolation, or use a hardcoded literal.
      Annotate reviewed safe uses with:
        # cypher-dynamic-safe: validated against <ALLOWLIST>
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-943: Improper Neutralization of Special Elements in Data Query Logic"
      sprint_task: SEC-L3-CYPHER-003
      layer: layer3-knowledge

  # ?? Rule 3: WHERE clause built from string concatenation ??????????????????
  - id: cypher-dynamic-where-clause
    paths:
      include:
        - "services/layer3-knowledge/**"
        - "services/**"
      exclude:
        - "**/tests/**"
        - "**/test_*.py"
        - "**/conftest.py"
        - "**/migrations/**"
        - "**/schema/**"
        - "**/db/audited_mutation.py"
    patterns:
      - pattern-either:
          - pattern: |
              $WHERE = " AND ".join($CLAUSES)
              ...
              $QUERY = f"... WHERE {$WHERE} ..."
          - pattern: |
              $WHERE = " OR ".join($CLAUSES)
              ...
              $QUERY = f"... WHERE {$WHERE} ..."
          - pattern: |
              $WHERE = " AND ".join($CLAUSES)
              ...
              $FUNC(..., f"... WHERE {$WHERE} ...", ...)
          - pattern: |
              $WHERE = " OR ".join($CLAUSES)
              ...
              $FUNC(..., f"... WHERE {$WHERE} ...", ...)
      - pattern-not-regex: '(?i)#\s*cypher-dynamic-safe:\s*.*(?:allowlist|allowed_|validate|enum|literal|hardcoded|sanitized)'
    message: >
      Dynamic Cypher WHERE clause assembled via string join and interpolated
      into a query. Verify that all elements of the joined list are hardcoded
      string literals (never user-controlled values). If confirmed safe, annotate
      the query line with: # cypher-dynamic-safe: where_clauses are hardcoded literals
    languages: [python]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-943: Improper Neutralization of Special Elements in Data Query Logic"
      sprint_task: SEC-L3-CYPHER-003
      layer: layer3-knowledge

  # ?? Rule 4: SET clause built from list join ????????????????????????????????
  - id: cypher-dynamic-set-clause
    paths:
      include:
        - "services/layer3-knowledge/**"
        - "services/**"
      exclude:
        - "**/tests/**"
        - "**/test_*.py"
        - "**/conftest.py"
        - "**/migrations/**"
        - "**/schema/**"
        - "**/db/audited_mutation.py"
    patterns:
      - pattern-either:
          - pattern: |
              $SET = ", ".join($CLAUSES)
              ...
              $QUERY = f"... SET {$SET} ..."
          - pattern: |
              $SET = ", ".join($CLAUSES)
              ...
              $FUNC(..., f"... SET {$SET} ...", ...)
      - pattern-not-regex: '(?i)#\s*cypher-dynamic-safe:\s*.*(?:allowlist|allowed_|validate|enum|literal|hardcoded|sanitized)'
    message: >
      Dynamic Cypher SET clause assembled via string join and interpolated
      into a query. Verify that all elements are hardcoded string literals.
      If confirmed safe, annotate with: # cypher-dynamic-safe: set_clauses are hardcoded literals
    languages: [python]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-943: Improper Neutralization of Special Elements in Data Query Logic"
      sprint_task: SEC-L3-CYPHER-003
      layer: layer3-knowledge
