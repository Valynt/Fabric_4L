# Canonical machine-readable production-readiness risk register.
#
# SOURCE OF TRUTH RULE (release/v1/launch-contract.yaml):
#   release/v1/*              = intended launch contract
#   production-readiness/*    = canonical risks and decisions (this file)
#   artifacts/release/<sha>/* = observed evidence for one candidate
#
# risk_register.md is the human view of this file and must stay reconciled;
# scripts/release/validate_contract.py fails when a PRR id exists in one file
# but not the other. This file transcribes the 2026-06-15 snapshot in
# risk_register.md and adds release-factory task links. Do not create a second
# register elsewhere (see docs/launch/launch-blocker-register.md history).

schema_version: 1
snapshot_date_utc: "2026-06-15"

risks:
  - id: PRR-001
    area: Security
    severity: P0
    owner: Security Engineering
    status: CLOSED
    risk: >
      A failing security regression, unresolved secret exposure, or weakened
      auth/RBAC control can expose tenant or customer data.
    validation: "make gate-security PASS; make security-smoke; contract lint 0 errors; secret-hygiene pass"
    exit_criteria: Security tests pass and evidence artifacts are attached to the scorecard.

  - id: PRR-002
    area: Tenancy
    severity: P0
    owner: Platform Security
    status: ACCEPTED
    status_note: Pending owner countersignature.
    countersignature: MISSING
    ground_truth_status: PENDING_COUNTERSIGNATURE
    risk: >
      Missing or stale tenant isolation evidence can allow cross-tenant read or
      write regressions to reach production.
    validation: >
      Historical hostile cross-tenant tests 49/49 passed; make security-smoke
      tenant-isolation pass; behavior-readiness route-auth pass; full aggregate
      requires Redis-configured environment.
    exit_criteria: >
      Execute full aggregate gate in CI/staging before removing acceptance;
      retain route tenant propagation evidence.
    tasks: [V1-TENANCY-010, V1-TENANCY-011, V1-TENANCY-012]

  - id: PRR-003
    area: Reliability
    severity: P0
    owner: Platform Engineering
    status: ACCEPTED
    status_note: Pending owner countersignature.
    countersignature: MISSING
    ground_truth_status: PENDING_COUNTERSIGNATURE
    risk: >
      Production-like golden path or core service failures can make launch
      unusable even when isolated checks pass.
    validation: >
      make verify pass; local critical-path smoke; make production-readiness-gate
      pass; full P0 Playwright journey evidence requires configured staging.
    exit_criteria: >
      Launch evidence bundle records passing production-like evidence for core
      GA blockers; accept residual risk only with signed waiver.
    tasks: [V1-GOLDEN-001, V1-GOLDEN-002]

  - id: PRR-004
    area: DR
    severity: P0
    owner: SRE
    status: CLOSED
    risk: Backup existence without restore proof creates unrecoverable launch risk.
    validation: "pnpm ops:backup:verify; pnpm ops:restore:dry-run; pnpm release:rollback:verify"
    exit_criteria: >
      Restore dry-run and rollback verification artifacts are retained. Runtime
      rollback rehearsal remains environment-dependent.

  - id: PRR-005
    area: Release Safety
    severity: P0
    owner: Release Engineering
    status: CLOSED
    risk: >
      Failed release policy, branch protection, immutable image, SBOM, or
      rollback evidence can make launch unsafe.
    validation: "pnpm release:dry-run; pnpm release:rollback:verify"
    exit_criteria: Release dry-run, rollback verification, and deploy evidence artifacts are retained.

  - id: PRR-006
    area: Observability
    severity: P1
    owner: SRE
    status: ACCEPTED
    status_note: Deferred to post-launch / pending owner countersignature.
    countersignature: MISSING
    ground_truth_status: PENDING_COUNTERSIGNATURE
    risk: >
      Missing dashboards, alert metadata, or receiver evidence reduces incident
      detection and response confidence.
    validation: "pnpm test:observability and pnpm lint:logs via make verify; metrics endpoints reachable on L4/L5/L6"
    exit_criteria: >
      Observability tests pass and receiver/dashboard evidence links are added
      to the scorecard in a configured environment; residual risk only with
      signed waiver.
    tasks: [V1-OPS-001]

  - id: PRR-007
    area: Billing
    severity: P1
    owner: Product Engineering
    status: ACCEPTED
    status_note: Scope out if unpaid; pending owner countersignature for paid GA.
    countersignature: MISSING
    ground_truth_status: PENDING_COUNTERSIGNATURE
    risk: >
      Paid launch without metering, entitlement, idempotency, and reconciliation
      evidence risks revenue and customer trust.
    validation: "make production-readiness-gate billing tests pass"
    exit_criteria: >
      Billing regression evidence present locally; paid launch requires live
      provider sandbox or explicit out-of-scope decision.

  - id: PRR-008
    area: Compliance Evidence
    severity: P1
    owner: Compliance Owner
    status: ACCEPTED
    status_note: Pending owner countersignature.
    countersignature: MISSING
    ground_truth_status: PENDING_COUNTERSIGNATURE
    risk: Control evidence without owner review is not auditable for SOC2/ISO-style readiness.
    validation: "make production-readiness-gate audit/config tests pass"
    exit_criteria: >
      Compliance owner signs off and retained evidence location is recorded;
      residual risk only with signed waiver.

  - id: PRR-009
    area: Data Lifecycle
    severity: P1
    owner: Data Platform
    status: CLOSED
    risk: >
      Stale migration, backup, retention, or deletion evidence can create data
      integrity and governance gaps.
    validation: "make db-migrate-check / make check-migration-heads via make verify"
    exit_criteria: Migration and data lifecycle evidence is current and linked from the scorecard.

  - id: PRR-010
    area: Environment-dependent P0 launch certification
    severity: P0
    owner: Release Management + respective owners
    status: ACCEPTED
    status_note: Pending owner countersignature.
    countersignature: MISSING
    ground_truth_status: PENDING_COUNTERSIGNATURE
    risk: >
      P0-001 Playwright journeys and P0-002 rollback rehearsal require a
      configured launch environment. P0-003 enterprise SSO/OIDC is scoped out of
      Core GA (deferred to paid/enterprise GA per
      docs/launch/sso-core-ga-scope-decision.md).
    validation: >
      Local surrogate evidence exists for P0-001/002; SSO scope decision
      recorded in docs/launch/sso-core-ga-scope-decision.md.
    exit_criteria: >
      Execute P0-001/002 certification in a configured environment or complete
      signed waivers; validate enterprise IdP before paid/enterprise GA.
    tasks: [V1-GOLDEN-001, V1-GOLDEN-002]
