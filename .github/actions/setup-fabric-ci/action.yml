name: 'Setup Fabric CI'
description: >
  Install the canonical Python, Node.js, pnpm, and dependency stack used across
  Fabric 4L CI workflows. This composite centralizes version pinning and setup
  steps to reduce duplication and action-version drift.

inputs:
  python-version:
    description: 'Python version to install'
    required: false
    default: '3.11'
  node-version:
    description: 'Node.js version to install'
    required: false
    default: '22.18.0'
  pnpm-version:
    description: 'pnpm version to install'
    required: false
    default: '10.18.1'
  python-dependency-mode:
    description: "Python dependency mode: root-test or none"
    required: false
    default: "root-test"
  install-node-deps:
    description: 'Run pnpm install --frozen-lockfile'
    required: false
    default: 'true'
  working-directory:
    description: 'Working directory for dependency installation'
    required: false
    default: '.'
  cache:
    description: 'Package manager cache (pnpm, pip, or empty to disable)'
    required: false
    default: 'pnpm'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip

    - name: Set up pnpm
      uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      with:
        version: ${{ inputs.pnpm-version }}
        run_install: false

    - name: Set up Node.js
      if: ${{ inputs.cache != '' }}
      uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.cache }}
        cache-dependency-path: ${{ inputs.working-directory == '.' && 'pnpm-lock.yaml' || format('{0}/pnpm-lock.yaml', inputs.working-directory) }}

    - name: Set up Node.js (no cache)
      if: ${{ inputs.cache == '' }}
      uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install Python gate dependencies
      shell: bash
      run: |
        set -euo pipefail
        case "${{ inputs.python-dependency-mode }}" in
          root-test|none) ;;
          *) echo "Unsupported python-dependency-mode: ${{ inputs.python-dependency-mode }}" >&2; exit 1 ;;
        esac

    - name: Install Python gate dependencies
      if: ${{ inputs.python-dependency-mode == 'root-test' }}
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install --require-hashes -r tests/requirements-test.lock
        python -m pip check
    - name: Install pnpm dependencies
      if: ${{ inputs.install-node-deps == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm install --frozen-lockfile

    - name: Summarize Fabric CI setup
      shell: bash
      env:
        PYTHON_VERSION: ${{ inputs.python-version }}
        NODE_VERSION: ${{ inputs.node-version }}
        PNPM_VERSION: ${{ inputs.pnpm-version }}
        PYTHON_DEPENDENCY_MODE: ${{ inputs.python-dependency-mode }}
      run: |
        set -euo pipefail
        actual_python="$(python --version 2>&1)"
        actual_node="$(node --version)"
        actual_pnpm="$(pnpm --version)"
        {
          echo "## Fabric CI setup"
          printf '%s\n' "- Python: ${actual_python} (requested ${PYTHON_VERSION})"
          printf '%s\n' "- Node.js: ${actual_node} (requested ${NODE_VERSION})"
          printf '%s\n' "- pnpm: ${actual_pnpm} (requested ${PNPM_VERSION})"
          printf '%s\n' "- Python dependency mode: ${PYTHON_DEPENDENCY_MODE}"
        } >> "$GITHUB_STEP_SUMMARY"
