name: OpenAPI Drift Check

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'services/**/src/api/**'
      - 'services/**/src/**/routes/**'
      - 'shared/**'
      - 'scripts/export_openapi.py'
      - '.github/workflows/openapi-drift-check.yml'
  push:
    branches: [main, develop]
    paths:
      - 'services/**/src/api/**'
      - 'services/**/src/**/routes/**'
      - 'shared/**'
      - 'scripts/export_openapi.py'

jobs:
  export-openapi:
    name: Export and Validate OpenAPI Specs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        layer:
          - {name: "Layer 1", dir: "layer1-ingestion", file: "layer1-ingestion.json"}
          - {name: "Layer 2", dir: "layer2-extraction", file: "layer2-extraction.json"}
          - {name: "Layer 2.5 Signal Refinery", dir: "layer2-5-signal-refinery", file: "layer2-5-signal-refinery.json"}
          - {name: "Layer 3", dir: "layer3-knowledge", file: "layer3-knowledge.json"}
          - {name: "Layer 4", dir: "layer4-agents", file: "layer4-agents.json"}
          - {name: "Layer 5", dir: "layer5-ground-truth", file: "layer5-ground-truth.json"}
          - {name: "API Gateway", dir: "api", file: "fabric-4l-api.json"}
          - {name: "Layer 7 Billing", dir: "layer7-billing", file: "layer7-billing.json"}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements-test.txt uvicorn \
            opentelemetry-api opentelemetry-sdk opentelemetry-exporter-otlp-proto-http \
            opentelemetry-instrumentation opentelemetry-instrumentation-fastapi
          # Install layer-specific dependencies if present
          pip install -e services/${{matrix.layer.dir}} || true

      - name: Export OpenAPI spec
        run: |
          python scripts/export_openapi.py

      - name: Validate OpenAPI JSON syntax
        run: |
          python -c "
          import json
          import sys
          path = 'contracts/openapi/${{matrix.layer.file}}'
          try:
              with open(path) as f:
                  data = json.load(f)
              print(f'✅ {path} is valid JSON')
              print(f'   Title: {data.get(\"info\", {}).get(\"title\", \"N/A\")}')
              print(f'   Version: {data.get(\"info\", {}).get(\"version\", \"N/A\")}')
              print(f'   Paths: {len(data.get(\"paths\", {}))}')
              sys.exit(0)
          except Exception as e:
              print(f'❌ {path} validation failed: {e}')
              sys.exit(1)
          "

      - name: Check for spec drift
        run: |
          if git diff --name-only | grep -q "contracts/openapi/${{matrix.layer.file}}"; then
            echo "::error::OpenAPI drift detected: contracts/openapi/${{matrix.layer.file}}"
            echo "Drift detected. Please run 'python scripts/export_openapi.py' and commit the changes."
            exit 1
          fi

  openapi-complete:
    name: All OpenAPI Exports Valid
    runs-on: ubuntu-latest
    needs: export-openapi
    if: always()

    steps:
      - name: Check all exports succeeded
        run: |
          echo "OpenAPI export validation complete for all layers"
          # This job ensures all matrix jobs passed before allowing merge

  contract-tests:
    name: Run Contract Tests
    runs-on: ubuntu-latest
    needs: export-openapi

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt
          pip install pytest schemathesis pyyaml jsonschema
          pip install -r requirements.txt || true

      - name: Run contract validation tests (with infra)
        run: |
          bash scripts/run-openapi-contract-tests.sh
        # Hard fail - contract tests must pass
