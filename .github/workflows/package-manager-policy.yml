name: Package Manager Policy

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  enforce-package-manager-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'

      - name: Enforce root package manager policy
        run: node scripts/ci/enforce-package-manager.cjs
