name: Import secrets and variables to Depot CI
on: push

permissions:
  id-token: write
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: depot/setup-action@v1
      - name: Import secrets
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          AWS_TERRAFORM_ROLE_ARN: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          DR_BACKUP_BUCKET: ${{ secrets.DR_BACKUP_BUCKET }}
          DR_IAM_ROLE_ARN: ${{ secrets.DR_IAM_ROLE_ARN }}
          INFISICAL_IDENTITY_ID: ${{ secrets.INFISICAL_IDENTITY_ID }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PROMETHEUS_URL: ${{ secrets.PROMETHEUS_URL }}
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
          SLACK_DR_WEBHOOK: ${{ secrets.SLACK_DR_WEBHOOK }}
          SLACK_WEBHOOK_URL_API_CHANGES: ${{ secrets.SLACK_WEBHOOK_URL_API_CHANGES }}
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_ROLE: ${{ secrets.VAULT_ROLE }}
          VAULT_ROLE_STAGING: ${{ secrets.VAULT_ROLE_STAGING }}
        run: |
          unset DEPOT_TOKEN
          depot ci secrets add AWS_DEPLOY_ROLE_ARN="$AWS_DEPLOY_ROLE_ARN" AWS_TERRAFORM_ROLE_ARN="$AWS_TERRAFORM_ROLE_ARN" DR_BACKUP_BUCKET="$DR_BACKUP_BUCKET" DR_IAM_ROLE_ARN="$DR_IAM_ROLE_ARN" INFISICAL_IDENTITY_ID="$INFISICAL_IDENTITY_ID" NPM_TOKEN="$NPM_TOKEN" PROMETHEUS_URL="$PROMETHEUS_URL" PYPI_API_TOKEN="$PYPI_API_TOKEN" SLACK_DR_WEBHOOK="$SLACK_DR_WEBHOOK" SLACK_WEBHOOK_URL_API_CHANGES="$SLACK_WEBHOOK_URL_API_CHANGES" VAULT_ADDR="$VAULT_ADDR" VAULT_ROLE="$VAULT_ROLE" VAULT_ROLE_STAGING="$VAULT_ROLE_STAGING" --repo Valynt/Fabric_4L
  variables:
    runs-on: ubuntu-latest
    steps:
      - uses: depot/setup-action@v1
      - name: Import variables
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ENFORCE_DEPRECATION_DEBT: ${{ vars.ENFORCE_DEPRECATION_DEBT }}
        run: |
          unset DEPOT_TOKEN
          depot ci vars add AWS_REGION="$AWS_REGION" ENFORCE_DEPRECATION_DEBT="$ENFORCE_DEPRECATION_DEBT" --repo Valynt/Fabric_4L
  cleanup:
    needs: [secrets, variables]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete migration branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expected_branch_pattern='^depot-migrate-secrets-[0123456789bcdfghjklmnpqrstvwxz]{10}$'
          if [[ ! "$GITHUB_REF_NAME" =~ $expected_branch_pattern ]]; then
            echo "Refusing to delete unexpected branch ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${GITHUB_REF_NAME}"
