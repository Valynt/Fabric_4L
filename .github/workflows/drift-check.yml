name: Contract Drift Check

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'services/**/src/api/**'
      - 'services/**/src/**/routes/**'
      - 'services/**/src/**/main.py'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  detect-drift:
    name: Detect OpenAPI Contract Drift
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate workflow command/artifact references
        run: make check-workflow-references

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r tests/requirements-test.lock
          # Install layer dependencies for proper export
          pip install -e services/layer1-ingestion/ --no-deps
          pip install -e services/layer2-extraction/ --no-deps
          pip install -e services/layer3-knowledge/ --no-deps
          pip install -e services/layer4-agents/ --no-deps
          pip install -e services/layer5-ground-truth/ --no-deps

      - name: Check Layer 3 app_monolith shim drift
        run: |
          python3 services/layer3-knowledge/scripts/check_app_monolith_shim_drift.py

      - name: Security regression drift
        run: |
          python3 scripts/ci/check_security_regressions.py --strict

      - name: Deprecation drift
        run: |
          python3 scripts/ci/check_deprecation_drift.py --strict --use-baseline

      - name: Compatibility launch-freeze policy
        run: |
          python3 scripts/ci/check_compatibility_launch_freeze.py --strict

      - name: Shim divergence suite
        run: |
          python3 -m pytest tests/ci/test_shim_divergence.py

      - name: Migration safety drift
        run: |
          python3 scripts/ci/check_migration_safety.py --strict --use-baseline

      - name: Production-readiness language drift
        run: |
          python3 scripts/ci/check_readiness_language.py --strict --use-baseline

      - name: Export current contracts
        run: |
          python scripts/export_openapi.py

      - name: Check for drift
        run: |
          git diff --stat contracts/openapi/
          git diff --exit-code contracts/openapi/ || {
            echo "::error::Contract drift detected! Run 'python scripts/export_openapi.py' locally and commit changes."
            echo "::group::Drift Details"
            git diff contracts/openapi/
            echo "::endgroup::"
            exit 1
          }

      - name: Upload drift artifact (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openapi-drift
          path: |
            contracts/openapi/*.json
            scripts/export_openapi.py
          retention-days: 7
