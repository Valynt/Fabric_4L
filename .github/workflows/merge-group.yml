name: Merge Group

"on":
  merge_group:
    types: [checks_requested]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  aggregate-checks:
    name: Merge Group Aggregate Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install workflow validation dependencies
        run: python -m pip install --require-hashes -r tests/requirements-test.lock

      - name: Validate workflow target and artifact references
        run: make check-workflow-references

      - name: Validate workflow ownership registry
        run: make check-workflow-registry
