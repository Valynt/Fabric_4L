name: Chaos Smoke (Informational)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chaos-smoke-informational:
    name: chaos-smoke-informational
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: pip install pytest pytest-asyncio httpx
      - name: Run chaos smoke suite
        run: scripts/ci/run_chaos_smoke.sh

  chaos-smoke-required-ready-marker:
    name: chaos-smoke-required-ready-marker
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Enable this job and remove continue-on-error from chaos-smoke-informational once flakes are resolved."
