name: Zero Trust Validation

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    # Change-scoping: zero-trust static checks inspect runtime code, infra
    # manifests, and the check scripts themselves. Docs-only PRs skip; the
    # nightly schedule and push-to-main runs remain unscoped as the safety
    # net (cadence gates belong on the calendar, not the per-PR path).
    paths:
      - "services/**"
      - "apps/**"
      - "packages/**"
      - "k8s/**"
      - "infra/**"
      - "monitoring/**"
      - ".github/**"
      - "scripts/**"
      - "config/**"
      - "Makefile"
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *" # Nightly at 03:00 UTC
  workflow_dispatch:

concurrency:
  # Cancel only an obsolete run of this same workflow/ref. A global
  # feature-branch group lets activity on an unrelated PR cancel required gates.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Opt into Node.js 24 for GitHub Actions
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  zero-trust-gate:
    name: zero-trust-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Run zero-trust checks
        run: |
          mkdir -p artifacts/zero-trust
          bash scripts/security/zero_trust_checks.sh

      - name: Upload zero-trust evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zero-trust-evidence
          path: artifacts/zero-trust/
          retention-days: 30
