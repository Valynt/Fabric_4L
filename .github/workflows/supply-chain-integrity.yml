name: "Supply Chain Integrity Gate"

"on":
  # NOTE: the `07-supply-chain-integrity` check is REQUIRED by branch protection on
  # main. A paths-filtered required check is never emitted for PRs that touch
  # only unlisted paths, which blocks merging those PRs. The pull_request
  # trigger therefore runs unconditionally.
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # Weekly: Monday 04:00 UTC (full scan of all 6 layers & services)
  # V1-CI-001: merge queue support (Stage 1 shadow; aggregates become
  # required at Stage 3).
  merge_group:
  workflow_call:
    inputs:
      image_tag:
        description: "Image tag to verify"
        required: true
        type: string
      certify_images:
        description: "Require release image SBOM, provenance, and signature controls"
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to verify"
        required: true
        type: string

concurrency:
  # Cancel only an obsolete run of this same workflow/ref. A global
  # feature-branch group lets activity on an unrelated PR cancel required gates.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io
  # Publisher, versions, digest verification, and rotation: docs/supply-chain/CI_TOOLS_SECURITY_SUITE.md
  CI_TOOLS_IMAGE: ghcr.io/valynt/ci-tools/security-suite@sha256:08955de6704e6a9d4536fff1ccd6d0e0a4b3f6fe3ce5b5a28435368d8bd0fe9a
  IMAGE_REPOSITORY: ghcr.io/valynt/fabric_4l
  IMAGE_TAG: ${{ github.sha }}

permissions:
  contents: read
  packages: read
  security-events: write
  actions: read
  id-token: write

jobs:
  # Fail closed before any job starts the centrally managed tools container.
  ci-tools-preflight:
    name: CI Tools Image Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pull image and verify digest and tool versions
        run: |
          set -euo pipefail
          image='${{ env.CI_TOOLS_IMAGE }}'
          expected_digest="${image##*@}"
          docker pull "$image"
          repo_digests="$(docker image inspect --format '{{json .RepoDigests}}' "$image")"
          grep -Fq "@${expected_digest}" <<<"$repo_digests"

          # assert_line must survive `set -e`: a failing container command would
          # otherwise abort the script at the command substitution, before any
          # diagnostic is printed. Capture the exit status explicitly and report
          # execution failures separately from output mismatches.
          assert_line() {
            local command="$1" expected="$2" docker_opts="${3:-}"
            local output status=0
            output=$(docker run --rm $docker_opts "$image" bash -o pipefail -c "$command" 2>&1) || status=$?
            if (( status != 0 )); then
              printf 'COMMAND FAILED: %s\nExit status: %s\nOutput:\n%s\n' "$command" "$status" "$output" >&2
              return 1
            fi
            if ! grep -Fxq -- "$expected" <<<"$output"; then
              printf 'ASSERTION FAILED: %s\nExpected: %s\nGot:\n%s\n' "$command" "$expected" "$output" >&2
              return 1
            fi
          }
          assert_line "grype version | awk -F: '/Version/{gsub(/^[[:space:]]+|[[:space:]]+$/,\"\",\$2); print \$2}'" "0.104.1"
          assert_line "syft version | awk -F: '/Version/{gsub(/^[[:space:]]+|[[:space:]]+$/,\"\",\$2); print \$2}'" "1.30.0"
          assert_line "cosign version | awk -F: '/GitVersion/{gsub(/^[[:space:]]+|[[:space:]]+$/,\"\",\$2); print \$2}'" "v2.5.3"
          assert_line "pip-audit --version" "pip-audit 2.9.0"
          assert_line "pip-licenses --version" "pip-licenses 5.0.0"
          # uv appends a platform suffix ("uv 0.11.6 (x86_64-unknown-linux-gnu)"), so
          # compare only the tool name and version fields, mirroring the awk extraction
          # already used for grype/syft/cosign above.
          assert_line "uv --version | awk '{print \$1, \$2}'" "uv 0.11.6"
          assert_line "python --version" "Python 3.12.10"
          assert_line "node --version" "v22.17.0"
          # pnpm runs through a corepack shim. The image bakes pnpm 10.18.1 into
          # root's corepack cache at build time (corepack prepare --activate)
          # but executes as USER 1001, whose HOME (/) is unwritable — observed:
          # EACCES mkdir '/.cache/node/corepack/v1'. A fresh writable
          # COREPACK_HOME is NOT the fix: with no activated default in it,
          # corepack resolves its built-in latest (observed: pnpm 11.21.0)
          # instead of the baked pin. Probe as root so the activated 10.18.1
          # cache answers offline — this asserts the image's baked content.
          assert_line "pnpm --version" "10.18.1" "--user root"

  # ============================================
  # Source-Level SBOM Scan (runs on every PR/push)
  # ============================================
  source-sbom-scan:
    name: Source SBOM Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No if: condition — runs on pull_request and push as well as workflow_call/dispatch

    strategy:
      fail-fast: false
      matrix:
        layer:
          [
            layer1-ingestion,
            layer2-extraction,
            layer3-knowledge,
            layer4-agents,
            layer5-ground-truth,
            layer6-benchmarks,
          ]

    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Generate source SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: services/${{ matrix.layer }}
          output-file: source-${{ matrix.layer }}-sbom.cdx.json
          format: cyclonedx-json

      - name: Scan source SBOM for vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: source-${{ matrix.layer }}-sbom.cdx.json
          output-format: sarif
          output-file: source-${{ matrix.layer }}-vulns.sarif
          fail-build: false
          severity-cutoff: high

      - name: Prepare baseline worktree for PR comparison
        if: github.event_name == 'pull_request'
        id: base_ref_setup
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          base_worktree="$(mktemp -d)"
          rm -rf "$base_worktree"
          git worktree add --detach "$base_worktree" "origin/${{ github.base_ref }}"
          echo "worktree=$base_worktree" >> "$GITHUB_OUTPUT"

      - name: Generate baseline source SBOM (CycloneDX)
        if: github.event_name == 'pull_request'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: ${{ steps.base_ref_setup.outputs.worktree }}/services/${{ matrix.layer }}
          output-file: baseline-source-${{ matrix.layer }}-sbom.cdx.json
          format: cyclonedx-json

      - name: Scan baseline source SBOM for vulnerabilities
        if: github.event_name == 'pull_request'
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: baseline-source-${{ matrix.layer }}-sbom.cdx.json
          output-format: sarif
          output-file: baseline-source-${{ matrix.layer }}-vulns.sarif
          fail-build: false
          severity-cutoff: high

      - name: Upload source SBOM artifacts
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        if: always()
        with:
          name: source-sbom-${{ matrix.layer }}-${{ github.sha }}
          path: |
            source-${{ matrix.layer }}-sbom.cdx.json
            source-${{ matrix.layer }}-vulns.sarif
          retention-days: 30

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@3ce22a6e336a7fcc318bc58ae1986395bdc83ba7 # v4.35.4
        if: always()
        with:
          sarif_file: source-${{ matrix.layer }}-vulns.sarif
          category: source-sbom-vulns-${{ matrix.layer }}

      - name: Enforce vulnerability policy
        if: always()
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python scripts/ci/run_source_sbom_policy.py compare \
              --current-sarif "source-${{ matrix.layer }}-vulns.sarif" \
              --baseline-sarif "baseline-source-${{ matrix.layer }}-vulns.sarif" \
              --severity high \
              --exceptions config/security/vulnerability-exceptions.yaml \
              --layer "${{ matrix.layer }}"
          else
            python scripts/ci/run_source_sbom_policy.py enforce \
              --sarif "source-${{ matrix.layer }}-vulns.sarif" \
              --severity high \
              --exceptions config/security/vulnerability-exceptions.yaml \
              --layer "${{ matrix.layer }}"
          fi

      - name: Cleanup baseline worktree
        if: always() && github.event_name == 'pull_request' && steps.base_ref_setup.outputs.worktree != ''
        run: git worktree remove --force "${{ steps.base_ref_setup.outputs.worktree }}"

  # ============================================
  # SBOM Generation and Vulnerability Scan (image-based, release only)
  # ============================================
  sbom-scan:
    env:
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
    needs: ci-tools-preflight
    container:
      image: ghcr.io/valynt/ci-tools/security-suite@sha256:08955de6704e6a9d4536fff1ccd6d0e0a4b3f6fe3ce5b5a28435368d8bd0fe9a
    name: SBOM + Vulnerability Scan
    if: inputs.certify_images || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        layer:
          [
            layer1-ingestion,
            layer2-extraction,
            layer3-knowledge,
            layer4-agents,
            layer5-ground-truth,
            layer6-benchmarks,
            apps-web,
          ]

    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Generate CycloneDX SBOM
        run: |
          IMAGE="${{ env.IMAGE_REPOSITORY }}/${{ matrix.layer }}:${{ env.IMAGE_TAG }}"
          syft "$IMAGE" -o cyclonedx-json=${{ matrix.layer }}-sbom.cdx.json
          echo "Generated CycloneDX SBOM for ${{ matrix.layer }}"

      - name: Generate SPDX SBOM
        run: |
          IMAGE="${{ env.IMAGE_REPOSITORY }}/${{ matrix.layer }}:${{ env.IMAGE_TAG }}"
          syft "$IMAGE" -o spdx-json=${{ matrix.layer }}-sbom.spdx.json
          echo "Generated SPDX SBOM for ${{ matrix.layer }}"

      - name: Scan SBOM for vulnerabilities
        run: |
          grype sbom:${{ matrix.layer }}-sbom.cdx.json \
            -o sarif=${{ matrix.layer }}-vulns.sarif \
            --fail-on high
        # BLOCKING: Security vulnerabilities fail the build per CONTRACT_EXCEPTION_POLICY.md
        # Never exemptible: Security scans must not soft-fail

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: sbom-${{ matrix.layer }}-${{ env.IMAGE_TAG }}
          path: |
            ${{ matrix.layer }}-sbom.cdx.json
            ${{ matrix.layer }}-sbom.spdx.json
            ${{ matrix.layer }}-vulns.sarif
          retention-days: 90

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@3ce22a6e336a7fcc318bc58ae1986395bdc83ba7 # v4.35.4
        if: always()
        with:
          sarif_file: ${{ matrix.layer }}-vulns.sarif
          category: sbom-vulns-${{ matrix.layer }}

  # ============================================
  # SLSA Provenance Generation
  # ============================================
  provenance:
    env:
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
    name: SLSA Provenance
    if: inputs.certify_images || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        layer:
          [
            layer1-ingestion,
            layer2-extraction,
            layer3-knowledge,
            layer4-agents,
            layer5-ground-truth,
            layer6-benchmarks,
            apps-web,
          ]

    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Log in to Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate provenance subject
        run: |
          IMAGE="${{ env.IMAGE_REPOSITORY }}/${{ matrix.layer }}:${{ env.IMAGE_TAG }}"
          docker pull "$IMAGE"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE")
          echo "subject=$DIGEST" >> $GITHUB_OUTPUT
          echo "$DIGEST" > ${{ matrix.layer }}-subject.txt

      - name: Generate SLSA provenance
        uses: slsa-framework/slsa-github-generator/actions/generator/generic/create-base64-subjects-from-file@0f8f8ad6f4e4ed25d2d64415f3344f7a48adf578
        with:
          path: "${{ matrix.layer }}-subject.txt"

      - name: Upload provenance
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: provenance-${{ matrix.layer }}-${{ env.IMAGE_TAG }}
          path: "*.intoto.jsonl"
          retention-days: 90

  # ============================================
  # Cosign Signature Verification
  # ============================================
  verify-signatures:
    env:
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
    needs: ci-tools-preflight
    container:
      image: ghcr.io/valynt/ci-tools/security-suite@sha256:08955de6704e6a9d4536fff1ccd6d0e0a4b3f6fe3ce5b5a28435368d8bd0fe9a
    name: Verify Image Signatures
    if: inputs.certify_images || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        layer:
          [
            layer1-ingestion,
            layer2-extraction,
            layer3-knowledge,
            layer4-agents,
            layer5-ground-truth,
            layer6-benchmarks,
            apps-web,
          ]

    steps:
      - name: Verify image signature
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          IMAGE="${{ env.IMAGE_REPOSITORY }}/${{ matrix.layer }}:${{ env.IMAGE_TAG }}"
          cosign verify \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}/.github/workflows/.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "$IMAGE"
          echo "✅ Signature verified for ${{ matrix.layer }}"

  # ============================================
  # Dependency Audit
  # ============================================
  dependency-audit:
    needs: ci-tools-preflight
    container:
      image: ghcr.io/valynt/ci-tools/security-suite@sha256:08955de6704e6a9d4536fff1ccd6d0e0a4b3f6fe3ce5b5a28435368d8bd0fe9a
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Audit Python dependencies
        run: |
          echo "Using pip-audit from pinned CI tools image"
          for dir in services/*/; do
            if [ -f "$dir/pyproject.toml" ]; then
              service_name=$(basename "$dir")
              requirements_file="/tmp/${service_name}-requirements.txt"
              audit_output="${GITHUB_WORKSPACE}/${service_name}-audit.json"
              echo "Auditing $service_name"
              # Use the locked dependency set as the source of truth for auditing.
              # uv.lock is the canonical resolution; pip install -e . can drift
              # due to newly published transitive pins and produces non-reproducible
              # audit results.
              set +e
              (
                if [ -f "$dir/uv.lock" ]; then
                  (
                    cd "$dir" && \
                      command -v uv >/dev/null 2>&1 || { echo "::error::uv is required in the CI tools image for locked dependency auditing"; exit 2; } && \
                      uv --version && \
                      uv export --locked --no-dev --no-editable --no-header --output-file="$requirements_file" && \
                      # uv export emits a standalone '.' line for the local editable root; pip-audit
                      # cannot parse it, so strip it before auditing. Use a temporary file because
                      # sed -i is not portable across BSD (macOS) and GNU (Linux) implementations.
                      grep -v '^\.$' "$requirements_file" > "${requirements_file}.tmp" && \
                      mv "${requirements_file}.tmp" "$requirements_file" && \
                      pip-audit -r "$requirements_file" --format=json --output="$audit_output"
                  )
                else
                  (
                    cd "$dir" && \
                      pip install -e . --quiet 2>/dev/null && \
                      pip freeze > "$requirements_file" && \
                      pip-audit -r "$requirements_file" --format=json --output="$audit_output"
                  )
                fi
              )
              audit_status=$?
              set -e

              python -c 'import json, sys; from pathlib import Path; path = Path(sys.argv[1]); service_name = sys.argv[2]; payload = json.loads(path.read_text(encoding="utf-8")); assert isinstance(payload, dict) and "dependencies" in payload, f"pip-audit JSON for {service_name} is missing the expected dependencies report"' "$audit_output" "$service_name"

              if [ "$audit_status" -gt 1 ]; then
                echo "::error::pip-audit exited with status $audit_status for $service_name"
                exit "$audit_status"
              fi

              if [ "$audit_status" -eq 1 ]; then
                echo "::error::pip-audit reported policy-blocking vulnerabilities for $service_name"
                touch .dependency-findings
              fi
            fi
          done

      - name: Setup pnpm
        run: |
          node --version
          pnpm --version

      - name: Verify frontend lockfile and install from lock graph
        run: |
          LOCK_HASH_BEFORE=$(sha256sum apps/web/pnpm-lock.yaml | awk '{print $1}')
          pnpm --dir apps/web install --frozen-lockfile
          LOCK_HASH_AFTER=$(sha256sum apps/web/pnpm-lock.yaml | awk '{print $1}')
          if [ "$LOCK_HASH_BEFORE" != "$LOCK_HASH_AFTER" ]; then
            echo "::error::apps/web/pnpm-lock.yaml drifted during pnpm install"
            exit 1
          fi

      - name: Compute frontend lockfile hash
        id: web_lock_hash
        run: |
          LOCK_HASH=$(sha256sum apps/web/pnpm-lock.yaml | awk '{print $1}')
          echo "lock_hash=$LOCK_HASH" >> "$GITHUB_OUTPUT"

      - name: Audit Node.js dependencies and verify security backports
        run: >-
          python scripts/ci/check_node_security_backports.py
          --audit
          --project-dir apps/web
          --audit-report-output frontend-audit.json

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: dependency-audit-${{ github.sha }}-${{ steps.web_lock_hash.outputs.lock_hash }}
          path: |
            *-audit.json
            .dependency-findings
          retention-days: 30

      - name: Enforce dependency findings policy
        if: always()
        run: |
          if [ -f .dependency-findings ]; then
            echo "::error::Validated HIGH-or-higher dependency findings are release blocking"
            exit 1
          fi

  # ============================================
  # License Compliance Check
  # ============================================
  license-check:
    needs: ci-tools-preflight
    container:
      image: ghcr.io/valynt/ci-tools/security-suite@sha256:08955de6704e6a9d4536fff1ccd6d0e0a4b3f6fe3ce5b5a28435368d8bd0fe9a
    name: License Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Check Python licenses
        run: |
          set -euo pipefail
          mkdir -p license-reports
          echo "Using pip-licenses from pinned CI tools image"
          for dir in services/*/; do
            if [ -f "$dir/requirements.txt" ]; then
              echo "Checking licenses in $dir"
              service_name="$(basename "$dir")"
              (cd "$dir" && pip-licenses --format=json --output-file="$GITHUB_WORKSPACE/license-reports/${service_name}-licenses.json")
            fi
          done

      - name: Check for forbidden licenses
        run: |
          set -euo pipefail
          python - << 'PY'
          import json
          from pathlib import Path

          forbidden = {"GPL-3.0", "AGPL-3.0", "LGPL-3.0", "SSPL-1.0"}
          violations = []
          for report in Path("license-reports").glob("*-licenses.json"):
              for package in json.loads(report.read_text(encoding="utf-8") or "[]"):
                  license_name = str(package.get("License") or package.get("license") or "")
                  if any(blocked in license_name for blocked in forbidden):
                      violations.append(
                          f"{report.name}: {package.get('Name') or package.get('name')} => {license_name}"
                      )

          if violations:
              print("Forbidden production dependency licenses detected:")
              print("\n".join(violations))
              raise SystemExit(1)

          print("No forbidden production dependency licenses detected.")
          PY

      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: license-report-${{ github.sha }}
          path: license-reports/
          retention-days: 30

  # ============================================
  # Summary Report
  # ============================================
  supply-chain-summary:
    env:
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
    name: Supply Chain Summary
    runs-on: ubuntu-latest
    needs:
      [
        source-sbom-scan,
        sbom-scan,
        provenance,
        verify-signatures,
        dependency-audit,
        license-check,
      ]
    if: always()

    steps:
      - name: Validate prerequisite results
        run: |
          set -euo pipefail
          failed=0
          for result in \
            "${{ needs.source-sbom-scan.result }}" \
            "${{ needs.sbom-scan.result }}" \
            "${{ needs.provenance.result }}" \
            "${{ needs.verify-signatures.result }}" \
            "${{ needs.dependency-audit.result }}" \
            "${{ needs.license-check.result }}"; do
            case "$result" in
              success|skipped) ;;
              *) failed=1 ;;
            esac
          done
          # Release/manual certification requires every image control. PR/push
          # legitimately skip image-only jobs but still require dependency and
          # license controls.
          if [ "${{ needs.dependency-audit.result }}" != "success" ] ||
             [ "${{ needs.license-check.result }}" != "success" ] ||
             [ "${{ needs.source-sbom-scan.result }}" != "success" ]; then
            failed=1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] ||
             [ "${{ inputs.certify_images }}" = "true" ]; then
            for result in \
              "${{ needs.sbom-scan.result }}" \
              "${{ needs.provenance.result }}" \
              "${{ needs.verify-signatures.result }}"; do
              [ "$result" = "success" ] || failed=1
            done
          fi
          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more required supply-chain controls failed or were unexpectedly skipped"
            exit 1
          fi

      - name: Generate summary
        run: |
          cat << 'EOF' > supply-chain-report.md
          # Supply Chain Integrity Report

          ## Build Information
          - **Image Tag**: ${{ env.IMAGE_TAG }}
          - **Commit**: ${{ github.sha }}
          - **Repository**: ${{ github.repository }}

          ## Recorded job results
          - Source SBOM + vulnerability scan: ${{ needs.source-sbom-scan.result }}
          - SBOM + vulnerability scan: ${{ needs.sbom-scan.result }}
          - Provenance: ${{ needs.provenance.result }}
          - Signature verification: ${{ needs.verify-signatures.result }}
          - Dependency audit: ${{ needs.dependency-audit.result }}
          - License compliance: ${{ needs.license-check.result }}

          ## Verification Commands
          ```bash
          # Verify image signature
          cosign verify \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}/.github/workflows/.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            ${{ env.IMAGE_REPOSITORY }}/layer1-ingestion:${{ env.IMAGE_TAG }}

          # Download and verify SBOM
          cosign verify-attestation \
            --type cyclonedx \
            ${{ env.IMAGE_REPOSITORY }}/layer1-ingestion:${{ env.IMAGE_TAG }}
          ```
          EOF

          cat supply-chain-report.md

      - name: Upload report
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: supply-chain-report-${{ env.IMAGE_TAG }}
          path: supply-chain-report.md
          retention-days: 90

      - name: Summary
        run: |
          echo "## Supply Chain Integrity ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Image Signatures | ${{ needs.verify-signatures.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SBOM Generation | ${{ needs.sbom-scan.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SLSA Provenance | ${{ needs.provenance.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Audit | ${{ needs.dependency-audit.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # V1-CI-001 Stage 1 (shadow): stable aggregate supply-chain check.
  # Informational until Stage 3. Summarizes existing jobs only
  # (scripts/ci/aggregate_gate.py).
  # ---------------------------------------------------------------------------
  aggregate-07-supply-chain-integrity:
    name: 07-supply-chain-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - ci-tools-preflight
      - source-sbom-scan
      - sbom-scan
      - provenance
      - verify-signatures
      - dependency-audit
      - license-check
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
      - name: Summarize supply-chain gates
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          # sbom-scan/provenance/verify-signatures certify release images; they
          # only run on dispatch or when certify_images is requested. On PR and
          # merge_group events no release image exists, so the skip is safe.
          SKIPSAFE_IMAGE_CERT: ${{ !(inputs.certify_images || github.event_name == 'workflow_dispatch') }}
        run: |
          python3 scripts/ci/aggregate_gate.py \
            --needs-json "$NEEDS_JSON" \
            --skip-safe sbom-scan=SKIPSAFE_IMAGE_CERT \
            --skip-safe provenance=SKIPSAFE_IMAGE_CERT \
            --skip-safe verify-signatures=SKIPSAFE_IMAGE_CERT
