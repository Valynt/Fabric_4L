name: Repository Hygiene

permissions:
  contents: read
  issues: write
  pull-requests: write

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/dependabot.yml'
      - '.github/CODEOWNERS'
      - '.github/scripts/**'
      - 'monitoring/alerting/rules.yml'
      - 'canonical-paths.yaml'
      - 'scripts/ci/repo_hygiene.py'
      - 'scripts/ci/legacy_path_guard.py'
      - 'scripts/ci/check_layer1_imports.py'
      - 'scripts/ci/check_layer56_shims.py'
      - 'scripts/ci/check_deprecated_namespace_imports.py'
      - 'scripts/ci/check_stale_namespace_dirs.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/dependabot.yml'
      - '.github/CODEOWNERS'
      - '.github/scripts/**'
      - 'monitoring/alerting/rules.yml'
      - 'canonical-paths.yaml'
      - 'scripts/ci/repo_hygiene.py'
      - 'scripts/ci/legacy_path_guard.py'
      - 'scripts/ci/check_layer1_imports.py'
      - 'scripts/ci/check_layer56_shims.py'
      - 'scripts/ci/check_deprecated_namespace_imports.py'
      - 'scripts/ci/check_stale_namespace_dirs.py'
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sunday

concurrency:
  group: repo-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-hygiene:
    name: Canonical Layout & Legacy Path Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Run legacy path guard
        run: python scripts/ci/legacy_path_guard.py --repo-root .

      - name: Ban str(e)/repr(e) exception leaks
        run: python scripts/ci/ban_str_e.py

      - name: Check stale namespace directories
        run: python scripts/ci/check_stale_namespace_dirs.py

      - name: Run repository hygiene validator
        id: hygiene
        run: |
          python scripts/ci/repo_hygiene.py --json | tee artifacts/repo-hygiene.json
          exit ${PIPESTATUS[0]}

      - name: Comment PR with hygiene report (on failure)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let report;
            try {
              report = JSON.parse(fs.readFileSync('artifacts/repo-hygiene.json', 'utf8'));
            } catch (e) {
              report = { passed: false, errors: 1, warnings: 0, violations: [] };
            }
            const lines = [
              '## 🧹 Repository Hygiene Check Failed',
              '',
              `**Errors:** ${report.errors}  |  **Warnings:** ${report.warnings}`,
              '',
              'Active workflows, Dependabot, CODEOWNERS, or monitoring rules reference deleted or obsolete directories.',
              '',
              '### Violations',
              ...report.violations
                .filter(v => v.severity === 'error')
                .map(v => `- **${v.file}:${v.line}** — ${v.message}`),
              '',
              '> See \_canonical-paths.yaml\_ for the canonical layout manifest and migration guidance.'
            ];
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: lines.join('\n')
            });

      - name: Upload hygiene report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo-hygiene-report
          path: artifacts/repo-hygiene.json
          retention-days: 14

  branch-cleanup:
    name: Cleanup Stale Branches
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Delete stale branches and close PRs
        uses: actions/github-script@v7
        with:
          script: |
            const daysToStale = 30;
            const threshold = new Date();
            threshold.setDate(threshold.getDate() - daysToStale);
            
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            
            for (const branch of branches) {
              if (branch.name === 'main' || branch.name.startsWith('release/')) continue;
              
              const commit = await github.rest.repos.getCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: branch.commit.sha,
              });
              const commitDate = new Date(commit.data.commit.committer.date);
              const isStale = commitDate < threshold;
              
              // We also aggressively clean up fully merged branches or abandoned bot branches
              const isBotBranch = branch.name.startsWith('copilot/') || branch.name.startsWith('codex/');
              
              const pulls = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: `${context.repo.owner}:${branch.name}`,
                state: 'open'
              });
              
              // If it has no open PRs and it's a bot branch, or if it's stale, or if it's fully merged
              let isFullyMerged = false;
              const isAbandonedBotBranch = isBotBranch && pulls.data.length === 0;
              const shouldCheckIfFullyMerged = !isStale && !isAbandonedBotBranch;
              
              if (shouldCheckIfFullyMerged) {
                try {
                  const compare = await github.rest.repos.compareCommits({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    base: 'main',
                    head: branch.name
                  });
                  isFullyMerged = compare.data.ahead_by === 0;
                } catch (e) {
                  console.error(`Failed to compare ${branch.name} with main: ${e.message}`);
                }
              }
              
              if (isStale || isFullyMerged || isAbandonedBotBranch) {
                const failedPRs = [];
                for (const pr of pulls.data) {
                  console.log(`Closing PR: ${pr.number} (branch: ${branch.name})`);
                  try {
                    await github.rest.pulls.update({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      pull_number: pr.number,
                      state: 'closed'
                    });
                  } catch (e) {
                    console.error(`Failed to close PR ${pr.number}: ${e.message}`);
                    failedPRs.push(pr.number);
                  }
                }
                
                if (failedPRs.length === 0) {
                  console.log(`Deleting branch: ${branch.name}`);
                  try {
                    await github.rest.git.deleteRef({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      ref: `heads/${branch.name}`
                    });
                  } catch (e) {
                    console.error(`Failed to delete ${branch.name}: ${e.message}`);
                  }
                } else {
                  console.error(`Skipping deletion of branch ${branch.name}. Failed to close PRs: ${failedPRs.join(', ')}`);
                }
              }
            }
