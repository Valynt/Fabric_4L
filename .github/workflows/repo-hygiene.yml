name: Repository Hygiene

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/dependabot.yml'
      - '.github/CODEOWNERS'
      - '.github/scripts/**'
      - 'monitoring/alerting/rules.yml'
      - 'canonical-paths.yaml'
      - 'scripts/ci/repo_hygiene.py'
      - 'scripts/ci/legacy_path_guard.py'
      - 'scripts/ci/check_layer1_imports.py'
      - 'scripts/ci/check_layer56_shims.py'
      - 'scripts/ci/check_deprecated_namespace_imports.py'
      - 'scripts/ci/check_stale_namespace_dirs.py'
      - 'scripts/ci/branch_cleanup_policy.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/dependabot.yml'
      - '.github/CODEOWNERS'
      - '.github/scripts/**'
      - 'monitoring/alerting/rules.yml'
      - 'canonical-paths.yaml'
      - 'scripts/ci/repo_hygiene.py'
      - 'scripts/ci/legacy_path_guard.py'
      - 'scripts/ci/check_layer1_imports.py'
      - 'scripts/ci/check_layer56_shims.py'
      - 'scripts/ci/check_deprecated_namespace_imports.py'
      - 'scripts/ci/check_stale_namespace_dirs.py'
      - 'scripts/ci/branch_cleanup_policy.py'
  workflow_dispatch:
    inputs:
      operation:
        description: Report branch state or delete one fully merged branch
        required: true
        default: report
        type: choice
        options:
          - report
          - delete
      branch:
        description: Exact branch name; required only for delete
        required: false
        type: string
      confirmation:
        description: Exact text DELETE <branch>; required only for delete
        required: false
        type: string
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sunday

concurrency:
  group: repo-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-hygiene:
    name: Canonical Layout & Legacy Path Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Infisical secret scan
        run: |
          curl -1sLf 'https://dl.cloudsmith.io/public/infisical/infisical-cli/setup.deb.sh' | sudo -E bash
          sudo apt-get install -y infisical
          infisical scan --recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Run legacy path guard
        run: python scripts/ci/legacy_path_guard.py --repo-root .

      - name: Ban str(e)/repr(e) exception leaks
        run: python scripts/ci/ban_str_e.py

      - name: Check stale namespace directories
        run: python scripts/ci/check_stale_namespace_dirs.py

      - name: Run repository hygiene validator
        id: hygiene
        run: |
          python scripts/ci/repo_hygiene.py --json | tee artifacts/repo-hygiene.json
          exit ${PIPESTATUS[0]}

      - name: Comment PR with hygiene report (on failure)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let report;
            try {
              report = JSON.parse(fs.readFileSync('artifacts/repo-hygiene.json', 'utf8'));
            } catch (e) {
              report = { passed: false, errors: 1, warnings: 0, violations: [] };
            }
            const lines = [
              '## 🧹 Repository Hygiene Check Failed',
              '',
              `**Errors:** ${report.errors}  |  **Warnings:** ${report.warnings}`,
              '',
              'Active workflows, Dependabot, CODEOWNERS, or monitoring rules reference deleted or obsolete directories.',
              '',
              '### Violations',
              ...report.violations
                .filter(v => v.severity === 'error')
                .map(v => `- **${v.file}:${v.line}** — ${v.message}`),
              '',
              '> See \_canonical-paths.yaml\_ for the canonical layout manifest and migration guidance.'
            ];
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: lines.join('\n')
            });

      - name: Upload hygiene report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo-hygiene-report
          path: artifacts/repo-hygiene.json
          retention-days: 14

  branch-inventory:
    name: Report Branch Inventory
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'report')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate report-only branch inventory
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python scripts/ci/branch_cleanup_policy.py report
          --repo "${{ github.repository }}"
          --output-json artifacts/branch-inventory.json
          --output-markdown docs/governance/branch-inventory.md

      - name: Publish inventory in workflow summary
        run: cat docs/governance/branch-inventory.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload branch inventory
        uses: actions/upload-artifact@v4
        with:
          name: branch-inventory
          path: |
            artifacts/branch-inventory.json
            docs/governance/branch-inventory.md
          retention-days: 30

  manual-branch-delete:
    name: Manually Delete Confirmed Merged Branch
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'delete'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Revalidate and delete exactly one merged branch
        env:
          BRANCH: ${{ inputs.branch }}
          CONFIRMATION: ${{ inputs.confirmation }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python scripts/ci/branch_cleanup_policy.py delete
          --repo "${{ github.repository }}"
          --branch "$BRANCH"
          --confirmation "$CONFIRMATION"
