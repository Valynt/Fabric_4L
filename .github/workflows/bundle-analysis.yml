# Bundle Analysis CI Workflow
# =============================
# Runs on every PR to analyze and report bundle size changes.
#
# - Builds the app with @vitejs/plugin-visualizer
# - Generates stats.json artifact
# - Compares against main branch baseline
# - Comments on PR with size changes table
# - Fails CI if performance-budget.json thresholds exceeded
#
# DESIGN.md § CI: "Performance budgets must be enforced in CI"

name: Bundle Analysis

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "**/vite.config.*"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "**/vite.config.*"

concurrency:
  group: bundle-analysis-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.13.0"
  PNPM_VERSION: "10.18.1"

jobs:
  # ---------------------------------------------------------------------------
  # Build with analyzer and generate stats
  # ---------------------------------------------------------------------------
  analyze:
    name: Analyze Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (PR)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout (main)
        if: github.event_name == 'push'
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install plugin-visualizer
        run: pnpm --filter ./apps/web add -D @vitejs/plugin-visualizer

      - name: Create vite.analyzer.config.ts
        run: |
          cat > apps/web/vite.analyzer.config.ts << 'EOF'
          import { defineConfig, mergeConfig } from 'vite';
          import baseConfig from './vite.config';
          import { visualizer } from 'rollup-plugin-visualizer';

          export default defineConfig(mergeConfig(baseConfig, {
            plugins: [
              visualizer({
                filename: './dist/stats.html',
                json: './dist/stats.json',
                gzipSize: true,
                brotliSize: true,
                open: false,
              }),
            ],
            build: {
              sourcemap: false,
              rollupOptions: {
                output: {
                  manualChunks: {
                    vendor: ['react', 'react-dom'],
                    ui: ['@radix-ui/react-dialog', '@radix-ui/react-dropdown-menu'],
                    query: ['@tanstack/react-query'],
                    router: ['react-router-dom'],
                  },
                },
              },
            },
          }));
          EOF

      - name: Build with analyzer
        run: pnpm --filter ./apps/web exec vite build --config vite.analyzer.config.ts
        env:
          NODE_ENV: production

      - name: Upload stats.json artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundle-stats
          path: |
            apps/web/dist/stats.json
            apps/web/dist/stats.html
          retention-days: 30

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build-bundle
          path: apps/web/dist
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Compare against main branch baseline
  # ---------------------------------------------------------------------------
  compare:
    name: Compare with Main
    runs-on: ubuntu-latest
    needs: [analyze]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Download PR stats
        uses: actions/download-artifact@v4
        with:
          name: bundle-stats
          path: artifacts/pr

      # Fetch main branch stats from the last successful build
      - name: Download main baseline
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: bundle-analysis.yml
          branch: main
          name: bundle-stats
          path: artifacts/main
          if_no_artifact_found: warn

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run bundle analyzer
        id: analyzer
        run: |
          node scripts/ci/bundle-analyzer-ci.js \
            --stats artifacts/pr/stats.json \
            --baseline artifacts/main/stats.json \
            --budget apps/web/performance-budget.json \
            --comment artifacts/bundle-comment.md \
            --verbose
        continue-on-error: true

      - name: Upload analysis results
        uses: actions/upload-artifact@v4
        with:
          name: bundle-analysis
          path: artifacts/bundle-comment.md
          retention-days: 7

      - name: Comment on PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const commentPath = 'artifacts/bundle-comment.md';

            let body;
            if (fs.existsSync(commentPath)) {
              body = fs.readFileSync(commentPath, 'utf-8');
            } else {
              body = '### 📦 Bundle Size Report\n\n⚠️ Unable to generate bundle analysis report.';
            }

            // Find existing bot comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user?.type === 'Bot' &&
              c.body?.includes('Bundle Size Report')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail on budget exceeded
        if: steps.analyzer.outcome == 'failure'
        run: |
          echo "❌ Bundle size exceeds performance budget. See PR comment for details."
          exit 1
