  # Frontend checks
  frontend-checks:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@e0a5a4ff5d1fb2a0f0f1d713d8b623f2c2b5d5b1 # v3
        with:
          version: '10.18.1'

      - name: Set up Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate frontend API types
        run: pnpm run generate:api

      - name: Check generated API type drift
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if ! git diff --quiet packages/platform-contract/src/typescript/generated/ apps/web/src/api/generated/ apps/web/src/types/; then
            echo "❌ Generated API type drift detected."
            node apps/web/scripts/report-generated-type-drift.mjs
          fi
          git diff --exit-code packages/platform-contract/src/typescript/generated/ apps/web/src/api/generated/ apps/web/src/types/

      - name: Type check
        run: pnpm tsc --noEmit

      - name: Lint
        run: pnpm run lint

      - name: Check for unguarded console statements
        run: |
          # Find console.log/console.warn without DEV guard (excluding tests)
          violations=$(grep -rn "console\.log\|console\.warn" apps/web/src/ \
            --include="*.ts" --include="*.tsx" \
            | grep -v "\.test\." \
            | grep -v "\.spec\." \
            | grep -v "import\.meta\.env\.DEV" \
            | grep -v "process\.env\.NODE_ENV" \
            | grep -v "noqa" || true)

          if [ -n "$violations" ]; then
            echo "❌ Found unguarded console statements in production code:"
            echo "$violations"
            echo ""
            echo "Either:"
            echo "  1. Remove the console statement"
            echo "  2. Guard with: if (import.meta.env.DEV) { console.log(...) }"
            exit 1
          fi

          echo "✅ No unguarded console statements found"

      - name: Build
        run: pnpm run build

      - name: Bundle Analysis
        run: pnpm run build:analyze

      - name: Upload bundle report
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        if: always()
        with:
          name: bundle-report
          path: apps/web/dist/stats.html
          retention-days: 14

      - name: Test
        run: pnpm test -- --reporter=junit --outputFile=frontend-junit.xml --reporter=default --coverage

      - name: Critical frontend coverage thresholds
        run: pnpm run test:coverage:critical

      - name: Upload test results
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        if: always()
        with:
          name: test-results-frontend
          path: |
            apps/web/frontend-junit.xml
            apps/web/coverage/
          retention-days: 14

      - name: Upload frontend test report artifact (release evidence)
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        if: always()
        with:
          name: frontend-test-report-${{ github.sha }}
          path: apps/web/frontend-junit.xml
          retention-days: 90
          if-no-files-found: warn

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Accessibility tests (components)
        run: pnpm run test:a11y:components

      - name: Accessibility scan + thresholds (pages)
        env:
          A11Y_REPORT_PATH: ./a11y-report.json
          A11Y_MAX_CRITICAL: "0"
          A11Y_MAX_SERIOUS: "0"
          A11Y_MIN_ROUTES_SCANNED: "4"
        run: |
          pnpm preview --host 127.0.0.1 --port 4173 &
          PREVIEW_PID=$!
          trap "kill $PREVIEW_PID" EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then
              break
            fi
            sleep 1
          done
          pnpm run test:a11y:launch-smoke

      - name: Accessibility keyboard-flow E2E (deep a11y assertions)
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: |
          # Preview server is still running from previous step in the same job
          pnpm run test:a11y:keyboard-flow

      - name: Security audit (GATING)
        run: pnpm audit --audit-level high

      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: frontend-build-failure
          path: apps/web/dist/public/

  # Kubernetes manifest validation (server-side dry-run via kustomize)
  k8s-dry-run:
    name: Kubernetes Dry-Run Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4

      - name: Create Kind cluster
        uses: helm/kind-action@5d5a9f679a1b7e1b6b16a3f86dd6843f6d944a9d # v1

      - name: Set up kubectl
        uses: azure/setup-kubectl@7af7486c9e5f7fdffd86f25d1f43df89c7a7897c # v4

      - name: Install kustomize
        run: |
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz -o kustomize.tar.gz
          echo "3669470b454d865c8184d6bce78df05e977c9aea31c30df3c669317d43bcc7a7  kustomize.tar.gz" | sha256sum -c
          tar -xzf kustomize.tar.gz
          sudo mv kustomize /usr/local/bin/kustomize
          kustomize version

      - name: Server-side dry-run (dev-nginx deployment)
        run: |
          kustomize build k8s/deployments/dev-nginx --load-restrictor=LoadRestrictionsNone | kubectl apply --dry-run=server -f -

      - name: Server-side dry-run (prod-nginx deployment)
        run: |
          kustomize build k8s/deployments/prod-nginx --load-restrictor=LoadRestrictionsNone | kubectl apply --dry-run=server -f -

  # Contract tests — required PR gate, no secrets needed
  contract-checks:
    name: Cross-Layer Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.18.1 --activate

      - name: Install dependencies
        run: |
          pip install -r tests/requirements.txt -r packages/platform-contract/requirements-test.txt

      - name: Install platform contract package dependencies
        working-directory: packages/platform-contract
        run: pnpm install --frozen-lockfile

      - name: Validate Fabric_4L OpenAPI documentation
        run: |
          python -c "import json; json.load(open('contracts/openapi/fabric-4l-api.json'))"
          python scripts/ci/validate_fabric_openapi_docs.py

      - name: Verify schema contract indexes
        run: pnpm test:schema

      - name: Run contract and architecture tests
        run: make contract-tests

      - name: Assert contract suite collection is clean
        run: |
          set -euo pipefail
          python -m pytest tests/contract --collect-only -q -m contract_static -n 0 2>&1 | tee contract-static-collect.log
          python -m pytest tests/contract --collect-only -q -m service_required -n 0 2>&1 | tee contract-service-collect.log
          if rg -n "ERROR collecting|ImportError while importing test module|ModuleNotFoundError" contract-static-collect.log contract-service-collect.log; then
            echo "Contract test collection errors detected."
            exit 1
          fi

      - name: Run frontend OpenAPI/Zod drift check
        run: |
          pnpm --dir apps/web install --frozen-lockfile
          pnpm --dir apps/web run test:contracts

      - name: Run tool contract validation
        run: |
          python scripts/ci/check_tool_contracts.py services/layer4-agents/src/layer4_agents/tools/

      - name: Run endpoint-hook coverage validation
        run: |
          python scripts/ci/check_endpoint_coverage.py \
            --registry apps/web/contracts/endpoint-hook-registry.json \
            --openapi-dir contracts/openapi

      - name: Compatibility debt summary
        run: |
          python scripts/ci/compatibility_debt_summary.py

      - name: Detect changed files
        if: github.event_name == 'pull_request'
        id: changed-files
        uses: tj-actions/changed-files@44f58c6df7a7d39a250c8bca2f8f4a8c07c9a0d6 # v46

      - name: Enforce shim change acknowledgment labels
        if: github.event_name == 'pull_request'
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          python scripts/ci/check_shim_change_ack.py

      - name: Generate compatibility shim usage report
        run: |
          python scripts/ci/shim_usage_report.py --output-dir artifacts/compatibility-debt

      - name: Upload compatibility shim report
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: compatibility-shim-report
          path: artifacts/compatibility-debt/
          retention-days: 90

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: contract-test-results
          path: |
            .pytest_cache/
          retention-days: 7

  runtime-contract-checks:
    name: Runtime Contract Tests (Services Up)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install pytest requests

      - name: Start runtime contract services
        run: |
          export OPENAI_API_KEY=${OPENAI_API_KEY:?set OPENAI_API_KEY}
          export REDIS_PASSWORD=test-redis
          export NEO4J_PASSWORD=test-neo4j
          export JWT_SECRET=${JWT_SECRET:?set JWT_SECRET}
          docker compose up -d postgres redis neo4j layer5-migrate layer5-ground-truth layer1-ingestion layer2-extraction layer3-knowledge layer4-agents

      - name: Wait for L1-L4 health endpoints
        run: |
          python - <<'PY'
          import time
          import requests

          endpoints = {
              "L1": "http://localhost:8001/health",
              "L2": "http://localhost:8002/health",
              "L3": "http://localhost:8003/health",
              "L4": "http://localhost:8004/health",
          }

          deadline = time.time() + 300
          failed = dict(endpoints)

          while time.time() < deadline and failed:
              pending = {}
              for name, url in failed.items():
                  try:
                      response = requests.get(url, timeout=5)
                      if response.status_code == 200:
                          print(f"✅ {name} healthy at {url}")
                      else:
                          pending[name] = url
                          print(f"⏳ {name} not ready: HTTP {response.status_code}")
                  except Exception as exc:
                      pending[name] = url
                      print(f"⏳ {name} not ready: {exc}")
              failed = pending
              if failed:
                  time.sleep(5)

          if failed:
              raise SystemExit(f"Services did not become healthy in time: {failed}")
          PY

      - name: Run runtime contract marker suite
        env:
          RUN_RUNTIME_CONTRACTS: "1"
          L1_URL: http://localhost:8001
          L2_URL: http://localhost:8002
          L3_URL: http://localhost:8003
          L4_URL: http://localhost:8004
        run: |
          pytest tests/contract/test_layer_integration.py -m runtime_contract -v --tb=short

      - name: Upload runtime contract artifacts
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: runtime-contract-test-results
          path: |
            .pytest_cache/
          retention-days: 7

  # Schemathesis — Property-based OpenAPI contract validation
  schemathesis-checks:
    name: Schemathesis Property-Based Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Schemathesis
        run: pip install "schemathesis==3.39.16" "pytest-xdist==3.5.0"

      - name: Run Schemathesis on L1 OpenAPI (static validation)
        run: |
          st check contracts/openapi/layer1-ingestion.json \
            --max-examples 10 \
            --hypothesis-seed 42
        # CONTRACT ENFORCEMENT: L1 now fully implemented - blocking enabled

      - name: Run Schemathesis on L2 OpenAPI (static validation)
        run: |
          st check contracts/openapi/layer2-extraction.json \
            --max-examples 10 \
            --hypothesis-seed 42
        # CONTRACT ENFORCEMENT: L2 now fully implemented - blocking enabled

      - name: Run Schemathesis on L3 OpenAPI (strict validation)
        run: |
          st check contracts/openapi/layer3-knowledge.json \
            --max-examples 50 \
            --hypothesis-seed 42 \
            --checks all

      - name: Run Schemathesis on L4 OpenAPI (strict validation)
        run: |
          st check contracts/openapi/layer4-agents.json \
            --max-examples 50 \
            --hypothesis-seed 42 \
            --checks all

      - name: Upload Schemathesis results
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: schemathesis-results
          path: |
            .schemathesis/
          retention-days: 7

  # Integration tests with Docker — PR-blocking
  integration-checks:
    name: Integration Tests (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Skip on fork PRs (no secrets available)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: '3.11'

      - name: Set up Docker Compose
        run: |
          docker compose version

      # once Infisical project is fully populated and CI validation passes.
      # Target: after first successful Infisical-only CI run.
      - name: Fetch secrets from Infisical
        id: infisical
        uses: Infisical/secrets-action@617d17ca4658c4b8d625927492bb55d41ff87230 # v1
        with:
          method: oidc
          env-slug: dev
          project-slug: fabric4l
          identity-id: ${{ secrets.INFISICAL_IDENTITY_ID }}
          secret-path: /layer2-extraction

      - name: Start core services
        run: |
          export NEO4J_PASSWORD=valuefabric
          docker compose up -d neo4j redis postgres
          # Start layers in background
          docker compose up -d --build layer2-extraction layer3-knowledge layer4-agents

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to be healthy..."
          for i in {1..24}; do
            sleep 5
            # Check if core DB services are responding
            pg_isready -h localhost -p 5432 2>/dev/null && echo "PostgreSQL ready"
            redis-cli -h localhost -p 6379 ping 2>/dev/null && echo "Redis ready"
            # Check Neo4j
            curl -s http://localhost:7474/dbms/health 2>/dev/null && echo "Neo4j ready"
            # If we've waited enough, proceed
            if [ "$i" -ge "12" ]; then
              echo "Proceeding with available services..."
              break
            fi
          done
          docker compose -f docker-compose.full.yml ps
        timeout-minutes: 3

      - name: Run smoke tests
        run: |
          pip install httpx
          python scripts/smoke/production_smoke.py \
            --l2-url http://localhost:8002 \
            --l3-url http://localhost:8003 \
            --l4-url http://localhost:8004 \
            --output-dir artifacts

      - name: Run integration test suite
        run: |
          pip install pytest httpx pytest-asyncio
          # Run the integration tests if they exist
          if [ -d "tests/integration" ]; then
            cd tests/integration
            pytest -v --tb=short
          else
            echo "Integration test folder not found, skipping..."
          fi

      - name: Capture logs on failure
        if: failure()
        run: |
          mkdir -p artifacts/logs
          docker compose -f docker-compose.test.yml logs > artifacts/logs/docker-compose.log || true

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: smoke-report-pr
          path: artifacts/smoke-report-*.json
          retention-days: 7

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: integration-logs
          path: artifacts/logs/
          retention-days: 7

  # Billing + entitlement regression pack and release evidence artifact
  billing-entitlements-regression:
    name: Billing/Entitlements Regression + Evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install test dependencies
        run: |
          pip install pytest

      - name: Run billing/entitlement regression pack
        run: |
          mkdir -p artifacts/release-evidence
          pytest tests/integration/billing_entitlements/ -v --tb=short \
            --junitxml artifacts/release-evidence/billing-entitlements-junit.xml

      - name: Generate launch-checklist evidence
        if: always()
        run: |
          python scripts/ci/generate_billing_evidence.py \
            --junit artifacts/release-evidence/billing-entitlements-junit.xml \
            --out-dir artifacts/release-evidence \
            --test-command "pytest tests/integration/billing_entitlements/ -v --tb=short"

      - name: Upload billing regression evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: launch-checklist-billing-entitlements-evidence
          path: |
            artifacts/release-evidence/billing-entitlements-junit.xml
            artifacts/release-evidence/billing-entitlements-summary.json
            artifacts/release-evidence/billing-entitlements-summary.md
          retention-days: 14

  # Docker image build verification - catches Dockerfile regressions
  docker-compose-config-contract:
    name: Docker Compose Config Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: '3.11'

      - name: Install compose contract dependencies
        run: python -m pip install pyyaml

      - name: Validate Docker Compose config contracts
        run: |
          python scripts/ci/check_docker_compose_config.py \
            --artifact-dir artifacts/docker-compose-config

      - name: Upload Docker Compose config artifacts
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: docker-compose-config-contract
          path: artifacts/docker-compose-config/**
          retention-days: 14

  queue-topology-checks:
    name: Queue Topology
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4
        with:
          node-version: '24'

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.18.1 --activate

      - name: Install queue topology test dependencies
        run: python -m pip install pytest pyyaml

      - name: Run queue topology checks
        run: pnpm test:queues

  docker-build-check:
    name: Docker Image Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        layer: [layer1-ingestion, layer2-extraction, layer3-knowledge, layer4-agents, layer5-ground-truth, layer6-benchmarks, frontend]
        include:
          - layer: layer1-ingestion
            context: services/layer1-ingestion
            dockerfile: ./Dockerfile
          - layer: layer2-extraction
            context: services/layer2-extraction
            dockerfile: ./Dockerfile
          - layer: layer3-knowledge
            context: services/layer3-knowledge
            dockerfile: ./Dockerfile
          - layer: layer4-agents
            context: services/layer4-agents
            dockerfile: ./Dockerfile
          - layer: layer5-ground-truth
            context: services/layer5-ground-truth
            dockerfile: ./Dockerfile
          - layer: layer6-benchmarks
            context: services/layer6-benchmarks
            dockerfile: ./Dockerfile
          - layer: frontend
            context: apps/web
            dockerfile: ./Dockerfile

    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v3

      - name: Build image (no push)
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671 # v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: local/${{ matrix.layer }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BASE_IMAGE=${{ vars.BASE_IMAGE || '' }}
            BUILDER_BASE_IMAGE=${{ vars.BUILDER_BASE_IMAGE || '' }}

      - name: Run Trivy image scan (PR security stage)
        uses: aquasecurity/trivy-action@314ff8b43182423b84c50b1670b0e10f858f2d98
        with:
          image-ref: local/${{ matrix.layer }}:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH

      - name: Generate image SBOM (SPDX JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: local/${{ matrix.layer }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom-${{ matrix.layer }}-${{ github.sha }}.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: sbom-${{ matrix.layer }}-${{ github.sha }}
          path: sbom-${{ matrix.layer }}-${{ github.sha }}.spdx.json
          retention-days: 14

      - name: Verify Dockerfile lint
        uses: hadolint/hadolint-action@9a9b4e40b6f6d0f6d8f7ecba674498b6ff157131 # v3.1.0
        if: matrix.layer != 'frontend'
        with:
          dockerfile: ${{ matrix.context }}/${{ matrix.dockerfile }}
          ignore: DL3008,DL3013

  # Alertmanager configuration validation
  alertmanager-config-check:
    name: Alertmanager Config Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate Alertmanager configuration
        run: |
          chmod +x scripts/ci/validate-alertmanager-config.sh
          ./scripts/ci/validate-alertmanager-config.sh

      - name: Check kustomize build for monitoring manifests
        run: |
          if command -v kubectl &> /dev/null; then
            echo "Testing kustomize build for dev overlay..."
            kubectl kustomize k8s/deployments/dev-nginx 2>&1 | grep -q "alertmanager" && echo "✓ Alertmanager manifests found in kustomize build"
          else
            echo "⚠️ kubectl not available, skipping kustomize validation"
            exit 1  # CONTRACT ENFORCEMENT: kubectl required for CI validation
          fi
  route-auth-gate:
    name: Route Auth Dependency Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: '3.11'

      - name: Install gate dependencies
        run: python -m pip install pyyaml

      - name: Enforce route auth dependency policy
        run: python scripts/ci/check_route_auth_dependencies.py

  tenant-isolation-gate:
    name: Tenant Isolation Gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fabric_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fabric_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/testpassword
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4
        with:
          node-version: '24'

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.18.1 --activate

      - name: Install tenant isolation test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements-test.txt

      - name: Run first-class tenant isolation gate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fabric_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fabric_test
          REDIS_URL: redis://localhost:6379
          NEO4J_URL: bolt://localhost:7687
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: testpassword
        run: pnpm test:isolation

      - name: Upload tenant isolation evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: tenant-isolation-gate-summary
          path: artifacts/tenant-isolation/summary.json
          retention-days: 14

  unified-readiness-gate:
    name: Unified Readiness Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - structural-preflight
      - shared-and-tests-checks
      - layer5-tenant-isolation-regression
      - contract-checks
      - runtime-contract-checks
      - integration-checks
      - k8s-dry-run
      - docker-compose-config-contract
      - queue-topology-checks
      - docker-build-check
      - route-auth-gate
      - tenant-isolation-gate
      - production-readiness-suites
    steps:
      - name: Enforce unified structural/security/tenant/contract/migration/deployment gate
        run: |
          declare -A CHECKS=(
            ["structural-preflight"]="${{ needs.structural-preflight.result }}"
            ["shared-and-tests-checks"]="${{ needs.shared-and-tests-checks.result }}"
            ["layer5-tenant-isolation-regression"]="${{ needs.layer5-tenant-isolation-regression.result }}"
            ["contract-checks"]="${{ needs.contract-checks.result }}"
            ["runtime-contract-checks"]="${{ needs.runtime-contract-checks.result }}"
            ["integration-checks"]="${{ needs.integration-checks.result }}"
            ["k8s-dry-run"]="${{ needs.k8s-dry-run.result }}"
            ["docker-compose-config-contract"]="${{ needs.docker-compose-config-contract.result }}"
            ["queue-topology-checks"]="${{ needs.queue-topology-checks.result }}"
            ["docker-build-check"]="${{ needs.docker-build-check.result }}"
            ["route-auth-gate"]="${{ needs.route-auth-gate.result }}"
            ["tenant-isolation-gate"]="${{ needs.tenant-isolation-gate.result }}"
            ["production-readiness-suites"]="${{ needs.production-readiness-suites.result }}"
          )

          failed=0
          for check in "${!CHECKS[@]}"; do
            result="${CHECKS[$check]}"
            if [[ "$result" != "success" ]]; then
              echo "❌ ${check} => ${result}"
              failed=1
            else
              echo "✅ ${check} => ${result}"
            fi
          done

          if [[ "$failed" -ne 0 ]]; then
            echo "Unified readiness gate failed."
            exit 1
          fi
          echo "Unified readiness gate passed."
