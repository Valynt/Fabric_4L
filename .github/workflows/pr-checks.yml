  docker-build-check:
    needs: change-scope
    if: needs.change-scope.outputs.docker == 'true'
    name: Docker Image Build Verification
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    env:
      BASE_IMAGE: ""
      BUILDER_BASE_IMAGE: ""
    strategy:
      fail-fast: false
      matrix:
        layer:
          [
            layer1-ingestion,
            layer2-extraction,
            layer3-knowledge,
            layer4-agents,
            layer5-ground-truth,
            layer6-benchmarks,
            frontend,
          ]
        include:
          - layer: layer1-ingestion
            context: services/layer1-ingestion
          - layer: layer2-extraction
            context: services/layer2-extraction
          - layer: layer3-knowledge
            context: services/layer3-knowledge
          - layer: layer4-agents
            context: services/layer4-agents
          - layer: layer5-ground-truth
            context: services/layer5-ground-truth
          - layer: layer6-benchmarks
            context: services/layer6-benchmarks
          - layer: frontend
            context: .
            dockerfile: ./apps/web/Dockerfile

    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v3

      # Single-platform build with `load: true` so the image is available locally
      # for the Trivy scan. Multi-platform builds (`linux/amd64,linux/arm64`) are
      # validated in build-deploy.yml, which pushes the multi-arch manifest.
      - name: Build image (no push)
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671 # v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile || format('{0}/Dockerfile', matrix.context) }}
          push: false
          load: true
          tags: local/${{ matrix.layer }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            BUILDER_BASE_IMAGE=${{ env.BUILDER_BASE_IMAGE }}

      - name: Determine if image context changed against base
        id: context-diff
        run: |
          git fetch --no-tags --prune origin "${{ github.base_ref || 'main' }}"
          BASE_REF="origin/${{ github.base_ref || 'main' }}"
          case "${{ matrix.layer }}" in
            frontend)
              CONTEXT_FILES="apps/web/Dockerfile apps/web/package.json pnpm-lock.yaml .nvmrc"
              ;;
            *)
              CONTEXT_FILES="${{ matrix.context }}/Dockerfile ${{ matrix.context }}/pyproject.toml ${{ matrix.context }}/uv.lock ${{ matrix.context }}/requirements.lock"
              ;;
          esac
          CHANGED=$(git diff --name-only "$BASE_REF...HEAD" -- $CONTEXT_FILES || true)
          if [ -n "$CHANGED" ]; then
            echo "context_changed=true" >> "$GITHUB_OUTPUT"
            echo "Image context changed for ${{ matrix.layer }}:" >&2
            echo "$CHANGED" >&2
          else
            echo "context_changed=false" >> "$GITHUB_OUTPUT"
            echo "Image context unchanged for ${{ matrix.layer }}; findings are baseline" >&2
          fi

      - name: Determine Trivy exit code
        id: trivy-exit
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.context-diff.outputs.context_changed }}" = "true" ]; then
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
          else
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Trivy image scan (PR security stage)
        uses: aquasecurity/trivy-action@314ff8b43182423b84c50b1670b0e10f858f2d98
        with:
          image-ref: local/${{ matrix.layer }}:${{ github.sha }}
          format: table
          exit-code: ${{ steps.trivy-exit.outputs.exit_code }}
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Generate image SBOM (SPDX JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: local/${{ matrix.layer }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom-${{ matrix.layer }}-${{ github.sha }}.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: sbom-${{ matrix.layer }}-${{ github.sha }}
          path: sbom-${{ matrix.layer }}-${{ github.sha }}.spdx.json
          retention-days: 14

      - name: Verify Dockerfile lint
        uses: hadolint/hadolint-action@v3.1.0
        if: matrix.layer != 'frontend'
        with:
          dockerfile: ${{ matrix.dockerfile || format('{0}/Dockerfile', matrix.context) }}
          ignore: DL3008,DL3013

  # Alertmanager configuration validation
  alertmanager-config-check:
    needs: change-scope
    if: needs.change-scope.outputs.k8s == 'true'
    name: Alertmanager Config Validation
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate Alertmanager configuration
        run: |
          chmod +x scripts/ci/validate-alertmanager-config.sh
          ./scripts/ci/validate-alertmanager-config.sh

      - name: Install kubectl
        run: |
          set -e
          KUBECTL_VERSION="v1.30.0"
          curl -LO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl
          mkdir -p "$HOME/.local/bin"
          mv kubectl "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install kustomize
        run: |
          url="https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz"
          curl -sSL "$url" -o kustomize.tar.gz
          echo "3669470b454d865c8184d6bce78df05e977c9aea31c30df3c669317d43bcc7a7  kustomize.tar.gz" | sha256sum -c
          tar -xzf kustomize.tar.gz
          sudo mv kustomize /usr/local/bin/kustomize
          kustomize version

      - name: Check kustomize build for monitoring manifests
        run: |
          if command -v kubectl &> /dev/null; then
            echo "Testing kustomize build for dev overlay..."
            kustomize build k8s/deployments/dev-nginx --load-restrictor=LoadRestrictionsNone | grep -q "alertmanager" && \
              echo "✓ Alertmanager manifests found in kustomize build"
          else
            echo "⚠️ kubectl not available, skipping kustomize validation"
            exit 1  # CONTRACT ENFORCEMENT: kubectl required for CI validation
          fi
  route-auth-gate:
