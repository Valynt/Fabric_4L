        run: python scripts/ci/check_route_auth_dependencies.py

  tenant-isolation-gate:
    needs: change-scope
    if: needs.change-scope.outputs.backend == 'true'
    name: Tenant Isolation Gate
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fabric_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fabric_test" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/testpassword
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1" --health-interval 10s
          --health-timeout 5s --health-retries 12

    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4
        with:
          node-version: "22.18.0"

      - name: Enable pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: "10.18.1"
      - name: Install tenant isolation test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r tests/requirements-test.lock

      - name: Configure CI authentication verification keys
        run: |
          printf 'FABRIC_AUTH_PUBLIC_KEYS=%s\n' "$(cat config/ci/fabric_auth_test_public_keys.json)" >> "$GITHUB_ENV"
          echo 'FABRIC_AUTH_MODE=observe' >> "$GITHUB_ENV"

      - name: Run first-class tenant isolation gate
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/shared/src:${{ github.workspace }}/services/layer4-agents/src:${{ github.workspace }}/services/layer5-ground-truth/src:${{ github.workspace }}/services/layer7-billing/src
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fabric_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fabric_test
          REDIS_URL: redis://localhost:6379
          NEO4J_URL: bolt://localhost:7687
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: testpassword
        run: |
          python scripts/ci/run_tenant_isolation_gate.py
          test -f artifacts/tenant-isolation/summary.json

      - name: Upload tenant isolation evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: tenant-isolation-gate-summary
          path: artifacts/tenant-isolation/summary.json
          retention-days: 14

  critical-behaviors-gate:
    needs: change-scope
    if: needs.change-scope.outputs.code == 'true'
    name: Critical Behaviors Gate
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: "3.11"

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r tests/requirements-test.lock

      - name: Run critical behaviors tests (frontend + backend + route auth)
        run: pnpm run test:critical-behaviors

      - name: Run behavior readiness audit (executable, skip-controlled, GREEN/YELLOW/RED)
        run: python scripts/ci/behavior_readiness_audit.py --report artifacts/readiness/behavior-readiness-audit.json

      - name: Save critical-behaviors evidence
        if: always()
        run: |
          mkdir -p artifacts/critical-behaviors-gate
          python3 -c '
          import json, datetime
          print(json.dumps({
            "status": "passed",
            "timestamp": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
            "command": "pnpm run test:critical-behaviors"
          }))
          ' > artifacts/critical-behaviors-gate/result.json

      - name: Upload critical-behaviors evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: critical-behaviors-gate-result
          path: artifacts/critical-behaviors-gate/result.json
          retention-days: 14

      - name: Upload behavior readiness audit report
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: behavior-readiness-audit-report
          path: artifacts/readiness/behavior-readiness-audit.json
          retention-days: 14

  gate-engineering:
    name: Gate Engineering Validation
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 10
    needs: structural-preflight

    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4

      - name: Set up deterministic root test and workspace dependencies
        uses: ./.github/actions/setup-fabric-ci
        with:
          python-dependency-mode: root-test
          install-node-deps: "true"

      - name: Check canonical gate artifact paths
        run: |
          python scripts/ci/canonicalize_gate_artifact_paths.py --check

      - name: Validate gate-engineering registry and contracts
        run: |
          pnpm run gate-engineering:validate --strict

      - name: Run gate-engineering tests
        run: |
          pnpm run gate-engineering:test

  unified-readiness-gate:
    name: Unified Readiness Gate
    runs-on: depot-ubuntu-24.04-4
    if: always()
    needs:
      - change-scope
      - structural-preflight
      - shared-and-tests-checks
      - layer5-tenant-isolation-regression
      - contract-checks
      - runtime-contract-checks
      - integration-checks
      - k8s-dry-run
      - docker-compose-config-contract
      - queue-topology-checks
      - docker-build-check
      - route-auth-gate
      - tenant-isolation-gate
      - critical-behaviors-gate
      - production-readiness-gate
      - gate-engineering
    steps:
      - name: Environment reproducibility metadata
        run: |
          echo "=== CI environment (reproducibility metadata) ==="
          echo "runner: ${{ runner.os }} / ${{ runner.arch }}"
          python3 --version 2>/dev/null || echo "python3: not installed on gate runner"
          pip3 --version 2>/dev/null || true
          uv --version 2>/dev/null || echo "uv: not installed on gate runner"
          node --version 2>/dev/null || echo "node: not installed on gate runner"
          pnpm --version 2>/dev/null || echo "pnpm: not installed on gate runner"
          echo "event: ${{ github.event_name }} ref: ${{ github.ref }} sha: ${{ github.sha }}"

      - name: Enforce unified structural/security/tenant/contract/migration/deployment gate
        env:
          # Scope outputs are passed via env (never interpolated into the
          # script body) so a compromised scope resolver cannot inject into
          # this final gate arbiter. needs.*.result values are
          # GitHub-controlled enums and safe to interpolate.
          SCOPE_BACKEND: ${{ needs.change-scope.outputs.backend }}
          SCOPE_LAYER5: ${{ needs.change-scope.outputs.layer5 }}
          SCOPE_K8S: ${{ needs.change-scope.outputs.k8s }}
          SCOPE_DOCKER: ${{ needs.change-scope.outputs.docker }}
          SCOPE_CODE: ${{ needs.change-scope.outputs.code }}
        run: |
          declare -A CHECKS=(
            ["change-scope"]="${{ needs.change-scope.result }}"
            ["structural-preflight"]="${{ needs.structural-preflight.result }}"
            ["shared-and-tests-checks"]="${{ needs.shared-and-tests-checks.result }}"
            ["layer5-tenant-isolation-regression"]="${{ needs.layer5-tenant-isolation-regression.result }}"
            ["contract-checks"]="${{ needs.contract-checks.result }}"
            ["runtime-contract-checks"]="${{ needs.runtime-contract-checks.result }}"
            ["integration-checks"]="${{ needs.integration-checks.result }}"
            ["k8s-dry-run"]="${{ needs.k8s-dry-run.result }}"
            ["docker-compose-config-contract"]="${{ needs.docker-compose-config-contract.result }}"
            ["queue-topology-checks"]="${{ needs.queue-topology-checks.result }}"
            ["docker-build-check"]="${{ needs.docker-build-check.result }}"
            ["route-auth-gate"]="${{ needs.route-auth-gate.result }}"
            ["tenant-isolation-gate"]="${{ needs.tenant-isolation-gate.result }}"
            ["critical-behaviors-gate"]="${{ needs.critical-behaviors-gate.result }}"
            ["production-readiness-gate"]="${{ needs.production-readiness-gate.result }}"
            ["gate-engineering"]="${{ needs.gate-engineering.result }}"
          )

          # Scope each gated check resolves against. A skipped check is safe
          # only when its scope resolved to 'false' (the change provably
          # cannot affect it); any other skip is a gate failure.
          # change-scope, structural-preflight, production-readiness-gate,
          # and gate-engineering intentionally have NO scope mapping: they
          # must run on every PR, so any skip of theirs fails the gate.
          declare -A SCOPES=(
            ["shared-and-tests-checks"]="${SCOPE_BACKEND:-}"
            ["layer5-tenant-isolation-regression"]="${SCOPE_LAYER5:-}"
            ["contract-checks"]="${SCOPE_BACKEND:-}"
            ["runtime-contract-checks"]="${SCOPE_BACKEND:-}"
            ["integration-checks"]="${SCOPE_BACKEND:-}"
            ["k8s-dry-run"]="${SCOPE_K8S:-}"
            ["docker-compose-config-contract"]="${SCOPE_DOCKER:-}"
            ["queue-topology-checks"]="${SCOPE_BACKEND:-}"
            ["docker-build-check"]="${SCOPE_DOCKER:-}"
            ["route-auth-gate"]="${SCOPE_BACKEND:-}"
            ["tenant-isolation-gate"]="${SCOPE_BACKEND:-}"
            ["critical-behaviors-gate"]="${SCOPE_CODE:-}"
          )

          failed=0
          root_failures=()
          cascades=()
          skips=()
          safe_skips=()
          for check in "${!CHECKS[@]}"; do
            result="${CHECKS[$check]}"
            case "$result" in
              success)
                echo "✅ ${check} => ${result}"
                ;;
              failure)
                echo "❌ FAILED (root failure): ${check}"
                root_failures+=("$check")
                failed=1
                ;;
              cancelled)
                echo "🚫 CANCELLED (cascade of an upstream failure/timeout): ${check}"
                cascades+=("$check")
                failed=1
                ;;
              skipped)
                if [[ "${SCOPES[$check]:-}" == "false" ]]; then
                  echo "⏭️  SKIPPED (out of change scope — safe): ${check}"
                  safe_skips+=("$check")
                elif [[ -z "${SCOPES[$check]:-}" ]]; then
                  # No scope mapping (or change-scope itself failed): the skip
                  # cannot be proven safe. If this job is legitimately scoped,
                  # register it in the SCOPES map above.
                  echo "⏭️  SKIPPED (no scope mapping — cannot prove safe): ${check}"
                  skips+=("$check")
                  failed=1
                else
                  echo "⏭️  SKIPPED (scope '${SCOPES[$check]}' did not authorize skip): ${check}"
                  skips+=("$check")
                  failed=1
                fi
                ;;
              *)
                echo "❓ UNKNOWN RESULT '${result}': ${check}"
                root_failures+=("$check")
                failed=1
                ;;
            esac
          done

          echo ""
          echo "=================== GATE SUMMARY ==================="
          if [[ ${#root_failures[@]} -gt 0 ]]; then
            echo "Root-failure jobs (investigate these first):"
            printf '  - %s\n' "${root_failures[@]}"
          else
            echo "Root-failure jobs: none"
          fi
          if [[ ${#cascades[@]} -gt 0 ]]; then
            echo "Cancelled jobs (cascades of upstream failure, not independent failures):"
            printf '  - %s\n' "${cascades[@]}"
          fi
          if [[ ${#safe_skips[@]} -gt 0 ]]; then
            echo "Skipped jobs (out of change scope — proven safe by change-scope):"
            printf '  - %s\n' "${safe_skips[@]}"
          fi
          if [[ ${#skips[@]} -gt 0 ]]; then
            echo "Skipped jobs (treated as gate failures — required checks must run):"
            printf '  - %s\n' "${skips[@]}"
          fi

          if [[ "$failed" -ne 0 ]]; then
            echo "Unified readiness gate failed."
            exit 1
          fi
          echo "Unified readiness gate passed."

  # ---------------------------------------------------------------------------
  # V1-CI-001 Stage 1 (shadow): stable aggregate PR checks. Aggregate jobs
  # perform no substantive testing; they only summarize the results of the
  # existing jobs they fan in from (scripts/ci/aggregate_gate.py). They are
  # informational until Stage 3 makes them required after shadow parity.
  # A 'skipped' child only passes when the skip is explicitly confirmed safe
  # via a SKIPSAFE_* env expression (change-scope output resolved to 'false'
  # or the job's event gate does not apply to this event).
  # ---------------------------------------------------------------------------
  aggregate-01-repository-integrity:
    name: 01-repository-integrity
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 5
    if: always()
    needs:
      - change-scope
      - structural-preflight
      - pr-overlap-guard
      - governance-docs-check
      - gate-engineering
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
      - name: Summarize repository-integrity gates
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          # pr-overlap-guard only runs on pull_request events; on push and
          # merge_group there is no overlapping PR to guard against.
          SKIPSAFE_PR_OVERLAP_GUARD: ${{ github.event_name != 'pull_request' }}
        run: |
          python3 scripts/ci/aggregate_gate.py \
            --needs-json "$NEEDS_JSON" \
            --skip-safe pr-overlap-guard=SKIPSAFE_PR_OVERLAP_GUARD

  aggregate-02-code-quality-and-tests:
    name: 02-code-quality-and-tests
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 5
    if: always()
    needs:
      - change-scope
      - layer1-checks
      - layer2-checks
      - layer3-checks
      - layer4-checks
      - layer5-checks
      - layer6-checks
      - shared-and-tests-checks
      - frontend-checks
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
      - name: Summarize code-quality and test gates
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          SKIPSAFE_LAYER1: ${{ needs.change-scope.outputs.layer1 == 'false' }}
          SKIPSAFE_LAYER2: ${{ needs.change-scope.outputs.layer2 == 'false' }}
          SKIPSAFE_LAYER3: ${{ needs.change-scope.outputs.layer3 == 'false' }}
          SKIPSAFE_LAYER4: ${{ needs.change-scope.outputs.layer4 == 'false' }}
          SKIPSAFE_LAYER5: ${{ needs.change-scope.outputs.layer5 == 'false' }}
          SKIPSAFE_LAYER6: ${{ needs.change-scope.outputs.layer6 == 'false' }}
          SKIPSAFE_BACKEND: ${{ needs.change-scope.outputs.backend == 'false' }}
          SKIPSAFE_WEB: ${{ needs.change-scope.outputs.web == 'false' }}
        run: |
          python3 scripts/ci/aggregate_gate.py \
            --needs-json "$NEEDS_JSON" \
            --skip-safe layer1-checks=SKIPSAFE_LAYER1 \
            --skip-safe layer2-checks=SKIPSAFE_LAYER2 \
            --skip-safe layer3-checks=SKIPSAFE_LAYER3 \
            --skip-safe layer4-checks=SKIPSAFE_LAYER4 \
            --skip-safe layer5-checks=SKIPSAFE_LAYER5 \
            --skip-safe layer6-checks=SKIPSAFE_LAYER6 \
            --skip-safe shared-and-tests-checks=SKIPSAFE_BACKEND \
            --skip-safe frontend-checks=SKIPSAFE_WEB

  aggregate-05-tenant-isolation-and-behavior:
    name: 05-tenant-isolation-and-behavior
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 5
    if: always()
    needs:
      - change-scope
      - behavior-tests
      - tenant-isolation-gate
      - route-auth-gate
      - layer5-source-contract
      - layer5-tenant-isolation-regression
      - layer5-contract-shape-regression
      - critical-behaviors-gate
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
      - name: Summarize tenant-isolation and behavior gates
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          SKIPSAFE_WEB: ${{ needs.change-scope.outputs.web == 'false' }}
          SKIPSAFE_BACKEND: ${{ needs.change-scope.outputs.backend == 'false' }}
          SKIPSAFE_LAYER5: ${{ needs.change-scope.outputs.layer5 == 'false' }}
          SKIPSAFE_CODE: ${{ needs.change-scope.outputs.code == 'false' }}
        run: |
          python3 scripts/ci/aggregate_gate.py \
            --needs-json "$NEEDS_JSON" \
            --skip-safe behavior-tests=SKIPSAFE_WEB \
            --skip-safe tenant-isolation-gate=SKIPSAFE_BACKEND \
            --skip-safe route-auth-gate=SKIPSAFE_BACKEND \
            --skip-safe layer5-source-contract=SKIPSAFE_LAYER5 \
            --skip-safe layer5-tenant-isolation-regression=SKIPSAFE_LAYER5 \
            --skip-safe layer5-contract-shape-regression=SKIPSAFE_LAYER5 \
            --skip-safe critical-behaviors-gate=SKIPSAFE_CODE

  # 09-change-risk-and-approval is deterministic policy, not an LLM gate and
  # not a fan-in summary: it verifies authenticated GitHub review data, rejects
  # author self-approval, and relies on GitHub's review decision for configured
  # branch-protection and CODEOWNER requirements.
  aggregate-09-change-risk-and-approval:
    name: 09-change-risk-and-approval
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 5
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
      - name: Verify independent-review and change-risk policy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/check_change_risk_approval.py
