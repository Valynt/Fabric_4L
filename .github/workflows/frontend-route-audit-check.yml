name: Frontend Route Audit Check

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'apps/web/src/App.tsx'
      - 'apps/web/src/shell/router.tsx'
      - 'contracts/openapi/**'
      - 'contracts/deprecations/**'
      - 'contracts/route-contracts.json'
      - 'scripts/ci/router_contract_gate.py'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'apps/web/src/App.tsx'
      - 'apps/web/src/shell/router.tsx'
      - 'contracts/openapi/**'
      - 'contracts/deprecations/**'
      - 'contracts/route-contracts.json'
      - 'scripts/ci/router_contract_gate.py'
      - 'package.json'

jobs:
  route-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: "10.18.1"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.22.2'
      - name: Run router contract gate
        run: |
          mkdir -p artifacts/router-contract
          pnpm test:router
      - name: Upload route audit artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: router-contract-audit
          path: artifacts/router-contract/
