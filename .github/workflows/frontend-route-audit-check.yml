name: Frontend Route Audit Check

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'apps/web/src/App.tsx'
      - 'apps/web/src/shell/router.tsx'
      - 'contracts/openapi/**'
      - 'contracts/deprecations/**'
      - 'contracts/route-contracts.json'
      - 'scripts/ci/router_contract_gate.py'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'apps/web/src/App.tsx'
      - 'apps/web/src/shell/router.tsx'
      - 'contracts/openapi/**'
      - 'contracts/deprecations/**'
      - 'contracts/route-contracts.json'
      - 'scripts/ci/router_contract_gate.py'
      - 'package.json'

jobs:
  route-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.18.1 --activate
      - name: Run router contract gate
        run: pnpm test:router
      - name: Upload route audit artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: router-contract-audit
          path: artifacts/router-contract/

