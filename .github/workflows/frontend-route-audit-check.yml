name: Frontend Route Audit Check

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'apps/web/src/App.tsx'
      - 'apps/web/src/App/Router.test.tsx'
      - 'apps/web/src/shell/router.tsx'
      - 'contracts/openapi/**'
      - 'contracts/route-auth-allowlist.yaml'
      - 'contracts/router-contract-baseline.json'
      - 'contracts/deprecations/**'
      - 'apps/web/audit-output/route-map.md'
      - 'apps/web/audit-output/track-a-route-extraction.json'
      - 'scripts/extract-routes-audit.py'
      - 'scripts/check-route-audit-freshness.py'
      - 'scripts/ci/router_contract_gate.py'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'apps/web/src/App.tsx'
      - 'apps/web/src/App/Router.test.tsx'
      - 'apps/web/src/shell/router.tsx'
      - 'contracts/openapi/**'
      - 'contracts/route-auth-allowlist.yaml'
      - 'contracts/router-contract-baseline.json'
      - 'contracts/deprecations/**'
      - 'apps/web/audit-output/route-map.md'
      - 'apps/web/audit-output/track-a-route-extraction.json'
      - 'scripts/extract-routes-audit.py'
      - 'scripts/check-route-audit-freshness.py'
      - 'scripts/ci/router_contract_gate.py'
      - 'package.json'

jobs:
  route-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.1
          run_install: false
      - name: Verify router contract gate
        run: pnpm test:router
      - name: Upload route audit artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: router-contract-audit
          path: artifacts/router-contract/

