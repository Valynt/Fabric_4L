name: Deploy

permissions:
  contents: read
  actions: read

env:
  DEV_API_BASE_URL: 'https://api.dev.value-fabric.com'
  STAGING_API_BASE_URL: 'https://api.staging.value-fabric.com'
  PRODUCTION_API_BASE_URL: 'https://api.production.value-fabric.com'
  AWS_REGION: 'us-east-1'
  EKS_CLUSTER_NAME: 'value-fabric'
  REGISTRY: ${{ inputs.registry || 'ghcr.io' }}
  IMAGE_REF: ${{ inputs.image_ref }}
  ENVIRONMENT: ${{ inputs.environment }}

"on":
  workflow_call:
    inputs:
      environment:
        description: "Target environment"
        type: string
        default: "staging"
      image_ref:
        description: "Image digest or immutable tag to deploy"
        required: true
        type: string
      registry:
        description: "Container registry"
        default: "ghcr.io"
        required: false
        type: string
      prod_readiness_verified:
        description: "Set to true only when the canonical prod-readiness workflow has produced a matching release packet."
        required: false
        type: boolean
        default: false
      supply_chain_artifact_sha:
        description: "Commit SHA used in scan-<service>-<sha> SBOM artifacts; defaults to the deploying workflow SHA."
        required: false
        type: string
        default: ""

  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
        - dev
        - staging
        - production
        default: "staging"
      image_ref:
        description: "Image digest or immutable tag to deploy"
        required: true
        type: string
      registry:
        description: "Container registry"
        default: "ghcr.io"
        required: false
        type: string
      supply_chain_artifact_sha:
        description: "Commit SHA used in scan-<service>-<sha> SBOM artifacts; defaults to the deploying workflow SHA."
        required: false
        type: string
        default: ""
      prod_readiness_verified:
        description: "Set to true only when the canonical prod-readiness workflow has produced a matching release packet."
        required: false
        type: boolean
        default: false

jobs:
  # ============================================
  # Pre-deployment Checks
  # ============================================
  preflight:
    name: Pre-deployment Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332   # v4

    - name: Set up Python
      uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38   # v5
      with:
        python-version: "3.11"

    - name: Verify image signatures
      uses: sigstore/cosign-installer@053f9b74638557590800a301da1ba82351507e2c   # v3.8.1

    - name: Check all images are signed
      env:
        COSIGN_EXPERIMENTAL: 1
        ENV_IMAGE_REF: ${{ env.IMAGE_REF }}
        ENV_REGISTRY: ${{ env.REGISTRY }}
        GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        ref="${ENV_IMAGE_REF}"
        if [[ "$ref" == "latest" ]] || [[ "$ref" =~ ^(main|master|develop|dev|staging|production|stable|edge|nightly)$ ]]; then
          echo "Mutable image reference is forbidden: $ref"
          exit 1
        fi
        if [[ ! "$ref" =~ ^sha-[0-9a-f]{40}$ ]] && \
           [[ ! "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] && \
           [[ ! "$ref" =~ ^sha256:[0-9a-f]{64}$ ]]; then
          echo "Image reference must be sha256 digest, sha-<40>, or signed semver release tag: $ref"
          exit 1
        fi

        for layer in layer1-ingestion layer2-extraction layer3-knowledge \
                     layer4-agents layer5-ground-truth layer6-benchmarks frontend; do
          if [[ "$ref" == sha256:* ]]; then
            IMAGE="${ENV_REGISTRY}/${GITHUB_REPOSITORY_OWNER}/fabric_4l/$layer@${ref}"
          else
            IMAGE="${ENV_REGISTRY}/${GITHUB_REPOSITORY_OWNER}/fabric_4l/$layer:${ref}"
          fi
          echo "Verifying signature for: $IMAGE"

          if ! cosign verify \
            --certificate-identity-regexp="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "$IMAGE"; then
            echo "Signature verification failed for: $IMAGE"
            exit 1
          fi
        done

        echo "All image signatures verified ✓"

    - name: Resolve supply-chain artifact SHA
      id: sbom-sha
      run: |
        if [[ -n "${INPUTS_SUPPLY_CHAIN_ARTIFACT_SHA}" ]]; then
          sha="${INPUTS_SUPPLY_CHAIN_ARTIFACT_SHA}"
        elif [[ "${ENV_IMAGE_REF}" =~ ^sha-([0-9a-f]{40})$ ]]; then
          sha="${BASH_REMATCH[1]}"
        else
          sha="${GITHUB_SHA}"
        fi

        if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::Supply-chain artifact SHA must be a 40-character lowercase git SHA; got '$sha'"
          exit 1
        fi

        echo "sha=$sha" >> "$GITHUB_OUTPUT"
        echo "Using SBOM artifact SHA: $sha"

      env:
        INPUTS_SUPPLY_CHAIN_ARTIFACT_SHA: ${{ inputs.supply_chain_artifact_sha }}
        ENV_IMAGE_REF: ${{ env.IMAGE_REF }}
        GITHUB_SHA: ${{ github.sha }}
    - name: Download SBOM and signing artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4
      with:
        pattern: scan-*-${{ steps.sbom-sha.outputs.sha }}
        path: artifacts/supply-chain
        merge-multiple: false

    - name: Verify SBOMs against deploy image digests
      env:
        COSIGN_EXPERIMENTAL: 1
        SBOM_SHA: ${{ steps.sbom-sha.outputs.sha }}
        ENV_REGISTRY: ${{ env.REGISTRY }}
        GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        ENV_IMAGE_REF: ${{ env.IMAGE_REF }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail

        layers=(
          layer1-ingestion
          layer2-extraction
          layer3-knowledge
          layer4-agents
          layer5-ground-truth
          layer6-benchmarks
          frontend
        )

        for layer in "${layers[@]}"; do
          image_name="${ENV_REGISTRY}/${GITHUB_REPOSITORY_OWNER}/fabric_4l/${layer}"
          if [[ "${ENV_IMAGE_REF}" == sha256:* ]]; then
            image_ref="${image_name}@${ENV_IMAGE_REF}"
            deployed_digest="${ENV_IMAGE_REF}"
          else
            image_ref="${image_name}:${ENV_IMAGE_REF}"
            deployed_digest="$(docker buildx imagetools inspect "$image_ref" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          fi

          if [[ ! "$deployed_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Could not resolve a valid digest for ${image_ref}; got '${deployed_digest}'"
            exit 1
          fi

          digest_ref="${image_name}@${deployed_digest}"
          artifact_dir="artifacts/supply-chain/scan-${layer}-${SBOM_SHA}"
          sbom_file="${artifact_dir}/sbom-${layer}-${SBOM_SHA}.cdx.json"

          if [[ ! -s "$sbom_file" ]]; then
            echo "::error::Missing non-empty SBOM artifact for ${layer}: ${sbom_file}"
            exit 1
          fi

          echo "Verifying SBOM artifact for ${layer} against ${digest_ref}"

          if ! jq -e --arg image "$image_name" '
            [.. | strings | select(contains($image))] | length > 0
          ' "$sbom_file" >/dev/null; then
            echo "::error::SBOM ${sbom_file} does not reference expected image ${image_name}"
            exit 1
          fi

          if ! jq -e --arg digest "$deployed_digest" '
            [.. | strings | select(contains($digest))] | length > 0
          ' "$sbom_file" >/dev/null; then
            echo "::error::SBOM ${sbom_file} does not reference deployed digest ${deployed_digest}"
            exit 1
          fi

          if [[ -s "${sbom_file}.sig" && -s "${sbom_file}.crt" ]]; then
            cosign verify-blob "$sbom_file" \
              --certificate "${sbom_file}.crt" \
              --signature "${sbom_file}.sig" \
              --certificate-identity-regexp="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/.*" \
              --certificate-oidc-issuer="https://token.actions.githubusercontent.com"
          else
            echo "::error::Missing Cosign signature or certificate for SBOM artifact ${sbom_file}"
            exit 1
          fi

          cosign verify-attestation \
            --certificate-identity-regexp="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --type cyclonedx \
            "$digest_ref" >/dev/null
        done

        echo "All SBOM artifacts and registry attestations match deployed image digests ✓"

    - name: Check environment health
      run: |
        set -euo pipefail

        case "${ENV_ENVIRONMENT}" in
          dev)        BASE_URL="${ENV_DEV_API_BASE_URL}" ;;
          staging)    BASE_URL="${ENV_STAGING_API_BASE_URL}" ;;
          production) BASE_URL="${ENV_PRODUCTION_API_BASE_URL}" ;;
          *) echo "::error::Unknown environment: ${ENV_ENVIRONMENT}"; exit 1 ;;
        esac

        BASE_URL="${BASE_URL%/}"
        if [[ ! "$BASE_URL" =~ ^https?:// ]]; then
          echo "::error::Resolved API base URL must include http:// or https://; got '$BASE_URL'"
          exit 1
        fi

        checks=(
          "api-gateway liveness|${BASE_URL}/health/live"
          "api-gateway readiness|${BASE_URL}/ready"
          "layer1 ingestion health|${BASE_URL}/api/v1/ingestion/health"
          "layer2 extraction health|${BASE_URL}/layer2/health"
          "layer3 knowledge health|${BASE_URL}/layer3/health"
          "layer4 agents health|${BASE_URL}/layer4/health"
          "layer5 ground-truth health|${BASE_URL}/api/v1/health"
          "layer6 benchmarks health|${BASE_URL}/layer6/health"
        )

        for check in "${checks[@]}"; do
          name="${check%%|*}"
          url="${check#*|}"
          echo "Checking ${name}: ${url}"
          curl --fail --silent --show-error --location --max-time 20 --retry 2 --retry-delay 5 "$url" >/dev/null
        done

        echo "Environment health checks passed for ${ENV_ENVIRONMENT} ✓"

      env:
        ENV_ENVIRONMENT: ${{ env.ENVIRONMENT }}
        ENV_DEV_API_BASE_URL: ${{ env.DEV_API_BASE_URL }}
        ENV_STAGING_API_BASE_URL: ${{ env.STAGING_API_BASE_URL }}
        ENV_PRODUCTION_API_BASE_URL: ${{ env.PRODUCTION_API_BASE_URL }}
    - name: Enforce deploy profile mandatory controls
      run: |
        case "${ENV_ENVIRONMENT}" in
          production) PROFILE="release-candidate" ;;
          staging) PROFILE="mainline-full" ;;
          dev) PROFILE="pr-fast" ;;
          *) echo "Unknown environment: ${ENV_ENVIRONMENT}"; exit 1 ;;
        esac
        python scripts/ci/validate_deploy_profile_controls.py \
          --policy-file .fabric/prod-gates.policy.yaml \
          --profile "$PROFILE"

      env:
        ENV_ENVIRONMENT: ${{ env.ENVIRONMENT }}
    - name: Block unverified production promotion
      if: env.ENVIRONMENT == 'production'
      run: |
        if [[ "${INPUTS_PROD_READINESS_VERIFIED}" != "true" ]]; then
          echo "Production deploys must come from a successful prod-readiness workflow with canonical release artifacts."
          exit 1
        fi

  # ============================================
  # Production Approval Gate
  # ============================================
  # This job requires a GitHub Environment protection rule with
  # required reviewers for the 'production' environment.
  # Configure in: Settings > Environments > production > Protection rules
      env:
        INPUTS_PROD_READINESS_VERIFIED: ${{ inputs.prod_readiness_verified }}
  approval-gate:
    name: Production Approval Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: preflight
    environment:
      name: ${{ inputs.environment == 'production' && 'production' || inputs.environment }}
    steps:
    - name: Confirm deployment approval
      run: |
        echo "Environment '${INPUTS_ENVIRONMENT}' has been approved for deployment."
        echo "Deploying image: ${ENV_IMAGE_REF}"
        echo "Approver: ${GITHUB_ACTOR}"
        echo "Run ID: ${GITHUB_RUN_ID}"

  # ============================================
  # Deploy to Environment
  # ============================================
      env:
        INPUTS_ENVIRONMENT: ${{ inputs.environment }}
        ENV_IMAGE_REF: ${{ env.IMAGE_REF }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_RUN_ID: ${{ github.run_id }}
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [preflight, approval-gate]
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy-info.outputs.url }}
    permissions:
      id-token: write # Required for AWS OIDC / IRSA
      contents: read

    steps:
    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332   # v4

    - name: Setup kubectl
      uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415   # v4
      with:
        version: "v1.31.2"

    - name: Setup Helm
      uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a   # v4
      with:
        version: "v3.16.2"

    - name: Validate EKS kubeconfig inputs
      env:
        AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        AWS_REGION: ${{ env.AWS_REGION }}
        EKS_CLUSTER_NAME: ${{ env.EKS_CLUSTER_NAME }}
      run: |
        set -euo pipefail
        if [[ -z "$AWS_DEPLOY_ROLE_ARN" ]]; then
          echo "::error::AWS_DEPLOY_ROLE_ARN secret is required before deployment can configure kubeconfig"
          exit 1
        fi
        if [[ -z "$AWS_REGION" || -z "$EKS_CLUSTER_NAME" ]]; then
          echo "::error::AWS_REGION and EKS_CLUSTER_NAME must resolve to non-empty values"
          exit 1
        fi

    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c   # v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Configure kubeconfig (EKS)
      run: |
        set -euo pipefail
        CLUSTER_NAME="${ENV_EKS_CLUSTER_NAME}"
        AWS_REGION="${ENV_AWS_REGION}"

        echo "Configuring kubeconfig for EKS cluster: ${CLUSTER_NAME} in ${AWS_REGION}"
        aws eks update-kubeconfig \
          --region "${AWS_REGION}" \
          --name "${CLUSTER_NAME}" \
          --alias "value-fabric-${ENV_ENVIRONMENT}"

        CURRENT_CONTEXT=$(kubectl config current-context)
        if [[ -z "$CURRENT_CONTEXT" ]]; then
          echo "::error::kubectl current-context is empty after EKS kubeconfig setup"
          exit 1
        fi
        echo "Kubeconfig configured. Current context: ${CURRENT_CONTEXT}"

      env:
        ENV_EKS_CLUSTER_NAME: ${{ env.EKS_CLUSTER_NAME }}
        ENV_AWS_REGION: ${{ env.AWS_REGION }}
        ENV_ENVIRONMENT: ${{ env.ENVIRONMENT }}
    - name: Resolve kustomize overlay
      id: overlay
      run: |
        # Map environment → overlay path and read the namespace the overlay
        # actually sets, so every subsequent step uses the same value.
        case "${ENV_ENVIRONMENT}" in
          production) OVERLAY="k8s/overlays/production" ;;
          staging)    OVERLAY="k8s/overlays/staging"    ;;
          dev)        OVERLAY="k8s/envs/dev"            ;;
          *) echo "Unknown environment: ${ENV_ENVIRONMENT}"; exit 1 ;;
        esac
        # Read namespace from the overlay itself — single source of truth.
        NS=$(grep '^namespace:' "${OVERLAY}/kustomization.yaml" | awk '{print $2}')
        if [[ -z "$NS" ]]; then
          echo "Could not read namespace from ${OVERLAY}/kustomization.yaml"
          exit 1
        fi
        echo "overlay=$OVERLAY" >> "$GITHUB_OUTPUT"
        echo "namespace=$NS" >> "$GITHUB_OUTPUT"

      env:
        ENV_ENVIRONMENT: ${{ env.ENVIRONMENT }}
    - name: Resolve deploy namespace
      run: |
        DEPLOY_NS=$(bash scripts/resolve-namespace.sh "${ENV_ENVIRONMENT}")
        if [[ "$DEPLOY_NS" != "${STEPS_OVERLAY_OUTPUTS_NAMESPACE}" ]]; then
          echo "::error::Namespace resolver returned '$DEPLOY_NS' but overlay output is \
            '${STEPS_OVERLAY_OUTPUTS_NAMESPACE}'"
          exit 1
        fi
        echo "Resolved namespace: $DEPLOY_NS"
        echo "DEPLOY_NS=$DEPLOY_NS" >> "$GITHUB_ENV"

      env:
        ENV_ENVIRONMENT: ${{ env.ENVIRONMENT }}
        STEPS_OVERLAY_OUTPUTS_NAMESPACE: ${{ steps.overlay.outputs.namespace }}
    - name: Confirm cluster context and namespace
      run: |
        set -euo pipefail
        # Safety gate: confirm kubectl is talking to the expected cluster
        CURRENT_CONTEXT=$(kubectl config current-context)
        echo "Current context: ${CURRENT_CONTEXT}"

        EXPECTED_NS="${STEPS_OVERLAY_OUTPUTS_NAMESPACE}"
        echo "Expected namespace: ${EXPECTED_NS}"

        # Fail if context contains unexpected keywords (basic sanity check)
        if [[ "${CURRENT_CONTEXT}" == *"prod"* && "${ENV_ENVIRONMENT}" != "production" ]]; then
          echo "::error::Context '${CURRENT_CONTEXT}' looks like production but environment is '${ENV_ENVIRONMENT}'"
          exit 1
        fi

        kubectl cluster-info >/dev/null
        echo "Cluster context and namespace confirmed ✓"

      env:
        STEPS_OVERLAY_OUTPUTS_NAMESPACE: ${{ steps.overlay.outputs.namespace }}
        ENV_ENVIRONMENT: ${{ env.ENVIRONMENT }}
    - name: Create namespace
      run: |
        kubectl create namespace "${ENV_DEPLOY_NS}" \
          --dry-run=client -o yaml | kubectl apply -f -

      env:
        ENV_DEPLOY_NS: ${{ env.DEPLOY_NS }}
    - name: Resolve digests and render immutable manifest
      run: |
        # Use prepare_kustomize_deploy.sh to resolve mutable tags to immutable
        # SHA256 digests before deployment. This ensures every deployed image
        # is addressable by digest, enabling reproducible rollbacks.
        OVERLAY="${STEPS_OVERLAY_OUTPUTS_OVERLAY}"
        REF="${ENV_IMAGE_REF}"
        REGISTRY="${ENV_REGISTRY}"
        RENDERED="/tmp/rendered-manifest.yaml"

        # The script resolves the tag to a digest and mutates the overlay
        # in-place, then renders the final manifest.
        export REGISTRY="${REGISTRY}"
        export IMAGE_TAG="${REF}"
        export GITHUB_REPOSITORY_OWNER="${GITHUB_REPOSITORY_OWNER}"
        export KUSTOMIZE_ROOT="$(dirname "$OVERLAY")"

        bash scripts/ci/prepare_kustomize_deploy.sh \
          "$(basename "$OVERLAY")" \
          "$RENDERED"

        echo "rendered_manifest=${RENDERED}" >> "$GITHUB_ENV"

      env:
        STEPS_OVERLAY_OUTPUTS_OVERLAY: ${{ steps.overlay.outputs.overlay }}
        ENV_IMAGE_REF: ${{ env.IMAGE_REF }}
        ENV_REGISTRY: ${{ env.REGISTRY }}
        GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
    - name: Deploy via kustomize
      run: |
        echo "Deploying ${ENV_IMAGE_REF} to ${ENV_ENVIRONMENT} (ns: ${ENV_DEPLOY_NS})"
        kubectl apply -f "${ENV_RENDERED_MANIFEST}"
        # Also apply the mutated overlay for any remaining kustomize resources
        kubectl apply -k "${STEPS_OVERLAY_OUTPUTS_OVERLAY}"

      env:
        ENV_IMAGE_REF: ${{ env.IMAGE_REF }}
        ENV_ENVIRONMENT: ${{ env.ENVIRONMENT }}
        ENV_DEPLOY_NS: ${{ env.DEPLOY_NS }}
        ENV_RENDERED_MANIFEST: ${{ env.rendered_manifest }}
        STEPS_OVERLAY_OUTPUTS_OVERLAY: ${{ steps.overlay.outputs.overlay }}
    - name: Wait for rollouts
      run: |
        for deploy in \
          layer1-ingestion layer2-extraction layer3-knowledge \
          layer4-agents layer5-ground-truth layer6-benchmarks frontend; do
          echo "Waiting for $deploy ..."
          kubectl rollout status "deployment/$deploy" \
            -n "${ENV_DEPLOY_NS}" --timeout=10m
        done

      env:
        ENV_DEPLOY_NS: ${{ env.DEPLOY_NS }}
    - name: Record deployment info
      id: deploy-info
      run: |
        URL="https://api.${ENV_ENVIRONMENT}.value-fabric.com"
        echo "url=$URL" >> "$GITHUB_OUTPUT"
        echo "Deployed to: $URL"

      env:
        ENV_ENVIRONMENT: ${{ env.ENVIRONMENT }}
    - name: Create deployment record
      run: |
        cat > deployment-record.json << EOF
        {
          "environment": "${ENV_ENVIRONMENT}",
          "namespace": "${STEPS_OVERLAY_OUTPUTS_NAMESPACE}",
          "image_ref": "${ENV_IMAGE_REF}",
          "commit_sha": "${GITHUB_SHA}",
          "deployed_by": "${GITHUB_ACTOR}",
          "deployed_at": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
          "workflow_run": "${GITHUB_RUN_ID}"
        }
        EOF
        cat deployment-record.json

      env:
        ENV_ENVIRONMENT: ${{ env.ENVIRONMENT }}
        STEPS_OVERLAY_OUTPUTS_NAMESPACE: ${{ steps.overlay.outputs.namespace }}
        ENV_IMAGE_REF: ${{ env.IMAGE_REF }}
        GITHUB_SHA: ${{ github.sha }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_RUN_ID: ${{ github.run_id }}
    - name: Upload deployment record
      uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808   # v4
      with:
        name: deployment-record-${{ env.ENVIRONMENT }}-${{ env.IMAGE_REF }}
        path: deployment-record.json
        retention-days: 90

  # ============================================
  # Smoke Tests
  # ============================================
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: deploy
    if: inputs.environment != 'dev'

    steps:
    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332   # v4

    - name: Wait for rollout
      run: |
        echo "Waiting for deployment to stabilize..."
        sleep 30
        NS=$(bash scripts/resolve-namespace.sh "${ENV_ENVIRONMENT}")
        kubectl rollout status deployment -n "$NS" --timeout=300s

      env:
        ENV_ENVIRONMENT: ${{ env.ENVIRONMENT }}
    - name: Health check endpoints
      run: |
        BASE_URL="https://api.${ENV_ENVIRONMENT}.value-fabric.com"

        endpoints=(
          "/health"
          "/health/version"
          "/api/v1/health"
        )

        for endpoint in "${endpoints[@]}"; do
          url="${BASE_URL}${endpoint}"
          echo "Checking: $url"

          if ! curl -fsS --max-time 30 "$url"; then
            echo "Health check failed: $url"
            exit 1
          fi
        done

        echo "All health checks passed ✓"

      env:
        ENV_ENVIRONMENT: ${{ env.ENVIRONMENT }}
    - name: Critical path tests
      run: |
        echo "Running critical path smoke tests"
        pytest tests/e2e/smoke/ --base-url=https://api.${ENV_ENVIRONMENT}.value-fabric.com

  # ============================================
  # Rollback on Failure
  # ============================================
      env:
        ENV_ENVIRONMENT: ${{ env.ENVIRONMENT }}
  rollback-on-failure:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [deploy, smoke-tests]
    if: failure() && inputs.environment != 'dev'
    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332   # v4

    - name: Setup kubectl
      uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415   # v4
      with:
        version: "v1.31.2"

    - name: Setup Helm
      uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a   # v4
      with:
        version: "v3.16.2"

    - name: Validate EKS kubeconfig inputs
      env:
        AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        AWS_REGION: ${{ env.AWS_REGION }}
        EKS_CLUSTER_NAME: ${{ env.EKS_CLUSTER_NAME }}
      run: |
        set -euo pipefail
        if [[ -z "$AWS_DEPLOY_ROLE_ARN" ]]; then
          echo "::error::AWS_DEPLOY_ROLE_ARN secret is required before rollback can configure kubeconfig"
          exit 1
        fi
        if [[ -z "$AWS_REGION" || -z "$EKS_CLUSTER_NAME" ]]; then
          echo "::error::AWS_REGION and EKS_CLUSTER_NAME must resolve to non-empty values"
          exit 1
        fi

    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c   # v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Configure kubeconfig (EKS)
      run: |
        set -euo pipefail
        CLUSTER_NAME="${ENV_EKS_CLUSTER_NAME}"
        AWS_REGION="${ENV_AWS_REGION}"

        echo "Configuring kubeconfig for EKS cluster: ${CLUSTER_NAME} in ${AWS_REGION}"
        aws eks update-kubeconfig \
          --region "${AWS_REGION}" \
          --name "${CLUSTER_NAME}" \
          --alias "value-fabric-${ENV_ENVIRONMENT}"

        CURRENT_CONTEXT=$(kubectl config current-context)
        if [[ -z "$CURRENT_CONTEXT" ]]; then
          echo "::error::kubectl current-context is empty after EKS kubeconfig setup"
          exit 1
        fi
        kubectl cluster-info >/dev/null
        echo "Kubeconfig configured. Current context: ${CURRENT_CONTEXT}"

      env:
        ENV_EKS_CLUSTER_NAME: ${{ env.EKS_CLUSTER_NAME }}
        ENV_AWS_REGION: ${{ env.AWS_REGION }}
        ENV_ENVIRONMENT: ${{ env.ENVIRONMENT }}
    - name: Alert on failure
      run: |
        echo "Deployment failed - initiating rollback procedures"
        echo "Environment: ${ENV_ENVIRONMENT}"
        echo "Failed tag: ${ENV_IMAGE_REF}"

      env:
        ENV_ENVIRONMENT: ${{ env.ENVIRONMENT }}
        ENV_IMAGE_REF: ${{ env.IMAGE_REF }}
    - name: Rollback deployments
      run: |
        # Re-derive namespace from overlay (DEPLOY_NS env is job-scoped and
        # not available across jobs; re-read from the same source of truth).
        DEPLOY_NS=$(bash scripts/resolve-namespace.sh "${ENV_ENVIRONMENT}")
        echo "Rolling back all deployments in $DEPLOY_NS ..."
        for deploy in \
          layer1-ingestion layer2-extraction layer3-knowledge \
          layer4-agents layer5-ground-truth layer6-benchmarks frontend; do
          echo "  Undoing $deploy ..."
          kubectl rollout undo "deployment/$deploy" -n "$DEPLOY_NS" || true
        done
        echo "Waiting for rollback rollouts ..."
        for deploy in \
          layer1-ingestion layer2-extraction layer3-knowledge \
          layer4-agents layer5-ground-truth layer6-benchmarks frontend; do
          kubectl rollout status "deployment/$deploy" \
            -n "$DEPLOY_NS" --timeout=5m || true
        done
        kubectl get deployments -n "$DEPLOY_NS"
        kubectl get pods        -n "$DEPLOY_NS"

  # ============================================
  # Post-deployment Verification
  # ============================================
      env:
        ENV_ENVIRONMENT: ${{ env.ENVIRONMENT }}
  verify:
    name: Post-deployment Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: smoke-tests
    if: success()

    steps:
    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332   # v4

    - name: Verify metrics
      run: |
        echo "Verifying deployment metrics"
        # Check error rates, latency, etc.
        # curl -s "https://prometheus.${ENV_ENVIRONMENT}.value-fabric.com/api/v1/query?query=up"

      env:
        ENV_ENVIRONMENT: ${{ env.ENVIRONMENT }}
    - name: Record successful deployment
      run: |
        echo "Recording successful deployment to ${ENV_ENVIRONMENT}"

        # This would update a deployment tracking system
        # or create a GitHub release with deployment metadata

  # ============================================
  # Deployment Evidence (production only)
  # ============================================
      env:
        ENV_ENVIRONMENT: ${{ env.ENVIRONMENT }}
  evidence:
    name: Commit Deployment Evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [smoke-tests, verify]
    if: >
      inputs.environment == 'production' && needs.smoke-tests.result == 'success' && needs.verify.result == 'success'
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332   # v4
      with:
        ref: main
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Generate evidence file
      id: evidence
      run: |
        TAG="${ENV_IMAGE_REF}"
        # Sanitize tag for use in filename: replace ':' and '/' with '-'
        # (digest refs like sha256:<hash> contain ':' which breaks paths)
        TAG_SAFE="${TAG//:/-}"
        TAG_SAFE="${TAG_SAFE//\//-}"
        DATE=$(date -u +%Y-%m-%d)
        TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        FILE=".deployments/${DATE}-${TAG_SAFE}.md"
        # Read actual namespace from the production overlay
        NAMESPACE=$(grep '^namespace:' k8s/overlays/production/kustomization.yaml | awk '{print $2}')
        mkdir -p .deployments

        cat > "$FILE" << EOF
        # Deployment Evidence — ${TAG}

        Date: ${TIME}
        Tag: ${TAG}
        Commit: ${GITHUB_SHA}
        Namespace: ${NAMESPACE}
        Deployer: ${GITHUB_ACTOR}
        Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

        ## Gate results

        - [x] Phase 0: tooling preflight passed
        - [x] Phase 1: repo state clean, tag verified
        - [x] Phase 2: image signatures verified
        - [x] Phase 3: all 7 images present
        - [x] Phase 4: kustomize render clean
        - [x] Phase 5: secrets provisioned
        - [x] Phase 6: all 7 deployments rolled out
        - [x] Phase 7: smoke tests passed
        - [x] Phase 8: post-deploy verification passed

        ## Services deployed

        - ghcr.io/bmsull560/fabric_4l/layer1-ingestion:${TAG}
        - ghcr.io/bmsull560/fabric_4l/layer2-extraction:${TAG}
        - ghcr.io/bmsull560/fabric_4l/layer3-knowledge:${TAG}
        - ghcr.io/bmsull560/fabric_4l/layer4-agents:${TAG}
        - ghcr.io/bmsull560/fabric_4l/layer5-ground-truth:${TAG}
        - ghcr.io/bmsull560/fabric_4l/layer6-benchmarks:${TAG}
        - ghcr.io/bmsull560/fabric_4l/frontend:${TAG}
        EOF

        echo "file=$FILE" >> "$GITHUB_OUTPUT"
        echo "tag_safe=$TAG_SAFE" >> "$GITHUB_OUTPUT"
        echo "Evidence file: $FILE"

      env:
        ENV_IMAGE_REF: ${{ env.IMAGE_REF }}
        GITHUB_SHA: ${{ github.sha }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_RUN_ID: ${{ github.run_id }}
    - name: Commit evidence file
      run: |
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add "${STEPS_EVIDENCE_OUTPUTS_FILE}"
        git diff --cached --quiet || \
          git commit -m "chore: deployment evidence ${ENV_IMAGE_REF} [skip ci]" \
            --author="github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
        git push origin main

      env:
        STEPS_EVIDENCE_OUTPUTS_FILE: ${{ steps.evidence.outputs.file }}
        ENV_IMAGE_REF: ${{ env.IMAGE_REF }}
    - name: Upload evidence artifact
      uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808   # v4
      with:
        name: deployment-evidence-${{ steps.evidence.outputs.tag_safe }}
        path: ${{ steps.evidence.outputs.file }}
        retention-days: 90

  # ============================================
  # Notify
  # ============================================
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy, smoke-tests]
    if: always()
    permissions:
      id-token: write # Required for Infisical OIDC authentication

    steps:
    - name: Map environment to Infisical slug
      run: |
        env="${INPUTS_ENVIRONMENT}"
        if [ "$env" == "production" ]; then
          echo "INFISICAL_ENV_SLUG=prod" >> "$GITHUB_ENV"
        else
          echo "INFISICAL_ENV_SLUG=$env" >> "$GITHUB_ENV"
        fi

      # once Infisical project is fully populated and CI validation passes.
      # Target: after first successful Infisical-only CI run.
      env:
        INPUTS_ENVIRONMENT: ${{ inputs.environment }}
    - name: Fetch secrets from Infisical
      id: infisical
      uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995   # v1.0.16
      with:
        method: oidc
        env-slug: ${{ env.INFISICAL_ENV_SLUG }}
        project-slug: fabric4l
        identity-id: ${{ secrets.INFISICAL_IDENTITY_ID }}
        secret-path: /monitoring

    - name: Slack notification
      uses: 8398a7/action-slack@77eaa4f1c608a7d68b38af4e3f739dcd8cba273e   # v3
      with:
        status: ${{ job.status }}
        channel: "#deployments"
        fields: repo,message,commit,author,action,eventName,ref,workflow
      env:
        SLACK_WEBHOOK_URL: ${{ env.SLACK_WEBHOOK_URL }}
      if: env.SLACK_WEBHOOK_URL != ''

    - name: Summary
      run: |
        echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Environment**: ${ENV_ENVIRONMENT}" >> $GITHUB_STEP_SUMMARY
        echo "- **Image Tag**: ${ENV_IMAGE_REF}" >> $GITHUB_STEP_SUMMARY
        if [ "${NEEDS_SMOKE_TESTS_RESULT}" = "success" ]; then
          status="✅ Success"
        elif [ "${NEEDS_DEPLOY_RESULT}" = "failure" ]; then
          status="❌ Failed"
        else
          status="🔄 In Progress"
        fi
        echo "- **Status**: ${status}" >> $GITHUB_STEP_SUMMARY
        echo "- **URL**: https://api.${ENV_ENVIRONMENT}.value-fabric.com" >> $GITHUB_STEP_SUMMARY
      env:
        ENV_ENVIRONMENT: ${{ env.ENVIRONMENT }}
        ENV_IMAGE_REF: ${{ env.IMAGE_REF }}
        NEEDS_SMOKE_TESTS_RESULT: ${{ needs.smoke-tests.result }}
        NEEDS_DEPLOY_RESULT: ${{ needs.deploy.result }}
