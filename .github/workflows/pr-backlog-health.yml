name: PR Backlog Health Report

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

"on":
  schedule:
    # Every Monday at 09:07 UTC
    - cron: "7 9 * * 1"
  workflow_dispatch:

jobs:
  report:
    name: Report stale PRs, main pass rate, and recurring CI failures
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Ensure backlog-health label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create pr-backlog-health --color "5319e7" --description "Backlog health reports and related issues" || true

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: "3.11"

      - name: Collect backlog metrics
        id: metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          github_output="$(mktemp)"
          python3 scripts/ci/collect_pr_backlog_metrics.py \
            --repo "${{ github.repository }}" \
            --server-url "https://github.com" \
            --stale-days 14 \
            --main-sha "$(gh api repos/${{ github.repository }}/commits/main --jq '.sha')" \
            --required-checks-config config/ci/required-status-checks.json \
            --body-output "$body_file" \
            --github-output "$github_output"
          cat "$github_output" >> "$GITHUB_OUTPUT"

      - name: Collect recurring CI failure backlog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          failure_backlog_dir="$(mktemp -d)"
          python3 scripts/ci/generate_ci_failure_backlog.py \
            --repo "${{ github.repository }}" \
            --server-url "https://github.com" \
            --window-days 14 \
            --max-failed-runs 500 \
            --json-output "$failure_backlog_dir/ci_failure_backlog.json" \
            --markdown-output "$failure_backlog_dir/ci_failure_backlog.md"
          {
            printf '\n---\n\n'
            cat "$failure_backlog_dir/ci_failure_backlog.md"
          } >> "${{ steps.metrics.outputs.body_file }}"

      - name: Open or update backlog health issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          body_file="${{ steps.metrics.outputs.body_file }}"
          title="${{ steps.metrics.outputs.issue_title }}"
          existing=$(gh issue list --label pr-backlog-health --state open --json number --jq '.[0].number' || true)

          if [[ -n "$existing" && "$existing" != "null" ]]; then
            gh issue edit "$existing" --title "$title" --body-file "$body_file"
          else
            gh issue create --title "$title" --label pr-backlog-health --body-file "$body_file"
          fi
