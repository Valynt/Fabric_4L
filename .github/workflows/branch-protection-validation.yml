name: Branch Protection Validation

on:
  schedule:
    - cron: "17 6 * * *" # Daily — drift detection target <24h (Plan E)
  workflow_dispatch:
  pull_request:
    paths:
      - 'config/ci/required-status-checks.json'
      - 'config/ci/branch-protection-gap.json'
      - 'docs/governance/branch-protection-required-checks.yml'
      - 'scripts/ci/validate_branch_protection_checks.py'
      - '.github/workflows/branch-protection-validation.yml'

permissions:
  contents: read
  actions: read
  # NOTE: `administration` is not a valid GITHUB_TOKEN permission scope, and
  # GITHUB_TOKEN cannot read branch protection endpoints (HTTP 403) unless the
  # actor has repository admin rights. Branch protection validation is therefore
  # best-effort: we fetch the API, and when the token is not permitted we skip
  # the API-backed checks and degrade gracefully (documented GitHub platform
  # limitation) instead of failing the workflow.

jobs:
  validate:
    name: Validate Required Status Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check branch protection rules
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          protection_file="$(mktemp)"
          rulesets_file="$(mktemp)"
          trap 'rm -f "$protection_file" "$rulesets_file"' EXIT

          # GITHUB_TOKEN cannot read branch protection settings (HTTP 403)
          # unless the actor holds repository admin rights - a documented
          # GitHub platform limitation. Fetch best-effort with `gh api`
          # (auto-auth via GITHUB_TOKEN); when the token is not permitted,
          # emit a warning and skip the API-backed validation steps so the
          # workflow degrades gracefully instead of phantom-failing.
          protection_fetch_ok=0
          rulesets_fetch_ok=0
          if gh api "/repos/$REPO/branches/main/protection" > "$protection_file" 2>/dev/null; then
            protection_fetch_ok=1
          else
            echo "::warning::GITHUB_TOKEN lacks permission to read branch protection for $REPO; skipping branch-protection validation."
          fi
          if gh api "/repos/$REPO/rulesets?per_page=100" > "$rulesets_file" 2>/dev/null; then
            rulesets_fetch_ok=1
          else
            echo "::warning::GITHUB_TOKEN lacks permission to read rulesets for $REPO; skipping ruleset validation."
          fi

          GAP_ARGS=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            GAP_ARGS="--gap-file config/ci/branch-protection-gap.json"
          fi

          if [ "$protection_fetch_ok" = "1" ]; then
            python scripts/ci/validate_branch_protection_checks.py \
              --config config/ci/required-status-checks.json \
              --api-response-file "$protection_file" \
              $GAP_ARGS
          fi
          if [ "$protection_fetch_ok" = "1" ] && [ "$rulesets_fetch_ok" = "1" ]; then
            python scripts/ci/validate_mandatory_security_gate_enforcement.py \
              --branch-protection-file "$protection_file" \
              --ruleset-file "$rulesets_file"
          fi
