name: Branch Protection Validation

on:
  schedule:
    - cron: "17 6 * * *" # Daily — drift detection target <24h (Plan E)
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    name: Validate Required Status Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check branch protection rules
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          protection_file="$(mktemp)"
          rulesets_file="$(mktemp)"
          trap 'rm -f "$protection_file" "$rulesets_file"' EXIT

          curl --fail --show-error --silent \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/branches/main/protection" \
            -o "$protection_file"
          curl --fail --show-error --silent \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/rulesets?per_page=100" \
            -o "$rulesets_file"

          python scripts/ci/validate_branch_protection_checks.py \
            --config config/ci/required-status-checks.json \
            --api-response-file "$protection_file"
          python scripts/ci/validate_mandatory_security_gate_enforcement.py \
            --branch-protection-file "$protection_file" \
            --ruleset-file "$rulesets_file"
