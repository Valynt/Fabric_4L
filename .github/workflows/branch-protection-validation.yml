name: Branch Protection Validation

on:
  schedule:
    - cron: "17 6 * * *" # Daily — drift detection target <24h (Plan E)
  workflow_dispatch:
  pull_request:
    paths:
      - 'config/ci/required-status-checks.json'
      - 'config/ci/branch-protection-gap.json'
      - 'docs/governance/branch-protection-required-checks.yml'
      - 'scripts/ci/validate_branch_protection_checks.py'
      - '.github/workflows/branch-protection-validation.yml'

permissions:
  contents: read
  actions: read
  # Reading GET /repos/{owner}/{repo}/branches/{branch}/protection requires
  # Administration read access on the token; without it the curl returns 403
  # and the validation never runs (see PR-driven + scheduled baseline failures).
  administration: read

jobs:
  validate:
    name: Validate Required Status Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check branch protection rules
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          protection_file="$(mktemp)"
          rulesets_file="$(mktemp)"
          trap 'rm -f "$protection_file" "$rulesets_file"' EXIT

          curl --fail --show-error --silent \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/branches/main/protection" \
            -o "$protection_file"
          curl --fail --show-error --silent \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/rulesets?per_page=100" \
            -o "$rulesets_file"

          GAP_ARGS=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            GAP_ARGS="--gap-file config/ci/branch-protection-gap.json"
          fi

          python scripts/ci/validate_branch_protection_checks.py \
            --config config/ci/required-status-checks.json \
            --api-response-file "$protection_file" \
            $GAP_ARGS
          python scripts/ci/validate_mandatory_security_gate_enforcement.py \
            --branch-protection-file "$protection_file" \
            --ruleset-file "$rulesets_file"
