name: Certify Release Candidate

# V1-release-certification-001: runs the canonical, SHA-bound release
# certification chain (make certify-release-candidate) against an immutable
# candidate, composes the candidate evidence bundle (make build-release-evidence),
# and publishes a single certification conclusion for branch protection or
# promotion decisioning.
#
# The certification harness fails closed: live steps (docker-build,
# reproducibility, compose/helm/k8s overlays, monitoring stack, staging
# preflight, ...) run only with CERTIFY_LIVE=1. A successful conclusion (exit 0
# + certification.json certified=true) requires every implemented step to pass;
# a non-certified conclusion leaves the candidate uncertified.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Immutable commit SHA to certify (defaults to HEAD)'
        required: false
        type: string
      live:
        description: 'Run live steps (docker-build, reproducibility, compose/helm/k8s, monitoring stack, staging preflight). Requires Docker + k8s tooling on the runner.'
        required: false
        default: 'false'
        type: boolean
  push:
    branches:
      - main
      - 'release/**'
    tags:
      - 'v*'

permissions:
  attestations: write
  id-token: write

env:
  # Default (push/main/tag) certification runs the live steps only when the caller
  # opts in; the workflow is fail-closed, so a non-live conclusion still proves
  # every non-live step and reports the live ones as not-run without a false
  # "certified" label.
  CERTIFY_LIVE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.live == 'true' && '1' || '0' }}
  RELEASE_SHA: ${{ github.event.inputs.sha || github.sha }}

jobs:
  certify-candidate:
    name: Certified release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements-test.txt

      - name: Set up Node.js + pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: '22.22.2'

      - name: Install Docker
        uses: docker/setup-docker@v3

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.16.2'

      - name: Install kustomize
        run: |
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz -o kustomize.tar.gz
          echo "3669470b454d865c8184d6bce78df05e977c9aea31c30df3c669317d43bcc7a7  kustomize.tar.gz" | sha256sum -c
          tar -xzf kustomize.tar.gz
          sudo mv kustomize /usr/local/bin/kustomize
          kustomize version

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz -o kubeconform.tar.gz
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  kubeconform.tar.gz" | sha256sum -c
          tar -xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Install Frontend deps (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Run canonical release certification
        timeout-minutes: 90
        run: |
          make certify-release-candidate RELEASE_SHA="${{ env.RELEASE_SHA }}"

      - name: Compose release evidence bundle
        run: make build-release-evidence RELEASE_SHA="${{ env.RELEASE_SHA }}"

      - name: Assert certification conclusion
        env:
          RELEASE_SHA: ${{ env.RELEASE_SHA }}
        run: |
          echo "certification-sha=$RELEASE_SHA"
          test -f "artifacts/release/$RELEASE_SHA/candidate-manifest.json"
          python - "$RELEASE_SHA" <<'PYEOF'
          import json, sys
          sha = sys.argv[1]
          with open(f"artifacts/release/{sha}/candidate-manifest.json", encoding="utf-8") as fh:
              manifest = json.load(fh)
          status = manifest.get("certification", {}).get("status")
          if status != "certified":
              print(f"Candidate NOT certified: status={status}", file=sys.stderr)
              sys.exit(1)
          print("Candidate certified (candidate-manifest.json certification.status=certified)")
          PYEOF

      - name: Attest certification bundle
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: artifacts/release/${{ env.RELEASE_SHA }}/candidate-manifest.json

      - name: Upload candidate certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-certification-${{ env.RELEASE_SHA }}
          path: artifacts/release/${{ env.RELEASE_SHA }}/**/*
          retention-days: 90

      - name: Publish certification conclusion as a status check
        env:
          RELEASE_SHA: ${{ env.RELEASE_SHA }}
        run: |
          python - "$RELEASE_SHA" <<'PY'
          import json, sys
          from pathlib import Path
          sha = sys.argv[1]
          manifest = json.loads(Path(f"artifacts/release/{sha}/candidate-manifest.json").read_text(encoding="utf-8"))
          status = manifest.get("certification", {}).get("status")
          state = "success" if status == "certified" else "failure"
          print(f"certification conclusion: {state} (status={status})")
          if state != "success":
              sys.exit(1)
          PY