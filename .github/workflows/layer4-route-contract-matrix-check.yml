name: layer4-route-contract-matrix-check

on:
  pull_request:
    paths:
      - 'contracts/layer4-route-contract-matrix.json'
      - 'contracts/openapi/layer4-agents.json'
      - 'services/layer4-agents/src/layer4_agents/api/routes/**'
      - 'services/layer4-agents/src/layer4_agents/feature_flags/api/**'
      - 'services/layer4-agents/src/layer4_agents/tenants/api/routes/**'
      - 'services/layer4-agents/src/layer4_agents/registry/api/**'
      - 'apps/web/src/**'
      - 'scripts/ci/check_layer4_route_contract_matrix.py'
      - 'scripts/ci/check_openapi_tenant_scope.py'
      - 'scripts/ci/layer4_tenant_scope.py'
      - 'scripts/ci/enrich_layer4_matrix_tenant_scope.py'
  push:
    branches: [main]
    paths:
      - 'contracts/layer4-route-contract-matrix.json'
      - 'contracts/openapi/layer4-agents.json'
      - 'services/layer4-agents/src/layer4_agents/api/routes/**'
      - 'services/layer4-agents/src/layer4_agents/feature_flags/api/**'
      - 'services/layer4-agents/src/layer4_agents/tenants/api/routes/**'
      - 'services/layer4-agents/src/layer4_agents/registry/api/**'
      - 'apps/web/src/**'
      - 'scripts/ci/check_layer4_route_contract_matrix.py'
      - 'scripts/ci/check_openapi_tenant_scope.py'
      - 'scripts/ci/layer4_tenant_scope.py'
      - 'scripts/ci/enrich_layer4_matrix_tenant_scope.py'

permissions: read-all

jobs:
  check-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Layer4 route matrix coverage and schema refs
        run: python scripts/ci/check_layer4_route_contract_matrix.py
      - name: Validate Layer4 x-tenant-scope metadata
        run: python scripts/ci/check_openapi_tenant_scope.py
