name: Layer3 Wrapper Drift Check

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'services/layer3-knowledge/src/**/*.py'
      - 'scripts/ci/check_layer3_wrapper_drift.py'
      - 'scripts/ci/check_layer3_settings_shim_drift.py'
      - '.github/workflows/layer3-wrapper-drift.yml'
  workflow_dispatch:

jobs:
  check-layer3-wrapper-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Validate Layer3 compatibility namespace
        run: python scripts/ci/check_layer3_wrapper_drift.py

      - name: Validate Layer3 settings shim
        run: python scripts/ci/check_layer3_settings_shim_drift.py

      - name: Collect changed files
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          echo "CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | tr '\n' ' ')" >> "$GITHUB_ENV"

      - name: Report unregistered Layer3 compatibility additions
        run: python scripts/ci/report_layer3_compat_additions.py
