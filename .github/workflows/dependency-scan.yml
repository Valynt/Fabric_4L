# -----------------------------------------------------------------------------
# Dependency Vulnerability Scan — Fabric 4L
#
# Scans all Python and Node.js dependencies for known CVEs on every PR,
# weekly on Monday 6am UTC, and on-demand.
#
# Tools:
#   - Python:  pypa/gh-action-pip-audit (pip-audit)
#   - Node.js: actions/dependency-review-action + pnpm audit
#   - Image:   anchore/scan-action (Grype) for container scanning
#   - Report:  SARIF upload to GitHub Security tab
# -----------------------------------------------------------------------------

name: Dependency Vulnerability Scan

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "**/requirements.txt"
      - "**/requirements*.txt"
      - "**/pyproject.toml"
      - "**/setup.py"
      - "**/package.json"
      - "**/pnpm-lock.yaml"
      - "**/Dockerfile"
      - ".github/workflows/dependency-scan.yml"
  push:
    branches: [main]
    paths:
      - "**/requirements.txt"
      - "**/requirements*.txt"
      - "**/pyproject.toml"
      - "**/setup.py"
      - "**/package.json"
      - "**/pnpm-lock.yaml"
      - "**/Dockerfile"
  schedule:
    - cron: "0 6 * * 1" # Weekly: Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      fail_threshold:
        description: "Severity threshold to fail build (low/medium/high/critical)"
        required: false
        default: "medium"
        type: choice
        options:
          - low
          - medium
          - high
          - critical

env:
  FAIL_THRESHOLD: ${{ inputs.fail_threshold || 'medium' }}

jobs:
  # =========================================================================
  # CHECK MANIFEST REGISTRY
  # =========================================================================
  check-manifests:
    name: Check Manifest Registry
    runs-on: ubuntu-latest
    outputs:
      python_matrix: ${{ steps.set_matrix.outputs.python_matrix }}
      node_matrix: ${{ steps.set_matrix.outputs.node_matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          fetch-depth: 0

      - name: Generate manifest registry
        id: generate
        run: |
          python scripts/ci/generate_manifest_registry.py > /tmp/generated.json

      - name: Compare with checked-in registry
        run: |
          if ! diff -u .github/manifests.json /tmp/generated.json; then
            echo "Manifest registry is out of date."
            echo "Please run `python scripts/ci/generate_manifest_registry.py > .github/manifests.json` and commit the changes."
            exit 1
          fi

      - name: Set matrix outputs
        id: set_matrix
        run: |
          # Read the checked-in manifests.json (which we know is up-to-date)
          python_matrix=$(python -c "import json, sys; data=json.load(open('.github/manifests.json')); print(json.dumps([{'service': item['name']} for item in data['python']]))")
          node_matrix=$(python -c "import json; data=json.load(open('.github/manifests.json')); print(json.dumps([item['name'] for item in data['node']]))")
          echo "python_matrix=$python_matrix" >> $GITHUB_OUTPUT
          echo "node_matrix=$node_matrix" >> $GITHUB_OUTPUT

  # =========================================================================
  # PYTHON DEPENDENCY SCAN
  # =========================================================================
  scan-python:
    name: Scan Python Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Uploads dependency scan SARIF to code scanning.
    needs: check-manifests

    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJson(needs.check-manifests.outputs.python_matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: "3.11"

      - name: Setup pinned uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "0.11.6"

      - name: Install pinned pip-audit
        run: uv tool install pip-audit==2.9.0

      - name: Determine service directory
        id: service-dir
        run: |
          case "${{ matrix.python.service }}" in
            shared)
              echo "dir=packages/shared/src" >> "$GITHUB_OUTPUT"
              ;;
            platform-contract)
              echo "dir=packages/platform-contract/src/python" >> "$GITHUB_OUTPUT"
              ;;
            sdk)
              echo "dir=sdk/python" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "dir=services/${{ matrix.python.service }}" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Run dependency audit
        id: audit
        env:
          ARTIFACT_DIR: artifacts/pip-audit/${{ matrix.python.service }}
        run: |
          set +e
          python scripts/ci/run_pip_audit.py scan \
            --service-name "${{ matrix.python.service }}" \
            --service-dir "${{ steps.service-dir.outputs.dir }}" \
            --artifact-dir "$ARTIFACT_DIR"
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          test -s "$ARTIFACT_DIR/diagnostic.json"
        shell: bash

      - name: Run base dependency audit
        id: base_audit
        if: github.event_name == 'pull_request'
        env:
          BASE_ARTIFACT_DIR: artifacts/pip-audit-base/${{ matrix.python.service }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          base_worktree="$(mktemp -d)"
          rm -rf "$base_worktree"
          git worktree add --detach "$base_worktree" "origin/$BASE_REF"
          echo "worktree=$base_worktree" >> "$GITHUB_OUTPUT"
          
          # Determine base service directory
          case "${{ matrix.python.service }}" in
            shared)
              BASE_SERVICE_DIR="$base_worktree/packages/shared/src"
              ;;
            platform-contract)
              BASE_SERVICE_DIR="$base_worktree/packages/platform-contract/src/python"
              ;;
            sdk)
              BASE_SERVICE_DIR="$base_worktree/sdk/python"
              ;;
            *)
              BASE_SERVICE_DIR="$base_worktree/services/${{ matrix.python.service }}"
              ;;
          esac
          
          set +e
          python scripts/ci/run_pip_audit.py scan \
            --service-name "${{ matrix.python.service }}" \
            --service-dir "$BASE_SERVICE_DIR" \
            --artifact-dir "$BASE_ARTIFACT_DIR"
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          test -s "$BASE_ARTIFACT_DIR/diagnostic.json"
        shell: bash

      - name: Upload dependency-audit evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: pip-audit-${{ matrix.python.service }}
          path: |
            artifacts/pip-audit/${{ matrix.python.service }}/requirements.txt
            artifacts/pip-audit/${{ matrix.python.service }}/report.json
            artifacts/pip-audit/${{ matrix.python.service }}/report.sarif
            artifacts/pip-audit/${{ matrix.python.service }}/diagnostic.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload dependency-audit SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@f58f0d11ebf5dedd870fab2f999275f7602cfa46 # codeql-bundle-v2.26.0
        with:
          sarif_file: artifacts/pip-audit/${{ matrix.python.service }}/report.sarif
          category: pip-audit-${{ matrix.python.service }}

      - name: Upload base dependency-audit evidence
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: pip-audit-base-${{ matrix.python.service }}
          path: |
            artifacts/pip-audit-base/${{ matrix.python.service }}/requirements.txt
            artifacts/pip-audit-base/${{ matrix.python.service }}/report.json
            artifacts/pip-audit-base/${{ matrix.python.service }}/report.sarif
            artifacts/pip-audit-base/${{ matrix.python.service }}/diagnostic.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce dependency vulnerability policy
        if: always()
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python scripts/ci/run_pip_audit.py compare \
              --current-diagnostic "artifacts/pip-audit/${{ matrix.python.service }}/diagnostic.json" \
              --current-expected-status '${{ steps.audit.outputs.status }}' \
              --baseline-diagnostic "artifacts/pip-audit-base/${{ matrix.python.service }}/diagnostic.json" \
              --baseline-expected-status '${{ steps.base_audit.outputs.status }}'
          else
            python scripts/ci/run_pip_audit.py enforce \
              --diagnostic "artifacts/pip-audit/${{ matrix.python.service }}/diagnostic.json" \
              --expected-status '${{ steps.audit.outputs.status }}'
          fi

      - name: Cleanup base dependency audit worktree
        if: always() && github.event_name == 'pull_request' && steps.base_audit.outputs.worktree != ''
        run: git worktree remove --force "${{ steps.base_audit.outputs.worktree }}"

  # =========================================================================
  # NODE.JS DEPENDENCY SCAN
  # =========================================================================
  scan-node:
    name: Scan Node.js Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Uploads dependency scan SARIF to code scanning.
    needs: check-manifests

    strategy:
      fail-fast: false
      matrix:
        frontend: ${{ fromJson(needs.check-manifests.outputs.node_matrix) }}

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout
      # -----------------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # 2. Setup Node.js + pnpm
      # -----------------------------------------------------------------------
      - name: Setup Node.js + pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: '22.18.0'

      # -----------------------------------------------------------------------
      # 3. Dependency review (PR only)
      # -----------------------------------------------------------------------
      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # dependency-review-action uses 'moderate', not 'medium'
          fail-on-severity: ${{ env.FAIL_THRESHOLD == 'medium' && 'moderate' || env.FAIL_THRESHOLD }}
          comment-summary-in-pr: true

      # -----------------------------------------------------------------------
      # 4. pnpm audit
      # -----------------------------------------------------------------------
      - name: pnpm audit ${{ matrix.frontend }}
        id: pnpm-audit
        run: |
          # Determine working directory based on matrix value
          case "${{ matrix.frontend }}" in
            value-studio)
              WD="services/value-studio"
              ;;
            config)
              WD="packages/config"
              ;;
            eslint-plugin-fabric-contracts)
              WD="packages/eslint-plugin-fabric-contracts"
              ;;
            *)
              WD="apps/${{ matrix.frontend }}"
              ;;
          esac
          
          BASE_REF="${GITHUB_BASE_REF:-main}"
          BASE_WORKTREE="${RUNNER_TEMP}/pnpm-audit-base-${{ matrix.frontend }}"
          git fetch --no-tags --prune origin "${BASE_REF}"

          (
            cd "${WD}"
            pnpm install --frozen-lockfile
            pnpm audit --json --audit-level "${{ env.FAIL_THRESHOLD }}" > pnpm-audit.json || true
          )

          git worktree add --detach "${BASE_WORKTREE}" "origin/${BASE_REF}"
          (
            cd "${BASE_WORKTREE}/${WD}"
            pnpm install --frozen-lockfile
            pnpm audit --json --audit-level "${{ env.FAIL_THRESHOLD }}" > "${GITHUB_WORKSPACE}/${WD}/pnpm-audit-base.json" || true
          )

          CURRENT_AUDIT_PATH="${GITHUB_WORKSPACE}/${WD}/pnpm-audit.json" \
          BASELINE_AUDIT_PATH="${GITHUB_WORKSPACE}/${WD}/pnpm-audit-base.json" \
          node <<'NODE'
          const fs = require('fs');
          const current = JSON.parse(fs.readFileSync(process.env.CURRENT_AUDIT_PATH, 'utf8'));
          const baseline = JSON.parse(fs.readFileSync(process.env.BASELINE_AUDIT_PATH, 'utf8'));
          const sevMap = {low: 0, moderate: 1, high: 2, critical: 3};
          const threshold = sevMap[process.env.FAIL_THRESHOLD] ?? 1;

          function signatures(report) {
            const advisories = report.advisories || {};
            const out = new Set();
            for (const [id, adv] of Object.entries(advisories)) {
              if ((sevMap[adv.severity] ?? -1) < threshold) continue;
              const advisoryId = adv.github_advisory_id || adv.url || id;
              const paths = (adv.findings || [])
                .flatMap((finding) => finding.paths || [])
                .sort()
                .join('|');
              out.add(`${adv.module_name}:${advisoryId}:${paths}`);
            }
            return out;
          }

          const baselineSignatures = signatures(baseline);
          let fail = false;
          for (const [id, adv] of Object.entries(current.advisories || {})) {
            if ((sevMap[adv.severity] ?? -1) < threshold) continue;
            const advisoryId = adv.github_advisory_id || adv.url || id;
            const paths = (adv.findings || [])
              .flatMap((finding) => finding.paths || [])
              .sort()
              .join('|');
            const signature = `${adv.module_name}:${advisoryId}:${paths}`;
            if (baselineSignatures.has(signature)) {
              console.log(`Inherited vulnerability: ${adv.severity} - ${adv.module_name} - ${advisoryId}`);
              continue;
            }
            console.log(`Branch-introduced vulnerability: ${adv.severity} - ${adv.module_name} - ${advisoryId}`);
            console.log(adv.overview || adv.title || 'No advisory overview available');
            fail = true;
          }
          process.exit(fail ? 1 : 0);
          NODE

      # -----------------------------------------------------------------------
      # 5. Upload results
      # -----------------------------------------------------------------------
      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: node-audit-${{ matrix.frontend }}
          path: |
            ${{ github.workspace }}/services/value-studio/pnpm-audit.json
            ${{ github.workspace }}/services/value-studio/pnpm-audit-base.json
            ${{ github.workspace }}/packages/config/pnpm-audit.json
            ${{ github.workspace }}/packages/config/pnpm-audit-base.json
            ${{ github.workspace }}/packages/eslint-plugin-fabric-contracts/pnpm-audit.json
            ${{ github.workspace }}/packages/eslint-plugin-fabric-contracts/pnpm-audit-base.json
            apps/web/pnpm-audit.json
            apps/web/pnpm-audit-base.json
          retention-days: 30
        # Use always() to ensure upload happens even if previous steps fail

  # =========================================================================
  # CONTAINER IMAGE SCAN
  # =========================================================================
  scan-containers:
    name: Scan Container Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Uploads container scan SARIF to code scanning.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          fetch-depth: 0

      - name: Build API service image
        run: |
          docker build -t fabric4l/api:scan-target -f services/api/Dockerfile .

      - name: Scan image with Grype
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: "fabric4l/api:scan-target"
          severity-cutoff: ${{ env.FAIL_THRESHOLD }}
          output-format: sarif
          output-file: container-scan.sarif

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@f58f0d11ebf5dedd870fab2f999275f7602cfa46 # codeql-bundle-v2.26.0
        with:
          sarif_file: container-scan.sarif
          category: container-scan

  # =========================================================================
  # SBOM GENERATION (Vulnerability Context)
  # =========================================================================
  generate-sbom:
    name: Generate SBOM for Vulnerability Tracking
    runs-on: ubuntu-latest
    needs: [scan-python, scan-node]
    if: always() && github.event_name != 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: "3.11"

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@df80a981bc6edbc4e220a492d3cbe9f5547a6e75 # v0.17.9

      - name: Generate SBOM
        run: |
          syft packages dir:. -o spdx-json=sbom-vuln-track.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: sbom-vulnerability-tracking
          path: sbom-vuln-track.json
          retention-days: 90

  # =========================================================================
  # SUMMARY
  # =========================================================================
  summary:
    name: Scan Summary
    runs-on: ubuntu-latest
    needs: [scan-python, scan-node]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## �� 🔒 Dependency Vulnerability Scan Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Component | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|--------|" >> "$GITHUB_STEP_SUMMARY"

          # Python services
          for svc in api layer1-ingestion layer2-extraction layer3-knowledge layer4-agents layer5-ground-truth layer6-benchmarks; do
            status="��⏭��️ Skipped"
            if [ "${{ needs.scan-python.result }}" = "success" ]; then status="��✅ Pass"; fi
            if [ "${{ needs.scan-python.result }}" = "failure" ]; then status="��❌ Fail"; fi
            echo "| Python: $svc | $status |" >> "$GITHUB_STEP_SUMMARY"
          done

          # Node frontends
          for fe in web; do
            status="��⏭��️ Skipped"
            if [ "${{ needs.scan-node.result }}" = "success" ]; then status="��✅ Pass"; fi
            if [ "${{ needs.scan-node.result }}" = "failure" ]; then status="��❌ Fail"; fi
            echo "| Node.js: $fe | $status |" >> "$GITHUB_STEP_SUMMARY"
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Threshold:** ${{ env.FAIL_THRESHOLD }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Triggered by:** ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
