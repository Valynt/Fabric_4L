# -----------------------------------------------------------------------------
# Dependency Vulnerability Scan — Fabric 4L
#
# Scans all Python and Node.js dependencies for known CVEs on every PR,
# weekly on Monday 6am UTC, and on-demand.
#
# Tools:
#   - Python:  pypa/gh-action-pip-audit (pip-audit)
#   - Node.js: actions/dependency-review-action + pnpm audit
#   - Image:   anchore/scan-action (Grype) for container scanning
#   - Report:  SARIF upload to GitHub Security tab
# -----------------------------------------------------------------------------

name: Dependency Vulnerability Scan

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "**/requirements.txt"
      - "**/requirements*.txt"
      - "**/pyproject.toml"
      - "**/setup.py"
      - "**/package.json"
      - "**/pnpm-lock.yaml"
      - "**/package-lock.json"
      - "**/Dockerfile"
      - ".github/workflows/dependency-scan.yml"
  push:
    branches: [main]
    paths:
      - "**/requirements.txt"
      - "**/requirements*.txt"
      - "**/pyproject.toml"
      - "**/setup.py"
      - "**/package.json"
      - "**/pnpm-lock.yaml"
      - "**/Dockerfile"
  schedule:
    - cron: "0 6 * * 1" # Weekly: Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      fail_threshold:
        description: "Severity threshold to fail build (low/medium/high/critical)"
        required: false
        default: "medium"
        type: choice
        options:
          - low
          - medium
          - high
          - critical

env:
  FAIL_THRESHOLD: ${{ inputs.fail_threshold || 'medium' }}

jobs:
  # =========================================================================
  # PYTHON DEPENDENCY SCAN
  # =========================================================================
  scan-python:
    name: Scan Python Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Uploads dependency scan SARIF to code scanning.

    strategy:
      fail-fast: false
      matrix:
        service:
          - api
          - layer1-ingestion
          - layer2-extraction
          - layer3-knowledge
          - layer4-agents
          - layer5-ground-truth
          - layer6-benchmarks

    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: "3.11"

      - name: Setup pinned uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "0.11.6"

      - name: Install pinned pip-audit
        run: uv tool install pip-audit==2.9.0

      - name: Run dependency audit
        id: audit
        env:
          ARTIFACT_DIR: artifacts/pip-audit/${{ matrix.service }}
        run: |
          set +e
          python scripts/ci/run_pip_audit.py scan \
            --service-name "${{ matrix.service }}" \
            --service-dir "services/${{ matrix.service }}" \
            --artifact-dir "$ARTIFACT_DIR"
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          test -s "$ARTIFACT_DIR/diagnostic.json"
        shell: bash

      - name: Upload dependency-audit evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: pip-audit-${{ matrix.service }}
          path: |
            artifacts/pip-audit/${{ matrix.service }}/requirements.txt
            artifacts/pip-audit/${{ matrix.service }}/report.json
            artifacts/pip-audit/${{ matrix.service }}/report.sarif
            artifacts/pip-audit/${{ matrix.service }}/diagnostic.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload dependency-audit SARIF
        if: always() && hashFiles(format('artifacts/pip-audit/{0}/report.sarif', matrix.service)) != ''
        uses: github/codeql-action/upload-sarif@f58f0d11ebf5dedd870fab2f999275f7602cfa46 # codeql-bundle-v2.26.0
        with:
          sarif_file: artifacts/pip-audit/${{ matrix.service }}/report.sarif
          category: pip-audit-${{ matrix.service }}

      - name: Enforce dependency vulnerability policy
        if: always()
        run: |
          python scripts/ci/run_pip_audit.py enforce \
            --diagnostic "artifacts/pip-audit/${{ matrix.service }}/diagnostic.json" \
            --expected-status '${{ steps.audit.outputs.status }}'

  # =========================================================================
  # NODE.JS DEPENDENCY SCAN
  # =========================================================================
  scan-node:
    name: Scan Node.js Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Uploads dependency scan SARIF to code scanning.

    strategy:
      fail-fast: false
      matrix:
        frontend:
          - web

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout
      # -----------------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4

      # -----------------------------------------------------------------------
      # 2. Setup Node.js + pnpm
      # -----------------------------------------------------------------------
      - name: Setup Node.js + pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: '22.18.0'

      # -----------------------------------------------------------------------
      # 3. Dependency review (PR only)
      # -----------------------------------------------------------------------
      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # dependency-review-action uses 'moderate', not 'medium'
          fail-on-severity: ${{ env.FAIL_THRESHOLD == 'medium' && 'moderate' || env.FAIL_THRESHOLD }}
          comment-summary-in-pr: true

      # -----------------------------------------------------------------------
      # 4. pnpm audit
      # -----------------------------------------------------------------------
      - name: pnpm audit ${{ matrix.frontend }}
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --json --audit-level ${{ env.FAIL_THRESHOLD }} > pnpm-audit.json || true
          # Check if any vulnerabilities exceed threshold
          node -e "
          const data = require('./pnpm-audit.json');
          const advisories = data.advisories || {};
          const sevMap = {low: 0, moderate: 1, high: 2, critical: 3};
          const threshold = sevMap['${{ env.FAIL_THRESHOLD }}'] || 1;
          let fail = false;
          for (const [id, adv] of Object.entries(advisories)) {
            if (sevMap[adv.severity] >= threshold) {
              console.log(\`FAIL: \${adv.severity} - \${adv.overview}\`);
              fail = true;
            }
          }
          process.exit(fail ? 1 : 0);
          "

      # -----------------------------------------------------------------------
      # 5. Upload results
      # -----------------------------------------------------------------------
      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: node-audit-${{ matrix.frontend }}
          path: apps/web/pnpm-audit.json
          retention-days: 30

  # =========================================================================
  # CONTAINER IMAGE SCAN
  # =========================================================================
  scan-containers:
    name: Scan Container Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Uploads container scan SARIF to code scanning.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4

      - name: Build API service image
        run: |
          docker build -t fabric4l/api:scan-target -f services/api/Dockerfile .

      - name: Scan image with Grype
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: "fabric4l/api:scan-target"
          severity-cutoff: ${{ env.FAIL_THRESHOLD }}
          output-format: sarif
          output-file: container-scan.sarif

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@f58f0d11ebf5dedd870fab2f999275f7602cfa46 # codeql-bundle-v2.26.0
        with:
          sarif_file: container-scan.sarif
          category: container-scan

  # =========================================================================
  # SBOM GENERATION (Vulnerability Context)
  # =========================================================================
  generate-sbom:
    name: Generate SBOM for Vulnerability Tracking
    runs-on: ubuntu-latest
    needs: [scan-python, scan-node]
    if: always() && github.event_name != 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: "3.11"

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@df80a981bc6edbc4e220a492d3cbe9f5547a6e75 # v0.17.9

      - name: Generate SBOM
        run: |
          syft packages dir:. -o spdx-json=sbom-vuln-track.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: sbom-vulnerability-tracking
          path: sbom-vuln-track.json
          retention-days: 90

  # =========================================================================
  # SUMMARY
  # =========================================================================
  summary:
    name: Scan Summary
    runs-on: ubuntu-latest
    needs: [scan-python, scan-node]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## 🔒 Dependency Vulnerability Scan Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Component | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|--------|" >> "$GITHUB_STEP_SUMMARY"

          # Python services
          for svc in api layer1-ingestion layer2-extraction layer3-knowledge layer4-agents layer5-ground-truth layer6-benchmarks; do
            status="⏭️ Skipped"
            if [ "${{ needs.scan-python.result }}" = "success" ]; then status="✅ Pass"; fi
            if [ "${{ needs.scan-python.result }}" = "failure" ]; then status="❌ Fail"; fi
            echo "| Python: $svc | $status |" >> "$GITHUB_STEP_SUMMARY"
          done

          # Node frontends
          for fe in web; do
            status="⏭️ Skipped"
            if [ "${{ needs.scan-node.result }}" = "success" ]; then status="✅ Pass"; fi
            if [ "${{ needs.scan-node.result }}" = "failure" ]; then status="❌ Fail"; fi
            echo "| Node.js: $fe | $status |" >> "$GITHUB_STEP_SUMMARY"
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Threshold:** ${{ env.FAIL_THRESHOLD }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Triggered by:** ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
