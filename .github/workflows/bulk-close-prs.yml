name: Bulk Close Open PRs
on:
  push:
    branches:
      - 'copilot/09d618f9-665a-4ab6-8bd4-069a4d38a051'
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: write

jobs:
  bulk-close:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Close PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching all open PRs..."
          PR_NUMBERS=$(gh pr list --state open --limit 200 --json number --jq '.[].number')
          for PR in $PR_NUMBERS; do
            echo "Closing PR #$PR"
            gh pr close "$PR" -d || echo "Failed to close PR #$PR"
          done
