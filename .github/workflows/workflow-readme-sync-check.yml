name: Workflow README Sync Check

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/scripts/check-workflow-readme-links.py'
      - 'scripts/ci/verify_workflow_registry.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/scripts/check-workflow-readme-links.py'
      - 'scripts/ci/verify_workflow_registry.py'

permissions:
  contents: read

jobs:
  validate-workflow-readme:
    name: Validate workflow README references
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Validate workflow filenames referenced in README
        run: |
          python .github/scripts/check-workflow-readme-links.py

      - name: Validate workflow ownership registry
        run: |
          python scripts/ci/verify_workflow_registry.py
