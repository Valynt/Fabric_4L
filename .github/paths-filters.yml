# Central change-scope filter definitions (CI signal architecture).
#
# Consumed by .github/actions/change-scope via tj-actions/changed-files
# (files_yaml_from_source_file). Each top-level key is a scope; a scope
# resolves to 'true' when a pull request touches at least one matching path.
#
# Contract:
# - Scopes are only ever used to SKIP work that cannot be affected by the
#   change. A skip driven by a 'false' scope is safe by construction: the
#   skipped job would have exercised code the PR did not touch.
# - CI plumbing is NOT bundled into domain scopes. Global CI inputs are
#   modeled as first-class scopes so contract tests can prove a CI-only
#   change resolves NO domain scope (and therefore safely skips the heavy
#   per-PR matrix):
#     ci-global     .github/**, Makefile, .pre-commit-config.yaml — workflow/
#                   action/makefile pipeline topology. Pipeline correctness
#                   is validated on every PR by structural-preflight's
#                   ungated CI-control-plane contract tests.
#     ci-tooling    scripts/** — CI/ops execution tooling (executed and
#                   validated by structural-preflight + merge-queue
#                   simulation on every PR).
#     ci-governance config/**, pytest.ini — gate inputs (baselines,
#                   allowlists, waivers) and python test policy.
# - Allowlist-sensitive gates keep a precise fail-open on exactly the inputs
#   they read (code includes config/semgrep/**, config/security/**,
#   config/ci/semgrep_baseline.json and scripts/ci/check_semgrep_sarif.py;
#   docker includes config/trivy/**). Skip-allowlist inflation is additionally
#   rejected by the always-run skip-governance gates in structural-preflight.
# - Non-pull_request events (push, schedule, workflow_dispatch) always run
#   the full matrix; scoping applies to the per-PR path only.
# - Documentation-only changes (docs/**, **/*.md) intentionally match no
#   runtime scope.

# Global CI plumbing scopes (first-class so contract tests can assert that a
# CI-only change flips NO domain scope). None of these gate the domain matrix.
ci-global:
  - '.github/**'
  - 'Makefile'
  - '.pre-commit-config.yaml'

ci-tooling:
  - 'scripts/**'

ci-governance:
  - 'config/**'
  - 'pytest.ini'

layer1:
  - 'services/layer1-ingestion/**'
  - 'packages/**'
  - 'contracts/**'
  - 'tests/**'

layer2:
  - 'services/layer2-extraction/**'
  - 'packages/**'
  - 'contracts/**'
  - 'tests/**'

layer3:
  - 'services/layer3-knowledge/**'
  - 'packages/**'
  - 'contracts/**'
  - 'tests/**'

layer4:
  - 'services/layer4-agents/**'
  - 'packages/**'
  - 'contracts/**'
  - 'tests/**'

layer5:
  - 'services/layer5-ground-truth/**'
  - 'packages/**'
  - 'contracts/**'
  - 'tests/**'

layer6:
  - 'services/layer6-benchmarks/**'
  - 'packages/**'
  - 'contracts/**'
  - 'tests/**'

# Any backend/runtime Python surface (all services, shared packages, tests,
# contracts) plus compose/infra used by integration suites.
backend:
  - 'services/**'
  - 'packages/**'
  - 'contracts/**'
  - 'tests/**'
  - 'infra/**'
  - 'packs/**'

# Frontend surface (apps/web plus the pnpm workspace manifests).
web:
  - 'apps/**'
  - 'package.json'
  - 'pnpm-lock.yaml'
  - 'pnpm-workspace.yaml'
  - 'contracts/**'

# Any executable code surface (backend or frontend). Used by SAST-style
# gates and behavior gates that span both stacks.
code:
  - 'services/**'
  - 'apps/**'
  - 'packages/**'
  - 'contracts/**'
  - 'tests/**'
  - 'packs/**'
  - 'infra/**'
  - 'k8s/**'
  - 'sdk/**'
  - 'docs-site/**'
  - 'examples/**'
  - '.semgrep/**'
  - '.semgrepignore'
  - 'package.json'
  - 'pnpm-lock.yaml'
  - 'pnpm-workspace.yaml'
  - '**/Dockerfile*'
  - '**/requirements*.txt'
  - '**/pyproject.toml'
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.yaml'
  - '*.yml'
  # Security-gate inputs (fail-open): exactly the files semgrep/SAST reads.
  - 'config/semgrep/**'
  - 'config/security/**'
  - 'config/ci/semgrep_baseline.json'
  - 'scripts/ci/check_semgrep_sarif.py'

# Container image surface: anything baked into an image or that defines one.
docker:
  - 'services/**'
  - 'apps/**'
  - 'packages/**'
  - 'infra/**'
  - '**/Dockerfile*'
  - '**/package.json'
  - 'pnpm-lock.yaml'
  - 'pnpm-workspace.yaml'
  - '**/requirements*.txt'
  - '**/pyproject.toml'
  # Trivy repository/image scan policy (fail-open): config/trivy/repository.yaml.
  - 'config/trivy/**'

# Kubernetes / infrastructure / observability manifests.
k8s:
  - 'k8s/**'
  - 'infra/**'
  - 'monitoring/**'

# Dependency manifests and lockfiles (supply-chain relevant changes).
deps:
  - '**/package.json'
  - '**/pnpm-lock.yaml'
  - 'pnpm-workspace.yaml'
  - '**/requirements*.txt'
  - '**/pyproject.toml'
  - '**/uv.lock'
  - '**/poetry.lock'
  # pnpm patched-dependency artifacts: changing a patch must re-run the
  # dependency audit that validates the patch is registered and applied.
  - 'patches/**'

# Release governance surface: launch contracts, readiness policies, and the
# scripts/tests that validate them. Gate any release-policy-validating job
# (e.g. gate-release-policy drift checks) on this scope — NOT on 'runtime' —
# so a risk_register.yaml-only PR still runs its drift checks.
release-policy:
  - 'release/**'
  - 'production-readiness/**'
  - 'scripts/release/**'
  - 'tests/release/**'

# Anything that can affect the running product (everything except pure
# documentation). Used by prod-readiness to decide whether the PR-time
# readiness jobs are relevant at all.
runtime:
  - 'services/**'
  - 'apps/**'
  - 'packages/**'
  - 'contracts/**'
  - 'tests/**'
  - 'infra/**'
  - 'k8s/**'
  - 'monitoring/**'
  - 'packs/**'
  - 'package.json'
  - '**/package.json'
  - 'pnpm-lock.yaml'
  - '**/pnpm-lock.yaml'
  - 'pnpm-workspace.yaml'
  - '**/requirements*.txt'
  - '**/pyproject.toml'
  - '**/uv.lock'
  - '**/poetry.lock'
