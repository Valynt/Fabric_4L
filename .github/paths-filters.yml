# Any backend/runtime Python surface (all services, shared packages, tests,
# contracts) plus compose/infra used by integration suites.
backend:
  - 'services/**'
  - 'packages/**'
  - 'contracts/**'
  - 'tests/**'
  - 'infra/**'
  - 'packs/**'
  - '.github/**'
  - 'scripts/**'
  - 'config/**'
  - 'Makefile'
  - 'pytest.ini'

# Frontend surface (apps/web plus the pnpm workspace manifests).
web:
  - 'apps/**'
  - 'package.json'
  - 'pnpm-lock.yaml'
  - 'pnpm-workspace.yaml'
  - 'contracts/**'
  - '.github/**'
  - 'scripts/**'
  - 'config/**'
  - 'Makefile'

# Any executable code surface (backend or frontend). Used by SAST-style
# gates and behavior gates that span both stacks.
code:
  - 'services/**'
  - 'apps/**'
  - 'packages/**'
  - 'contracts/**'
  - 'tests/**'
  - 'packs/**'
  - 'infra/**'
  - 'k8s/**'
  - 'sdk/**'
  - 'docs-site/**'
  - 'examples/**'
  - '.semgrep/**'
  - '.semgrepignore'
  - 'package.json'
  - 'pnpm-lock.yaml'
  - 'pnpm-workspace.yaml'
  - '**/Dockerfile*'
  - '**/requirements*.txt'
  - '**/pyproject.toml'
  - '*.py'
  - '*.js'
  - '*.ts'
  - '*.json'
  - '*.yaml'
  - '*.yml'
  - '.github/**'
  - 'scripts/**'
  - 'config/**'
  - 'Makefile'
  - 'pytest.ini'

# Container image surface: anything baked into an image or that defines one.
docker:
  - 'services/**'
  - 'apps/**'
  - 'packages/**'
  - 'infra/**'
  - '**/Dockerfile*'
  - '**/package.json'
  - 'pnpm-lock.yaml'
  - 'pnpm-workspace.yaml'
  - '**/requirements*.txt'
  - '**/pyproject.toml'
  - '.github/**'
  - 'scripts/**'
  - 'config/**'
  - 'Makefile'

# Kubernetes / infrastructure / observability manifests.
k8s:
  - 'k8s/**'
  - 'infra/**'
  - 'monitoring/**'
  - '.github/**'
  - 'scripts/**'
  - 'config/**'
  - 'Makefile'

# Dependency manifests and lockfiles (supply-chain relevant changes).
deps:
  - '**/package.json'
  - '**/pnpm-lock.yaml'
  - 'pnpm-workspace.yaml'
  - '**/requirements*.txt'
  - '**/pyproject.toml'
  - '**/uv.lock'
  - '**/poetry.lock'
  - '.github/**'
  - 'scripts/**'
  - 'config/**'
  - 'Makefile'

# Release governance surface: launch contracts, readiness policies, and the
# scripts/tests that validate them. Gate any release-policy-validating job
# (e.g. gate-release-policy drift checks) on this scope — NOT on 'runtime' —
# so a risk_register.yaml-only PR still runs its drift checks.
release-policy:
  - 'release/**'
  - 'production-readiness/**'
  - 'scripts/release/**'
  - 'tests/release/**'
  - '.github/**'
  - 'scripts/**'
  - 'config/**'
  - 'Makefile'
  - 'pytest.ini'

# Anything that can affect the running product (everything except pure
# documentation). Used by prod-readiness to decide whether the PR-time
# readiness jobs are relevant at all.
runtime:
  - 'services/**'
  - 'apps/**'
  - 'packages/**'
  - 'contracts/**'
  - 'tests/**'
  - 'infra/**'
  - 'k8s/**'
  - 'monitoring/**'
  - 'packs/**'
  - 'package.json'
  - '**/package.json'
  - 'pnpm-lock.yaml'
  - '**/pnpm-lock.yaml'
  - 'pnpm-workspace.yaml'
  - '**/requirements*.txt'
  - '**/pyproject.toml'
  - '**/uv.lock'
  - '**/poetry.lock'
  - '.github/**'
  - 'scripts/**'
  - 'config/**'
  - 'Makefile'
  - 'pytest.ini'
