version: 2
updates:
  # Root npm workspace
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - nodejs
    reviewers:
      - value-fabric/sre-leads
    commit-message:
      prefix: chore(deps)
    groups:
      routine-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  # Frontend
  - package-ecosystem: npm
    directory: /apps/web
