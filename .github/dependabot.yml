version: 2
updates:
  # Root npm workspace
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - nodejs
    reviewers:
      - value-fabric/sre-leads
    commit-message:
      prefix: chore(deps)
    groups:
      routine-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  # Archived dependency snapshots are intentionally absent from this list.
  # They are excluded from canonical workspace tooling (pnpm-workspace.yaml) and
  # from both Dependabot coverage validators. Dependabot only scans explicitly
  # listed directories, so adding an archive entry would recreate update noise. See
  # docs/supply-chain/dependabot-triage-2026-08-29.md.
  # Frontend
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: America/New_York
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - nodejs
      - frontend
    reviewers:
      - value-fabric/sre-leads
    commit-message:
      prefix: chore(deps)
    groups:
      routine-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  # Node packages
  - package-ecosystem: npm
    directory: /packages/config
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: America/New_York
    open-pull-requests-limit: 2
