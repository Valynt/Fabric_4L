          - patch
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    # presidio-analyzer/anonymizer >=2.2.363 cap cryptography<47/<49, conflicting with the
    # platform cryptography>=50.0.0 security baseline (GHSA-g6cj-pr64-35w5). Keep pinned 2.2.362.
    ignore:
      - dependency-name: "presidio-analyzer"
        versions:
          - ">=2.2.363"
      - dependency-name: "presidio-anonymizer"
        versions:
          - ">=2.2.363"

