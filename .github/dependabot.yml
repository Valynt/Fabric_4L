- package-ecosystem: pip
  directory: /services/api

  schedule:
    interval: weekly
    day: monday
    time: "05:00"
    timezone: America/New_York

  open-pull-requests-limit: 2

  labels:
    - dependencies
    - python
    - service-api

  commit-message:
    prefix: chore(deps)

  groups:
    routine-minor-patch:
      applies-to: version-updates
      patterns:
        - "*"
      update-types:
        - minor
        - patch

    security-updates:
      applies-to: security-updates
      patterns:
        - "*"
