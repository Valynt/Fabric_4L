version: 2

# Keep the dependency queue reviewable by grouping the same dependency across
# monorepo directories and staggering ecosystem runs through the week.
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /apps/web
      - /packages/config
      - /packages/eslint-plugin-fabric-contracts
      - /packages/platform-contract
      - /services/value-studio
    exclude-paths:
      - docs/archive/**
      - archive/**
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: America/New_York
    open-pull-requests-limit: 4
    labels:
      - dependencies
      - nodejs
    reviewers:
      - value-fabric/sre-leads
    commit-message:
      prefix: chore(deps)
    groups:
      routine-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
        group-by: dependency-name
      major-upgrades:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major
        group-by: dependency-name
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: pip
    directories:
      - /services/api
      - /services/layer1-ingestion
      - /services/layer2-extraction
      - /services/layer2-5-signal-refinery
      - /services/layer3-knowledge
      - /services/layer4-agents
      - /services/layer5-ground-truth
      - /services/layer6-benchmarks
      - /services/billing
      - /services/layer7-billing
      - /packages/shared/src
      - /packages/platform-contract/src/python
      - /sdk/python
      - /tests
    schedule:
      interval: weekly
      day: tuesday
      time: "05:00"
      timezone: America/New_York
    open-pull-requests-limit: 4
    labels:
      - dependencies
      - python
    reviewers:
      - value-fabric/sre-leads
    commit-message:
      prefix: chore(deps)
    groups:
      routine-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
        group-by: dependency-name
      major-upgrades:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major
        group-by: dependency-name
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: docker
    directories:
      - /.devcontainer
      - /apps/web
      - /services/api
      - /services/layer1-ingestion
      - /services/layer2-extraction
      - /services/layer2-5-signal-refinery
      - /services/layer3-knowledge
      - /services/layer4-agents
      - /services/layer5-ground-truth
      - /services/layer6-benchmarks
      - /services/layer7-billing
    schedule:
      interval: weekly
      day: wednesday
      time: "05:00"
      timezone: America/New_York
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - docker
    reviewers:
      - value-fabric/sre-leads
    commit-message:
      prefix: chore(deps)
    groups:
      routine-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
        group-by: dependency-name
      major-upgrades:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major
        group-by: dependency-name
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: thursday
      time: "05:00"
      timezone: America/New_York
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - github-actions
    reviewers:
      - value-fabric/sre-leads
    commit-message:
      prefix: chore(deps)
