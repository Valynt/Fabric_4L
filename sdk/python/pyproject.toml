[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/valuefabric", "src/valuepact"]

[tool.hatch.build.targets.wheel.force-include]
"src/valuefabric/generated" = "valuefabric/generated"

# Force the committed generated clients into the sdist as well. The sdist is
# built with VCS-aware file collection, which can drop the gitignored
# `generated/` directory on some runners; without this, `python -m build`
# (wheel-from-sdist) fails to find `src/valuefabric/generated` when it
# re-applies the wheel force-include. Explicitly including it makes the
# distributable artifact deterministic regardless of VCS state.
[tool.hatch.build.targets.sdist.force-include]
"src/valuefabric/generated" = "src/valuefabric/generated"

[project]
name = "valuefabric"
version = "1.1.0"
description = "Python SDK and CLI for Value Fabric"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "email-validator>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "toml>=0.10.2",
    "pyjwt>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
    "openapi-python-client>=0.21.0",
    "datamodel-code-generator>=0.25.0",
]

[project.scripts]
vf = "valuefabric.cli.main:app"
valuepact = "valuepact.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
