# Development-only adjustments layered onto docker-compose.prod.yml or
# docker-compose.full.yml. Infrastructure definitions remain canonical there.
x-cloud-runtime: &cloud-runtime
  restart: unless-stopped
  mem_limit: 1g
  cpus: 1.0
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

x-data-dependencies: &data-dependencies
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  neo4j:
    condition: service_healthy

services:
  postgres:
    <<: *cloud-runtime
    mem_limit: 1g
    cpus: 1.0
  redis:
    <<: *cloud-runtime
    mem_limit: 512m
    cpus: 0.5
  neo4j:
    <<: *cloud-runtime
    mem_limit: 2g
    cpus: 1.0
  api-gateway:
    <<: *cloud-runtime
    depends_on: *data-dependencies
  layer1-ingestion:
    <<: *cloud-runtime
    depends_on: *data-dependencies
  layer2-extraction:
    <<: *cloud-runtime
    depends_on: *data-dependencies
  layer3-knowledge:
    <<: *cloud-runtime
    depends_on: *data-dependencies
  layer4-agents:
    <<: *cloud-runtime
    depends_on: *data-dependencies
  layer5-ground-truth:
    <<: *cloud-runtime
    depends_on: *data-dependencies
  layer6-benchmarks:
    <<: *cloud-runtime
    depends_on: *data-dependencies

volumes:
  postgres-data:
  redis-data:
  neo4j-data:
  neo4j-logs:
  layer3-hf-cache:
