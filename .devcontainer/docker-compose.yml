name: fabric4l-devcontainer

x-runtime: &runtime
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  dev:
    <<: *runtime
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      target: development
    user: vscode
    init: true
    command: sleep infinity
    environment:
      DOCKER_HOST: tcp://docker:2375
      DOCKER_BUILDKIT: "1"
      COMPOSE_DOCKER_CLI_BUILD: "1"
      PNPM_HOME: /home/vscode/.local/share/pnpm
      PATH: /home/vscode/.local/share/pnpm:${PATH}
    volumes:
      - ..:/workspace/Fabric_4L:cached
      - dev-pnpm-store:/home/vscode/.local/share/pnpm/store
      - dev-pip-cache:/home/vscode/.cache/pip
    depends_on:
      docker:
        condition: service_healthy
    mem_limit: 4g
    cpus: 2.0
    networks:
      - devcontainer

  docker:
    <<: *runtime
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      target: docker-daemon
    user: vscode
    command: /workspace-support/start-rootless-docker.sh
    environment:
      DOCKER_HOST: unix:///run/user/1000/docker.sock
      DOCKER_TLS_CERTDIR: ""
      XDG_RUNTIME_DIR: /run/user/1000
    volumes:
      - docker-data:/home/vscode/.local/share/docker
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    mem_limit: 2g
    cpus: 1.5
    networks:
      - devcontainer

volumes:
  dev-pnpm-store:
  dev-pip-cache:
  docker-data:

networks:
  devcontainer:
    driver: bridge
