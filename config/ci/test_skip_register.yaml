metadata:
  emergency_renewal_2026_07_31:
    owner: '@platform-quality'
    renewed_on: '2026-07-31'
    expires_on: '2026-08-30'
    reason: 'Eleven existing mandatory P0 registrations expired during PR #1188. Their original owners and remediation tickets remain unchanged; this short renewal keeps the gate fail-closed on unregistered skips while allowing the owners through 2026-08-30 to remove the registered paths.'
  emergency_renewal_2026_08_16:
    owner: '@platform-quality'
    renewed_on: '2026-08-16'
    expires_on: '2026-08-30'
    reason: Twenty-two registered P0 skip entries expired on 2026-08-15 and failed Structural Preflight. Owners and tickets are unchanged; this two-week renewal keeps the gate fail-closed on unregistered skips.
  migration_follow_up:
    id: split-shared-skip-expiry-2026-06-30
    owner: '@platform-quality'
    due_on: '2026-09-15'
    reason: Initial migration registered existing skip markers under one shared expiry.
    required_action: Skip register entries have been split by owning layer/team and expiry dates staggered.
  dedupe:
    grouping_key: path_pattern + reason_pattern
    deduplicated_on: '2026-05-18'
    notes: Each unique skip condition appears once with a single remediation owner and ticket.
  canonical_model:
    schema_version: '1.0'
    authoritative_evaluator: scripts/ci/check_test_skip_governance.py
    scan_roots:
    - tests
    - services/**/tests
    - apps/web/e2e
    updated_on: '2026-08-18'
