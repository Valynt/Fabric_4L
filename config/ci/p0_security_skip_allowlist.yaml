# P0/security skip-governance allowlist.
#
# Canonical allowlist enforced by scripts/ci/check_p0_security_skip_governance.py.
# Any pytest.skip / pytest.mark.skip / pytest.mark.xfail in a P0/security test
# path MUST be covered by exactly one entry below with an unexpired expiry.
# A skip without a matching entry, or with an expired entry, fails CI.
#
# Fields per entry:
#   id              - stable allowlist id
#   path_pattern    - fnmatch pattern for the file containing the skip
#   reason_pattern  - regex matched (case-insensitive) against the skip line text
#   owner           - owning team/person
#   reason          - why local behavioral verification is insufficient
#   expiry          - ISO date after which the entry is invalid (CI fails)
#   issue           - tracking issue / reference
#   classification  - why the skip is retained (live-stack, env limitation)

entries:
  - id: p0-allow-001
    path_pattern: tests/security/test_cross_layer_tenant_isolation.py
    reason_pattern: Requires (L2|L3|L5|L6|L7) service integration
    owner: '@platform-security'
    reason: >-
      These layers (Extraction, Knowledge, Ground Truth, Benchmarks, Billing)
      have no in-process repository/API seam in this test tree; a behavior
      test requires the live service contract. Local behavioral verification
      is insufficient.
    expiry: '2026-09-30'
    issue: VF-SKIP-LAYER-SEAMS
    classification: live-stack

  - id: p0-allow-002
    path_pattern: tests/security/test_cross_layer_tenant_isolation.py
    reason_pattern: Requires cross-layer integration test
    owner: '@platform-security'
    reason: >-
      Cross-layer tenant-context propagation and hostile cross-layer bypass
      are true end-to-end behaviors spanning adjacent services. They cannot
      be verified within a single layer's in-process seam.
    expiry: '2026-09-30'
    issue: VF-SKIP-CROSS-LAYER
    classification: live-stack

  - id: p0-allow-003
    path_pattern: tests/security/test_webhook_security_p0.py
    reason_pattern: Live-stack:.*(secret|rollover|rate limiter)
    owner: '@platform-security'
    reason: >-
      Secret-rotation rollover and rate limiting are enforced by deployed
      infrastructure (seeded endpoint, Redis-backed limiter) and cannot be
      exercised in an in-process unit boundary.
    expiry: '2026-09-30'
    issue: VF-SKIP-WEBHOOK-LIVE
    classification: live-stack
