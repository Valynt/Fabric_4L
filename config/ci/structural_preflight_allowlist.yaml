# Reviewed structural-preflight allowlist.
#
# This file is intentionally scoped to filename/topology findings in
# scripts/ci/structural_preflight.py. It does not disable gitleaks,
# audit_infra_secrets.py, or check_manifest_secret_hygiene.py.

# Audited safe: examples/templates, ExternalSecret/SecretStore CRDs, Vault
# policy references, placeholder manifests, and inventory docs with no
# literal production secret material.
secret_file_risk_allow:
  - .env.dev.example
  - .env.example
  - .env.production-compose.template
  - apps/web/.env.example
  - apps/web/.env.local.mock-auth.example
  - docs/archive/frontend-root-2026-05-02/source-snapshot/.env.example
  - docs/archive/legacy-value-fabric/.env.example
  - infra/helm/fabric-chart/templates/secrets.yaml
  - k8s/base/alertmanager-secrets.yml
  - k8s/base/api-key-cache-secret.yaml
  - k8s/base/external-secrets-operator.yml
  - k8s/base/externalsecrets/DEPRECATED.md
  - k8s/base/externalsecrets/clustersecretstore.yaml
  - k8s/base/externalsecrets/externalsecret-layer1.yaml
  - k8s/base/jwt-keys-secret.yaml
  - k8s/envs/dev/secrets.yml
  - k8s/external-secrets/SECRET_INVENTORY.md
  - k8s/external-secrets/alertmanager-secrets.yaml
  - k8s/external-secrets/cluster-secret-store.yaml
  - k8s/external-secrets/keycloak-secrets.yaml
