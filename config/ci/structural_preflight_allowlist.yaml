# Audited safe: local loopback/readiness credentials and negative security
# fixtures used to prove literal secret scanners fail closed.
hardcoded_db_credentials_allow:
  - scripts/ci/mandatory_security_regression_gate.sh
  - scripts/ci/run_db_production_readiness_gate.sh
  - scripts/ci/tests/fixtures/manifest_secret_hygiene/fail-postgres-inline.yml
