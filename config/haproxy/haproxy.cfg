global
    maxconn 4096
    log stdout local0 info
    stats socket /run/haproxy/admin.sock mode 660 level admin

defaults
    mode tcp
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    option tcp-check

frontend postgres_frontend
    bind *:5434
    default_backend postgres_backend

backend postgres_backend
    balance roundrobin
    option tcp-check
    tcp-check connect port 5432
    server primary postgres-primary:5432 check inter 2s fall 3 rise 2
    server replica postgres-replica:5432 check inter 2s fall 3 rise 2 backup

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if TRUE
